<title>人口潮汐</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;700;900&display=swap">
<style>/* Layout: a full-bleed flat world map with liquid-glass instruments floating over it (top bar, timeline, side panel).
   Hairline rules, heavy numerals. Map colours: diverging blue (growth) / red (decline) on a neutral midpoint. */
:root{
  --bg:#E7EEF2;--sea:#DCE6ED;--land:#F3F5F6;--land-edge:rgba(20,34,46,.18);
  --ink:#0C1620;--muted:#4A5864;--faint:#7C8993;
  --glass-a:rgba(255,255,255,.66);--glass-b:rgba(255,255,255,.34);--glass-edge:rgba(255,255,255,.95);--glass-inner:rgba(255,255,255,.98);
  --shadow:rgba(16,40,60,.20);--line:rgba(12,22,32,.16);--line-soft:rgba(12,22,32,.08);--field:rgba(255,255,255,.5);
  --accent:#0B6E78;--accent-soft:rgba(11,110,120,.12);
  --s-cn:#eb6834;--s-eu:#2a78d6;--s-us:#1baf7a;
  --div-neg3:#a8302f;--div-neg2:#e34948;--div-neg1:#f3a9a5;--div-mid:#f0efec;--div-pos1:#9ec5f4;--div-pos2:#2a78d6;--div-pos3:#104281;
  --seq-lo:#e3eefb;--seq-hi:#0d366b;
  --flow:#0C1620;--flow-x:#7a3fb8;--nodata:#E2E6E9;
  --hair:1px;
  --f-display:"Outfit","Noto Sans SC",system-ui,sans-serif;
  --f-body:"Noto Sans SC","Outfit",system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#071017;--sea:#0A1620;--land:#16212A;--land-edge:rgba(255,255,255,.12);
  --ink:#E8F0F5;--muted:#A3B1BB;--faint:#6F7E89;
  --glass-a:rgba(22,34,44,.66);--glass-b:rgba(10,20,28,.44);--glass-edge:rgba(255,255,255,.16);--glass-inner:rgba(255,255,255,.18);
  --shadow:rgba(0,0,0,.55);--line:rgba(255,255,255,.16);--line-soft:rgba(255,255,255,.07);--field:rgba(255,255,255,.05);
  --accent:#4FD1D9;--accent-soft:rgba(79,209,217,.14);
  --s-cn:#d95926;--s-eu:#3987e5;--s-us:#199e70;
  --div-neg3:#ff8a85;--div-neg2:#e66767;--div-neg1:#7a3434;--div-mid:#383835;--div-pos1:#1f4f8a;--div-pos2:#3987e5;--div-pos3:#9ec5f4;
  --seq-lo:#1a2a3a;--seq-hi:#b7d3f6;
  --flow:#F2F7FA;--flow-x:#c39bff;--nodata:#1D2830;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#071017;--sea:#0A1620;--land:#16212A;--land-edge:rgba(255,255,255,.12);
  --ink:#E8F0F5;--muted:#A3B1BB;--faint:#6F7E89;
  --glass-a:rgba(22,34,44,.66);--glass-b:rgba(10,20,28,.44);--glass-edge:rgba(255,255,255,.16);--glass-inner:rgba(255,255,255,.18);
  --shadow:rgba(0,0,0,.55);--line:rgba(255,255,255,.16);--line-soft:rgba(255,255,255,.07);--field:rgba(255,255,255,.05);
  --accent:#4FD1D9;--accent-soft:rgba(79,209,217,.14);
  --s-cn:#d95926;--s-eu:#3987e5;--s-us:#199e70;
  --div-neg3:#ff8a85;--div-neg2:#e66767;--div-neg1:#7a3434;--div-mid:#383835;--div-pos1:#1f4f8a;--div-pos2:#3987e5;--div-pos3:#9ec5f4;
  --seq-lo:#1a2a3a;--seq-hi:#b7d3f6;
  --flow:#F2F7FA;--flow-x:#c39bff;--nodata:#1D2830;color-scheme:dark}
@media (min-resolution:2dppx){:root{--hair:.5px}}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.55;padding-inline:16px;padding-block:16px;overflow:hidden}
.num{font-family:var(--f-display);font-variant-numeric:tabular-nums}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h2,h3{margin:0;text-wrap:balance}

.glass{background:linear-gradient(145deg,var(--glass-a),var(--glass-b));-webkit-backdrop-filter:blur(24px) saturate(170%);backdrop-filter:blur(24px) saturate(170%);border:var(--hair) solid var(--glass-edge);box-shadow:inset 0 1px 0 var(--glass-inner),0 24px 60px -28px var(--shadow)}

.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 380px;grid-template-rows:auto minmax(0,1fr);gap:12px}
.top{grid-column:1/-1;display:flex;align-items:center;gap:14px 20px;padding:10px 16px;border-radius:20px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto}
.brand b{font:900 24px/1 var(--f-body);letter-spacing:.04em}
.brand span{font:600 11px var(--f-display);letter-spacing:.22em;color:var(--muted);text-transform:uppercase}
.ctrls{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;padding:3px;border-radius:13px;border:var(--hair) solid var(--line);background:var(--field);gap:2px}
.seg button,.chip{border:0;background:none;padding:6px 12px;border-radius:10px;font-size:13.5px;font-weight:500;color:var(--muted);cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--glass-a);color:var(--ink);font-weight:800;box-shadow:inset 0 1px 0 var(--glass-inner),0 4px 14px -6px var(--shadow)}
.chip{border:var(--hair) solid var(--line);display:inline-flex;align-items:center;gap:7px;padding:7px 13px;border-radius:13px;background:var(--field)}
.chip i{width:18px;height:0;border-top:1.5px dashed var(--faint)}
.chip[aria-pressed="true"]{color:var(--ink);font-weight:800}
.chip[aria-pressed="true"] i{border-top-color:var(--accent)}

/* stage */
.stage{position:relative;min-height:0;border-radius:24px;overflow:hidden;background:var(--sea);border:var(--hair) solid var(--line)}
#map{width:100%;height:100%;display:block;cursor:grab}
#map:active{cursor:grabbing}
.bg path{fill:var(--land);stroke:var(--land-edge);stroke-width:.5px;vector-effect:non-scaling-stroke}
.units path{stroke:var(--land-edge);stroke-width:.5px;vector-effect:non-scaling-stroke;cursor:pointer;transition:fill .25s linear}
.units path.sel{stroke:var(--ink);stroke-width:1.6px}
.units path:hover{stroke:var(--ink);stroke-width:1px}
.flows path{fill:none;stroke:var(--flow);stroke-linecap:round;vector-effect:non-scaling-stroke;opacity:.62;stroke-dasharray:2 7;animation:flow 1.1s linear infinite;pointer-events:visibleStroke;cursor:help}
.flows path.x{stroke:var(--flow-x);opacity:.8}
.flows path:hover{opacity:1}
.flows circle{fill:var(--flow);opacity:.75;pointer-events:none}
.flows circle.x{fill:var(--flow-x)}
.flows .ext{fill:none;stroke:var(--flow-x);stroke-width:1px;vector-effect:non-scaling-stroke;stroke-dasharray:1 3}
.flows text{font:600 11px var(--f-body);fill:var(--muted);paint-order:stroke;stroke:var(--sea);stroke-width:3px;pointer-events:none}
@keyframes flow{to{stroke-dashoffset:-9}}
@media (prefers-reduced-motion:reduce){.flows path{animation:none;stroke-dasharray:none}.units path{transition:none}}

.legend{position:absolute;left:12px;top:12px;border-radius:16px;padding:10px 12px;font-size:12px;color:var(--muted);max-width:min(300px,calc(100% - 24px))}
.legend b{display:block;color:var(--ink);font-size:12.5px;font-weight:800;margin-bottom:6px}
.legend .ramp{display:flex;height:8px;border-radius:4px;overflow:hidden;border:var(--hair) solid var(--line)}
.legend .ramp i{flex:1}
.legend .lab{display:flex;justify-content:space-between;margin-top:4px;font-family:var(--f-display);font-variant-numeric:tabular-nums}
.legend .fl{display:flex;gap:12px;margin-top:8px;align-items:center;flex-wrap:wrap}
.legend .fl span{display:inline-flex;align-items:center;gap:6px}
.legend .fl i{width:20px;border-top:1.5px dashed var(--flow)}
.legend .fl i.x{border-top-color:var(--flow-x)}

.tip{position:absolute;pointer-events:none;border-radius:14px;padding:9px 12px;font-size:12.5px;min-width:160px;z-index:5}
.tip b{display:block;font-size:13.5px;font-weight:800;margin-bottom:3px}
.tip .r{display:flex;justify-content:space-between;gap:14px;color:var(--muted)}
.tip .r span:last-child{color:var(--ink);font-family:var(--f-display);font-variant-numeric:tabular-nums;font-weight:600}

.timeline{position:absolute;left:12px;right:12px;bottom:12px;border-radius:18px;padding:10px 14px;display:flex;align-items:center;gap:14px}
.play{width:38px;height:38px;flex:none;border-radius:50%;border:var(--hair) solid var(--line);background:var(--glass-a);display:grid;place-items:center;cursor:pointer}
.play path{fill:var(--ink)}
.yr{display:flex;flex-direction:column;line-height:1;min-width:76px}
.yr b{font-size:30px;font-weight:800;letter-spacing:-.02em}
.yr span{font-size:11px;color:var(--muted);margin-top:4px;letter-spacing:.08em}
.track{position:relative;flex:1;min-width:0;padding-top:4px}
.bands{position:absolute;left:0;right:0;top:13px;height:4px;display:flex;border-radius:2px;overflow:hidden;pointer-events:none}
.bands i{display:block;height:100%}
.b-rec{width:50%;background:repeating-linear-gradient(90deg,var(--faint) 0 3px,transparent 3px 6px);opacity:.6}
.b-obs{width:23.333%;background:var(--ink);opacity:.55}
.b-proj{flex:1;background:repeating-linear-gradient(90deg,var(--accent) 0 6px,transparent 6px 9px)}
#slider{width:100%;margin:0;appearance:none;-webkit-appearance:none;background:transparent;height:26px;position:relative;cursor:pointer}
#slider::-webkit-slider-runnable-track{height:26px;background:transparent}
#slider::-moz-range-track{height:26px;background:transparent}
#slider::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;margin-top:5px;border-radius:50%;background:var(--glass-inner);border:1.5px solid var(--ink);box-shadow:0 2px 8px var(--shadow)}
#slider::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--glass-inner);border:1.5px solid var(--ink)}
.ticks{position:relative;height:14px;font-size:10.5px;color:var(--faint)}
.ticks span{position:absolute;transform:translateX(-50%);white-space:nowrap}

/* panel */
.panel{border-radius:24px;min-height:0;display:grid;grid-template-rows:auto minmax(0,1fr);overflow:hidden}
.tabs{display:flex;gap:2px;padding:10px 12px 0;border-bottom:var(--hair) solid var(--line)}
.tabs button{border:0;background:none;padding:8px 12px 10px;font-weight:500;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--ink);font-weight:800;border-bottom-color:var(--ink)}
.pane{overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:18px;min-width:0}
.eyebrow{font:700 11px var(--f-display);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
.lead{font-size:13.5px;color:var(--muted);margin:4px 0 0}
.lead b{color:var(--ink)}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tile{border:var(--hair) solid var(--line);border-radius:16px;padding:10px 10px 9px;background:var(--field);display:flex;flex-direction:column;gap:2px;min-width:0}
.tile .k{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);font-weight:600}
.tile .k i{width:8px;height:8px;border-radius:50%}
.tile .v{font:800 22px/1.1 var(--f-display);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.tile .v small{font-size:12px;font-weight:600;color:var(--muted);margin-left:2px}
.tile .d{font:600 12px var(--f-display);font-variant-numeric:tabular-nums}
.up{color:var(--div-pos2)}.down{color:var(--div-neg2)}
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .grid line{stroke:var(--line-soft)}
.chart .axis text{font:500 10.5px var(--f-display);fill:var(--faint);font-variant-numeric:tabular-nums}
.chart .cursor{stroke:var(--ink);stroke-width:1px;stroke-dasharray:2 3}
.chart .now{stroke:var(--faint);stroke-width:1px}
.chart .lab{font:700 11px var(--f-body);fill:var(--ink)}
.chart .hit{fill:transparent;cursor:crosshair}
.legend-row{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend-row span{display:inline-flex;align-items:center;gap:6px}
.legend-row i{width:14px;height:2px;border-radius:1px}
.legend-row i.band{height:8px;opacity:.25;background:var(--ink)}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{font-weight:700;color:var(--faint);text-align:left;font-size:11px;letter-spacing:.06em;padding:0 6px 6px 0;border-bottom:var(--hair) solid var(--line)}
td{padding:6px 6px 6px 0;border-bottom:var(--hair) solid var(--line-soft);vertical-align:top}
td.n,th.n{text-align:right;font-family:var(--f-display);font-variant-numeric:tabular-nums;white-space:nowrap}
tr.best td{font-weight:800}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--accent-soft)}
.tbl{overflow-x:auto}
.note{font-size:12px;color:var(--muted);line-height:1.6}
.note b{color:var(--ink)}
.pill{display:inline-block;font:700 10.5px var(--f-display);letter-spacing:.06em;padding:2px 7px;border-radius:999px;border:var(--hair) solid var(--line);color:var(--muted)}
.pill.a{color:var(--accent);border-color:var(--accent)}
.empty{color:var(--muted);font-size:13px;border:var(--hair) dashed var(--line);border-radius:16px;padding:18px;text-align:center}
.unit-h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.unit-h h2{font-size:26px;font-weight:900}
.unit-h span{color:var(--muted);font-family:var(--f-display)}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.kv div{border:var(--hair) solid var(--line);border-radius:14px;padding:8px 10px;background:var(--field)}
.kv span{display:block;font-size:11.5px;color:var(--muted)}
.kv b{font:800 18px var(--f-display);font-variant-numeric:tabular-nums}
.sec h3{font-size:14px;font-weight:800;margin-bottom:8px}
ul.plain{margin:0;padding-left:18px;font-size:12.5px;color:var(--muted)}
ul.plain li{margin-bottom:4px}
ul.plain b{color:var(--ink)}

@media (max-width:980px){
  body{overflow:auto;height:auto}
  html{height:auto}
  .app{height:auto;grid-template-columns:minmax(0,1fr);grid-template-rows:auto}
  .stage{height:68vh;min-height:420px}
  .panel{max-height:none}
  .pane{overflow:visible}
}
@media (max-width:560px){
  .brand span{display:none}
  .seg button,.chip{padding:6px 9px;font-size:13px}
  .timeline{gap:10px;padding:8px 10px}
  .yr b{font-size:24px}
  .yr{min-width:58px}
  .legend{font-size:11px;padding:8px 10px}
  .tiles{grid-template-columns:minmax(0,1fr)}
}
</style>
<div class="app" id="app">
  <header class="top glass">
    <div class="brand"><b>人口潮汐</b><span>Population Tides · 1800–2100</span></div>
    <div class="ctrls">
      <div class="seg" role="group" aria-label="视角" id="view">
        <button data-v="world" aria-pressed="true">全球</button>
        <button data-v="CN">中国</button>
        <button data-v="EU">欧洲</button>
        <button data-v="US">美国</button>
      </div>
      <div class="seg" role="group" aria-label="地图着色" id="mode">
        <button data-m="growth" aria-pressed="true">增减率</button>
        <button data-m="density">密度</button>
        <button data-m="mig">净迁移</button>
        <button data-m="error">回测误差</button>
      </div>
      <div class="seg" role="group" aria-label="未来情景" id="scen">
        <button data-s="Low">低</button>
        <button data-s="Medium" aria-pressed="true">中</button>
        <button data-s="High">高</button>
      </div>
      <button class="chip" id="flowsBtn" aria-pressed="true"><i></i>流向</button>
    </div>
  </header>

  <section class="stage" id="stage">
    <svg id="map" role="img" aria-label="人口地图"></svg>
    <div class="legend glass" id="legend"></div>
    <div class="tip glass" id="tip" hidden></div>
    <div class="timeline glass">
      <button class="play" id="play" aria-label="播放">
        <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path id="playIcon" d="M4 2.5v11l9-5.5z"/></svg>
      </button>
      <div class="yr"><b class="num" id="year">2020</b><span id="era">观测</span></div>
      <div class="track">
        <div class="bands" aria-hidden="true"><i class="b-rec"></i><i class="b-obs"></i><i class="b-proj"></i></div>
        <input type="range" id="slider" min="1800" max="2100" step="1" value="2020" aria-label="年份">
        <div class="ticks num" aria-hidden="true" id="ticks"></div>
      </div>
    </div>
  </section>

  <aside class="panel glass" id="panel">
    <nav class="tabs" role="tablist" aria-label="面板">
      <button role="tab" data-t="sum" aria-selected="true" id="t-sum">总览</button>
      <button role="tab" data-t="unit" id="t-unit">地区</button>
      <button role="tab" data-t="bt" id="t-bt">回测</button>
      <button role="tab" data-t="how" id="t-how">方法</button>
    </nav>
    <div class="pane" id="p-sum" role="tabpanel"></div>
    <div class="pane" id="p-unit" role="tabpanel" hidden></div>
    <div class="pane" id="p-bt" role="tabpanel" hidden></div>
    <div class="pane" id="p-how" role="tabpanel" hidden></div>
  </aside>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/topojson/3.0.2/topojson.min.js"></script>
<script>(()=>{'use strict';

// 人口潮汐 · map, timeline, panel. DATA (src/data.js) and GEO (src/geo.js) are inlined by build.mjs.
const $ = s => document.querySelector(s);
const YRS = DATA.years, HIST = DATA.histEnd, Y0 = YRS[0], Y1 = YRS[YRS.length - 1];
const U = DATA.units, NU = U.length, EXT = DATA.ext;
const BLOCS = [{ k: 'CN', zh: '中国', c: '--s-cn' }, { k: 'EU', zh: '欧洲', c: '--s-eu' }, { k: 'US', zh: '美国', c: '--s-us' }];
const VZH = { Low: '低', Medium: '中', High: '高' };
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

const store = {
  get(k, d) { try { const v = localStorage.getItem('tides.' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem('tides.' + k, JSON.stringify(v)); } catch { /* storage unavailable */ } },
};
const S = {
  year: 2020, view: store.get('view', 'world'), mode: store.get('mode', 'growth'), scen: store.get('scen', 'Medium'),
  flows: store.get('flows', true), sel: null, tab: 'sum', playing: false,
};

// ---------------------------------------------------------------- numbers
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const dIdx = y => Math.min(Math.floor((y - Y0) / 10), YRS.length - 2);
function popAt(i, y, v = S.scen) {
  const row = DATA.pop[v][i], k = dIdx(y), t = (y - YRS[k]) / 10, a = row[k], b = row[k + 1];
  return a > 0 && b > 0 ? a * Math.pow(b / a, t) : a + (b - a) * t;
}
function growth(i, y, v = S.scen) {  // annual % over the decade containing y
  const k = dIdx(y), a = DATA.pop[v][i][k], b = DATA.pop[v][i][k + 1];
  return a > 0 && b > 0 ? (Math.pow(b / a, 0.1) - 1) * 100 : NaN;
}
function migRate(i, y) {  // net migration per 1000 residents per year (medium variant)
  const k = dIdx(y), a = DATA.pop.Medium[i][k], b = DATA.pop.Medium[i][k + 1];
  return a > 0 && b > 0 ? DATA.mig[i][k] / Math.sqrt(a * b) / 10 * 1000 : NaN;
}
const blocPop = (b, y, v = S.scen) => U.reduce((s, u, i) => u.bloc === b ? s + popAt(i, y, v) : s, 0);
function fmtPop(k) {
  if (!isFinite(k)) return '—';
  if (k >= 1e5) return (k / 1e5).toFixed(2) + ' 亿';
  if (k >= 10) return (k / 10).toFixed(k < 1000 ? 1 : 0) + ' 万';
  return Math.round(k * 1000).toLocaleString() + ' 人';
}
const fmtWan = k => { const w = k / 10; return (Math.abs(w) >= 100 ? Math.round(w) : w.toFixed(1)) + ' 万'; };
const sgn = (x, d = 2) => !isFinite(x) ? '—' : (x > 0 ? '+' : x < 0 ? '−' : '') + Math.abs(x).toFixed(d);
const era = y => y <= 1950 ? '重建' : y <= HIST ? '观测' : '预测 · ' + VZH[S.scen];
const decadeLabel = y => { const k = dIdx(y); return `${YRS[k]}–${YRS[k + 1]}`; };
const nodeName = j => j < NU ? U[j].zh : EXT[j - NU].zh;
const nodeBloc = j => j < NU ? U[j].bloc : EXT[j - NU].id.slice(2, 4);

// ---------------------------------------------------------------- geometry
// d3 treats rings as spherical: a ring wound the "wrong" way covers the rest of the globe, so flip those polygons.
const rewind = f => {
  const g = f.geometry, polys = g.type === 'Polygon' ? [g.coordinates] : g.coordinates;
  for (const rings of polys) if (d3.geoArea({ type: 'Polygon', coordinates: rings }) > 2 * Math.PI) rings.forEach(r => r.reverse());
  return f;
};
const layers = Object.fromEntries(['world', 'us', 'cn'].map(l => [l, topojson.feature(GEO, GEO.objects[l]).features.filter(f => f.geometry).map(rewind)]));
const keyOf = { CN: 'cn', US: 'us', EU: 'world' };
const featsByUnit = U.map(u => layers[keyOf[u.bloc]].filter(f => f.properties.k === u.geo));
const unitKeys = new Set(U.filter(u => u.bloc === 'EU').map(u => u.geo));
const bgFeats = layers.world.filter(f => !unitKeys.has(f.properties.k));
const noData = layers.cn.filter(f => !U.some(u => u.bloc === 'CN' && u.geo === f.properties.k)); // Taiwan, HK, Macau
const areaKm2 = featsByUnit.map(fs => fs.reduce((s, f) => s + d3.geoArea(f), 0) * 6371 * 6371);
const allFeats = { type: 'FeatureCollection', features: [...layers.world, ...layers.us, ...layers.cn] };

const svg = d3.select('#map'), root = svg.append('g'), gBg = root.append('g').attr('class', 'bg'),
  gUnits = root.append('g').attr('class', 'units'), gFlows = root.append('g').attr('class', 'flows');
let projection, path, W = 0, H = 0, centroid = [];
const zoom = d3.zoom().scaleExtent([1, 14]).on('zoom', e => root.attr('transform', e.transform));
svg.call(zoom).on('dblclick.zoom', null);

function layout() {
  const el = $('#stage'); W = el.clientWidth; H = el.clientHeight;
  svg.attr('viewBox', `0 0 ${W} ${H}`);
  projection = d3.geoNaturalEarth1().fitExtent([[12, 12], [W - 12, H - 84]], allFeats);
  path = d3.geoPath(projection);
  gBg.selectAll('path').data([...bgFeats, ...noData]).join('path').attr('d', path);
  gUnits.selectAll('path').data(U.flatMap((u, i) => featsByUnit[i].map(f => ({ f, i })))).join('path')
    .attr('d', d => path(d.f))
    .on('pointermove', (e, d) => showTip(e, unitTip(d.i)))
    .on('pointerleave', hideTip)
    .on('click', (e, d) => selectUnit(d.i));
  centroid = U.map((u, i) => {
    let best = null, area = -1;
    for (const f of featsByUnit[i]) {
      const polys = f.geometry.type === 'MultiPolygon' ? f.geometry.coordinates : [f.geometry.coordinates];
      for (const c of polys) { const p = { type: 'Polygon', coordinates: c }, a = d3.geoArea(p); if (a > area) { area = a; best = p; } }
    }
    return projection(d3.geoCentroid(best));
  });
  goView(S.view, false);
  paint(); drawFlows(true);
}

const VIEW_BOX = {
  CN: () => U.flatMap((u, i) => u.bloc === 'CN' ? featsByUnit[i] : []),
  US: () => U.flatMap((u, i) => u.bloc === 'US' && !['Alaska', 'Hawaii'].includes(u.en) ? featsByUnit[i] : []),
  EU: () => [{ type: 'Feature', geometry: { type: 'Polygon', coordinates: [[[-12, 35], [-12, 70], [42, 70], [42, 35], [-12, 35]]] } }],
};
function goView(v, animate = true) {
  let t = d3.zoomIdentity;
  if (v !== 'world') {
    const [[x0, y0], [x1, y1]] = path.bounds({ type: 'FeatureCollection', features: VIEW_BOX[v]() });
    const k = Math.min(14, 0.86 / Math.max((x1 - x0) / W, (y1 - y0) / (H - 90)));
    t = d3.zoomIdentity.translate(W / 2 - k * (x0 + x1) / 2, (H - 70) / 2 - k * (y0 + y1) / 2).scale(k);
  }
  (animate && !reduced ? svg.transition().duration(700) : svg).call(zoom.transform, t);
}

// ---------------------------------------------------------------- colour scales
const DIV = ['--div-neg3', '--div-neg2', '--div-neg1', '--div-mid', '--div-pos1', '--div-pos2', '--div-pos3'];
const MODES = {
  growth: { title: '年均人口增减率（本十年）', th: [-1.5, -0.5, -0.1, 0.1, 0.5, 1.5], lab: ['−1.5%', '0', '+1.5%'],
    val: i => growth(i, S.year), fmt: v => sgn(v) + '%' },
  density: { title: '人口密度（人/平方公里）', th: [5, 15, 50, 150, 400, 1000], lab: ['<5', '50', '>1000'], seq: true,
    val: i => popAt(i, S.year) * 1000 / areaKm2[i], fmt: v => Math.round(v).toLocaleString() },
  mig: { title: '净迁移率（‰/年，本十年）', th: [-10, -4, -1, 1, 4, 10], lab: ['−10‰', '0', '+10‰'],
    val: i => migRate(i, S.year), fmt: v => sgn(v, 1) + '‰' },
  error: { title: '回测误差：2000 年预测 2020 年人口', th: [-20, -8, -3, 3, 8, 20], lab: ['低估 20%', '0', '高估 20%'],
    val: i => DATA.backtest.holdout[U[i].id] ?? NaN, fmt: v => sgn(v, 1) + '%' },
};
function colorFor(mode, v) {
  if (!isFinite(v)) return css('--nodata');
  const m = MODES[mode];
  let k = m.th.findIndex(t => v < t); if (k < 0) k = m.th.length;
  if (m.seq) return d3.interpolateLab(css('--seq-lo'), css('--seq-hi'))(k / m.th.length);
  return css(DIV[k]);
}
function paint() {
  const m = MODES[S.mode];
  const fills = U.map((u, i) => DATA.pop.Medium[i][dIdx(S.year)] <= 0 && S.mode !== 'error' ? css('--nodata') : colorFor(S.mode, m.val(i)));
  gUnits.selectAll('path').attr('fill', d => fills[d.i]).classed('sel', d => d.i === S.sel);
  const steps = m.seq ? d3.range(7).map(k => d3.interpolateLab(css('--seq-lo'), css('--seq-hi'))(k / 6)) : DIV.map(css);
  $('#legend').innerHTML = `<b>${m.title}</b><div class="ramp">${steps.map(c => `<i style="background:${c}"></i>`).join('')}</div>
    <div class="lab"><span>${m.lab[0]}</span><span>${m.lab[1]}</span><span>${m.lab[2]}</span></div>
    ${S.flows && S.mode !== 'error' ? `<div class="fl"><span><i></i>区内净流动</span><span><i class="x"></i>跨洲 / 海外</span></div>` : ''}
    ${S.mode === 'error' ? '<div class="lab" style="margin-top:6px">欧洲用 UN 国别预测，不参与此回测</div>' : ''}`;
}

// ---------------------------------------------------------------- flows
const maxFlow = Math.max(...Object.values(DATA.flows).flatMap(f => f.map(r => r[2])));
let flowKey = '';
function extPos(j, y) { const e = EXT[j - NU]; return projection(y >= 1950 ? e.post : e.pre); }
function visibleFlows(y) {
  const rows = DATA.flows[YRS[dIdx(y)]] || [];
  const inView = S.view === 'world' ? () => true : r => nodeBloc(r[0]) === S.view || nodeBloc(r[1]) === S.view;
  return rows.filter(inView).slice(0, S.view === 'world' ? 48 : 40);
}
function drawFlows(force) {
  const key = [dIdx(S.year), S.view, S.flows, S.mode, W, H].join();
  if (!force && key === flowKey) return; flowKey = key;
  const rows = S.flows && S.mode !== 'error' ? visibleFlows(S.year) : [];
  const y = YRS[dIdx(S.year)];
  const pos = j => j < NU ? centroid[j] : extPos(j, y);
  const cross = r => r[0] >= NU || r[1] >= NU || U[r[0]].bloc !== U[r[1]].bloc;
  const arc = r => {
    const [x0, y0] = pos(r[0]), [x1, y1] = pos(r[1]), dx = x1 - x0, dy = y1 - y0, len = Math.hypot(dx, dy) || 1;
    const bend = cross(r) ? 0.18 : 0.26, cx = (x0 + x1) / 2 - dy * bend, cy = (y0 + y1) / 2 + dx * bend;
    return `M${x0},${y0}Q${cx},${cy} ${x1},${y1}`;
  };
  gFlows.selectAll('path').data(rows, r => r[0] + '-' + r[1]).join('path')
    .attr('d', arc).classed('x', cross)
    .attr('stroke-width', r => Math.max(0.6, Math.sqrt(r[2] / maxFlow) * 7))
    .on('pointermove', (e, r) => showTip(e, flowTip(r, y, cross(r))))
    .on('pointerleave', hideTip);
  gFlows.selectAll('circle').data(rows, r => r[0] + '-' + r[1]).join('circle')
    .attr('cx', r => pos(r[1])[0]).attr('cy', r => pos(r[1])[1]).classed('x', cross)
    .attr('r', r => (1 + Math.sqrt(r[2] / maxFlow) * 3) / d3.zoomTransform(svg.node()).k);
  const exts = [...new Set(rows.flatMap(r => [r[0], r[1]]).filter(j => j >= NU))];
  gFlows.selectAll('text').data(exts, j => j).join('text')
    .attr('x', j => extPos(j, y)[0] + 6).attr('y', j => extPos(j, y)[1] + 4).text(j => nodeName(j))
    .attr('transform', null).style('font-size', () => `${11 / d3.zoomTransform(svg.node()).k}px`).style('stroke-width', () => `${3 / d3.zoomTransform(svg.node()).k}px`);
}

function lineChart(el, series, opts = {}) {

  const x = d3.scaleLinear([Y0, Y1], [m.l, w - m.r]);

  const y = d3.scaleLinear([0, ymax * 1.05], [h - m.b, m.t]).nice(4);
  const s = d3.select(el).html('').append('svg').attr('viewBox', `0 0 ${w} ${h}`).attr('role', 'img').attr('aria-label', opts.label || '');
  s.append('g').attr('class', 'grid').selectAll('line').data(y.ticks(4)).join('line')
    .attr('x1', m.l).attr('x2', w - m.r).attr('y1', y).attr('y2', y);
  s.append('g').attr('class', 'axis').selectAll('text').data(y.ticks(4)).join('text')
    .attr('x', m.l - 6).attr('y', d => y(d) + 3).attr('text-anchor', 'end').text(opts.yfmt || (d => d));
  s.append('g').attr('class', 'axis').selectAll('text').data([1800, 1900, 2000, 2100]).join('text')

  s.append('line').attr('class', 'now').attr('x1', x(HIST)).attr('x2', x(HIST)).attr('y1', m.t).attr('y2', h - m.b);
  for (const se of series) {
    const band = se.pts.filter(p => p.lo != null);
    if (band.length) s.append('path').attr('fill', se.color).attr('opacity', .16)
      .attr('d', d3.area().x(p => x(p.y)).y0(p => y(p.lo)).y1(p => y(p.hi))(band));
    s.append('path').attr('fill', 'none').attr('stroke', se.color).attr('stroke-width', 2).attr('stroke-linejoin', 'round')
      .attr('d', d3.line().x(p => x(p.y)).y(p => y(p.v))(se.pts.filter(p => p.y <= HIST)));
    s.append('path').attr('fill', 'none').attr('stroke', se.color).attr('stroke-width', 2).attr('stroke-dasharray', '4 3')
      .attr('d', d3.line().x(p => x(p.y)).y(p => y(p.v))(se.pts.filter(p => p.y >= HIST)));
  }

  const dots = s.append('g').selectAll('circle').data(series).join('circle').attr('r', 4).attr('fill', d => d.color)
    .attr('stroke', css('--bg')).attr('stroke-width', 2);
  const hover = d3.select(el).append('div').attr('class', 'tip glass').attr('hidden', true);
  const place = yr => {
    cur.attr('x1', x(yr)).attr('x2', x(yr));
    dots.attr('cx', x(yr)).attr('cy', d => y(d.at(yr)));
  };
  s.append('rect').attr('class', 'hit').attr('x', m.l).attr('y', 0).attr('width', w - m.l - m.r).attr('height', h)
    .on('pointermove', e => {
      const [px] = d3.pointer(e), yr = Math.round(Math.max(Y0, Math.min(Y1, x.invert(px))));
      place(yr);
      hover.attr('hidden', null).html(`<b>${yr}</b>` + series.map(se => row(se.label, opts.vfmt(se.at(yr)))).join(''));
      const bw = el.clientWidth, left = px / w * bw;
      hover.style('left', (left > bw / 2 ? left - hover.node().offsetWidth - 12 : left + 12) + 'px').style('top', '4px');
    })
    .on('pointerleave', () => { hover.attr('hidden', true); place(S.year); });
  place(S.year);
  return place;
}
function barChart(el, vals, opts) {
  const w = 340, h = 120, m = { l: 34, r: 8, t: 8, b: 20 };
  const x = d3.scaleLinear([Y0, Y1], [m.l, w - m.r]);

  s.append('g').attr('class', 'axis').selectAll('text').data(y.ticks(2)).join('text').attr('x', m.l - 6).attr('y', d => y(d) + 3).attr('text-anchor', 'end').text(opts.yfmt);
  s.append('g').attr('class', 'axis').selectAll('text').data([1800, 1900, 2000, 2100]).join('text')
    .attr('x', x).attr('y', h - 4).attr('text-anchor', (d, i) => i === 0 ? 'start' : i === 3 ? 'end' : 'middle').text(d => d);
  s.append('line').attr('class', 'now').attr('x1', x(HIST)).attr('x2', x(HIST)).attr('y1', m.t).attr('y2', h - m.b);
  const bw = (x(1810) - x(1800)) - 2;
  s.append('g').selectAll('path').data(vals).join('path')
    .attr('fill', d => css(d.v >= 0 ? '--div-pos2' : '--div-neg2')).attr('opacity', d => d.y >= HIST ? .55 : 1)
    .attr('d', d => {  // 2px rounded data end, square at the zero line
      const x0 = x(d.y) + 1, y0 = y(0), y1 = y(d.v), r = Math.min(2, Math.abs(y1 - y0));
      if (Math.abs(y1 - y0) < .5) return '';
      const up = d.v >= 0, e = up ? y1 + r : y1 - r;
      return `M${x0},${y0}V${e}Q${x0},${y1} ${x0 + r},${y1}H${x0 + bw - r}Q${x0 + bw},${y1} ${x0 + bw},${e}V${y0}Z`;
    })

  const cur = s.append('line').attr('class', 'cursor').attr('y1', m.t).attr('y2', h - m.b);
  return yr => cur.attr('x1', x(yr)).attr('x2', x(yr));
}

    </tbody></table></div></div>
    <div class="sec"><h3>模型</h3><ul class="plain">
      <li><b>净迁移（中美）</b>：残差法。某省/州十年净迁移 = 实际增量 − 全国自然增长率 × 期初人口。</li>
      <li><b>战乱与饥荒</b>：太平天国、西北战争、丁戊奇荒、1942 河南饥荒、1959–61 饥荒期间，受灾省份超出自然增长的减少计为超额死亡，不计为迁出。</li>
      <li><b>净迁移（欧洲）</b>：1950 年后用 UN 各国净迁移；1950 年前只建模跨洲移民和战后驱逐，欧洲内部流动未建模。</li>
      <li><b>流向</b>：净迁出地 → 净迁入地按双约束重力模型（距离衰减）分配；跨洲流量按入境口岸（纽约、旧金山）分配到各州。</li>
      <li><b>未来</b>：UN 低/中/高情景只改变生育率，迁移假设相同，所以三种情景的流向相同。</li>
    </ul></div>
    <div class="sec"><h3>局限</h3><ul class="plain">
      <li>残差法假设同一国内各地自然增长率相同；美国南部 1950 年前、中国少数民族地区生育率更高，会被部分误读为迁入。</li>
      <li>重力模型给出的是“合理分配”，不是登记到的具体路线；单条弧线应读作量级。</li>
      <li>1860 年以前美国普查不含原住民；台湾、香港、澳门未纳入（灰色）。</li>
      <li>俄罗斯按整国计入欧洲。</li>
    </ul></div>`;
}

// ---------------------------------------------------------------- state changes
const pressed = (sel, attr, val) => document.querySelectorAll(sel + ' button').forEach(b => b.setAttribute('aria-pressed', b.dataset[attr] === val));
function setYear(y, fromSlider) {
  y = Math.max(Y0, Math.min(Y1, Math.round(y)));
  if (y === S.year && !fromSlider) return;
  S.year = y;
  $('#year').textContent = y; $('#era').textContent = era(y);
  if (!fromSlider) $('#slider').value = y;
  paint(); drawFlows(); renderSum();
  if (S.tab === 'unit' && S.sel != null) {
    const k = dIdx(y);
    if (k !== setYear.k) renderUnit(); else { $('#uPop') && ($('#uPop').textContent = fmtPop(popAt(S.sel, y))); placeUnit.forEach(f => f(y)); }
  }
  setYear.k = dIdx(y);
}
function setMode(m) { S.mode = m; store.set('mode', m); pressed('#mode', 'm', m); paint(); drawFlows(true); if (S.tab === 'bt') renderBt(); }
function selectUnit(i) { S.sel = i; paint(); setTab('unit'); }
function setTab(t) {
  S.tab = t;
  document.querySelectorAll('.tabs button').forEach(b => b.setAttribute('aria-selected', b.dataset.t === t));
  for (const p of ['sum', 'unit', 'bt', 'how']) $('#p-' + p).hidden = p !== t;
  if (t === 'unit') renderUnit(); if (t === 'bt') renderBt(); if (t === 'how') renderHow(); if (t === 'sum') { sumKey = ''; renderSum(); }
}

document.querySelectorAll('#view button').forEach(b => b.onclick = () => { S.view = b.dataset.v; store.set('view', S.view); pressed('#view', 'v', S.view); goView(S.view); drawFlows(true); sumKey = ''; renderSum(); });
document.querySelectorAll('#mode button').forEach(b => b.onclick = () => setMode(b.dataset.m));
document.querySelectorAll('#scen button').forEach(b => b.onclick = () => {
  S.scen = b.dataset.s; store.set('scen', S.scen); pressed('#scen', 's', S.scen);
  $('#era').textContent = era(S.year); paint(); sumKey = ''; renderSum(); if (S.tab === 'unit') renderUnit();
});
$('#flowsBtn').onclick = () => { S.flows = !S.flows; store.set('flows', S.flows); $('#flowsBtn').setAttribute('aria-pressed', S.flows); paint(); drawFlows(true); };
document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => setTab(b.dataset.t));
$('#slider').addEventListener('input', e => setYear(+e.target.value, true));

// play
let raf = 0, last = 0, acc = 0;
function tick(t) {
  if (!S.playing) return;
  const dt = last ? (t - last) / 1000 : 0; last = t;
  acc += dt * (reduced ? 1 / 0.7 * 10 : 7);  // 7 years/s; reduced motion jumps a decade every 0.7 s
  const step = reduced ? Math.floor(acc / 10) * 10 : Math.floor(acc);
  if (step >= 1) { acc -= step; setYear(S.year + step); }
  if (S.year >= Y1) return stop();
  raf = requestAnimationFrame(tick);
}
function stop() { S.playing = false; cancelAnimationFrame(raf); $('#playIcon').setAttribute('d', 'M4 2.5v11l9-5.5z'); $('#play').setAttribute('aria-label', '播放'); }
$('#play').onclick = () => {
  if (S.playing) return stop();
  if (S.year >= Y1) setYear(Y0);
  S.playing = true; last = 0; acc = 0;
  $('#playIcon').setAttribute('d', 'M4 2.5h3v11H4zM9 2.5h3v11H9z'); $('#play').setAttribute('aria-label', '暂停');
  raf = requestAnimationFrame(tick);
};
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' && e.target.type !== 'range') return;
  if (e.key === ' ' && e.target === document.body) { e.preventDefault(); $('#play').click(); }
});

// ticks under the slider
$('#ticks').innerHTML = [1800, 1850, 1900, 1950, 2000, 2050, 2100].map(y => `<span style="left:${(y - Y0) / (Y1 - Y0) * 100}%">${y}</span>`).join('');

// theme changes repaint everything colour-bound
const repaint = () => { paint(); sumKey = ''; renderSum(); if (S.tab === 'unit') renderUnit(); };
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', repaint);
new MutationObserver(repaint).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

// boot
pressed('#view', 'v', S.view); pressed('#mode', 'm', S.mode); pressed('#scen', 's', S.scen);
$('#flowsBtn').setAttribute('aria-pressed', S.flows);
$('#year').textContent = S.year; $('#era').textContent = era(S.year); $('#slider').value = S.year;
layout(); renderSum();
let rz; new ResizeObserver(() => { clearTimeout(rz); rz = setTimeout(layout, 120); }).observe($('#stage'));

})();</script>
