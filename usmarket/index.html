<title>美股晨报 OS</title>
<meta name="description" content="美股晨报决策台：按波动率决定仓位上限，核心仓 SPY + 卫星仓趋势突破个股，每天给出买卖指令、止损和股数，附 9 年回测与模拟组合实盘记录。">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;700;900&display=swap">
<style>/* Layout: the 机会猎手 OS frame turned into a decision desk. A glass top bar, then two columns of glass cards:
   left = what to do (exposure cap, today's orders, model book, my holdings), right = why to trust it (paper record,
   candidates, backtest scorecard, method). Hairline rules, heavy Outfit numerals, one accent; up/down hues swap with the toggle. */
:root{
  --bg:#E8EDF2;--sea:#DCE4EB;
  --ink:#0B1520;--muted:#4A5765;--faint:#7C8995;
  --glass-a:rgba(255,255,255,.70);--glass-b:rgba(255,255,255,.38);--glass-edge:rgba(255,255,255,.95);--glass-inner:rgba(255,255,255,.98);
  --shadow:rgba(16,36,60,.18);--line:rgba(11,21,32,.16);--line-soft:rgba(11,21,32,.08);--field:rgba(255,255,255,.55);
  --accent:#1F62C4;--accent-soft:rgba(31,98,196,.11);--accent-2:#8FB3E8;
  --bench:#7C8995;--warn:#B26A00;--warn-soft:rgba(178,106,0,.12);
  --red:#B42A25;--red-soft:rgba(180,42,37,.11);--green:#127042;--green-soft:rgba(18,112,66,.11);
  --hair:1px;
  --f-display:"Outfit","Noto Sans SC",system-ui,sans-serif;
  --f-body:"Noto Sans SC","Outfit",system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#070F16;--sea:#0A151E;
  --ink:#E8EFF5;--muted:#A2B0BC;--faint:#6E7D89;
  --glass-a:rgba(22,33,44,.70);--glass-b:rgba(10,19,28,.48);--glass-edge:rgba(255,255,255,.16);--glass-inner:rgba(255,255,255,.18);
  --shadow:rgba(0,0,0,.55);--line:rgba(255,255,255,.16);--line-soft:rgba(255,255,255,.07);--field:rgba(255,255,255,.05);
  --accent:#6FA8F2;--accent-soft:rgba(111,168,242,.14);--accent-2:#2F5E9C;
  --bench:#8593A0;--warn:#F2B04C;--warn-soft:rgba(242,176,76,.14);
  --red:#FF8A82;--red-soft:rgba(255,138,130,.13);--green:#5BE39A;--green-soft:rgba(91,227,154,.12);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#070F16;--sea:#0A151E;
  --ink:#E8EFF5;--muted:#A2B0BC;--faint:#6E7D89;
  --glass-a:rgba(22,33,44,.70);--glass-b:rgba(10,19,28,.48);--glass-edge:rgba(255,255,255,.16);--glass-inner:rgba(255,255,255,.18);
  --shadow:rgba(0,0,0,.55);--line:rgba(255,255,255,.16);--line-soft:rgba(255,255,255,.07);--field:rgba(255,255,255,.05);
  --accent:#6FA8F2;--accent-soft:rgba(111,168,242,.14);--accent-2:#2F5E9C;
  --bench:#8593A0;--warn:#F2B04C;--warn-soft:rgba(242,176,76,.14);
  --red:#FF8A82;--red-soft:rgba(255,138,130,.13);--green:#5BE39A;--green-soft:rgba(91,227,154,.12);
  color-scheme:dark}
@media (min-resolution:2dppx){:root{--hair:.5px}}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.55;padding-inline:16px;padding-block:16px 40px;
  background-image:radial-gradient(60vw 50vh at 8% -10%,var(--accent-soft),transparent 70%),radial-gradient(50vw 40vh at 100% 0%,var(--accent-soft),transparent 70%);
  --up:var(--red);--up-soft:var(--red-soft);--dn:var(--green);--dn-soft:var(--green-soft)}
body[data-updown="us"]{--up:var(--green);--up-soft:var(--green-soft);--dn:var(--red);--dn-soft:var(--red-soft)}
.num{font-family:var(--f-display);font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,h4{margin:0;text-wrap:balance}
p{margin:0}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
.up{color:var(--up)}.dn{color:var(--dn)}.flat{color:var(--muted)}

.glass{background:linear-gradient(145deg,var(--glass-a),var(--glass-b));-webkit-backdrop-filter:blur(24px) saturate(170%);backdrop-filter:blur(24px) saturate(170%);border:var(--hair) solid var(--glass-edge);box-shadow:inset 0 1px 0 var(--glass-inner),0 24px 60px -30px var(--shadow)}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;display:flex;align-items:center;gap:10px 18px;padding:10px 16px;border-radius:20px;flex-wrap:wrap;max-width:1440px;margin:0 auto 14px}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto;min-width:0;flex-wrap:wrap}
.brand b{font:900 24px/1 var(--f-body);letter-spacing:.03em;white-space:nowrap}
.brand span{font-weight:600;font-size:11px;letter-spacing:.2em;color:var(--muted);text-transform:uppercase;white-space:nowrap}
.ctrls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;min-width:0}
.seg{display:inline-flex;padding:3px;border-radius:13px;border:var(--hair) solid var(--line);background:var(--field);gap:2px}
.seg button{border:0;background:none;padding:6px 12px;border-radius:10px;font-size:13px;font-weight:500;color:var(--muted);cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--glass-a);color:var(--ink);font-weight:800;box-shadow:inset 0 1px 0 var(--glass-inner),0 4px 14px -6px var(--shadow)}
.seg .sw{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;vertical-align:1px}
select,input[type=text],input[type=number],textarea{border:var(--hair) solid var(--line);background:var(--field);border-radius:12px;padding:0 10px;height:36px;font-size:13px}
select{font-family:var(--f-display);font-weight:600}
textarea{height:auto;padding:8px 10px;width:100%;font-family:var(--f-display);font-size:12.5px;resize:vertical}
.btn{border:var(--hair) solid var(--line);background:var(--field);border-radius:12px;height:36px;padding:0 14px;font-weight:700;cursor:pointer;white-space:nowrap}
.btn.pri{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.sm{height:28px;padding:0 10px;font-size:12px;border-radius:9px;font-weight:600}

.grid{max-width:1440px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:14px;align-items:start}
.col{display:flex;flex-direction:column;gap:14px;min-width:0}
.card{border-radius:24px;padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.card>*{min-width:0}
.ch{display:flex;align-items:baseline;gap:8px 12px;flex-wrap:wrap}
.ch h2{font-size:17px;font-weight:900}
.ch .sub{font-size:12px;color:var(--faint)}
.ch .right{margin-left:auto}
.eyebrow{font:700 11px var(--f-display);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
.note{font-size:12px;color:var(--muted);line-height:1.65}
.note b{color:var(--ink)}
.pill{display:inline-flex;align-items:center;gap:4px;font:700 11px var(--f-body);letter-spacing:.03em;padding:2px 8px;border-radius:999px;border:var(--hair) solid var(--line);color:var(--muted);white-space:nowrap}
.pill.live{color:var(--accent);border-color:var(--accent)}
.pill.solid{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pill.buy{background:var(--up-soft);color:var(--up);border-color:transparent}
.pill.sell{background:var(--dn-soft);color:var(--dn);border-color:transparent}
.pill.adj{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.empty{color:var(--muted);font-size:13px;border:var(--hair) dashed var(--line);border-radius:16px;padding:14px 16px}
.empty b{color:var(--ink)}
.src{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:11.5px}
.src a::before{content:"↗ ";color:var(--faint)}

/* hero: exposure cap */
.hero{gap:16px}
.cap{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 28px;align-items:end}
.cap .big{font:800 88px/.9 var(--f-display);letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.cap .big small{font-size:34px;letter-spacing:0;margin-left:2px}
.cap .lbl{display:flex;flex-direction:column;gap:6px;padding-bottom:6px}
.cap .lbl b{font-size:20px;font-weight:900}
.split{display:flex;height:12px;border-radius:6px;overflow:hidden;gap:2px;background:var(--line-soft)}
.split i{display:block;height:100%}
.split .core{background:var(--accent)}.split .sat{background:var(--accent-2)}.split .cash{background:transparent}
.legend{display:flex;gap:6px 16px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.legend i.ln{height:0;border-top:2px solid;border-radius:0;width:16px}
.legend i.dash{height:0;border-top:2px dashed;border-radius:0;width:16px}
.gauge{display:flex;flex-direction:column;gap:6px}
.gauge svg{display:block;width:100%;height:auto;overflow:visible}
.gauge .zone{fill:var(--line-soft)}
.gauge .zone.on{fill:var(--accent-soft)}
.gauge .zl{font:600 10.5px var(--f-display);fill:var(--muted)}
.gauge .zl.on{fill:var(--accent);font-weight:800}
.gauge .tick{font:500 10px var(--f-display);fill:var(--faint)}
.gauge .mk{fill:var(--ink)}
.gauge .mkl{font:800 11.5px var(--f-display);fill:var(--ink)}
.gauge .edge{stroke:var(--line);stroke-width:1}

/* orders */
.orders{display:flex;flex-direction:column}
.order{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 12px;padding:12px 0;border-top:var(--hair) solid var(--line-soft);align-items:baseline}
.order:first-child{border-top:0;padding-top:2px}
.order .tk{font:800 18px var(--f-display)}
.order .tk small{font:500 12.5px var(--f-body);color:var(--muted);margin-left:6px}
.order .qty{font:800 18px var(--f-display);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.order .qty small{display:block;font:500 11.5px var(--f-body);color:var(--faint)}
.order .det{grid-column:2/-1;display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--muted)}
.order .det b{color:var(--ink);font-family:var(--f-display);font-weight:700}
.order .why{grid-column:2/-1;font-size:13px;line-height:1.6}
.order .src{grid-column:2/-1}
.checks{margin:6px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px}
.checks li{display:flex;gap:8px;align-items:baseline}
.checks li::before{content:"";width:6px;height:1px;background:var(--ink);flex:none;transform:translateY(-3px)}

/* tables */
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{font-weight:700;color:var(--faint);text-align:left;font-size:11px;letter-spacing:.05em;padding:0 10px 6px 0;border-bottom:var(--hair) solid var(--line);white-space:nowrap}
td{padding:8px 10px 8px 0;border-bottom:var(--hair) solid var(--line-soft);vertical-align:middle}
td.n,th.n{text-align:right;font-family:var(--f-display);font-variant-numeric:tabular-nums;white-space:nowrap}
td.code{font-family:var(--f-display);font-weight:800;white-space:nowrap}
td.code small{display:block;font:500 11px var(--f-body);color:var(--faint)}
.tbl td{white-space:nowrap}
.tbl td.act,.tbl td.wrap{white-space:normal;min-width:170px}
td.act{font-size:12px;line-height:1.5}
tr.hi td{background:var(--accent-soft)}
tr.foot td{color:var(--muted);border-bottom:0}
td .x{border:0;background:none;color:var(--faint);cursor:pointer;font-size:15px;padding:0 4px}
td .x:hover{color:var(--ink)}

/* forms */
.form{display:flex;flex-wrap:wrap;gap:8px;align-items:end}
.form label{display:flex;flex-direction:column;gap:3px;font-size:11px;color:var(--faint);font-weight:600}
.form input{width:110px}
.form input#h-sym{width:96px;text-transform:uppercase}
.form input#acct-eq{width:130px}
details summary{cursor:pointer;font-size:12.5px;color:var(--muted);font-weight:600}
details[open] summary{margin-bottom:8px}
.msg{font-size:12px;color:var(--muted);min-height:1em}

/* stats + charts */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.tile{border:var(--hair) solid var(--line);border-radius:16px;padding:10px 11px 9px;background:var(--field);display:flex;flex-direction:column;gap:1px;min-width:0}
.tile .k{font-size:11.5px;color:var(--muted);font-weight:600}
.tile .v{font:800 21px/1.15 var(--f-display);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.tile .d{font-size:11px;color:var(--faint)}
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .grid line{stroke:var(--line-soft)}
.chart .axis text{font:500 10.5px var(--f-display);fill:var(--faint);font-variant-numeric:tabular-nums}
.chart .base{stroke:var(--line)}
.chart .replay{fill:var(--line-soft)}
.chart .replay-l{font:600 10.5px var(--f-body);fill:var(--faint)}
.chart .end{font:700 11px var(--f-display);fill:var(--ink)}
.chart .hit{fill:transparent;cursor:crosshair}
.chart .xh{stroke:var(--faint);stroke-width:1}
.chart .tip{position:absolute;top:0;pointer-events:none;border-radius:12px;padding:7px 10px;font-size:12px;min-width:150px;z-index:3}
.chart .tip b{display:block;font:700 12px var(--f-display);margin-bottom:2px}
.chart .tip .r{display:flex;justify-content:space-between;gap:12px;color:var(--muted)}
.chart .tip .r span:last-child{color:var(--ink);font-family:var(--f-display);font-weight:600}
.trades{display:flex;flex-direction:column;gap:0;font-size:12.5px}
.trades div{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:10px;padding:6px 0;border-top:var(--hair) solid var(--line-soft);align-items:baseline}
.trades div:first-child{border-top:0}
.trades .why{color:var(--muted);font-size:12px;min-width:0}
.cands article{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 10px;padding:10px 0;border-top:var(--hair) solid var(--line-soft)}
.cands article:first-child{border-top:0}
.cands .tk{font:800 15px var(--f-display)}
.cands .tk small{font:500 12px var(--f-body);color:var(--muted);margin-left:6px}
.cands .meta{grid-column:1/-1;font-size:12px;color:var(--muted);display:flex;gap:4px 12px;flex-wrap:wrap}
.cands .why{grid-column:1/-1;font-size:12.5px}
.events{display:flex;flex-direction:column;font-size:12.5px}
.events div{display:grid;grid-template-columns:88px minmax(0,1fr);gap:10px;padding:5px 0;border-top:var(--hair) solid var(--line-soft)}
.events div:first-child{border-top:0}
.rules{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px;font-size:12.5px;line-height:1.6}
.rules li{padding-left:14px;position:relative}
.rules li::before{content:"";position:absolute;left:0;top:.75em;width:6px;height:1px;background:var(--ink)}
.rules b{font-weight:800}

@media (max-width:1080px){
  .grid{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
  .brand span{display:none}
  .cap{grid-template-columns:minmax(0,1fr)}
  .cap .big{font-size:72px}
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .card{padding:16px 14px;border-radius:20px}
  .order{grid-template-columns:auto minmax(0,1fr)}
  .order .qty{grid-column:2;text-align:left}
}
</style>
<header class="top glass">
  <div class="brand"><b>美股晨报 OS</b><span class="num" id="brand-sub">Decision Desk</span></div>
  <div class="ctrls">
    <label for="issue-pick" hidden>往期</label>
    <select id="issue-pick" aria-label="选择日期"></select>
    <div class="seg" role="group" aria-label="涨跌配色">
      <button type="button" id="ud-cn" aria-pressed="true" title="红涨绿跌"><i class="sw" style="background:var(--red)"></i>红涨</button>
      <button type="button" id="ud-us" aria-pressed="false" title="绿涨红跌"><i class="sw" style="background:var(--green)"></i>绿涨</button>
    </div>
  </div>
</header>
<main class="grid">
  <section class="col" aria-label="今天怎么做">
    <article class="card glass hero" id="gate" aria-labelledby="gate-h"></article>
    <article class="card glass" id="orders" aria-labelledby="orders-h"></article>
    <article class="card glass" id="book" aria-labelledby="book-h"></article>
    <article class="card glass" id="mine" aria-labelledby="mine-h">
      <div class="ch"><h2 id="mine-h">我的持仓</h2><span class="sub">只存在这台设备的浏览器里，不会上传</span></div>
      <div class="form" role="group" aria-label="账户设置">
        <label for="acct-eq">账户净值（美元）<input id="acct-eq" type="number" min="1000" step="1000" inputmode="numeric"></label>
        <label for="acct-risk">每笔风险<select id="acct-risk"><option value="0.0025">0.25%</option><option value="0.005">0.5%（回测口径）</option><option value="0.01">1%</option></select></label>
      </div>
      <form class="form" id="h-form" autocomplete="off">
        <label for="h-sym">代码<input id="h-sym" type="text" placeholder="AAPL" required></label>
        <label for="h-cost">成本价<input id="h-cost" type="number" step="0.01" min="0" placeholder="180.50" required></label>
        <label for="h-sh">股数<input id="h-sh" type="number" step="0.0001" min="0" placeholder="20" required></label>
        <button class="btn pri" type="submit">添加</button>
      </form>
      <p class="msg" id="h-msg" role="status"></p>
      <div id="h-table"></div>
      <details>
        <summary>批量导入或备份</summary>
        <p class="note">每行一只：代码,成本价,股数。复制下面的文本即可备份；粘贴后点「导入」会替换当前列表。</p>
        <textarea id="h-bulk" rows="5" spellcheck="false" aria-label="持仓文本"></textarea>
        <div class="form" style="margin-top:8px"><button class="btn sm" type="button" id="h-import">导入</button><button class="btn sm" type="button" id="h-copy">复制</button></div>
      </details>
    </article>
  </section>
  <aside class="col" aria-label="依据">
    <article class="card glass" id="perf" aria-labelledby="perf-h"></article>
    <article class="card glass" id="cands" aria-labelledby="cands-h"></article>
    <article class="card glass" id="score" aria-labelledby="score-h"></article>
    <article class="card glass" id="how" aria-labelledby="how-h"></article>
  </aside>

// ---------- line chart ----------
function lineChart(el, { x, series, shadeTo, fmt }) {
  const W = 640, H = 220, L = 46, R = 70, T = 12, B = 26;
  const all = series.flatMap(s => s.v).filter(num);
  let lo = Math.min(...all), hi = Math.max(...all);
  const pad = (hi - lo) * 0.08 || 1; lo -= pad; hi += pad;
  const sx = i => L + (i / Math.max(x.length - 1, 1)) * (W - L - R);
  const sy = v => T + (1 - (v - lo) / (hi - lo)) * (H - T - B);
  const ticks = Array.from({ length: 4 }, (_, k) => lo + ((k + 0.5) * (hi - lo)) / 4);
  const xt = [0, Math.floor((x.length - 1) / 2), x.length - 1];
  const path = v => v.map((y, i) => (num(y) ? `${i && num(v[i - 1]) ? 'L' : 'M'}${sx(i).toFixed(1)},${sy(y).toFixed(1)}` : '')).join('');
  const ends = series.map(s => ({ s, y: sy(s.v[s.v.length - 1]) })).sort((a, b) => a.y - b.y);
  for (let k = 1; k < ends.length; k++) if (ends[k].y - ends[k - 1].y < 13) ends[k].y = ends[k - 1].y + 13;
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(series.map(s => s.n).join('、'))}">
    ${shadeTo > 0 ? `<rect class="replay" x="${L}" y="${T}" width="${(sx(shadeTo) - L).toFixed(1)}" height="${H - T - B}"></rect><text class="replay-l" x="${L + 6}" y="${T + 14}">规则回放</text>` : ''}
    <g class="grid">${ticks.map(t => `<line x1="${L}" x2="${W - R}" y1="${sy(t)}" y2="${sy(t)}"></line>`).join('')}</g>
    <g class="axis">${ticks.map(t => `<text x="${L - 6}" y="${sy(t) + 3.5}" text-anchor="end">${esc(fmt(t))}</text>`).join('')}
      ${xt.map((i, k) => `<text x="${sx(i)}" y="${H - 8}" text-anchor="${k === 0 ? 'start' : k === 2 ? 'end' : 'middle'}">${esc(x[i])}</text>`).join('')}</g>
    <line class="base" x1="${L}" x2="${W - R}" y1="${H - B}" y2="${H - B}"></line>
    ${series.map(s => `<path d="${path(s.v)}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"${s.dash ? ' stroke-dasharray="5 4"' : ''}></path>`).join('')}
    ${series.map(s => `<circle cx="${sx(s.v.length - 1)}" cy="${sy(s.v[s.v.length - 1])}" r="3.5" fill="${s.color}" stroke="var(--bg)" stroke-width="2"></circle>`).join('')}
    ${ends.map(({ s, y }) => `<text class="end" x="${W - R + 8}" y="${y + 4}">${esc(fmt(s.v[s.v.length - 1]))}</text>`).join('')}
    <line class="xh" y1="${T}" y2="${H - B}" x1="0" x2="0" visibility="hidden"></line>
    <rect class="hit" x="${L}" y="${T}" width="${W - L - R}" height="${H - T - B}"></rect></svg>
    <div class="tip glass" hidden></div>`;
  const svg = el.querySelector('svg'), tip = el.querySelector('.tip'), xh = el.querySelector('.xh');
  svg.querySelector('.hit').addEventListener('pointermove', ev => {
    const b = svg.getBoundingClientRect(), px = ((ev.clientX - b.left) / b.width) * W;
    const i = Math.max(0, Math.min(x.length - 1, Math.round(((px - L) / (W - L - R)) * (x.length - 1))));
    xh.setAttribute('x1', sx(i)); xh.setAttribute('x2', sx(i)); xh.setAttribute('visibility', 'visible');
    tip.innerHTML = `<b>${esc(x[i])}</b>${series.map(s => `<div class="r"><span>${esc(s.n)}</span><span>${esc(fmt(s.v[i]))}</span></div>`).join('')}`;
    tip.hidden = false;
    const left = (sx(i) / W) * b.width;
    tip.style.left = Math.min(Math.max(0, left + 12), b.width - tip.offsetWidth) + 'px';
  });
  svg.querySelector('.hit').addEventListener('pointerleave', () => { tip.hidden = true; xh.setAttribute('visibility', 'hidden'); });
}

  const W = 600, X = v => 10 + (Math.min(v, 0.4) / 0.4) * (W - 20);
  const ch = r.prevCap === r.cap ? '与上一交易日相同' : `上一交易日 ${pc0(r.prevCap)}`;

    <div class="ch"><span class="eyebrow">今日结论 · ${esc(md(dec.session))} ${wd(dec.session)} 收盘后</span></div>
    <div><h1 style="font-size:21px;font-weight:900;line-height:1.4">${esc(cover.title)}</h1><p class="note" style="font-size:13.5px;margin-top:6px">${esc(cover.dek)}</p></div>
    <div class="ch"><h2 id="gate-h">仓位总闸</h2><span class="sub">${esc(BT.regime.model.n)} · ${esc(ch)}</span></div>

        <div class="split" aria-hidden="true"><i class="core" style="flex:${r.coreW}"></i><i class="sat" style="flex:${r.satCap}"></i><i class="cash" style="flex:${Math.max(0, 1 - r.cap)}"></i></div>
        <div class="legend"><span><i style="background:var(--accent)"></i>核心仓 SPY ${pc0(r.coreW)}</span><span><i style="background:var(--accent-2)"></i>卫星仓 个股 ${pc0(r.satCap)}</span><span><i style="border:1px solid var(--line)"></i>现金 ${pc0(Math.max(0, 1 - r.cap))}</span></div></div></div>
    <div class="gauge"><svg viewBox="0 0 ${W} 58" role="img" aria-label="SPY 20 日年化波动 ${pc1(r.vol20)}，对应仓位 ${pc0(r.cap)}">
      ${zones.map(z => `<rect class="zone${z.s === r.volMult ? ' on' : ''}" x="${X(z.from)}" y="16" width="${Math.max(X(z.to) - X(z.from) - 2, 0)}" height="16" rx="4"></rect>
        <text class="zl${z.s === r.volMult ? ' on' : ''}" x="${(X(z.from) + X(z.to)) / 2}" y="28" text-anchor="middle">${Math.round(z.s * 100)}%</text>`).join('')}
      ${bounds.slice(0, -1).map(b => `<text class="tick" x="${X(b)}" y="46" text-anchor="middle">${Math.round(b * 100)}%</text>`).join('')}
      <text class="tick" x="${X(0)}" y="46">0</text><text class="tick" x="${X(0.4)}" y="46" text-anchor="end">40%+</text>
      <path class="mk" d="M${X(r.vol20) - 6},4 L${X(r.vol20) + 6},4 L${X(r.vol20)},14 Z"></path>
      <text class="mkl" x="${Math.min(Math.max(X(r.vol20), 60), W - 60)}" y="${56}" text-anchor="middle">SPY 20 日波动 ${pc1(r.vol20)}</text></svg>
      <p class="note">SPY 过去 20 个交易日的年化波动是 <b>${pc1(r.vol20)}</b>，${r.vol20 <= tgt ? `低于 ${pc0(tgt)} 的目标，仓位系数 1` : `高于 ${pc0(tgt)} 的目标，仓位系数降到 ${r.volMult}`}。波动越高，仓位越低：${zones.map(z => `${z.to >= 0.4 ? Math.round(z.from * 100) + '% 以上' : (z.from ? Math.round(z.from * 100) : 0) + '–' + Math.round(z.to * 100) + '%'} 对应 ${Math.round(z.s * 100)}%`).join('，')}。核心仓买 SPY，占 min(60%, 上限)；超出 60% 的部分给卫星仓个股。</p></div>

function scaledOrder(o) {
  const mult = o.act === 'buy' ? settings.risk / CFG.risk : 1;
  let value = o.w * settings.eq * mult;
  if (o.act === 'buy') value = Math.min(value, CFG.maxPos * settings.eq);
  return { value, sh: o.act === 'sell' ? null : Math.floor(value / o.px) };
}

  const body = dec.orders.length ? `<div class="orders">${dec.orders.map(o => {
    const sc = scaledOrder(o), note = (E.notes || {})[o.s];
    const chip = o.act === 'buy' ? '<span class="pill buy">买入</span>' : o.act === 'sell' ? '<span class="pill sell">卖出</span>' : '<span class="pill adj">调整</span>';

}

function renderMine() {
  $('#acct-eq').value = settings.eq;
  $('#acct-risk').value = String(settings.risk);
  const r = D.decision.regime;
  if (!holdings.length) {
    $('#h-table').innerHTML = '<div class="empty">还没有录入持仓。添加后，这里会按同一套规则给出每只的止损价和建议：<b>持有、上移止损、减仓或卖出</b>。覆盖标普 500 成分股和常见指数 ETF（SPY、QQQ、IWM、VOO、TLT、GLD 等）。</div>';
    $('#h-bulk').value = '';
    return;
  }
  let total = 0;
  const rows = holdings.map((h, k) => {
    const q = quote(h.s);
    if (!q) return { h, k, html: `<tr><td class="code">${esc(h.s)}</td><td class="n">${h.sh}</td><td class="n">${usd(h.cost)}</td><td colspan="5" class="act"><span class="pill">不在覆盖范围</span></td><td><button class="x" type="button" data-del="${k}" aria-label="删除 ${esc(h.s)}">×</button></td></tr>` };
    const value = q.c * h.sh; total += value;
    const hardStop = h.cost - 2 * q.atr, trail = num(q.h1m) ? q.h1m - 3 * q.atr : null;
    const stop = Math.max(hardStop, trail ?? -Infinity);
    const pnl = q.c / h.cost - 1;
    let act, chip;
    if (q.c <= stop) { chip = 'sell'; act = `卖出：收盘 ${usd(q.c)} 已低于止损 ${usd(stop)}`; }
    else if (num(q.s200) && q.c < q.s200) { chip = 'sell'; act = `卖出：跌破 200 日线 ${usd(q.s200)}`; }
    else if (num(q.s50) && q.c < q.s50) { chip = 'warn'; act = `警戒：跌破 50 日线 ${usd(q.s50)}，止损 ${usd(stop)}`; }
    else if (trail != null && trail > hardStop && trail > h.cost) { chip = 'adj'; act = `持有，止损上移到 ${usd(stop)}（锁定盈利）`; }
    else { chip = 'live'; act = `持有，止损 ${usd(stop)}`; }
    const label = { sell: '卖出', warn: '警戒', adj: '上移止损', live: '持有' }[chip];
    const er = q.en && q.en >= D.decision.session && (new Date(q.en) - new Date(D.decision.session)) / 864e5 <= 7 ? ` · <span class="pill warn">${md(q.en)} 财报</span>` : '';
    return { h, k, value, html: `<tr><td class="code">${esc(h.s)}<small>${esc(nameOf(h.s))}</small></td><td class="n">${h.sh}</td><td class="n">${usd(h.cost)}</td><td class="n">${usd(q.c)}</td><td class="n">${sp(pnl)}</td>
      <td class="n" data-w="${k}"></td><td class="n">${usd(stop)}</td><td class="act"><span class="pill ${chip === 'live' ? 'live' : chip}">${label}</span> ${esc(act.replace(/^(卖出|警戒|持有)[：，]?/, ''))}${er}</td><td><button class="x" type="button" data-del="${k}" aria-label="删除 ${esc(h.s)}">×</button></td></tr>` };
  });
  const capVal = r.cap * settings.eq, over = total - capVal;
  $('#h-table').innerHTML = `<div class="tbl"><table><thead><tr><th>代码</th><th class="n">股数</th><th class="n">成本</th><th class="n">现价</th><th class="n">盈亏</th><th class="n">占净值</th><th class="n">止损</th><th>建议</th><th></th></tr></thead>
    <tbody>${rows.map(x => x.html).join('')}</tbody></table></div>
    <p class="note">止损 = max(成本 − 2×ATR, 1 个月最高价 − 3×ATR)。股票合计 <b>${usd(total, 0)}</b>，占净值 <b>${pc1(total / settings.eq)}</b>；仓位上限 ${pc0(r.cap)}，${over > settings.eq * 0.01 ? `<b>超出 ${usd(over, 0)}，先减「卖出」「警戒」和浮亏最大的仓位</b>` : '在上限之内'}。</p>`;
  for (const x of rows) { const td = document.querySelector(`[data-w="${x.k}"]`); if (td && x.value) td.textContent = pc1(x.value / settings.eq); }
  $('#h-bulk').value = holdings.map(h => `${h.s},${h.cost},${h.sh}`).join('\n');
}
function saveHoldings() { store.set('usmb-holdings', JSON.stringify(holdings)); renderMine(); }
$('#h-form').addEventListener('submit', e => {
  e.preventDefault();
  const s = $('#h-sym').value.trim().toUpperCase().replace('/', '.'), cost = Number($('#h-cost').value), sh = Number($('#h-sh').value);
  if (!s || !(cost > 0) || !(sh > 0)) { $('#h-msg').textContent = '请填写代码、成本价和股数，成本和股数要大于 0。'; return; }
  holdings = holdings.filter(h => h.s !== s).concat({ s, cost, sh });
  $('#h-msg').textContent = quote(s) ? `已添加 ${s}。` : `已添加 ${s}，但它不在覆盖范围内，无法计算止损。`;
  e.target.reset();
  saveHoldings();
});
$('#h-table').addEventListener('click', e => { const b = e.target.closest('[data-del]'); if (!b) return; holdings.splice(Number(b.dataset.del), 1); $('#h-msg').textContent = '已删除。'; saveHoldings(); });
$('#h-import').addEventListener('click', () => {
  const rows = $('#h-bulk').value.split('\n').map(l => l.trim()).filter(Boolean).map(l => l.split(/[,\s，]+/));
  const ok = rows.filter(r => r.length >= 3 && Number(r[1]) > 0 && Number(r[2]) > 0).map(r => ({ s: r[0].toUpperCase(), cost: Number(r[1]), sh: Number(r[2]) }));
  if (!ok.length) { $('#h-msg').textContent = '没有识别到有效的行。格式：代码,成本价,股数'; return; }
  holdings = ok;
  $('#h-msg').textContent = `已导入 ${ok.length} 只${rows.length > ok.length ? `，跳过 ${rows.length - ok.length} 行格式不对的` : ''}。`;

});
$('#h-copy').addEventListener('click', () => {

});
$('#acct-eq').addEventListener('change', e => { const v = Number(e.target.value); if (v >= 1000) { settings.eq = v; store.set('usmb-eq', v); renderOrders(); renderMine(); } });

    <div class="tiles">
      <div class="tile"><span class="k">组合收益</span><span class="v ${cls(L.ret)}">${sgn(L.ret)}</span><span class="d">净值 ${usd(L.eq, 0)}</span></div>
      <div class="tile"><span class="k">SPY 同期</span><span class="v ${cls(L.spyRet)}">${sgn(L.spyRet)}</span><span class="d">差 ${sgn(L.ret - L.spyRet)}</span></div>
      <div class="tile"><span class="k">距净值高点</span><span class="v ${cls(L.dd)}">${sgn(L.dd)}</span><span class="d">回撤 8% 时风险减半</span></div>

    <div class="chart" id="perf-chart"></div>
    <div class="legend"><span><i class="ln" style="border-color:var(--accent)"></i>模拟组合</span><span><i class="dash" style="border-color:var(--bench)"></i>SPY 买入持有</span>${shade > 0 ? '<span><i style="background:var(--line-soft)"></i>规则回放（非实盘）</span>' : ''}</div>
    ${L.recent.length ? `<div><span class="eyebrow">最近平仓</span><div class="trades" style="margin-top:6px">${L.recent.map(t => `<div><span class="num" style="font-weight:800">${esc(t.s)}</span><span class="why">${esc(md(t.fillDate))} → ${esc(md(t.exitDate))} · ${esc(t.why)}</span><span class="num ${cls(t.r)}">${sgn(t.r)}${num(t.R) ? ` · ${t.R > 0 ? '+' : ''}${t.R}R` : ''}</span></div>`).join('')}</div></div>` : ''}`;

}

    ${live.length ? `<div class="cands">${live.map(c => { const n = (E.notes || {})[c.s]; return `<article><div class="tk">${esc(c.s)}<small>${esc(nameOf(c.s))}</small></div><div>${st(c)}</div>
      <div class="meta"><span>收盘 ${usd(c.c)}</span><span>6 个月 ${sp(c.m6 / 100, 0)}</span><span>相对量 ${num(c.rv) ? c.rv.toFixed(1) + '×' : '—'}</span><span>估算止损 ${usd(c.stop)}</span>${c.reason ? `<span>${esc(c.reason)}</span>` : ''}${c.flags.map(f => `<span class="pill warn">${esc(f)}</span>`).join('')}</div>

      ${row('S4 趋势回调', st('s4').sleeve, st('s4').live ? 'live' : 'obs', `每笔 ${st('s4').filtered.expR.toFixed(2)}R，扣成本后几乎没有优势`)}
      ${row('S5 放量跳空', st('s5').sleeve, st('s5').live ? 'live' : 'obs', `每笔 ${st('s5').filtered.expR.toFixed(2)}R，期望为负`)}
      ${row('板块轮动（前 3 名）', b.rotation, b.rotation.live ? 'live' : 'obs', `换成 SPY 后夏普从 ${b.rotation.core.sharpe.toFixed(2)} 升到 ${b.core.sharpe.toFixed(2)}`)}
      ${row('个股等权', b.bench.EW_UNIV, 'bench', '当前成分股，有幸存者偏差；S3 的对照基准')}
