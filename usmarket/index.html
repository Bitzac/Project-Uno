<title>美股晨报 OS</title>
<meta name="description" content="美股晨报：标普 500 热力图、板块进展、异动股与原因、盘前、宏观、财报与经济日历、市场宽度，每个交易日美西 05:00 出刊。">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;700;900&display=swap">
<style>/* Layout: the 机会猎手 OS frame — a full-bleed S&P 500 heat map (sized by market cap, grouped by GICS sector) with liquid-glass
   instruments floating over it (legend, sector strip, tooltip) and a glass side panel. Hairline rules, heavy type.
   Colour: one diverging ramp per direction around a neutral grey; the up/down hues swap with the 红涨/绿涨 toggle. */
:root{
  --bg:#E8EDF2;--sea:#DCE4EB;
  --ink:#0B1520;--muted:#4A5765;--faint:#7C8995;
  --glass-a:rgba(255,255,255,.68);--glass-b:rgba(255,255,255,.34);--glass-edge:rgba(255,255,255,.95);--glass-inner:rgba(255,255,255,.98);
  --shadow:rgba(16,36,60,.20);--line:rgba(11,21,32,.16);--line-soft:rgba(11,21,32,.08);--field:rgba(255,255,255,.52);
  --accent:#1F62C4;--accent-soft:rgba(31,98,196,.11);
  --tile-mid:#C9D0D8;--tile-gap:#DCE4EB;
  --red-1:#F0B9B2;--red-2:#DD5B52;--red-3:#A3201D;--red-t:#B42A25;
  --green-1:#ACDDC0;--green-2:#2E9C61;--green-3:#0E5C37;--green-t:#127042;
  --hair:1px;
  --f-display:"Outfit","Noto Sans SC",system-ui,sans-serif;
  --f-body:"Noto Sans SC","Outfit",system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#070F16;--sea:#0A151E;
  --ink:#E8EFF5;--muted:#A2B0BC;--faint:#6E7D89;
  --glass-a:rgba(22,33,44,.68);--glass-b:rgba(10,19,28,.46);--glass-edge:rgba(255,255,255,.16);--glass-inner:rgba(255,255,255,.18);
  --shadow:rgba(0,0,0,.55);--line:rgba(255,255,255,.16);--line-soft:rgba(255,255,255,.07);--field:rgba(255,255,255,.05);
  --accent:#6FA8F2;--accent-soft:rgba(111,168,242,.14);
  --tile-mid:#27313B;--tile-gap:#0A151E;
  --red-1:#5E2A29;--red-2:#B8403A;--red-3:#FF7B72;--red-t:#FF8A82;
  --green-1:#1C4632;--green-2:#22895A;--green-3:#4FDC8E;--green-t:#5BE39A;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#070F16;--sea:#0A151E;
  --ink:#E8EFF5;--muted:#A2B0BC;--faint:#6E7D89;
  --glass-a:rgba(22,33,44,.68);--glass-b:rgba(10,19,28,.46);--glass-edge:rgba(255,255,255,.16);--glass-inner:rgba(255,255,255,.18);
  --shadow:rgba(0,0,0,.55);--line:rgba(255,255,255,.16);--line-soft:rgba(255,255,255,.07);--field:rgba(255,255,255,.05);
  --accent:#6FA8F2;--accent-soft:rgba(111,168,242,.14);
  --tile-mid:#27313B;--tile-gap:#0A151E;
  --red-1:#5E2A29;--red-2:#B8403A;--red-3:#FF7B72;--red-t:#FF8A82;
  --green-1:#1C4632;--green-2:#22895A;--green-3:#4FDC8E;--green-t:#5BE39A;
  color-scheme:dark}
@media (min-resolution:2dppx){:root{--hair:.5px}}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.55;padding-inline:16px;padding-block:16px;overflow:hidden;
  --pos-1:var(--red-1);--pos-2:var(--red-2);--pos-3:var(--red-3);--pos-t:var(--red-t);
  --neg-1:var(--green-1);--neg-2:var(--green-2);--neg-3:var(--green-3);--neg-t:var(--green-t)}
body[data-updown="us"]{--pos-1:var(--green-1);--pos-2:var(--green-2);--pos-3:var(--green-3);--pos-t:var(--green-t);
  --neg-1:var(--red-1);--neg-2:var(--red-2);--neg-3:var(--red-3);--neg-t:var(--red-t)}
.num{font-family:var(--f-display);font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h2,h3,h4{margin:0;text-wrap:balance}
p{margin:0}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
.up{color:var(--pos-t)}.dn{color:var(--neg-t)}.flat{color:var(--muted)}

.glass{background:linear-gradient(145deg,var(--glass-a),var(--glass-b));-webkit-backdrop-filter:blur(24px) saturate(170%);backdrop-filter:blur(24px) saturate(170%);border:var(--hair) solid var(--glass-edge);box-shadow:inset 0 1px 0 var(--glass-inner),0 24px 60px -28px var(--shadow)}

.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 440px;grid-template-rows:auto minmax(0,1fr);gap:12px}
.top{grid-column:1/-1;display:flex;align-items:center;gap:10px 20px;padding:10px 16px;border-radius:20px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto;min-width:0;flex-wrap:wrap}
.brand b{font:900 24px/1 var(--f-body);letter-spacing:.03em;white-space:nowrap}
.brand span{font-weight:600;font-size:11px;letter-spacing:.2em;color:var(--muted);text-transform:uppercase;white-space:nowrap}
.ctrls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;min-width:0}
.seg{display:inline-flex;padding:3px;border-radius:13px;border:var(--hair) solid var(--line);background:var(--field);gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:6px 12px;border-radius:10px;font-size:13.5px;font-weight:500;color:var(--muted);cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--glass-a);color:var(--ink);font-weight:800;box-shadow:inset 0 1px 0 var(--glass-inner),0 4px 14px -6px var(--shadow)}
.seg button:disabled{opacity:.4;cursor:default}
.seg .sw{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;vertical-align:1px}
select{border:var(--hair) solid var(--line);background:var(--field);border-radius:12px;padding:0 10px;height:36px;font-size:13px;font-family:var(--f-display);font-weight:600}

/* stage */
.stage{position:relative;min-height:0;border-radius:24px;overflow:hidden;background:var(--sea);border:var(--hair) solid var(--line);display:flex;flex-direction:column;gap:8px;padding:10px}
#map{position:relative;flex:1 1 0;min-height:0}
#map svg{position:absolute;inset:0;display:block;width:100%;height:100%}
#map .sec-h{font:800 11.5px var(--f-body);fill:var(--muted);letter-spacing:.04em;pointer-events:none}
#map .sec-h tspan.v{font-family:var(--f-display);font-weight:700}
#map rect.cell{stroke:var(--tile-gap);stroke-width:1px;cursor:pointer;transition:fill .25s linear}
#map rect.cell:hover,#map rect.cell.sel{stroke:var(--ink);stroke-width:1.6px}
#map text.tk{font-family:var(--f-display);font-weight:800;pointer-events:none;text-anchor:middle}
#map text.pc{font-family:var(--f-display);font-weight:500;pointer-events:none;text-anchor:middle;font-variant-numeric:tabular-nums}
#map rect.sec-box{fill:none;stroke:var(--line);stroke-width:1px;pointer-events:none}
@media (prefers-reduced-motion:reduce){#map rect.cell{transition:none}}

.dock{flex:none;border-radius:18px;padding:7px 10px;display:flex;gap:8px 14px;align-items:center;min-width:0}
.legend{flex:none;width:210px;font-size:11px;color:var(--muted)}
.legend b{display:flex;justify-content:space-between;gap:8px;color:var(--ink);font-size:12px;font-weight:800;margin-bottom:4px;white-space:nowrap}
.legend b small{font-weight:500;color:var(--faint);font-size:11px}
.legend .ramp{display:flex;height:6px;border-radius:3px;overflow:hidden;gap:1px;background:var(--line-soft)}
.legend .ramp i{flex:1}
.legend .lab{display:flex;justify-content:space-between;margin-top:2px;gap:8px;font-size:10.5px}

.secs{flex:1 1 0;min-width:0;display:flex;gap:6px;overflow-x:auto;scrollbar-width:thin;align-items:center;padding-left:12px;border-left:var(--hair) solid var(--line)}
.secs .lbl{font:700 11px var(--f-display);letter-spacing:.14em;color:var(--faint);padding:0 4px 0 2px;white-space:nowrap}
.chip{border:var(--hair) solid var(--line);background:var(--field);border-radius:999px;padding:5px 11px;font-size:12.5px;font-weight:500;color:var(--muted);cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.chip b{font:700 11.5px var(--f-display);font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg);font-weight:800}
.chip[aria-pressed="true"] b{color:var(--bg)}

.tip{position:absolute;pointer-events:none;border-radius:14px;padding:10px 12px;font-size:12.5px;width:250px;z-index:5}
.tip .h{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.tip .h b{font:800 17px var(--f-display)}
.tip .h span{font:700 15px var(--f-display);font-variant-numeric:tabular-nums}
.tip .nm{color:var(--muted);font-size:12px;margin:1px 0 6px}
.tip .r{display:flex;justify-content:space-between;gap:14px;color:var(--muted)}
.tip .r span:last-child{font-family:var(--f-display);font-variant-numeric:tabular-nums;font-weight:600}
.tip .r span:last-child:not(.up):not(.dn){color:var(--ink)}
.tip .why{margin-top:7px;padding-top:7px;border-top:var(--hair) solid var(--line);color:var(--ink);line-height:1.5}

/* panel */
.panel{border-radius:24px;min-height:0;display:grid;grid-template-rows:auto minmax(0,1fr);overflow:hidden}
.tabs{display:flex;gap:2px;padding:10px 12px 0;border-bottom:var(--hair) solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs button{border:0;background:none;padding:8px 11px 10px;font-weight:500;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);font-weight:800;border-bottom-color:var(--ink)}
.pane{overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:22px;min-width:0}
.pane>*{min-width:0}
.eyebrow{font:700 11px var(--f-display);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
.stamp{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.pill{display:inline-block;font:700 10.5px var(--f-body);letter-spacing:.04em;padding:1px 7px;border-radius:999px;border:var(--hair) solid var(--line);color:var(--muted);white-space:nowrap}
.pill.a{color:var(--accent);border-color:var(--accent)}
.pill.solid{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.thesis{border:var(--hair) solid var(--line);border-left:2px solid var(--accent);border-radius:4px 14px 14px 4px;background:var(--accent-soft);padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.thesis h2{font-size:19px;font-weight:900;line-height:1.35}
.thesis p{font-size:13.5px;color:var(--muted);line-height:1.65}
ul.points{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:7px;font-size:13.5px;line-height:1.6}
ul.points li{padding-left:14px;position:relative}
ul.points li::before{content:"";position:absolute;left:0;top:.72em;width:6px;height:1px;background:var(--ink)}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.tile{border:var(--hair) solid var(--line);border-radius:16px;padding:10px 11px 9px;background:var(--field);display:flex;flex-direction:column;gap:1px;min-width:0}
.tile .k{font-size:11.5px;color:var(--muted);font-weight:600;display:flex;justify-content:space-between;gap:6px}
.tile .v{font:800 22px/1.15 var(--f-display);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.tile .v small{font-size:12px;font-weight:600;color:var(--muted);margin-left:2px}
.tile .d{font-size:12px;font-family:var(--f-display);font-variant-numeric:tabular-nums;font-weight:700}
.tile .d em{font-style:normal;font-weight:500;color:var(--faint);margin-left:6px}
.kv{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.kv div{border:var(--hair) solid var(--line);border-radius:12px;padding:7px 8px;background:var(--field);min-width:0}
.kv span{display:block;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kv b{font:800 15px var(--f-display);font-variant-numeric:tabular-nums}
.sec{display:flex;flex-direction:column;gap:9px}
.sec>h3{font-size:14.5px;font-weight:900;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.sec>h3 small{font-size:11.5px;font-weight:500;color:var(--faint)}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{font-weight:700;color:var(--faint);text-align:left;font-size:11px;letter-spacing:.06em;padding:0 8px 6px 0;border-bottom:var(--hair) solid var(--line);white-space:nowrap}
td{padding:7px 8px 7px 0;border-bottom:var(--hair) solid var(--line-soft);vertical-align:top}
td.n,th.n{text-align:right;font-family:var(--f-display);font-variant-numeric:tabular-nums;white-space:nowrap}
td.code{font-family:var(--f-display);font-weight:700;white-space:nowrap;font-size:12px}
td.nm{font-weight:700;white-space:nowrap}
td.nm small{display:block;font:500 11px var(--f-display);color:var(--faint)}
tr.click{cursor:pointer}
tr.click:hover td,tr.click:focus-visible td{background:var(--accent-soft)}
tr.click:focus-visible{outline:none}
tr.cm td{border-bottom:var(--hair) solid var(--line-soft);padding-top:0;color:var(--muted);font-size:12px;line-height:1.6}
tr.has-cm td{border-bottom:0}
.note{font-size:12px;color:var(--muted);line-height:1.65}
.note b{color:var(--ink)}
.src{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:11.5px}
.src a::before{content:"↗ ";color:var(--faint)}
.empty{color:var(--muted);font-size:13px;border:var(--hair) dashed var(--line);border-radius:16px;padding:14px;text-align:center}

.stack{display:flex;height:8px;border-radius:4px;overflow:hidden;gap:2px;min-width:70px}
.stack i{display:block;height:100%}
.stack i.p{background:var(--pos-2)}.stack i.q{background:var(--neg-2)}.stack i.z{background:var(--line)}
.bar{position:relative;height:8px;border-radius:4px;background:var(--line-soft)}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--accent)}
.bar i.b2{background:none;border:1.5px solid var(--accent)}

/* movers */
.mv{display:flex;flex-direction:column;gap:0}
.mv article{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:10px 0;border-bottom:var(--hair) solid var(--line-soft);cursor:pointer}
.mv article:hover .t b{text-decoration:underline}
.mv .t{display:flex;align-items:baseline;gap:7px;flex-wrap:wrap;min-width:0}
.mv .t b{font:800 15px var(--f-display)}
.mv .t span{font-size:12.5px;color:var(--muted);min-width:0}
.mv .c{font:800 16px var(--f-display);font-variant-numeric:tabular-nums;text-align:right}
.mv .meta{grid-column:1/-1;font-size:11.5px;color:var(--faint);display:flex;gap:10px;flex-wrap:wrap;font-family:var(--f-display);font-variant-numeric:tabular-nums}
.mv .why{grid-column:1/-1;font-size:13px;line-height:1.6;margin-top:3px}
.mv .src{grid-column:1/-1;margin-top:2px}
.duo{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.duo>*{min-width:0}

/* news */
.news{display:flex;flex-direction:column}
.news article{padding:11px 0;border-bottom:var(--hair) solid var(--line-soft);display:flex;flex-direction:column;gap:4px}
.news .tg{display:flex;gap:8px;align-items:center;font-size:11.5px;color:var(--faint)}
.news h4{font-size:14.5px;font-weight:800;line-height:1.45}
.news p{font-size:13px;color:var(--muted);line-height:1.65}

/* calendar */
.day{display:flex;flex-direction:column;gap:0}
.day>h4{font:800 12.5px var(--f-body);padding:8px 0 6px;border-bottom:var(--hair) solid var(--line);display:flex;gap:8px;align-items:baseline}
.day>h4 small{font:500 11px var(--f-display);color:var(--faint)}
.ev{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:2px 10px;padding:7px 0;border-bottom:var(--hair) solid var(--line-soft);font-size:12.5px;align-items:baseline}
.ev .tm{font-family:var(--f-display);font-variant-numeric:tabular-nums;color:var(--muted);font-size:12px}
.ev .ti{font-weight:600;min-width:0}
.ev .ti small{color:var(--faint);font-weight:400;margin-left:4px}
.ev .imp{display:inline-flex;gap:2px;margin-right:6px;vertical-align:1px}
.ev .imp i{width:5px;height:5px;border-radius:50%;background:var(--line)}
.ev .imp i.on{background:var(--ink)}
.ev .vals{grid-column:2/-1;font-family:var(--f-display);font-variant-numeric:tabular-nums;font-size:11.5px;color:var(--faint);display:flex;gap:12px;flex-wrap:wrap}
.ev .vals b{color:var(--ink);font-weight:700}
.ev.done .ti{color:var(--ink)}

@media (max-width:1080px){
  body{overflow:auto;height:auto}
  html{height:auto}
  .app{height:auto;grid-template-columns:minmax(0,1fr);grid-template-rows:auto}
  .stage{height:66vh;min-height:440px}
  .pane{overflow:visible}
}
@media (max-width:560px){
  .brand span{display:none}
  .seg button{padding:6px 8px;font-size:12.5px}
  .dock{flex-wrap:wrap}
  .legend{width:100%}
  .secs{flex-basis:100%;padding-left:0;border-left:0}
  .kv{grid-template-columns:repeat(2,minmax(0,1fr))}
  .duo{grid-template-columns:minmax(0,1fr)}
  .tip{width:220px}
}
</style>
<div class="app" id="app">
  <header class="top glass">
    <div class="brand"><b>美股晨报 OS</b><span class="num" id="brand-sub">US Market Brief</span></div>
    <div class="ctrls">
      <label for="issue-pick" hidden>往期</label>
      <select id="issue-pick" aria-label="选择日期"></select>
      <div class="seg" role="group" aria-label="热力图口径" id="mode">
        <button type="button" data-m="c" aria-pressed="true">前收</button>
        <button type="button" data-m="pm">盘前</button>
        <button type="button" data-m="w">近一周</button>
        <button type="button" data-m="m">近一月</button>
        <button type="button" data-m="ytd">年初至今</button>
      </div>
      <div class="seg" role="group" aria-label="涨跌配色">
        <button type="button" id="ud-cn" aria-pressed="true" title="红涨绿跌"><i class="sw" style="background:var(--red-2)"></i>红涨</button>
        <button type="button" id="ud-us" aria-pressed="false" title="绿涨红跌"><i class="sw" style="background:var(--green-2)"></i>绿涨</button>
      </div>
    </div>
  </header>

  <section class="stage" id="stage" aria-label="标普 500 热力图">
    <div id="map" role="img" aria-label="标普 500 成分股热力图，面积为市值，颜色为涨跌幅"></div>
    <div class="tip glass" id="tip" hidden></div>
    <div class="dock glass">
      <div class="legend" id="legend"></div>
      <div class="secs" id="secs" role="group" aria-label="板块"></div>
    </div>
  </section>

  <aside class="panel glass" id="panel">
    <nav class="tabs" role="tablist" aria-label="面板">
      <button role="tab" data-t="sum" aria-selected="true" id="t-sum">总览</button>
      <button role="tab" data-t="sec" id="t-sec">板块</button>
      <button role="tab" data-t="mov" id="t-mov">异动</button>
      <button role="tab" data-t="cal" id="t-cal">日历</button>
      <button role="tab" data-t="br" id="t-br">宽度</button>
      <button role="tab" data-t="how" id="t-how">方法</button>
    </nav>
    <div class="pane" id="p-sum" role="tabpanel" aria-labelledby="t-sum"></div>
    <div class="pane" id="p-sec" role="tabpanel" aria-labelledby="t-sec" hidden></div>
    <div class="pane" id="p-mov" role="tabpanel" aria-labelledby="t-mov" hidden></div>
    <div class="pane" id="p-cal" role="tabpanel" aria-labelledby="t-cal" hidden></div>
    <div class="pane" id="p-br" role="tabpanel" aria-labelledby="t-br" hidden></div>
    <div class="pane" id="p-how" role="tabpanel" aria-labelledby="t-how" hidden></div>

const cls = v => (typeof v === 'number' ? (v > 0 ? 'up' : v < 0 ? 'dn' : 'flat') : 'flat');

const bp = v => (typeof v === 'number' ? `<span class="${cls(v)}">${v > 0 ? '+' : v < 0 ? '−' : ''}${Math.abs(v).toFixed(1)}bp</span>` : '—');
const px = v => (typeof v !== 'number' ? '—' : Math.abs(v) >= 1000 ? v.toLocaleString('en-US', { maximumFractionDigits: 2 }) : Math.abs(v) < 20 ? String(v) : v.toFixed(2));
const capUsd = v => (typeof v !== 'number' ? '—' : v >= 1000 ? `$${(v / 1000).toFixed(2)}T` : `$${v.toFixed(v >= 100 ? 0 : 1)}B`);
const md = d => `${Number(d.slice(5, 7))}/${Number(d.slice(8, 10))}`;
const wd = d => WEEK[new Date(d + 'T12:00:00Z').getUTCDay()];

const sources = src => (src && src.length ? `<div class="src">${src.map(([n, u]) => `<a href="${esc(href(u))}" target="_blank" rel="noopener">${esc(n)}</a>`).join('')}</div>` : '');

const ECON = [

  [/^GDP Price Index/, 'GDP 价格指数'], [/^ISM Manufacturing PMI/, 'ISM 制造业 PMI'], [/^ISM Services PMI/, 'ISM 服务业 PMI'],

  [/^Michigan Consumer Sentiment/, '密歇根消费者信心'], [/^Michigan (\d+)-Year Inflation Expectations/, '密歇根 $1 年通胀预期'],

// ---------- state ----------
let issue = ISSUES[0];
let D, E, COL, BY;
let mode = 'c';
let sector = null;
let selected = null;
let tab = 'sum';

function load(i) {
  issue = ISSUES[i];
  D = issue.data;
  E = issue.edit;
  COL = Object.fromEntries(D.cols.map((c, j) => [c, j]));
  BY = {};
  for (const r of D.stocks) BY[r[COL.s]] = r;
  if (mode === 'pm' && D.status !== 'pre') mode = 'c';
  if (D.kind === 'weekly' && mode === 'c') mode = 'w';
  sector = null;
  selected = null;
}
const v = (row, k) => row[COL[k]];
const cMetric = () => (D.kind === 'weekly' ? 'w' : 'c');
const closeLabel = () => (D.session === issue.date ? (D.status === 'open' ? '盘中' : '今日收盘') : `前收 ${md(D.session)}`);
const modeName = m => (m === 'c' ? (D.session === issue.date && D.status === 'open' ? '盘中涨跌' : `${md(D.session)} 收盘涨跌`) : MODE_NAME[m]);
const nameOf = s => CN[s] || (BY[s] ? v(BY[s], 'n') : s);
const enName = s => (BY[s] ? v(BY[s], 'n') : '');

// ---------- heat map ----------
let cssVars = {};
function readVars() {
  const cs = getComputedStyle(document.body);
  for (const k of ['--tile-mid', '--pos-1', '--pos-2', '--pos-3', '--neg-1', '--neg-2', '--neg-3', '--ink', '--bg']) cssVars[k] = cs.getPropertyValue(k).trim();
}
function colorScale(m) {
  const s = SCALE[m];
  return d3.scaleLinear()
    .domain([-s, -s * 0.5, -s * 0.12, 0, s * 0.12, s * 0.5, s])
    .range([cssVars['--neg-3'], cssVars['--neg-2'], cssVars['--neg-1'], cssVars['--tile-mid'], cssVars['--pos-1'], cssVars['--pos-2'], cssVars['--pos-3']])
    .interpolate(d3.interpolateLab).clamp(true);
}

function drawMap() {
  const host = $('#map');
  const W = host.clientWidth, H = host.clientHeight;
  if (!W || !H || typeof d3 === 'undefined') return;
  const color = colorScale(mode);
  const zoom = sector !== null;
  const groups = zoom
    ? d3.groups(D.stocks.filter(r => v(r, 'g') === sector), r => D.inds[v(r, 'i')])
    : D.sectors.map((s, gi) => [gi, D.stocks.filter(r => v(r, 'g') === gi)]);
  const root = d3.hierarchy({ children: groups.map(([key, rows]) => ({ key, children: rows.map(r => ({ r })) })) })
    .sum(d => (d.r ? Math.max(v(d.r, 'mc') || 0, 0.5) : 0))
    .sort((a, b) => b.value - a.value);
  d3.treemap().size([W, H]).tile(d3.treemapSquarify.ratio(1.2)).paddingOuter(2).paddingTop(d => (d.depth === 1 ? 17 : 0)).paddingInner(1).round(true)(root);

  const svg = d3.create('svg').attr('viewBox', `0 0 ${W} ${H}`).attr('width', W).attr('height', H);
  for (const g of root.children || []) {
    const gw = g.x1 - g.x0;
    svg.append('rect').attr('class', 'sec-box').attr('x', g.x0 + 0.5).attr('y', g.y0 + 0.5).attr('width', Math.max(gw - 1, 0)).attr('height', Math.max(g.y1 - g.y0 - 1, 0)).attr('rx', 4);
    if (gw > 46) {
      const label = zoom ? g.data.key : D.sectors[g.data.key].n;
      const sv = zoom ? null : D.sectors[g.data.key][mode === 'c' ? 'c' : mode];
      const t = svg.append('text').attr('class', 'sec-h').attr('x', g.x0 + 5).attr('y', g.y0 + 12.5);
      const maxChars = Math.floor((gw - 10) / 11.5);
      t.append('tspan').text(label.length > maxChars ? label.slice(0, Math.max(maxChars - 1, 1)) + '…' : label);
      if (sv != null && gw > 110) t.append('tspan').attr('class', `v`).attr('dx', 6).attr('fill', 'currentColor').text(pct(sv));
    }
  }
  const leaves = root.leaves();
  for (const lf of leaves) {
    const r = lf.data.r;
    const val = v(r, mode);
    const w = lf.x1 - lf.x0, h = lf.y1 - lf.y0;
    const fill = typeof val === 'number' ? color(val) : cssVars['--tile-mid'];
    svg.append('rect').attr('class', 'cell' + (selected === v(r, 's') ? ' sel' : '')).attr('data-s', v(r, 's'))
      .attr('x', lf.x0).attr('y', lf.y0).attr('width', Math.max(w, 0)).attr('height', Math.max(h, 0)).attr('fill', fill);
    if (w < 20 || h < 13) continue;
    const s = v(r, 's');
    const fs = Math.min(w / (s.length * 0.66 + 0.5), h * 0.4, 26);
    if (fs < 7.5) continue;
    const ink = d3.lab(fill).l < 58 ? '#FFFFFF' : '#0B1520';
    const showPct = h > fs * 2.25 && fs >= 9 && typeof val === 'number';
    const cy = lf.y0 + h / 2 + (showPct ? -fs * 0.18 : fs * 0.35);
    svg.append('text').attr('class', 'tk').attr('x', lf.x0 + w / 2).attr('y', cy).attr('font-size', fs.toFixed(1)).attr('fill', ink).text(s);
    if (showPct) {
      const label = pct(val);
      const pfs = Math.min(fs * 0.62, (w - 4) / (label.length * 0.6));
      if (pfs >= 7.5) svg.append('text').attr('class', 'pc').attr('x', lf.x0 + w / 2).attr('y', cy + fs * 0.95).attr('font-size', pfs.toFixed(1)).attr('fill', ink).text(label);
    }
  }
  host.replaceChildren(svg.node());
  drawLegend();
}

function drawLegend() {
  const s = SCALE[mode];
  const color = colorScale(mode);
  const steps = d3.range(-s, s + 0.001, s / 5);
  const n = D.stocks.filter(r => typeof v(r, mode) === 'number').length;
  const legend = $('#legend');
  legend.title = `面积为市值，${n} 只标普 500 成分股，${sector !== null ? '按 GICS 子行业分组' : '按 GICS 板块分组'}`;
  legend.innerHTML = `<b>${esc(modeName(mode))}${sector !== null ? ` · ${esc(D.sectors[sector].n)}` : ''}<small>面积 = 市值</small></b>
    <div class="ramp">${steps.map(x => `<i style="background:${color(x)}"></i>`).join('')}</div>
    <div class="lab num"><span>≤ −${s}%</span><span>0</span><span>≥ +${s}%</span></div>`;
}

function drawChips() {
  const k = mode === 'c' ? 'c' : mode;
  const chips = [`<span class="lbl">板块</span><button class="chip" type="button" data-g="" aria-pressed="${sector === null}">全部</button>`]
    .concat(D.sectors.map((s, gi) => `<button class="chip" type="button" data-g="${gi}" aria-pressed="${sector === gi}">${esc(s.n)}<b class="${cls(s[k])}">${pct(s[k])}</b></button>`));
  $('#secs').innerHTML = chips.join('');
}

// tooltip
const tip = $('#tip');
function tipHtml(s) {
  const r = BY[s];
  if (!r) return '';
  const mv = E.movers && E.movers[s];
  const row = (k, val) => `<div class="r"><span>${k}</span>${val}</div>`;
  return `<div class="h"><b>${esc(s)}</b><span>$${px(v(r, 'p'))}</span></div>
    <div class="nm">${esc(nameOf(s))}${CN[s] ? ' · ' + esc(enName(s)) : ''} · ${esc(D.inds[v(r, 'i')])}</div>
    ${row(D.kind === 'weekly' ? `${md(D.session)} 收盘` : closeLabel(), pc(v(r, 'c')))}
    ${D.status === 'pre' ? row('盘前', pc(v(r, 'pm'))) : ''}
    ${row('近一周', pc(v(r, 'w')))}${row('近一月', pc(v(r, 'm')))}${row('年初至今', pc(v(r, 'ytd')))}
    ${row('相对成交量', `<span>${typeof v(r, 'rv') === 'number' ? v(r, 'rv').toFixed(2) + '×' : '—'}</span>`)}
    ${row('市值', `<span>${capUsd(v(r, 'mc'))}</span>`)}
    ${mv && mv.why && mv.why !== 'TODO' ? `<div class="why">${esc(mv.why)}</div>` : ''}`;
}
function placeTip(x, y) {
  const st = $('#stage').getBoundingClientRect();
  const tw = tip.offsetWidth, th = tip.offsetHeight;
  let left = x - st.left + 14, top = y - st.top + 14;
  if (left + tw > st.width - 8) left = x - st.left - tw - 14;
  if (top + th > st.height - 8) top = Math.max(8, st.height - th - 8);
  tip.style.left = Math.max(8, left) + 'px';
  tip.style.top = Math.max(8, top) + 'px';
}
$('#map').addEventListener('pointermove', e => {
  const el = e.target.closest('rect.cell');
  if (!el) { if (!selected) tip.hidden = true; return; }
  tip.innerHTML = tipHtml(el.dataset.s);
  tip.hidden = false;
  placeTip(e.clientX, e.clientY);
});
$('#map').addEventListener('pointerleave', () => { if (!selected) tip.hidden = true; });
$('#map').addEventListener('click', e => {
  const el = e.target.closest('rect.cell');
  if (!el) { selected = null; tip.hidden = true; drawMap(); return; }
  focusStock(el.dataset.s, false);
});

function focusStock(s, fromPanel) {
  if (!BY[s]) return;
  selected = s;
  if (fromPanel && sector !== null && sector !== v(BY[s], 'g')) sector = null;
  drawMap();
  drawChips();
  const el = document.querySelector(`#map rect.cell[data-s="${CSS.escape(s)}"]`);
  if (!el) return;
  const b = el.getBoundingClientRect();
  tip.innerHTML = tipHtml(s);
  tip.hidden = false;
  placeTip(b.left + b.width / 2, b.top + b.height / 2);
  if (fromPanel && window.matchMedia('(max-width:1080px)').matches) $('#stage').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

// ---------- panel ----------
const sec = (title, small, body) => `<section class="sec"><h3>${esc(title)}${small ? `<small>${small}</small>` : ''}</h3>${body}</section>`;
const isTodo = x => x == null || x === 'TODO' || (typeof x === 'string' && /TODO/.test(x));

function renderSum() {

  const tiles = ['SPX', 'NDX', 'DJI', 'RUT'].map(k => {

    ${(E.news || []).length ? sec('要闻', `${E.news.length} 条 · 每条附来源`, `<div class="news">${E.news.map(n => `<article>

function renderSec() {
  const k = cMetric();
  const pre = D.status === 'pre';
  const rows = D.sectors.map((s, gi) => ({ ...s, gi })).sort((a, b) => (b[k] ?? -99) - (a[k] ?? -99));
  const stack = s => {

    return `<div class="stack" title="上涨 ${s.adv} · 下跌 ${s.dec}"><i class="p" style="flex:${s.adv / t}"></i><i class="q" style="flex:${s.dec / t}"></i></div>`;
  };
  const cm = s => (E.sectors && E.sectors[s.k] && !isTodo(E.sectors[s.k].t) ? E.sectors[s.k] : null);
  const head = `<tr><th>板块</th><th class="n">${D.kind === 'weekly' ? '近一周' : esc(closeLabel())}</th>${pre ? '<th class="n">盘前</th>' : ''}${D.kind === 'weekly' ? '' : '<th class="n">近一周</th>'}<th class="n">近一月</th><th class="n">年初至今</th><th>涨 / 跌</th></tr>`;

    const c = cm(s);
    const cols = 4 + (pre ? 1 : 0) + (D.kind === 'weekly' ? 0 : 1) + 1;
    return `<tr class="click${c ? ' has-cm' : ''}" tabindex="0" data-g="${s.gi}"><td class="nm">${esc(s.n)}<small>${esc(s.k)} · ${s.cnt} 只</small></td>
      <td class="n">${pc(s[k])}</td>${pre ? `<td class="n">${pc(s.pm)}</td>` : ''}${D.kind === 'weekly' ? '' : `<td class="n">${pc(s.w)}</td>`}<td class="n">${pc(s.m)}</td><td class="n">${pc(s.ytd)}</td>
      <td style="min-width:80px">${stack(s)}<small class="num" style="color:var(--faint);font-size:10.5px">${s.adv} / ${s.dec}</small></td></tr>
      ${c ? `<tr class="cm"><td colspan="${cols}">${esc(c.t)}${sources(c.src)}</td></tr>` : ''}`;
  }).join('');
  const th = D.themes.filter(t => t.c != null).sort((a, b) => (b[k] ?? -99) - (a[k] ?? -99));
  $('#p-sec').innerHTML = `
    ${sec('GICS 11 个板块', `SPDR 板块 ETF · 按${D.kind === 'weekly' ? '近一周' : '当日'}涨跌排序 · 点击在热力图展开`, `<div class="tbl"><table><thead>${head}</thead><tbody>${body}</tbody></table></div>`)}
    ${sec('主题 ETF', '细分赛道', `<div class="tbl"><table><thead><tr><th>主题</th><th class="n">${D.kind === 'weekly' ? '近一周' : '当日'}</th>${pre ? '<th class="n">盘前</th>' : ''}<th class="n">近一月</th><th class="n">年初至今</th></tr></thead>
      <tbody>${th.map(t => `<tr><td class="nm">${esc(t.n)}<small>${esc(t.k)} · $${px(t.px)}</small></td><td class="n">${pc(t[k])}</td>${pre ? `<td class="n">${pc(t.pm)}</td>` : ''}<td class="n">${pc(t.m)}</td><td class="n">${pc(t.ytd)}</td></tr>`).join('')}</tbody></table></div>`)}
    <p class="note">板块涨跌取 SPDR 板块 ETF；「涨 / 跌」是该板块标普 500 成分股中上涨与下跌的家数。</p>`;
}

function moverList(list, key) {
  if (!list.length) return '<p class="empty">没有符合条件的股票</p>';
  return `<div class="mv">${list.map(s => {
    const r = BY[s];
    if (!r) return '';
    const e = (E.movers || {})[s] || {};
    return `<article tabindex="0" data-s="${esc(s)}"><div class="t"><b>${esc(s)}</b><span>${esc(nameOf(s))}</span></div><div class="c ${cls(v(r, key))}">${pct(v(r, key))}</div>
      <div class="meta"><span>$${px(v(r, 'p'))}</span>${key !== 'c' && D.kind !== 'weekly' ? `<span>当日 ${pct(v(r, 'c'))}</span>` : ''}<span>相对量 ${typeof v(r, 'rv') === 'number' ? v(r, 'rv').toFixed(1) + '×' : '—'}</span><span>${capUsd(v(r, 'mc'))}</span><span>${esc(D.inds[v(r, 'i')])}</span>${v(r, 'er') ? `<span>财报 ${md(v(r, 'er'))}</span>` : ''}</div>
      ${!isTodo(e.why) ? `<p class="why">${esc(e.why)}</p>` : ''}${sources(e.src)}</article>`;
  }).join('')}</div>`;
}
function renderMov() {
  const k = cMetric();
  const lab = D.kind === 'weekly' ? '近一周' : closeLabel();
  const pre = D.movers.pmUp.length || D.movers.pmDown.length;
  $('#p-mov').innerHTML = `
    ${pre ? sec('盘前异动', `盘前成交 ≥ 1 万股且涨跌 ≥ 1% · ${esc(ptTime(D.fetched))} PT`, `<div class="duo"><div>${moverList(D.movers.pmUp, 'pm')}</div><div>${moverList(D.movers.pmDown, 'pm')}</div></div>`) : ''}
    ${sec('涨幅榜', `标普 500 · ${esc(lab)}`, moverList(D.movers.up, k))}
    ${sec('跌幅榜', `标普 500 · ${esc(lab)}`, moverList(D.movers.down, k))}
    ${sec('放量', '相对 10 日均量', `<div class="tbl"><table><thead><tr><th>代码</th><th>名称</th><th class="n">相对量</th><th class="n">成交量</th><th class="n">当日</th></tr></thead>
      <tbody>${D.movers.vol.map(s => { const r = BY[s]; return `<tr class="click" tabindex="0" data-s="${esc(s)}"><td class="code">${esc(s)}</td><td>${esc(nameOf(s))}</td><td class="n">${v(r, 'rv').toFixed(2)}×</td><td class="n">${v(r, 'v').toFixed(1)}M</td><td class="n">${pc(v(r, 'c'))}</td></tr>`; }).join('')}</tbody></table></div>`)}
    <p class="note">点击任意一行可在热力图上定位。异动原因由编辑检索新闻后撰写，查不到明确消息的会写明。</p>`;
}

function renderCal() {
  const today = issue.date;
  const byDay = d3.groups(D.econ, e => etDate(e.t));
  const dayTag = d => (d === today ? ' · 今天' : d < today ? ' · 已公布' : '');
  const unit = (x, u) => (x == null ? '—' : x + (u || ''));
  const econHtml = byDay.length ? byDay.map(([d, evs]) => `<div class="day"><h4>${md(d)} ${wd(d)}<small>${dayTag(d)}</small></h4>
    ${evs.map(e => {
      const zh = econName(e.n);
      return `<div class="ev${e.a != null ? ' done' : ''}"><span class="tm">${ptTime(e.t)}</span>
        <span class="ti"><span class="imp" title="重要性">${[0, 1, 2].map(i => `<i class="${i <= e.imp + 1 ? 'on' : ''}"></i>`).join('')}</span>${esc(zh || e.n)}${zh ? `<small>${esc(e.n)}</small>` : ''}${e.per ? `<small>${esc(e.per)}</small>` : ''}</span><span></span>
        <span class="vals"><span>实际 <b>${esc(unit(e.a, e.u))}</b></span><span>预期 ${esc(unit(e.f, e.u))}</span><span>前值 ${esc(unit(e.p, e.u))}</span></span></div>`;
    }).join('')}</div>`).join('') : '<p class="empty">经济日历暂无数据</p>';

  const res = D.earnings.results;
  const up = d3.groups(D.earnings.upcoming, e => e.d);
  const tm = t => (t === 'bmo' ? '盘前' : t === 'amc' ? '盘后' : '—');
  const eps = x => (x == null ? '—' : (x < 0 ? '−$' : '$') + Math.abs(x).toFixed(2));
  $('#p-cal').innerHTML = `
    ${res.length ? sec('财报 · 已公布', '标普 500 或市值 ≥ 200 亿美元', `<div class="tbl"><table><thead><tr><th>代码</th><th>名称</th><th class="n">EPS 实际</th><th class="n">预期</th><th class="n">超预期</th></tr></thead>
      <tbody>${res.map(e => `<tr class="click" tabindex="0" data-s="${esc(e.s)}"><td class="code">${esc(e.s)}</td><td>${esc(CN[e.s] || e.n)}</td><td class="n">${eps(e.eA)}</td><td class="n">${eps(e.eF)}</td><td class="n">${pc(e.sp)}</td></tr>`).join('')}</tbody></table></div>`) : ''}
    ${sec('财报 · 未来一周', 'EPS 为市场一致预期 · 标普 500 或市值 ≥ 200 亿美元', up.length ? up.map(([d, rows]) => `<div class="day"><h4>${md(d)} ${wd(d)}<small>${d === today ? ' · 今天' : ''} · ${rows.length} 家</small></h4>
      <div class="tbl"><table><tbody>${rows.sort((a, b) => (b.mc || 0) - (a.mc || 0)).map(e => `<tr><td class="code">${esc(e.s)}</td><td>${esc(CN[e.s] || e.n)}</td><td>${tm(e.t)}</td><td class="n">EPS ${eps(e.eF)}</td><td class="n">${capUsd(e.mc)}</td></tr>`).join('')}</tbody></table></div></div>`).join('') : '<p class="empty">未来一周没有大型公司发布财报</p>')}
    ${sec('经济数据', '美国 · 时间为美西 PT · 圆点为重要性', econHtml)}`;
}

function renderBr() {
  const b = D.breadth;
  const k = cMetric();
  const rsp = D.macro.find(m => m.k === 'RSP') || {}, spx = D.macro.find(m => m.k === 'SPX') || {};
  const gap = typeof rsp[k] === 'number' && typeof spx[k] === 'number' ? rsp[k] - spx[k] : null;
  const t = b.adv + b.dec + b.unch || 1;
  const bar = (x, cls2 = '') => `<div class="bar"><i class="${cls2}" style="width:${Math.max(0, Math.min(100, x))}%"></i></div>`;
  $('#p-br').innerHTML = `
    ${sec('标普 500 宽度', esc(D.kind === 'weekly' ? '近一周' : closeLabel()), `<div class="tiles">
      <div class="tile"><span class="k">上涨 / 下跌</span><span class="v"><span class="up">${b.adv}</span><small>/</small><span class="dn">${b.dec}</span></span>
        <div class="stack" style="margin-top:5px"><i class="p" style="flex:${b.adv / t}"></i><i class="z" style="flex:${b.unch / t}"></i><i class="q" style="flex:${b.dec / t}"></i></div></div>
      <div class="tile"><span class="k">等权 − 市值加权</span><span class="v ${cls(gap)}">${gap == null ? '—' : (gap > 0 ? '+' : gap < 0 ? '−' : '') + Math.abs(gap).toFixed(2)}<small>个百分点</small></span><span class="d" style="color:var(--faint);font-weight:500">RSP ${pct(rsp[k])} · 标普 ${pct(spx[k])}</span></div>
      <div class="tile"><span class="k">站上 50 日均线</span><span class="v">${b.a50}<small>%</small></span>${bar(b.a50)}</div>
      <div class="tile"><span class="k">站上 200 日均线</span><span class="v">${b.a200}<small>%</small></span>${bar(b.a200)}</div>
      <div class="tile"><span class="k">52 周新高</span><span class="v">${b.hi}<small>只</small></span><span class="d" style="color:var(--faint);font-weight:500">当日最高价触及 52 周高点</span></div>
      <div class="tile"><span class="k">52 周新低</span><span class="v">${b.lo}<small>只</small></span><span class="d" style="color:var(--faint);font-weight:500">当日最低价触及 52 周低点</span></div>
      ${b.pmAdv != null ? `<div class="tile" style="grid-column:1/-1"><span class="k">盘前上涨 / 下跌（有盘前成交的成分股）</span><span class="v"><span class="up">${b.pmAdv}</span><small>/</small><span class="dn">${b.pmDec}</span></span></div>` : ''}
    </div>`)}
    ${sec('各板块站上均线比例', '实心 50 日 · 空心 200 日', `<div class="tbl"><table><thead><tr><th>板块</th><th class="n">50 日</th><th style="width:40%"></th><th class="n">200 日</th></tr></thead>
      <tbody>${D.sectors.slice().sort((a, b2) => b2.a50 - a.a50).map(s => `<tr><td class="nm">${esc(s.n)}</td><td class="n">${s.a50}%</td>
        <td style="vertical-align:middle"><div style="display:flex;flex-direction:column;gap:3px">${bar(s.a50)}${bar(s.a200, 'b2')}</div></td><td class="n">${s.a200}%</td></tr>`).join('')}</tbody></table></div>`)}
    <p class="note">宽度只统计标普 500 成分股。站上均线用最新收盘价对比 50 日、200 日简单均线；等权减市值加权为正，说明多数股票跑赢了权重股。</p>`;
}

function renderHow() {
  const s = D.src;
  $('#p-how').innerHTML = `
    ${sec('这份晨报怎么做', '', `<p class="note">每个交易日美西 05:00 前出刊（美东 08:00，盘前时段），周六出一期周报，周日和美股休市日不出刊。数据由脚本抓取后，编辑（Claude）检索新闻写结论、板块点评和每只异动股的原因，每条附来源。本期编辑于 <b class="num">${esc(E.edited)}</b>。</p>`)}
    ${sec('口径', '', `<ul class="points">
      <li><b>${esc(closeLabel())}</b>：本期收盘数据属于 ${md(D.session)} ${wd(D.session)} 的交易时段${D.session === issue.date && D.status === 'open' ? '（抓取时市场仍在交易，为盘中数据）' : ''}。</li>
      <li><b>盘前</b>：美东 04:00–09:30 的成交价相对前收；只在盘前时段出刊时显示。</li>
      <li><b>期货、利率、汇率、商品、加密</b>：抓取时的最新报价，期货相对前结算价。</li>
      <li><b>板块</b>：SPDR 板块 ETF 的涨跌；成分股按 Wikipedia 上的 GICS 分类归入 11 个板块。</li>
      <li><b>异动</b>：标普 500 成分股按涨跌幅排序；盘前榜要求盘前成交 ≥ 1 万股且涨跌 ≥ 1%。</li>
      <li><b>相对量</b>：当日成交量 ÷ 过去 10 日平均成交量。</li>
      <li>行情延迟约 15 分钟。本页不构成投资建议。</li></ul>`)}
    ${sec('数据来源', '', `<div class="src" style="flex-direction:column;gap:6px">${Object.values(s).map(([n, u]) => `<a href="${esc(href(u))}" target="_blank" rel="noopener">${esc(n)}</a>`).join('')}</div>`)}
    ${D.warn && D.warn.length ? sec('本期数据提示', '', `<ul class="points">${D.warn.map(w => `<li>${esc(w)}</li>`).join('')}</ul>`) : ''}
    <p class="note">数据抓取于 <span class="num">${esc(new Date(D.fetched).toLocaleString('zh-CN', { timeZone: 'America/Los_Angeles', hour12: false }))}</span> PT。</p>`;
}

function renderPanel() {
  renderSum(); renderSec(); renderMov(); renderCal(); renderBr(); renderHow();
}

function setTab(t) {
  tab = t;
  document.querySelectorAll('.tabs button').forEach(b => b.setAttribute('aria-selected', String(b.dataset.t === t)));
  document.querySelectorAll('.pane').forEach(p => { p.hidden = p.id !== 'p-' + t; });
}
document.querySelector('.tabs').addEventListener('click', e => { const b = e.target.closest('button[data-t]'); if (b) setTab(b.dataset.t); });

$('#panel').addEventListener('click', e => {
  const st = e.target.closest('[data-s]');
  if (st && !e.target.closest('a')) { focusStock(st.dataset.s, true); return; }
  const sg = e.target.closest('tr[data-g]');
  if (sg) { sector = Number(sg.dataset.g); selected = null; tip.hidden = true; drawMap(); drawChips(); if (window.matchMedia('(max-width:1080px)').matches) $('#stage').scrollIntoView({ behavior: 'smooth', block: 'start' }); }
});
$('#panel').addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[data-s],tr[data-g]')) { e.preventDefault(); e.target.click(); } });

$('#secs').addEventListener('click', e => {
  const b = e.target.closest('button[data-g]');
  if (!b) return;
  sector = b.dataset.g === '' ? null : Number(b.dataset.g);
  selected = null; tip.hidden = true;
  drawMap(); drawChips();
});

function setMode(m) {
  mode = m;
  document.querySelectorAll('#mode button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.m === m)));
  drawMap(); drawChips();
  if (selected) focusStock(selected, false);
}
$('#mode').addEventListener('click', e => { const b = e.target.closest('button[data-m]'); if (b && !b.disabled) setMode(b.dataset.m); });

function setUpDown(m) {
  document.body.dataset.updown = m;
  $('#ud-cn').setAttribute('aria-pressed', String(m === 'cn'));
  $('#ud-us').setAttribute('aria-pressed', String(m === 'us'));
  store.set('usmb-updown', m);
  readVars();
  drawMap();
}
$('#ud-cn').addEventListener('click', () => setUpDown('cn'));
$('#ud-us').addEventListener('click', () => setUpDown('us'));

function show(i) {
  load(i);
  $('#brand-sub').textContent = `US Market Brief · ${issue.date.replace(/-/g, '.')} · No.${String(E.no).padStart(3, '0')}`;
  const pmBtn = document.querySelector('#mode button[data-m="pm"]');
  pmBtn.disabled = D.status !== 'pre';
  pmBtn.title = D.status !== 'pre' ? '本期不在盘前时段出刊，没有盘前数据' : '';
  document.querySelector('#mode button[data-m="c"]').textContent = D.session === issue.date && D.status === 'open' ? '盘中' : '前收';
  document.querySelectorAll('#mode button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.m === mode)));
  tip.hidden = true;
  renderPanel();
  drawChips();
  drawMap();
}

const pick = $('#issue-pick');
pick.innerHTML = ISSUES.map((it, i) => `<option value="${i}">${esc(md(it.date))} ${wd(it.date)} · No.${String(it.edit.no).padStart(3, '0')}${it.data.kind === 'weekly' ? ' 周报' : ''}</option>`).join('');
pick.addEventListener('change', () => show(Number(pick.value)));

document.body.dataset.updown = store.get('usmb-updown') === 'us' ? 'us' : 'cn';
$('#ud-cn').setAttribute('aria-pressed', String(document.body.dataset.updown === 'cn'));
$('#ud-us').setAttribute('aria-pressed', String(document.body.dataset.updown === 'us'));
readVars();
const tabFromHash = location.hash.slice(1);
if (['sum', 'sec', 'mov', 'cal', 'br', 'how'].includes(tabFromHash)) setTab(tabFromHash);
show(0);
new ResizeObserver(() => drawMap()).observe($('#map'));
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { readVars(); drawMap(); });
new MutationObserver(() => { readVars(); drawMap(); }).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

})();</script>
