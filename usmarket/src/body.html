<header class="top glass">
  <div class="brand"><b>美股晨报 OS</b><span class="num" id="brand-sub">Decision Desk</span></div>
  <div class="ctrls">
    <label for="issue-pick" hidden>往期</label>
    <select id="issue-pick" aria-label="选择日期"></select>
    <div class="seg" role="group" aria-label="涨跌配色">
      <button type="button" id="ud-cn" aria-pressed="true" title="红涨绿跌"><i class="sw" style="background:var(--red)"></i>红涨</button>
      <button type="button" id="ud-us" aria-pressed="false" title="绿涨红跌"><i class="sw" style="background:var(--green)"></i>绿涨</button>
    </div>
  </div>
</header>
<main class="grid">
  <section class="col" aria-label="今天怎么做">
    <article class="card glass hero" id="gate" aria-labelledby="gate-h"></article>
    <article class="card glass" id="orders" aria-labelledby="orders-h"></article>
    <article class="card glass" id="book" aria-labelledby="book-h"></article>
    <article class="card glass" id="mine" aria-labelledby="mine-h">
      <div class="ch"><h2 id="mine-h">我的持仓</h2><span class="sub">只存在这台设备的浏览器里，不会上传</span></div>
      <div class="form" role="group" aria-label="账户设置">
        <label for="acct-eq">账户净值（美元）<input id="acct-eq" type="number" min="1000" step="1000" inputmode="numeric"></label>
        <label for="acct-risk">每笔风险<select id="acct-risk"><option value="0.0025">0.25%</option><option value="0.005">0.5%（回测口径）</option><option value="0.01">1%</option></select></label>
      </div>
      <form class="form" id="h-form" autocomplete="off">
        <label for="h-sym">代码<input id="h-sym" type="text" placeholder="AAPL" required></label>
        <label for="h-cost">成本价<input id="h-cost" type="number" step="0.01" min="0" placeholder="180.50" required></label>
        <label for="h-sh">股数<input id="h-sh" type="number" step="0.0001" min="0" placeholder="20" required></label>
        <button class="btn pri" type="submit">添加</button>
      </form>
      <p class="msg" id="h-msg" role="status"></p>
      <div id="h-table"></div>
      <details>
        <summary>批量导入或备份</summary>
        <p class="note">每行一只：代码,成本价,股数。复制下面的文本即可备份；粘贴后点「导入」会替换当前列表。</p>
        <textarea id="h-bulk" rows="5" spellcheck="false" aria-label="持仓文本"></textarea>
        <div class="form" style="margin-top:8px"><button class="btn sm" type="button" id="h-import">导入</button><button class="btn sm" type="button" id="h-copy">复制</button></div>
      </details>
    </article>
  </section>
  <aside class="col" aria-label="依据">
    <article class="card glass" id="perf" aria-labelledby="perf-h"></article>
    <article class="card glass" id="cands" aria-labelledby="cands-h"></article>
    <article class="card glass" id="score" aria-labelledby="score-h"></article>
    <article class="card glass" id="how" aria-labelledby="how-h"></article>
  </aside>
</main>
