<title>国家蛛网 Country Radar</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;700;800;900&display=swap">
<style>/* Layout: one liquid-glass window over a quiet aurora; top bar (name · views), one scrolling view. The radar is the only loud thing: hairline web, heavy type, four series colors. */
:root{--bg:#EDF0F3;--blob1:#BCD2F2;--blob2:#F2CFDD;--blob3:#CFE6D5;--blob4:#F3E2B8;--ink:#0D1117;--muted:#525A66;--faint:#868E99;--glass-a:rgba(255,255,255,.62);--glass-b:rgba(255,255,255,.3);--glass-edge:rgba(255,255,255,.92);--glass-inner:rgba(255,255,255,.97);--shadow:rgba(30,44,70,.18);--line:rgba(13,17,23,.15);--line-soft:rgba(13,17,23,.07);--field:rgba(255,255,255,.5);--surface:rgba(252,252,251,.88);--surface-solid:#FBFBFA;--grid:rgba(13,17,23,.13);--grid-strong:rgba(13,17,23,.28);--s0:#e87ba4;--s1:#2a78d6;--s2:#008300;--s3:#eda100;--heat:#0D1117;--bar:rgba(13,17,23,.3);--bad:#d03b3b;--bad-soft:rgba(208,59,59,.1);--good:#006300;--hair:1px;--f-display:"Outfit","Noto Sans SC",system-ui,sans-serif;--f-body:"Noto Sans SC","Outfit",system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0A0D11;--blob1:#17305A;--blob2:#3E1A2B;--blob3:#0F3320;--blob4:#3D2E0C;--ink:#EEF1F5;--muted:#A8B0BB;--faint:#737B86;--glass-a:rgba(28,33,40,.62);--glass-b:rgba(14,17,22,.42);--glass-edge:rgba(255,255,255,.15);--glass-inner:rgba(255,255,255,.18);--shadow:rgba(0,0,0,.55);--line:rgba(255,255,255,.14);--line-soft:rgba(255,255,255,.07);--field:rgba(255,255,255,.04);--surface:rgba(26,26,25,.86);--surface-solid:#1C1D1E;--grid:rgba(255,255,255,.12);--grid-strong:rgba(255,255,255,.26);--s0:#d55181;--s1:#3987e5;--s2:#008300;--s3:#c98500;--heat:#EEF1F5;--bar:rgba(255,255,255,.32);--bad:#ff7468;--bad-soft:rgba(255,116,104,.14);--good:#0ca30c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0A0D11;--blob1:#17305A;--blob2:#3E1A2B;--blob3:#0F3320;--blob4:#3D2E0C;--ink:#EEF1F5;--muted:#A8B0BB;--faint:#737B86;--glass-a:rgba(28,33,40,.62);--glass-b:rgba(14,17,22,.42);--glass-edge:rgba(255,255,255,.15);--glass-inner:rgba(255,255,255,.18);--shadow:rgba(0,0,0,.55);--line:rgba(255,255,255,.14);--line-soft:rgba(255,255,255,.07);--field:rgba(255,255,255,.04);--surface:rgba(26,26,25,.86);--surface-solid:#1C1D1E;--grid:rgba(255,255,255,.12);--grid-strong:rgba(255,255,255,.26);--s0:#d55181;--s1:#3987e5;--s2:#008300;--s3:#c98500;--heat:#EEF1F5;--bar:rgba(255,255,255,.32);--bad:#ff7468;--bad-soft:rgba(255,116,104,.14);--good:#0ca30c;color-scheme:dark}
@media (min-resolution:2dppx){:root{--hair:.5px}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;padding-inline:16px;padding-block:16px;overflow:hidden;position:relative}
.num{font-family:var(--f-display);font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
h1,h2,h3,h4{text-wrap:balance;margin:0}
a{color:inherit;text-decoration-thickness:var(--hair);text-underline-offset:3px}

/* comparison slots: a compared country keeps its slot color + marker shape; text stays ink */
.s0{--c:var(--s0)}.s1{--c:var(--s1)}.s2{--c:var(--s2)}.s3{--c:var(--s3)}
.mk{width:11px;height:11px;flex:none;display:inline-block;background:var(--c)}
.mk.circle{border-radius:50%}
.mk.square{border-radius:2px;width:10px;height:10px}
.mk.triangle{clip-path:polygon(50% 0,100% 100%,0 100%);width:12px}
.mk.diamond{transform:rotate(45deg) scale(.86);border-radius:1px}
.mk.none{background:none;border:var(--hair) solid var(--faint);border-radius:50%;width:9px;height:9px}
.mk.ideal{background:none;border:1.5px dashed var(--ink);border-radius:50%}

/* aurora + glass */
.aurora{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.aurora i{position:absolute;border-radius:50%;filter:blur(90px);opacity:.7}
.aurora i:nth-child(1){width:46vw;height:46vw;left:-14vw;top:-16vw;background:var(--blob1)}
.aurora i:nth-child(2){width:34vw;height:34vw;right:-8vw;top:-8vw;background:var(--blob2)}
.aurora i:nth-child(3){width:40vw;height:40vw;left:24vw;bottom:-26vw;background:var(--blob3)}
.aurora i:nth-child(4){width:30vw;height:30vw;right:0;bottom:-14vw;background:var(--blob4)}
.glass{background:linear-gradient(145deg,var(--glass-a),var(--glass-b));-webkit-backdrop-filter:blur(30px) saturate(170%);backdrop-filter:blur(30px) saturate(170%);border:var(--hair) solid var(--glass-edge);box-shadow:inset 0 1px 0 var(--glass-inner),0 24px 60px -24px var(--shadow)}
.window{position:relative;z-index:1;height:100%;display:grid;grid-template-rows:auto minmax(0,1fr);border-radius:28px;overflow:hidden;max-width:1440px;margin-inline:auto}

/* top bar */
.top{display:flex;align-items:center;gap:18px;padding:14px 22px;border-bottom:var(--hair) solid var(--line);flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto}
.brand b{font:900 25px/1 var(--f-body);letter-spacing:.04em}
.brand span{font:600 11px var(--f-display);letter-spacing:.28em;color:var(--muted);text-transform:uppercase}
.seg{display:inline-flex;padding:3px;border-radius:14px;border:var(--hair) solid var(--line);background:var(--field);gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:7px 14px;border-radius:11px;font-size:14.5px;font-weight:500;color:var(--muted);cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.seg button[aria-selected="true"],.seg button[aria-pressed="true"],.seg button[aria-checked="true"]{background:var(--glass-a);color:var(--ink);font-weight:800;box-shadow:inset 0 1px 0 var(--glass-inner),0 4px 14px -6px var(--shadow)}
.seg.sm button{padding:4px 10px;font-size:13px;border-radius:9px}

/* views */
.main{overflow-y:auto;overflow-x:hidden;min-height:0}
.view{padding:24px 24px 40px;display:grid;gap:20px;align-content:start}
.eyebrow{font:600 11.5px var(--f-display);letter-spacing:.2em;text-transform:uppercase;color:var(--faint)}
.lead h1{font:900 clamp(24px,3vw,32px)/1.25 var(--f-body);letter-spacing:.01em;margin-top:6px;max-width:32em}
.cl{display:inline-block}
.lead p{margin:8px 0 0;color:var(--muted);font-size:15px;max-width:72ch}
.panel{border-radius:22px;border:var(--hair) solid var(--line);background:var(--field);padding:16px 18px;min-width:0}
.panel>h3,.ph{font:800 16px var(--f-body);display:flex;align-items:baseline;gap:10px;justify-content:space-between;flex-wrap:wrap}
.ph small,.panel>h3 small{font:400 12.5px var(--f-body);color:var(--faint)}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{border:var(--hair) solid var(--line);background:none;border-radius:999px;padding:4px 12px;font-size:13.5px;color:var(--muted);cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:7px;min-height:30px}
.chip[aria-pressed="true"],.chip[aria-checked="true"]{border-color:var(--ink);color:var(--ink);font-weight:700}
.chip[aria-pressed="false"] .mk{opacity:.3}
.chip:disabled{opacity:.45;cursor:default}
.ctl{display:grid;gap:10px}
.ctl-row{display:flex;gap:10px 16px;flex-wrap:wrap;align-items:center}
.ctl-row>span{font-size:12.5px;color:var(--faint);min-width:3em}
.foot{font-size:12.5px;color:var(--faint);padding:0 24px 28px;margin:0}


/* overview grid */
.ov{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:18px;align-items:start}
.chart{border-radius:22px;border:var(--hair) solid var(--line);background:var(--surface);padding:16px 18px 10px;min-width:0;position:relative}
.radar-box{position:relative;max-width:620px;margin:6px auto 0}
.radar{display:block;width:100%;height:auto;overflow:visible}
.radar path,.radar line{vector-effect:non-scaling-stroke}
.radar .ring{fill:none;stroke:var(--grid);stroke-width:1}
.radar .ring.outer{stroke:var(--grid-strong)}
.radar .axis{stroke:var(--grid);stroke-width:1}
.radar .axis.on{stroke:var(--ink);stroke-width:1}
.radar .tick{font:500 10.5px var(--f-display);fill:var(--faint)}
.radar .lab{font:800 14.5px var(--f-body);fill:var(--ink);cursor:pointer}
.radar .lab-g:focus{outline:none}
.radar .lab-g:focus-visible .lab,.radar .lab-g.on .lab{text-decoration:underline;text-underline-offset:4px}
.radar .lab-sub{font:500 11px var(--f-display);fill:var(--faint)}
.radar .hit{fill:transparent;cursor:pointer}
.radar .ser path.area{fill:var(--c);fill-opacity:.08;stroke:none}
.radar .ser path.edge{fill:none;stroke:var(--c);stroke-width:1.6;stroke-linejoin:round}
.radar .ser .pt{fill:var(--c);stroke:var(--surface-solid);stroke-width:2;vector-effect:non-scaling-stroke}
.radar.compact .lab{font-size:26px}
.radar.compact .tick{font-size:17px}
.radar .ser{transition:opacity .2s}
.radar[data-emph] .ser{opacity:.14}
.radar[data-emph] .ser.on{opacity:1}
.radar[data-emph] .ser path.area{fill-opacity:.16}
.radar .ideal path{fill:var(--ink);fill-opacity:.03;stroke:var(--ink);stroke-width:1.3;stroke-dasharray:5 4;stroke-linejoin:round}
.radar .ideal circle{fill:var(--surface-solid);stroke:var(--ink);stroke-width:1.2}
.radar .hl{fill:var(--ink);opacity:.035}
.legend{display:flex;gap:6px 14px;flex-wrap:wrap;justify-content:center;font-size:13px;color:var(--muted);padding:4px 0 8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
@media (prefers-reduced-motion:no-preference){.radar .ser,.radar .ideal{animation:grow .5s cubic-bezier(.2,.8,.2,1) both;transform-origin:var(--o)}}
@keyframes grow{from{transform:scale(.9);opacity:0}to{transform:none;opacity:1}}

/* tooltip */
.tip{position:fixed;z-index:30;pointer-events:none;min-width:200px;max-width:280px;border-radius:16px;padding:10px 12px;font-size:13px;opacity:0;transform:translateY(4px);transition:opacity .12s,transform .12s}
.tip.on{opacity:1;transform:none}
.tip.glass{background:linear-gradient(145deg,var(--surface),var(--surface))}
.tip h4{font:800 14px var(--f-body);display:flex;justify-content:space-between;gap:10px;margin-bottom:4px}
.tip h4 small{font:500 11.5px var(--f-body);color:var(--faint)}
.tip .r{display:grid;grid-template-columns:14px minmax(0,1fr) auto;gap:6px;align-items:center;padding:2px 0}
.tip .r b{font:800 14px var(--f-display);font-variant-numeric:tabular-nums}
.tip .r.ideal{color:var(--muted)}
.tip p{margin:6px 0 0;color:var(--faint);font-size:12px}

/* tables */
.tbl-wrap{overflow-x:auto;border-radius:20px;border:var(--hair) solid var(--line);background:var(--field)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{font:600 11.5px var(--f-display);letter-spacing:.1em;text-transform:uppercase;color:var(--faint);text-align:left;padding:12px 12px 8px;border-bottom:var(--hair) solid var(--line);white-space:nowrap;vertical-align:bottom}
th .th-c{display:inline-flex;align-items:center;gap:6px;font:700 13px var(--f-body);letter-spacing:0;text-transform:none;color:var(--ink)}
td{padding:9px 12px;border-bottom:var(--hair) solid var(--line-soft);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.score-tbl{min-width:430px}
.score-tbl tbody tr{cursor:pointer}
.score-tbl tbody tr:hover td{background:var(--field)}
.score-tbl td.dn{font-weight:800;white-space:nowrap}
.score-tbl td.dn small{display:block;font:400 11.5px var(--f-body);color:var(--faint)}
.sc{white-space:nowrap;font:500 15px var(--f-display);font-variant-numeric:tabular-nums;color:var(--muted)}
.sc.hi{font-weight:800;color:var(--ink)}
.sc.hi::before{content:"";display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--ink);margin-right:6px;vertical-align:middle}
.score-tbl tfoot td{border-top:var(--hair) solid var(--line);font-weight:800}
.score-tbl tfoot .sc{font-size:17px}
.score-tbl tr.off td{opacity:.4}

/* findings */
.find{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.fc{border-top:var(--hair) solid var(--line);padding-top:10px;display:grid;gap:6px;align-content:start}
.fc h4{display:flex;align-items:center;gap:8px;font:800 15px var(--f-body)}
.fc p{margin:0;font-size:13.5px;color:var(--muted);line-height:1.65}
.fc p b{color:var(--ink)}
.fc .pm{display:grid;grid-template-columns:30px minmax(0,1fr);gap:4px;font-size:13.5px;line-height:1.6;color:var(--muted)}
.fc .pm em{font-style:normal;font-weight:800;color:var(--ink);font-size:12px;border:var(--hair) solid var(--line);border-radius:6px;text-align:center;height:20px;line-height:19px;margin-top:2px}
.fc .pm b{color:var(--ink)}
.callout{display:grid;gap:6px;padding:14px 16px;border-radius:18px;border:var(--hair) solid var(--grid-strong);background:var(--field)}
.callout b{font-weight:800}
.callout p{margin:0;font-size:13.5px;color:var(--muted);line-height:1.65}

/* pair compare */
.pair{display:grid;gap:8px;margin-top:10px}
.pr{display:grid;grid-template-columns:76px minmax(0,1fr) 44px;gap:10px;align-items:center;font-size:13px}
.pr>span{font-weight:700;white-space:nowrap}
.pr .tr{position:relative;height:18px}
.pr .tr::before{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:var(--grid-strong)}
.pr .tr i{position:absolute;top:3px;bottom:3px;background:var(--ink)}
.pr.pb .tr i{background:var(--bar)}
.pr .tr i.r{left:50%;border-radius:0 4px 4px 0}
.pr .tr i.l{right:50%;border-radius:4px 0 0 4px}
.pr b{font:700 13px var(--f-display);font-variant-numeric:tabular-nums;text-align:right}
.pair-h{display:grid;grid-template-columns:76px minmax(0,1fr) 44px;gap:10px;font-size:12px;color:var(--faint)}
.pair-h div{display:flex;justify-content:space-between}
.pair-h span{display:inline-flex;align-items:center;gap:6px}

/* dimension view */
.dhead{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start}
.dhead h1{font:900 clamp(26px,3.2vw,34px)/1.2 var(--f-body)}
.dhead h1 small{font:600 13px var(--f-display);letter-spacing:.2em;text-transform:uppercase;color:var(--faint);margin-left:10px}
.dhead p{margin:6px 0 0;color:var(--muted)}
.bars{display:grid;gap:8px}
.bar{display:grid;grid-template-columns:70px minmax(0,1fr) 44px;gap:10px;align-items:center;font-size:13.5px}
.bar>span{display:inline-flex;align-items:center;gap:7px;font-weight:700;white-space:nowrap}
.bar .tr{height:10px;position:relative;border-radius:0 4px 4px 0}
.bar .tr::before{content:"";position:absolute;inset:4px 0;background:var(--grid)}
.bar .tr i{position:absolute;left:0;top:0;bottom:0;background:var(--c,var(--bar));border-radius:0 4px 4px 0}
.bar b{font:800 16px var(--f-display);text-align:right;font-variant-numeric:tabular-nums}
.ind-tbl{min-width:900px}
.ind-tbl td.in{min-width:200px}
.ind-tbl td.in b{font-weight:800;display:block}
.ind-tbl td.in small{color:var(--faint);font-size:12px}
.cell{display:grid;gap:3px;min-width:96px}
.cell b{font:700 15px var(--f-display);font-variant-numeric:tabular-nums}
.cell b small{font:400 11.5px var(--f-body);color:var(--faint);margin-left:3px}
.cell .mini-bar{height:3px;background:var(--grid);position:relative;border-radius:2px}
.cell .mini-bar i{position:absolute;left:0;top:0;bottom:0;background:var(--c,var(--bar));border-radius:2px}
.cell.na b{color:var(--faint)}
.cell span{font:500 11.5px var(--f-display);color:var(--faint)}
.cell.best b::after{content:"最佳";font:700 10.5px var(--f-body);border:var(--hair) solid var(--ink);border-radius:999px;padding:0 6px;margin-left:6px;vertical-align:2px;color:var(--ink)}
.gp{font:500 12px var(--f-display);color:var(--muted);white-space:nowrap}
.src{font-size:12px;color:var(--muted);min-width:150px}
.src a{color:var(--muted)}
.notes{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.notes li{display:grid;grid-template-columns:110px minmax(0,1fr);gap:12px;font-size:13.5px;color:var(--muted);line-height:1.65;padding-top:8px;border-top:var(--hair) solid var(--line-soft)}
.notes li b{color:var(--ink);font-weight:700}

/* ideal view */
.idl{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start}
.idl-side{position:sticky;top:0;display:grid;gap:14px}
.presets{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:10px}
.preset{border:var(--hair) solid var(--line);background:none;border-radius:16px;padding:10px 12px;text-align:left;cursor:pointer;display:grid;gap:2px}
.preset b{font-weight:800;font-size:14.5px}
.preset small{font-size:12px;color:var(--muted);line-height:1.45}
.preset[aria-checked="true"]{border-color:var(--ink);background:var(--glass-a);box-shadow:inset 0 1px 0 var(--glass-inner)}
.qs{display:grid;gap:14px;margin-top:10px;counter-reset:q}
.q{display:grid;gap:8px}
.q>b{font-weight:800;font-size:14.5px;counter-increment:q}
.q>b::before{content:counter(q) ". ";font-family:var(--f-display);color:var(--faint)}
.tune{min-width:520px}
.tune td{padding:8px 10px}
.tune td.dn{font-weight:800;white-space:nowrap}
.tune input[type=range]{width:100%;min-width:110px;accent-color:var(--ink)}
.tune .tv{font:800 15px var(--f-display);min-width:28px;display:inline-block;text-align:right}
.tune tr.mute td:not(:first-child){opacity:.45}
.matches{display:grid;gap:4px}
.m{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:10px 0;border-top:var(--hair) solid var(--line-soft)}
.m:first-child{border-top:0}
.m .rk{font:800 15px var(--f-display);color:var(--faint)}
.m:first-child .rk{color:var(--ink)}
.m .nm{display:flex;align-items:center;gap:8px;font-weight:800;font-size:15.5px}
.m .fit{font:800 28px/1 var(--f-display);text-align:right}
.m .fit small{font:500 12px var(--f-body);color:var(--faint);margin-left:2px}
.m .mt{grid-column:2/-1;height:4px;background:var(--grid);border-radius:2px;position:relative}
.m .mt i{position:absolute;left:0;top:0;bottom:0;background:var(--c,var(--bar));border-radius:2px}
.m .gaps{grid-column:2/-1;display:flex;gap:5px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.gap{display:inline-flex;align-items:center;gap:4px;border:var(--hair) solid var(--line);border-radius:999px;padding:0 8px;line-height:1.7;white-space:nowrap}
.gap.hard{border-color:var(--bad);background:var(--bad-soft);color:var(--ink);font-weight:700}
.gap.hard svg{width:11px;height:11px;stroke:var(--bad)}
.gap.ok{border-color:transparent;color:var(--good);padding-left:0}
.badge{font:600 11.5px var(--f-body);border:var(--hair) solid var(--line);border-radius:999px;padding:1px 9px;color:var(--muted);white-space:nowrap}
.btn{border:var(--hair) solid var(--line);background:none;border-radius:12px;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer;color:var(--ink)}

/* method view */
.prose{max-width:76ch;display:grid;gap:10px;font-size:14.5px;color:var(--muted);line-height:1.75}
.prose b{color:var(--ink)}
.prose p{margin:0}
.formula{font:500 14px var(--f-display);color:var(--ink);padding:12px 16px;border-radius:14px;border:var(--hair) solid var(--line);background:var(--field);overflow-x:auto;white-space:nowrap}
.limits{display:grid;gap:8px;margin:0;padding:0;list-style:none;max-width:86ch}

const norm = (ind, v) => {
  if (v == null) return null;
  const t = ind.log ? (Math.log(v) - Math.log(ind.w)) / (Math.log(ind.b) - Math.log(ind.w)) : (v - ind.w) / (ind.b - ind.w);
  return Math.max(0, Math.min(1, t)) * 100;
};

  C.forEach(c => {
    const xs = d.ind.map(ind => IS[d.id][ind.id][c.id]).filter(x => x != null);
    DS[d.id][c.id] = xs.reduce((s, x) => s + x, 0) / xs.length;

});

  dims: lsGet('dims', D.map(d => d.id)).filter(id => dimById(id)),
  showIdeal: lsGet('showIdeal', false),
  dim: 'health',
  sort: 'all',
  pair: lsGet('pair', ['cn', 'de']),
  ideal: lsGet('ideal', null)
};
S.cmp = [0, 1, 2, 3].map(k => (S.cmp && byId(S.cmp[k]) && S.cmp.indexOf(S.cmp[k]) === k) ? S.cmp[k] : null);
if (!S.cmp.some(Boolean)) S.cmp = ['cn', 'us', 'nz', 'de'];
if (S.dims.length < 3) S.dims = D.map(d => d.id);
if (!S.ideal || !S.ideal.imp || !S.ideal.tgt || D.some(d => S.ideal.imp[d.id] == null || S.ideal.tgt[d.id] == null)) S.ideal = { ...clone(DEFAULT_IDEAL), answers: {}, example: true };
S.ideal.answers = S.ideal.answers || {};
if (!Array.isArray(S.pair) || S.pair.length !== 2 || !S.pair.every(byId) || S.pair[0] === S.pair[1]) S.pair = ['cn', 'de'];
const saveIdeal = () => lsSet('ideal', S.ideal);

// A compared country keeps its slot (color + marker shape) for as long as it stays compared; removing one never repaints the others.
const slotOf = id => S.cmp.indexOf(id);
const compared = () => S.cmp.map((id, k) => id ? { c: byId(id), k } : null).filter(Boolean);
const sc = id => { const k = slotOf(id); return k >= 0 ? 's' + k : ''; };
const mk = c => { const k = slotOf(c.id); return k >= 0 ? `<i class="mk ${SHAPE[k]} s${k}" aria-hidden="true"></i>` : '<i class="mk none" aria-hidden="true"></i>'; };

const toastEl = $('#toast');
function toast(msg) { toastEl.textContent = msg; toastEl.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => toastEl.classList.remove('on'), 2600); }
function toggleCmp(id) {
  const k = slotOf(id);
  if (k >= 0) {
    if (compared().length <= 1) return toast('至少保留 1 个对比国家');
    S.cmp[k] = null;
  } else {
    const free = S.cmp.indexOf(null);
    if (free < 0) return toast('最多同时对比 4 个国家，先取消一个');
    S.cmp[free] = id;
  }
  lsSet('cmp', S.cmp);
  rerender();
}

// ---------- match ----------
// fit = 100 × (1 − √(Σ w·gap² / Σ w·t²)), gap = max(0, target − score). Exceeding a target earns nothing; one big gap hurts more than several small ones.
function match(cid, ideal = S.ideal) {
  let num = 0, den = 0, ws = 0, wsum = 0;
  const gaps = [];
  D.forEach(d => {
    const w = ideal.imp[d.id], t = ideal.tgt[d.id];
    if (!w) return;
    const s = DS[d.id][cid], g = Math.max(0, t - s);
    num += w * g * g; den += w * t * t; ws += w * s; wsum += w;
    if (g > 0.05) gaps.push({ d, g, w, hard: w === 3 && g >= 10 });
  });
  const fit = den ? 100 * (1 - Math.sqrt(num / den)) : 100;
  return { fit, wavg: wsum ? ws / wsum : 0, gaps: gaps.sort((a, b) => b.w * b.g - a.w * a.g) };
}
const ranked = () => C.map(c => ({ c, ...match(c.id) })).sort((a, b) => b.fit - a.fit || b.wavg - a.wavg);

// ---------- radar ----------
const SHAPES = {
  circle: (x, y, r) => `<circle class="pt" cx="${r1(x)}" cy="${r1(y)}" r="${r}"/>`,
  square: (x, y, r) => `<rect class="pt" x="${r1(x - r * .88)}" y="${r1(y - r * .88)}" width="${r1(r * 1.76)}" height="${r1(r * 1.76)}" rx="1"/>`,
  triangle: (x, y, r) => `<path class="pt" d="M${r1(x)} ${r1(y - r * 1.2)}L${r1(x + r * 1.12)} ${r1(y + r * .8)}L${r1(x - r * 1.12)} ${r1(y + r * .8)}Z"/>`,
  diamond: (x, y, r) => `<path class="pt" d="M${r1(x)} ${r1(y - r * 1.3)}L${r1(x + r * 1.1)} ${r1(y)}L${r1(x)} ${r1(y + r * 1.3)}L${r1(x - r * 1.1)} ${r1(y)}Z"/>`
};
const RG = { W: 640, H: 600, cx: 320, cy: 300, R: 210 };
const compact = () => innerWidth < 560;
function setGeom() { RG.R = compact() ? 168 : 210; }
setGeom();
const ang = (i, n) => -Math.PI / 2 + i * 2 * Math.PI / n;
const at = (i, n, rad, cx = RG.cx, cy = RG.cy) => [cx + rad * Math.cos(ang(i, n)), cy + rad * Math.sin(ang(i, n))];
const pathOf = (vals, R = RG.R, cx = RG.cx, cy = RG.cy) => vals.map((v, i) => (i ? 'L' : 'M') + at(i, vals.length, R * v / 100, cx, cy).map(r1).join(' ')).join('') + 'Z';

function radar({ id, dims, series, ideal }) {
  const n = dims.length, { W, H, cx, cy, R } = RG, pr = compact() ? 6.5 : 4.4;
  const summary = dims.map(d => `${d.name}：` + series.map(({ c }) => `${c.name} ${f1(DS[d.id][c.id])}`).join('，')).join('；');
  let s = `<svg class="radar${compact() ? ' compact' : ''}" id="${id}" viewBox="0 0 ${W} ${H}" role="img" aria-label="雷达图，0–100 分。${esc(summary)}">`;
  s += `<path class="hl" d=""/>`;
  [20, 40, 60, 80, 100].forEach(v => { s += `<path class="ring${v === 100 ? ' outer' : ''}" d="${pathOf(dims.map(() => v))}"/>`; });
  dims.forEach((d, i) => { const [x, y] = at(i, n, R); s += `<line class="axis" data-i="${i}" x1="${cx}" y1="${cy}" x2="${r1(x)}" y2="${r1(y)}"/>`; });
  [20, 40, 60, 80, 100].forEach(v => { const [x, y] = at(0, n, R * v / 100); s += `<text class="tick" x="${r1(x + 6)}" y="${r1(y + (compact() ? 18 : 12))}">${v}</text>`; });
  if (ideal) {
    const vals = dims.map(d => ideal.imp[d.id] ? ideal.tgt[d.id] : 0);
    s += `<g class="ideal" style="--o:${cx}px ${cy}px"><path d="${pathOf(vals)}"/>${vals.map((v, i) => { const [x, y] = at(i, n, R * v / 100); return ideal.imp[dims[i].id] ? `<circle cx="${r1(x)}" cy="${r1(y)}" r="${compact() ? 5 : 3.5}"/>` : ''; }).join('')}</g>`;
  }
  series.forEach(({ c, k }) => {
    const vals = dims.map(d => DS[d.id][c.id]), p = pathOf(vals);
    s += `<g class="ser s${k}" data-c="${c.id}" style="--o:${cx}px ${cy}px"><path class="area" d="${p}"/><path class="edge" d="${p}"/>${vals.map((v, i) => SHAPES[SHAPE[k]](...at(i, n, R * v / 100), pr)).join('')}</g>`;
  });
  const half = Math.PI / n;
  dims.forEach((d, i) => {
    const a = ang(i, n), pt = (aa, rr) => [cx + rr * Math.cos(aa), cy + rr * Math.sin(aa)].map(r1).join(' ');
    s += `<path class="hit" data-i="${i}" d="M${cx} ${cy}L${pt(a - half, R + 44)}L${pt(a, R + 52)}L${pt(a + half, R + 44)}Z"/>`;
  });
  dims.forEach((d, i) => {
    const a = ang(i, n), cos = Math.cos(a), sin = Math.sin(a);
    const [x, y] = [cx + (R + 22) * cos, cy + (R + 22) * sin];
    const anchor = Math.abs(cos) < .2 ? 'middle' : cos > 0 ? 'start' : 'end';
    const fs = compact() ? 26 : 14.5, dy = sin < -.8 ? -2 : sin > .8 ? fs + 1 : fs * .4;
    const aria = `${d.name}：` + series.map(({ c }) => `${c.name} ${f1(DS[d.id][c.id])} 分`).join('，') + '。按回车查看指标';
    s += `<g class="lab-g" data-i="${i}" tabindex="0" role="button" aria-label="${esc(aria)}"><text class="lab" x="${r1(x)}" y="${r1(y + dy)}" text-anchor="${anchor}">${esc(d.name)}</text></g>`;
  });
  return s + '</svg>';
}

// Small multiple: the same axes as the big radar, no labels, one polygon.
function mini(c, dims) {
  const R = 46, cx = 60, cy = 56, vals = dims.map(d => DS[d.id][c.id]);
  return `<svg class="mini" viewBox="0 0 120 112" aria-hidden="true">${[50, 100].map(v => `<path class="ring" d="${pathOf(dims.map(() => v), R, cx, cy)}"/>`).join('')}${dims.map((d, i) => { const [x, y] = at(i, dims.length, R, cx, cy); return `<line class="axis" x1="${cx}" y1="${cy}" x2="${r1(x)}" y2="${r1(y)}"/>`; }).join('')}<path class="poly" d="${pathOf(vals, R, cx, cy)}"/></svg>`;
}

// One tooltip, driven by whichever radar is hovered. Axis wedges are the hit targets, so the reader compares the countries on one dimension at a time.
const tip = $('#tip');
function tipFor(box, i) {
  const ctx = box._ctx; if (!ctx) return;
  const d = ctx.dims[i];
  const rows = ctx.series.map(({ c }) => ({ c, s: DS[d.id][c.id] })).sort((a, b) => b.s - a.s);
  const idl = ctx.ideal && ctx.ideal.imp[d.id] ? `<div class="r ideal"><i class="mk ideal" aria-hidden="true"></i><span>你的目标 · ${IMP[ctx.ideal.imp[d.id]]}</span><b>${ctx.ideal.tgt[d.id]}</b></div>` : '';
  tip.innerHTML = `<h4>${esc(d.name)}<small>点击看 ${d.ind.length} 项指标</small></h4>${rows.map(r => `<div class="r">${mk(r.c)}<span>${r.c.name} <small>第 ${rankDim(d.id, r.c.id)}/${N}</small></span><b>${f1(r.s)}</b></div>`).join('')}${idl}<p>${esc(d.q)}</p>`;
  const svg = box.querySelector('svg');
  svg.querySelectorAll('.axis').forEach(a => a.classList.toggle('on', +a.dataset.i === i));
  svg.querySelectorAll('.lab-g').forEach(a => a.classList.toggle('on', +a.dataset.i === i));
  const n = ctx.dims.length, a = ang(i, n), half = Math.PI / n, R = RG.R, cx = RG.cx, cy = RG.cy;
  const arc = [-1, -.5, 0, .5, 1].map(k => [cx + R * Math.cos(a + k * half), cy + R * Math.sin(a + k * half)].map(r1).join(' '));
  svg.querySelector('.hl').setAttribute('d', `M${cx} ${cy}L${arc.join('L')}Z`);
  tip.classList.add('on');
}
function placeTip(x, y) {
  const w = tip.offsetWidth, h = tip.offsetHeight, vw = innerWidth, vh = innerHeight;
  let l = x + 16, t = y + 16;
  if (l + w > vw - 8) l = x - w - 16;
  if (t + h > vh - 8) t = y - h - 16;
  tip.style.left = Math.max(8, l) + 'px'; tip.style.top = Math.max(8, t) + 'px';
}
function hideTip(box) {
  tip.classList.remove('on');
  if (!box) return;
  const svg = box.querySelector('svg'); if (!svg) return;
  svg.querySelectorAll('.axis.on,.lab-g.on').forEach(a => a.classList.remove('on'));
  svg.querySelector('.hl').setAttribute('d', '');
}
function wireRadar(box, ctx) {
  box._ctx = ctx;
  if (box._wired) return;
  box._wired = true;
  box.addEventListener('pointermove', e => {
    const t = e.target.closest('[data-i]');
    if (!t || t.tagName === 'line') return;
    const i = +t.dataset.i;
    if (box._i !== i) { box._i = i; tipFor(box, i); }
    placeTip(e.clientX, e.clientY);
  });
  box.addEventListener('pointerleave', () => { box._i = null; hideTip(box); });
  box.addEventListener('click', e => {
    const t = e.target.closest('[data-i]'); if (!t) return;
    openDim(box._ctx.dims[+t.dataset.i].id);
  });
  box.addEventListener('focusin', e => {
    const t = e.target.closest('.lab-g'); if (!t) return;
    const i = +t.dataset.i; box._i = i; tipFor(box, i);
    const r = t.getBoundingClientRect(); placeTip(r.right, r.bottom);
  });
  box.addEventListener('focusout', () => { box._i = null; hideTip(box); });
  box.addEventListener('keydown', e => {
    const t = e.target.closest('.lab-g');
    if (t && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); openDim(box._ctx.dims[+t.dataset.i].id); }
  });
}
// Hovering a compared country anywhere (chip, row, legend) brings its polygon forward on every radar.
document.addEventListener('pointerover', e => {
  const t = e.target.closest('[data-emph]');
  const id = t && slotOf(t.dataset.emph) >= 0 ? t.dataset.emph : null;
  $$('.radar').forEach(r => {
    if (id) r.setAttribute('data-emph', id); else r.removeAttribute('data-emph');
    r.querySelectorAll('.ser').forEach(g => g.classList.toggle('on', g.dataset.c === id));
  });
});

const legend = (series, withIdeal) => `<div class="legend" aria-hidden="true">${series.map(({ c }) => `<span data-emph="${c.id}">${mk(c)}${c.name}</span>`).join('')}${withIdeal ? '<span><i class="mk ideal"></i>你的理想</span>' : ''}</div>`;
const addSelect = (id, label) => {
  const free = S.cmp.includes(null);
  return `<select class="sel" id="${id}" aria-label="${label}" ${free ? '' : 'disabled'}><option value="">${free ? '＋ 加入对比' : '已满 4 国'}</option>${REGIONS.map(rg => `<optgroup label="${rg}">${C.filter(c => c.region === rg && slotOf(c.id) < 0).map(c => `<option value="${c.id}">${c.name}</option>`).join('')}</optgroup>`).join('')}</select>`;
};
const cmpChips = () => compared().map(({ c, k }) => `<button class="chip on-chip" data-uncmp="${c.id}" data-emph="${c.id}" aria-label="把${c.name}移出对比">${mk(c)}${c.name}${I.x}</button>`).join('');

// ---------- overview ----------
function profile(cid, dims = D) {
  const list = dims.map(d => ({ d, s: DS[d.id][cid], rank: rankDim(d.id, cid) })).sort((a, b) => b.s - a.s);
  return { best: list.slice(0, 3), worst: list.slice(-3).reverse(), min: list[list.length - 1], lead: [...list].sort((a, b) => a.rank - b.rank || b.s - a.s).slice(0, 3) };
}
// Each line names the indicator that best explains the strength (best-ranked) or weakness (worst-ranked) inside that dimension.
function why(x, cid, strong) {
  const inds = x.d.ind.filter(ind => ind.v[cid] != null).map(ind => { const r = rankInd(ind, cid), ties = C.filter(c => ind.v[c.id] === ind.v[cid]).length; return { ind, r, mid: r + (ties - 1) / 2 }; });
  const pick = inds.sort((a, b) => strong ? a.mid - b.mid : b.mid - a.mid)[0];
  return `<b>${x.d.name} ${f1(x.s)}</b>（第 ${x.rank}/${N}）：${esc(pick.ind.name)} ${valTxt(pick.ind, pick.ind.v[cid])}，第 ${pick.r}/${withData(pick.ind)}`;
}

function headline() {
  const all = C.map(c => ({ c, s: overall(c.id, D) })).sort((a, b) => b.s - a.s);
  const cnR = 1 + all.findIndex(x => x.c.id === 'cn'), cnS = all[cnR - 1].s, cn = profile('cn');
  const pick = ids => { const ds = ids.map(dimById); return C.map(c => ({ c, s: overall(c.id, ds) })).sort((a, b) => b.s - a.s); };
  return {
    h1: [`十项等权：${all[0].c.name} ${f1(all[0].s)} 分第一，`, `中国 ${f1(cnS)} 分排第 ${cnR}/${N}`],
    p: `前五依次是${all.slice(0, 5).map(x => `${x.c.name} ${f1(x.s)}`).join('、')}。中国的强项是${cn.lead.map(x => `${x.d.name}（第 ${x.rank}）`).join('、')}，短板是${cn.worst.map(x => `${x.d.name}（${f1(x.s)}，第 ${x.rank}）`).join('、')}。`,
    hard: pick(['safety', 'infra', 'econ']), soft: pick(['gov', 'env', 'life'])
  };
}

  const [A, B] = S.pair.map(byId);
  const diffs = D.map(d => ({ d, x: DS[d.id][A.id] - DS[d.id][B.id] })).sort((a, b) => Math.abs(b.x) - Math.abs(a.x));

function openDim(id) { S.dim = id; setView('dims'); }

// ---------- ideal life ----------
function applyAnswers() {
  const imp = Object.fromEntries(D.map(d => [d.id, 1])), tgt = Object.fromEntries(D.map(d => [d.id, 70]));
  const best = {};
  QS.forEach(q => {
    const k = S.ideal.answers[q.id]; if (k == null) return;
    Object.entries(q.opts[k].set).forEach(([dim, [w, t]]) => {
      if (best[dim] == null || w >= best[dim]) { best[dim] = w; imp[dim] = w; tgt[dim] = t; }
    });
  });
  Object.assign(S.ideal, { imp, tgt, preset: null, example: false });
}
function idealLead() {
  const r = ranked(), a = r[0], b = r[1];
  const name = S.ideal.preset ? PRESETS.find(p => p.id === S.ideal.preset).name : (Object.keys(S.ideal.answers).length ? `${Object.keys(S.ideal.answers).length} 道选择题生成` : '自定义');
  const hard = a.gaps.filter(g => g.hard);
  const tail = a.gaps.length ? `它离你的目标最远的是${a.gaps.slice(0, 2).map(g => `${g.d.name}（差 ${f1(g.g)}）`).join('、')}` : `它在你关心的每个维度都达到了目标`;
  const cnR = 1 + r.findIndex(x => x.c.id === 'cn');
  return `
    <div class="eyebrow">理想生活 · 当前设定：${esc(name)}${S.ideal.example ? ' · 示例' : ''}</div>
    <h1><span class="cl">按你的设定，最接近的是${a.c.name}，</span><span class="cl">匹配度 ${f1(a.fit)}</span></h1>
    <p>${a.c.name}领先第二名${b.c.name} ${f1(a.fit - b.fit)} 分；中国排第 ${cnR}/${N}（${f1(r[cnR - 1].fit)}）。${tail}${hard.length ? '，其中有你标为“必须”的硬伤' : ''}。${S.ideal.example ? '下面是“成家育儿”的示例设定，点任一选项就换成你自己的。' : ''}</p>`;
}

// ---------- method ----------
function renderMethod() {
  const gaps = D.flatMap(d => d.ind.flatMap(ind => C.filter(c => ind.v[c.id] == null).map(c => ({ d, ind, c }))));
  const limits = [
    ['维度和权重是一种选择', '换一组维度或权重，排名就会变（总览里有两个反例）。所以这里不给“最好的国家”，只给你在自己权重下的匹配度。'],
    ['国家均值掩盖内部差异', '上海和甘肃、旧金山和密西西比、悉尼和达尔文，差距可能大过国与国之间。目前只做国家层面。'],
    ['统计口径不完全可比', '杀人率年份不同（中国最新 2020）；医保覆盖率各国口径不同；Gallup 中国样本为网络问卷；阿联酋近九成人口是外籍劳工，很多人均指标反映的是这一人口结构。'],
    ['调查型指数带主观成分', '清廉指数、自由之家、WJP、Gallup、幸福报告都依赖问卷或专家打分，评估机构的立场会影响结果，尤其是对中国、新加坡、阿联酋等非西方体制国家。'],
    ['众包数据样本偏差', 'Numbeo 购买力和房价收入比来自用户提交，偏向大城市和外籍人士；Ookla 网速来自用户自测。'],
    ['以“本国居民”为视角', '没有计入签证难度、语言、华人社区、种族歧视、税负、汇率等移居者特有的因素。'],
    ['部分数据较旧或缺失', `社会流动性指数只有 2020 年一版；LPI 为 2023 年版；共 ${gaps.length} 个国家-指标组合没有数据，所在维度按其余指标平均。`]
  ];
  $('#v-method').innerHTML = `
    <div class="lead"><div class="eyebrow">方法与来源</div><h1>每个分数怎么来的</h1><p>原始数据 → 按全球区间换算成 0–100 → 维度内等权平均 → 维度间等权（或按你的理想权重）。所有原始值、区间和来源都列在下面，可以逐项核对。</p></div>
    <div class="prose">
      <p><b>1. 指标换算。</b>每个指标设一个“0 分”和“100 分”的区间端点，端点取全球大致的底部和前沿水平，所以 100 分不是“这 ${N} 国里最高”，而是接近世界前沿。超出区间按 0 或 100 截断。收入、网速、杀人率、房价收入比、大学排名这类跨数量级的指标用对数刻度。</p>
      <div class="formula">线性：分数 = 100 ×（值 − 0 分端点）÷（100 分端点 − 0 分端点）　　对数：分数 = 100 ×（ln 值 − ln 0 分端点）÷（ln 100 分端点 − ln 0 分端点）</div>
      <p><b>2. 维度分。</b>维度内各指标等权平均；某国缺某项数据时，按其余指标平均，并在表里标 *。<b>3. 综合分。</b>所选维度等权平均。</p>
      <p><b>4. 理想匹配度。</b>你为每个维度设重要程度 w（不在乎 0 · 一般 1 · 重要 2 · 必须 3）和目标分 t。缺口 = max(0, t − 国家得分)。</p>
      <div class="formula">匹配度 = 100 ×（1 − √( Σ w·缺口² ÷ Σ w·t² )）</div>
      <p>超过目标不加分，避免某一项特别强掩盖你在意的短板；缺口平方让一个大缺口比多个小缺口扣分更多。</p>
    </div>
    <div class="tbl-wrap">
      <table class="gp-tbl">
        <caption class="eyebrow" style="text-align:left;padding:12px 12px 0">为什么是这 ${N} 个国家</caption>
        <thead><tr><th>地区</th><th>国家</th><th>入选理由</th></tr></thead>
        <tbody>${C.map((c, i) => `<tr><td>${i && C[i - 1].region === c.region ? '' : `<b>${c.region}</b>`}</td><td>${c.name} <span style="color:var(--faint)">${c.en}</span></td><td>${esc(c.why)}</td></tr>`).join('')}</tbody>
      </table>
    </div>
    <div class="tbl-wrap">
      <table class="gp-tbl">
        <caption class="eyebrow" style="text-align:left;padding:12px 12px 0">全部 ${D.reduce((s, d) => s + d.ind.length, 0)} 项指标的区间与来源</caption>
        <thead><tr><th>维度</th><th>指标</th><th>单位</th><th class="n">0 分</th><th class="n">100 分</th><th>刻度</th><th>年份</th><th>覆盖</th><th>来源</th></tr></thead>
        <tbody>${D.map(d => d.ind.map((ind, k) => `<tr><td>${k ? '' : `<b>${d.name}</b>`}</td><td>${esc(ind.name)}</td><td>${esc(ind.unit)}</td><td class="n">${fmtV(ind, ind.w)}</td><td class="n">${fmtV(ind, ind.b)}</td><td>${ind.log ? '对数' : '线性'}</td><td>${esc(ind.yr)}${ind.yx ? `（${Object.entries(ind.yx).map(([cid, y]) => `${byId(cid).name} ${y}`).join('、')}）` : ''}</td><td class="n">${withData(ind)}/${N}</td><td><a href="${SRC[ind.src][1]}" target="_blank" rel="noopener">${esc(SRC[ind.src][0])}</a></td></tr>`).join('')).join('')}</tbody>
      </table>
    </div>
    <div class="panel"><h3>局限<small>读结论前先读这里</small></h3><ul class="limits" style="margin-top:10px">${limits.map(([b, t]) => `<li><span><b>${b}。</b>${t}</span></li>`).join('')}</ul>
      ${gaps.length ? `<p style="margin:12px 0 0;font-size:13px;color:var(--muted)">缺失数据：${gaps.map(g => `${g.c.name} · ${esc(g.ind.name)}`).join('；')}。</p>` : ''}</div>`;
}

// ---------- views ----------
function setView(v) {
  if (!VIEWS.includes(v)) v = 'overview';
  S.view = v;
  $$('#nav button').forEach(b => b.setAttribute('aria-selected', b.dataset.v === v));
  VIEWS.forEach(x => { $('#v-' + x).hidden = x !== v; });
  hideTip();
  rerender();
  $('#main').scrollTop = 0;
  try { history.replaceState(null, '', '#' + v); } catch { }
}
function rerender() {
  ({ overview: renderOverview, dims: renderDims, ideal: renderIdeal, method: renderMethod })[S.view]();
}

// ---------- events ----------
document.addEventListener('click', e => {
  const t = e.target.closest('button,a');
  if (!t || t.disabled) return;
  const ds = t.dataset;
  if (ds.v) return setView(ds.v);
  if (ds.go) { e.preventDefault(); return setView(ds.go); }
  if (ds.cmp) return toggleCmp(ds.cmp);
  if (ds.uncmp) return toggleCmp(ds.uncmp);
  if (t.id === 'tg-ideal') { S.showIdeal = !S.showIdeal; lsSet('showIdeal', S.showIdeal); return renderOverview(); }
  if (ds.dim) {
    const has = S.dims.includes(ds.dim);
    if (has && S.dims.length <= 3) return toast('至少保留 3 个维度');
    S.dims = has ? S.dims.filter(x => x !== ds.dim) : D.map(d => d.id).filter(id => S.dims.includes(id) || id === ds.dim);
    lsSet('dims', S.dims); return renderOverview();
  }
  if (t.id === 'dims-all') { S.dims = D.map(d => d.id); lsSet('dims', S.dims); return renderOverview(); }
  if (ds.sort) { S.sort = ds.sort; return renderOverview(); }
  if (ds.pick) { S.dim = ds.pick; return renderDims(); }
  if (ds.preset) {
    const p = PRESETS.find(x => x.id === ds.preset);
    S.ideal = { preset: p.id, answers: {}, example: false, imp: Object.fromEntries(D.map(d => [d.id, p.set[d.id][0]])), tgt: Object.fromEntries(D.map(d => [d.id, p.set[d.id][1]])) };
    saveIdeal(); return renderIdeal();
  }
  if (ds.q) {
    S.ideal.answers = { ...S.ideal.answers, [ds.q]: +ds.k };
    applyAnswers(); saveIdeal(); return renderIdeal();
  }
  if (t.id === 'q-reset') { S.ideal.answers = {}; applyAnswers(); saveIdeal(); return renderIdeal(); }
  if (ds.imp) {
    S.ideal.imp[ds.imp] = +ds.w; touched();
    const row = $(`tr[data-row="${ds.imp}"]`);
    row.classList.toggle('mute', !+ds.w);
    row.querySelectorAll('[data-imp]').forEach(b => b.setAttribute('aria-checked', b.dataset.w === ds.w));
    $$('[data-preset]').forEach(b => b.setAttribute('aria-checked', 'false'));
    return refreshIdealOut();
  }
});
document.addEventListener('change', e => {
  const t = e.target;
  if ((t.id === 'add-ov' || t.id === 'add-idl') && t.value) return toggleCmp(t.value);
  if (t.dataset.pairsel != null) { S.pair[+t.dataset.pairsel] = t.value; lsSet('pair', S.pair); return renderOverview(); }
});
document.addEventListener('input', e => {
  const t = e.target; if (!t.dataset.tgt) return;
