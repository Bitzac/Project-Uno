<title>破土 Groundbreak</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;700;900&display=swap">
<style>/* Layout: one liquid-glass window over a soft aurora; top bar (brand · views · identity), one scrolling view, a detail sheet from the right. Hairline rules, heavy type. */
:root{--bg:#ECF2EF;--blob1:#8FE0C0;--blob2:#A9CBFF;--blob3:#FFD9A0;--blob4:#CDBDFF;--ink:#0B1714;--muted:#4C5E58;--faint:#7D8D87;--glass-a:rgba(255,255,255,.6);--glass-b:rgba(255,255,255,.28);--glass-edge:rgba(255,255,255,.9);--glass-inner:rgba(255,255,255,.96);--shadow:rgba(22,70,56,.18);--line:rgba(11,23,20,.16);--line-soft:rgba(11,23,20,.08);--field:rgba(255,255,255,.5);--accent:#0A8F63;--accent-ink:#FFFFFF;--accent-soft:rgba(10,143,99,.12);--track:rgba(10,143,99,.15);--warn:#B86E00;--warn-soft:rgba(230,150,20,.16);--bad:#CF3F35;--bad-soft:rgba(214,69,58,.12);--inv:#4A55D6;--inv-soft:rgba(74,85,214,.1);--scrim:rgba(20,40,34,.22);--sheet:rgba(246,250,248,.9);--hair:1px;--f-display:"Outfit","Noto Sans SC",system-ui,sans-serif;--f-body:"Noto Sans SC","Outfit",system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#06110E;--blob1:#0F5E46;--blob2:#1A3F7A;--blob3:#5E4012;--blob4:#3A2D7A;--ink:#E8F3EE;--muted:#A0B3AC;--faint:#71857E;--glass-a:rgba(24,40,36,.62);--glass-b:rgba(12,24,21,.4);--glass-edge:rgba(255,255,255,.16);--glass-inner:rgba(255,255,255,.2);--shadow:rgba(0,0,0,.5);--line:rgba(255,255,255,.15);--line-soft:rgba(255,255,255,.07);--field:rgba(255,255,255,.05);--accent:#34D39E;--accent-ink:#04261A;--accent-soft:rgba(52,211,158,.14);--track:rgba(52,211,158,.17);--warn:#F2B13D;--warn-soft:rgba(242,177,61,.16);--bad:#FF7468;--bad-soft:rgba(255,116,104,.16);--inv:#959DFF;--inv-soft:rgba(149,157,255,.14);--scrim:rgba(0,0,0,.45);--sheet:rgba(12,24,21,.92);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#06110E;--blob1:#0F5E46;--blob2:#1A3F7A;--blob3:#5E4012;--blob4:#3A2D7A;--ink:#E8F3EE;--muted:#A0B3AC;--faint:#71857E;--glass-a:rgba(24,40,36,.62);--glass-b:rgba(12,24,21,.4);--glass-edge:rgba(255,255,255,.16);--glass-inner:rgba(255,255,255,.2);--shadow:rgba(0,0,0,.5);--line:rgba(255,255,255,.15);--line-soft:rgba(255,255,255,.07);--field:rgba(255,255,255,.05);--accent:#34D39E;--accent-ink:#04261A;--accent-soft:rgba(52,211,158,.14);--track:rgba(52,211,158,.17);--warn:#F2B13D;--warn-soft:rgba(242,177,61,.16);--bad:#FF7468;--bad-soft:rgba(255,116,104,.16);--inv:#959DFF;--inv-soft:rgba(149,157,255,.14);--scrim:rgba(0,0,0,.45);--sheet:rgba(12,24,21,.92);color-scheme:dark}
@media (min-resolution:2dppx){:root{--hair:.5px}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;padding-inline:16px;padding-block:16px;overflow:hidden;position:relative}
.num{font-family:var(--f-display);font-variant-numeric:tabular-nums}
.latin{font-family:var(--f-display)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,h4{text-wrap:balance;margin:0}

/* aurora + glass */
.aurora{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.aurora i{position:absolute;border-radius:50%;filter:blur(80px);opacity:.7}
.aurora i:nth-child(1){width:44vw;height:44vw;left:-12vw;top:-14vw;background:var(--blob1)}
.aurora i:nth-child(2){width:36vw;height:36vw;right:-8vw;top:-10vw;background:var(--blob2)}
.aurora i:nth-child(3){width:38vw;height:38vw;left:26vw;bottom:-24vw;background:var(--blob3)}
.aurora i:nth-child(4){width:28vw;height:28vw;right:2vw;bottom:-12vw;background:var(--blob4)}
.glass{background:linear-gradient(145deg,var(--glass-a),var(--glass-b));-webkit-backdrop-filter:blur(28px) saturate(170%);backdrop-filter:blur(28px) saturate(170%);border:var(--hair) solid var(--glass-edge);box-shadow:inset 0 1px 0 var(--glass-inner),0 24px 60px -24px var(--shadow)}
.window{position:relative;z-index:1;height:100%;display:grid;grid-template-rows:auto minmax(0,1fr);border-radius:28px;overflow:hidden}

/* top bar */
.top{display:flex;align-items:center;gap:18px;padding:14px 22px;border-bottom:var(--hair) solid var(--line);flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto}
.brand b{font:900 26px/1 var(--f-body);letter-spacing:.02em}
.brand span{font:600 11px var(--f-display);letter-spacing:.28em;color:var(--muted);text-transform:uppercase}
.seg{display:inline-flex;padding:3px;border-radius:14px;border:var(--hair) solid var(--line);background:var(--field);gap:2px}
.seg button{border:0;background:none;padding:7px 14px;border-radius:11px;font-size:14.5px;font-weight:500;color:var(--muted);cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.seg button[aria-selected="true"],.seg button[aria-pressed="true"]{background:var(--glass-a);color:var(--ink);font-weight:700;box-shadow:inset 0 1px 0 var(--glass-inner),0 4px 14px -6px var(--shadow)}
.seg .n{font:500 12px var(--f-display);color:var(--faint)}
.who{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.who .seg button{padding:6px 11px;font-size:13.5px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--faint);display:inline-block}
.dot.on{background:var(--inv)}

/* views */
.main{overflow-y:auto;overflow-x:hidden;min-height:0}
.view{padding:22px 22px 40px;display:grid;gap:18px}
.vhead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.vhead h1{font:900 30px/1.15 var(--f-body);letter-spacing:.01em}
.vhead p{margin:4px 0 0;color:var(--muted);font-size:14.5px;max-width:62ch}
.eyebrow{font:600 11.5px var(--f-display);letter-spacing:.2em;text-transform:uppercase;color:var(--faint)}
.cols{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:18px;align-items:start}
.panel{border-radius:22px;border:var(--hair) solid var(--line);background:var(--field);padding:16px 18px;min-width:0}
.panel h3{font:800 16px var(--f-body);display:flex;align-items:center;gap:8px;justify-content:space-between}
.panel h3 small{font:500 12.5px var(--f-body);color:var(--faint)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:var(--hair) solid var(--line);background:none;border-radius:999px;padding:4px 12px;font-size:13.5px;color:var(--muted);cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{border-color:var(--ink);color:var(--ink);font-weight:700}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;color:var(--muted);border:var(--hair) solid var(--line);border-radius:999px;padding:1px 9px;white-space:nowrap;line-height:1.6}
.tag.ok{color:var(--accent);border-color:currentColor}
.tag.warn{color:var(--warn);border-color:currentColor}
.tag.inv{color:var(--inv);border-color:currentColor}
.tag.solid{background:var(--accent-soft);border-color:transparent;color:var(--ink)}
.tag i{width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.btn{border:0;border-radius:13px;padding:9px 16px;font-size:14.5px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:7px;white-space:nowrap}
.btn.pri{background:var(--accent);color:var(--accent-ink)}
.btn.inv{background:var(--inv);color:#fff}
.btn.ghost{background:none;border:var(--hair) solid var(--line);color:var(--ink);font-weight:500}
.btn.sm{padding:6px 12px;font-size:13px;border-radius:11px}
.btn:disabled{opacity:.45;cursor:default}

/* logo */
.logo{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font:900 21px var(--f-body);color:#fff;flex:none;background:linear-gradient(140deg,hsl(var(--h) 62% 58%),hsl(calc(var(--h) + 38) 58% 42%));box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 8px 18px -10px hsl(var(--h) 60% 35%)}
.logo.lg{width:64px;height:64px;border-radius:18px;font-size:28px}

/* launch list */
.board{display:grid}
.row{display:grid;grid-template-columns:30px 48px minmax(0,1fr) 66px;gap:14px;align-items:center;padding:14px 6px;border-bottom:var(--hair) solid var(--line-soft);cursor:pointer;border-radius:14px;transition:background .15s}
.row:last-child{border-bottom:0}
.row:hover{background:var(--field)}
.rank{font:800 18px var(--f-display);color:var(--faint);text-align:center}
.row:nth-child(-n+3) .rank{color:var(--ink)}
.row .nm{font:800 16.5px/1.3 var(--f-body)}
.row .nm small{font:400 14.5px var(--f-body);color:var(--muted)}
.row .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;align-items:center}
.vote{width:62px;height:62px;border-radius:16px;border:var(--hair) solid var(--line);background:var(--glass-a);display:grid;place-items:center;align-content:center;gap:0;cursor:pointer;line-height:1.1}
.vote svg{width:16px;height:16px}
.vote b{font:800 15px var(--f-display)}
.vote small{font:500 10.5px var(--f-display);color:var(--faint)}
.vote[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.vote[aria-pressed="true"] small{color:inherit;opacity:.75}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{border-top:var(--hair) solid var(--line);padding-top:8px}
.stat b{display:block;font:800 26px/1.1 var(--f-display)}
.stat span{font-size:12.5px;color:var(--muted)}
.rules{display:grid;gap:10px;margin-top:4px}
.rule{display:grid;grid-template-columns:18px minmax(0,1fr);gap:8px;font-size:13.5px;color:var(--muted);line-height:1.6}
.rule svg{width:16px;height:16px;margin-top:3px;stroke:var(--accent)}
.rule b{color:var(--ink);font-weight:700}

/* back grid */
.strip{display:flex;gap:8px;flex-wrap:wrap}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.card{border-radius:22px;border:var(--hair) solid var(--line);background:var(--field);overflow:hidden;cursor:pointer;display:flex;flex-direction:column;text-align:left;padding:0;transition:transform .2s,box-shadow .2s}
.card:hover{transform:translateY(-2px);box-shadow:0 18px 40px -24px var(--shadow)}
.cover{position:relative;aspect-ratio:16/8;max-width:100%;display:grid;place-items:center;background:radial-gradient(120% 90% at 20% 10%,hsl(var(--h) 70% 72% / .9),transparent 60%),linear-gradient(150deg,hsl(var(--h) 55% 52%),hsl(calc(var(--h) + 50) 50% 30%));color:#fff;overflow:hidden}
.cover em{font:900 64px/1 var(--f-body);font-style:normal;opacity:.92;text-shadow:0 6px 24px rgba(0,0,0,.18)}
.cover .k{position:absolute;left:12px;top:12px;font-size:12px;font-weight:700;padding:2px 10px;border-radius:999px;background:rgba(255,255,255,.22);border:var(--hair) solid rgba(255,255,255,.5);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.cover .d{position:absolute;right:12px;top:12px;font:700 12px var(--f-display);padding:2px 10px;border-radius:999px;background:rgba(0,0,0,.22)}
.cbody{padding:14px 16px 16px;display:grid;gap:8px}
.cbody h4{font:800 16px var(--f-body)}
.cbody p{margin:0;font-size:13.5px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.9em}
.meter{height:6px;border-radius:3px;background:var(--track);overflow:hidden}
.meter i{display:block;height:100%;border-radius:3px;background:var(--accent)}
.meter.warn i{background:var(--warn)}
.meter.inv{background:var(--inv-soft)}.meter.inv i{background:var(--inv)}
.kv{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--muted);align-items:baseline}
.kv b{font:800 17px var(--f-display);color:var(--ink)}
.pct{font:800 14px var(--f-display)}
.pct.ok{color:var(--accent)}.pct.warn{color:var(--warn)}

/* investor */
.gate{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:18px}
.gate h2{font:900 26px/1.25 var(--f-body)}
.gate p{color:var(--muted);margin:8px 0 0;font-size:14.5px}
.steps{display:grid;gap:0;counter-reset:s}
.step{display:grid;grid-template-columns:30px minmax(0,1fr);gap:12px;padding:12px 0;border-bottom:var(--hair) solid var(--line-soft)}
.step:last-child{border-bottom:0}
.step i{width:26px;height:26px;border-radius:50%;border:var(--hair) solid var(--line);display:grid;place-items:center;font:700 13px var(--f-display);font-style:normal}
.step.done i{background:var(--inv);color:#fff;border-color:var(--inv)}
.step b{font-weight:700;display:block}
.step span{font-size:13px;color:var(--muted)}
.banner{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px;border-radius:16px;border:var(--hair) solid var(--inv);background:var(--inv-soft);font-size:13.5px}
.banner b{color:var(--inv)}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.filters label{font-size:13px;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.filters select{border:var(--hair) solid var(--line);background:var(--field);border-radius:10px;padding:5px 8px;font-size:13.5px}
.filters input[type=range]{accent-color:var(--inv);width:120px}
.pipe{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.pipe b{font:800 20px var(--f-display);color:var(--ink);margin-right:4px}
.tbl-wrap{overflow-x:auto;border-radius:20px;border:var(--hair) solid var(--line);background:var(--field)}
table{border-collapse:collapse;width:100%;min-width:860px;font-size:13.5px}
th{font:600 11.5px var(--f-display);letter-spacing:.12em;text-transform:uppercase;color:var(--faint);text-align:left;padding:12px 12px 8px;border-bottom:var(--hair) solid var(--line);white-space:nowrap}
td{padding:11px 12px;border-bottom:var(--hair) solid var(--line-soft);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--field)}
td .nm{display:flex;align-items:center;gap:10px;font-weight:800}
td .nm .logo{width:34px;height:34px;border-radius:10px;font-size:15px}
td .sub{font-size:12px;color:var(--muted);font-weight:400}
.score{display:flex;align-items:center;gap:8px}
.score b{font:800 20px var(--f-display);min-width:28px}
.spark{width:84px;height:28px;display:block;overflow:visible}
.spark path{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.spark .up{stroke:var(--accent)}.spark .dn{stroke:var(--warn)}
.spark .area.up{fill:var(--accent);opacity:.1;stroke:none}.spark .area.dn{fill:var(--warn);opacity:.1;stroke:none}
.spark circle{stroke:var(--bg);stroke-width:2}
.spark circle.up{fill:var(--accent)}.spark circle.dn{fill:var(--warn)}
.star{border:var(--hair) solid var(--line);background:none;border-radius:10px;padding:4px 10px;font-size:12.5px;cursor:pointer;white-space:nowrap}
.star[aria-pressed="true"]{background:var(--inv);border-color:var(--inv);color:#fff;font-weight:700}

/* founder */
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.prog{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;margin-top:12px}
.prog div{padding:10px 10px 0 0;border-top:2px solid var(--line);font-size:13px;color:var(--muted)}
.prog div.done{border-color:var(--accent)}
.prog div.now{border-color:var(--accent);border-top-style:solid;background:linear-gradient(180deg,var(--accent-soft),transparent 70%)}
.prog b{display:block;color:var(--ink);font-weight:800;font-size:14px}
.parts{display:grid;gap:12px;margin-top:10px}
.part{display:grid;grid-template-columns:88px minmax(0,1fr) 34px;gap:10px;align-items:center;font-size:13.5px}
.part span{color:var(--muted)}
.part b{font:800 15px var(--f-display);text-align:right}
.part small{grid-column:2/-1;font-size:12px;color:var(--faint);margin-top:-6px}
.funnel{display:grid;gap:9px;margin-top:10px}
.fbar{display:grid;grid-template-columns:96px minmax(0,1fr);gap:10px;align-items:center;font-size:13px;position:relative}
.fbar span{color:var(--muted)}
.fbar .tr{position:relative;height:24px}
.fbar .tr i{position:absolute;left:0;top:0;bottom:0;border-radius:0 4px 4px 0;background:var(--accent);min-width:3px}
.fbar.inv .tr i{background:var(--inv)}
.fbar .tr em{position:absolute;top:50%;transform:translateY(-50%);font:700 13px var(--f-display);font-style:normal;white-space:nowrap;color:var(--ink)}
.fbar .tr em small{font-weight:500;color:var(--muted);margin-left:6px}
.check{display:grid;gap:8px;margin-top:10px}
.check div{display:grid;grid-template-columns:20px minmax(0,1fr);gap:8px;font-size:13.5px;line-height:1.55}
.check svg{width:16px;height:16px;margin-top:3px}
.check .y svg{stroke:var(--accent)}.check .n svg{stroke:var(--warn)}
.check small{display:block;color:var(--faint);font-size:12px}

/* sheet */
.scrim{position:fixed;inset:0;z-index:20;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;z-index:21;top:16px;right:16px;bottom:16px;width:min(540px,calc(100% - 32px));border-radius:26px;overflow-y:auto;transform:translateX(110%);transition:transform .32s cubic-bezier(.2,.8,.2,1);padding:22px 22px 30px;display:grid;gap:16px;align-content:start}
.sheet.on{transform:none}
.sheet.glass{background:linear-gradient(145deg,var(--sheet),var(--sheet))}
.sheet .hd{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:14px;align-items:center}
.sheet .hd h2{font:900 24px/1.2 var(--f-body)}
.sheet .hd p{margin:2px 0 0;color:var(--muted);font-size:14px}
.x{width:34px;height:34px;border-radius:50%;border:var(--hair) solid var(--line);background:var(--glass-a);cursor:pointer;display:grid;place-items:center;align-self:start}
.x svg{width:14px;height:14px}
.sec{display:grid;gap:10px;padding-top:14px;border-top:var(--hair) solid var(--line)}
.sec h3{font:800 15px var(--f-body);display:flex;justify-content:space-between;align-items:center;gap:8px}
.sec p{margin:0;font-size:14px;color:var(--muted)}
.big3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.big3 div{font-size:12px;color:var(--muted)}
.big3 b{display:block;font:800 22px/1.15 var(--f-display);color:var(--ink)}
.tier{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:12px 14px;border-radius:16px;border:var(--hair) solid var(--line)}
.tier b{font-weight:800}
.tier b .num{font-size:17px;margin-left:6px}
.tier span{font-size:12.5px;color:var(--muted);grid-column:1}
.tier .btn{grid-row:1/3;grid-column:2}
.confirm{display:grid;gap:8px;padding:12px 14px;border-radius:16px;border:var(--hair) solid var(--accent);background:var(--accent-soft);font-size:13.5px}
.confirm .acts{display:flex;gap:8px}
.lock{display:grid;gap:8px;padding:16px;border-radius:18px;border:var(--hair) dashed var(--inv);background:var(--inv-soft);font-size:13.5px;color:var(--muted)}
.lock b{color:var(--inv)}
.deal{display:grid;gap:10px;padding:16px;border-radius:18px;border:var(--hair) solid var(--inv);background:var(--inv-soft)}
.deal .kvs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 16px}
.deal .kvs div{font-size:12px;color:var(--muted)}
.deal .kvs b{display:block;font:800 16px var(--f-body);color:var(--ink)}
.deal .acts{display:flex;gap:8px;flex-wrap:wrap}
.room{display:flex;gap:6px;flex-wrap:wrap}
.team{display:grid;gap:8px}
.team div{display:flex;gap:10px;align-items:baseline;font-size:13.5px}
.team b{font-weight:800;min-width:3.5em}
.team span{color:var(--muted)}
.tl{display:grid;gap:0}

const logo = (p, cls = '') => `<span class="logo ${cls}" style="--h:${p.h}" aria-hidden="true">${esc(p.name[0])}</span>`;

function backTag(p) {
  const b = p.back;
  if (b.status === 'soon') return `<span class="tag inv"><i></i>${mdShort(b.start)}开始 · ${n0(b.notify)} 人预约</span>`;
  const pc = Math.round(pctOf(p) * 100);
  if (b.status === 'done') return `<span class="tag ok"><i></i>${esc(b.kind)}已达成 ${pc}%</span>`;
  return `<span class="tag ${pc >= 100 ? 'ok' : 'warn'}"><i></i>${esc(b.kind)} ${pc}%</span>`;
}

function spark(arr) {
  const w = 84, h = 28, lo = 45, hi = 90, pad = 4;
  const x = i => arr.length === 1 ? w / 2 : pad + i * (w - pad * 2) / (arr.length - 1);
  const y = v => h - pad - (Math.min(hi, Math.max(lo, v)) - lo) / (hi - lo) * (h - pad * 2);
  const c = rising({ trend: arr }) ? 'up' : 'dn';
  const line = arr.map((v, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)} ${y(v).toFixed(1)}`).join('');
  const area = `${line}L${x(arr.length - 1).toFixed(1)} ${h}L${x(0).toFixed(1)} ${h}Z`;
  const last = arr.length - 1;
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" role="img" aria-label="近 ${arr.length} 周信号分 ${arr.join('、')}"><path class="area ${c}" d="${area}"/><path class="${c}" d="${line}"/><circle class="${c}" cx="${x(last).toFixed(1)}" cy="${y(arr[last]).toFixed(1)}" r="4"/></svg>`;
}

}

      <thead><tr><th>项目</th><th>信号分 · 8 周</th><th>需求验证</th><th>经营</th><th>本轮</th><th>股东人数</th><th></th></tr></thead>
      <tbody>${rows.map(p => {
        const b = p.back, pc = Math.round(pctOf(p) * 100), w = S.watch[p.id];
        const dem = b.status === 'soon' ? `${n0(b.notify)} 人预约` : `${pc}% · ${b.unit ? b.n + ' ' + b.unit : n0(b.n) + ' 人'}`;
        return `<tr data-open="${p.id}" tabindex="0">
          <td><div class="nm">${logo(p)}<div>${esc(p.name)}<div class="sub">${esc(p.ind)} · ${esc(p.city)}</div></div></div></td>
          <td><div class="score"><b>${p.score}</b>${spark(p.trend)}</div></td>
          <td>${dem}<div class="sub">${esc(b.kind)}</div></td>
          <td>${esc(p.ops)}</td>
          <td><b>${esc(p.deal.round)}</b> ${esc(p.deal.amt)}<div class="sub">${esc(p.deal.share)}</div></td>
          <td class="num">${p.deal.holders} / ${p.deal.cap}</td>
          <td><button class="star" data-watch="${p.id}" aria-pressed="${!!w}">${w === 'talk' ? '已约谈' : w ? '已关注' : '关注'}</button></td></tr>`;
      }).join('') || '<tr><td colspan="7" class="empty">没有符合筛选条件的项目</td></tr>'}</tbody></table></div>
    <button class="btn ghost sm" id="leaveBtn" style="justify-self:start">退出投资人身份</button>`;
}

// ---------- founder ----------
function renderFound() {
  const p = byId(FOUNDER.id), b = p.back;
  const fun = (arr, cls) => {
    const max = arr[0][1];
    return `<div class="funnel">${arr.map(([k, v], i) => {
      const w = Math.max(.5, v / max * 100), conv = i ? ` <small>${(v / arr[i - 1][1] * 100).toFixed(1)}%</small>` : '';
      const pos = w > 62 ? `right:8px;color:${cls ? '#fff' : 'var(--accent-ink)'}` : `left:calc(${w}% + 8px)`;
      return `<div class="fbar ${cls}" title="${esc(k)}：${n0(v)}${i ? '，上一步转化 ' + (v / arr[i - 1][1] * 100).toFixed(1) + '%' : ''}"><span>${esc(k)}</span>
        <div class="tr"><i style="width:${w}%"></i><em style="${pos}">${n0(v)}${w > 62 ? '' : conv}</em></div></div>`;
    }).join('')}</div>`;
  };
  $('#v-found').innerHTML = `
    <div class="vhead"><div><div class="eyebrow">示例：拾光 LumiNest 的后台</div><h1>创业者后台</h1>
      <p>一个项目从首发到见投资人的全过程：首发拿曝光，众筹验证需求，信号分达到 60 后自动推送给匹配的认证投资人。</p></div>
      <button class="btn pri" data-open="lumi">查看公开页面</button></div>
    <div class="panel"><h3>进度 <small>${esc(p.name)} · ${esc(p.city)}</small></h3>
      <div class="prog">
        <div class="done"><b>建档与实名</b>9月2日完成</div>
        <div class="done"><b>首发日</b>9月10日 · 加权票 ${n0(p.launch.w)} · 当日第 1</div>
        <div class="now"><b>众筹 ${Math.round(pctOf(p) * 100)}%</b>${yuan(b.raised)} · 剩 ${b.left} 天</div>
        <div class="done"><b>投资人对接</b>信号分 ${p.score}，已解锁</div>
      </div></div>
    <div class="grid2">
      <div class="panel"><h3>信号分 <span class="num" style="font-size:30px;font-weight:800">${p.score}</span></h3>
        <p style="margin:2px 0 0;font-size:12.5px;color:var(--faint)">加权求和，每项 0–100。下面是每项的数据来源和改进建议。</p>
        ${partsHTML(p, Object.fromEntries(Object.keys(W).map(k => [k, FOUNDER.tips[k] || PART_SRC[k]])))}
      </div>
      <div class="panel"><h3>公众漏斗 <small>首发至今</small></h3>${fun(FOUNDER.pub, '')}
        <h3 style="margin-top:20px">投资人漏斗 <small>信号分达标后</small></h3>${fun(FOUNDER.inv, 'inv')}
        <p style="margin:10px 0 0;font-size:12.5px;color:var(--faint)">百分比是相对上一步的转化率。</p></div>
    </div>
    <div class="panel"><h3>合规自检 <small>${FOUNDER.checks.filter(c => c[0]).length} / ${FOUNDER.checks.length} 已通过</small></h3>
      <div class="check">${FOUNDER.checks.map(([ok, t, s]) => `<div class="${ok ? 'y' : 'n'}">${ok ? I.ok : I.warn}<div>${esc(t)}<small>${esc(s)}</small></div></div>`).join('')}</div></div>`;
}

// ---------- detail sheet ----------
function renderSheet() {
  const p = byId(S.open); if (!p) return;
  const b = p.back, pc = pctOf(p), inv = S.role === 'investor';
  let money;
  if (b.status === 'soon') money = `<div class="big3"><div><b>${n0(b.notify)}</b>人预约</div><div><b>${yuan(b.goal)}</b>目标</div><div><b>${mdShort(b.start)}</b>开始</div></div>
      <button class="btn ${S.notify[p.id] ? 'ghost' : 'pri'}" data-notify="${p.id}">${S.notify[p.id] ? '已设置开售提醒' : '开售时提醒我'}</button>`;
  else money = `<div class="big3"><div><b>${yuan(b.raised)}</b>已筹 · 目标 ${yuan(b.goal)}</div><div><b class="${pc >= 1 ? 'pct ok' : 'pct warn'}" style="font-size:22px">${Math.round(pc * 100)}%</b>达成率</div><div><b>${b.unit ? b.n + ' ' + b.unit : n0(b.n)}</b>${b.status === 'done' ? '已结束' : `支持 · 剩 ${b.left} 天`}</div></div>
      <div class="meter ${pc < 1 ? 'warn' : ''}"><i style="width:${Math.min(100, pc * 100)}%"></i></div>`;
  const tiers = b.tiers.map((t, i) => `<div class="tier"><b>${esc(t.t)}<span class="num">${yuan(t.p)}</span></b><span>${esc(t.s)}</span>
      <button class="btn sm ${b.status === 'live' && !/剩 0|已满|已结束/.test(t.s) ? 'pri' : 'ghost'}" data-pick="${i}" ${b.status === 'live' && !/剩 0|已满|已结束/.test(t.s) ? '' : 'disabled'}>${b.kind === '付费试点' ? '申请试点' : '支持'}</button></div>
      ${S.pick === i ? `<div class="confirm"><div>确认${b.kind === '付费试点' ? '申请' : '支持'}「${esc(t.t)}」${yuan(t.p)}？款项由持牌支付机构存管，${esc(p.name)}未在截止日前达成目标将原路退回。</div>
        <div class="acts"><button class="btn pri sm" data-pay="${i}">确认（演示）</button><button class="btn ghost sm" data-pick="-1">取消</button></div></div>` : ''}`).join('');
  let deal;
  if (!inv) deal = `<div class="lock"><b>融资信息仅对认证投资人可见</b><span>按证券法第九条，非公开发行不得公开劝诱，所以访客看不到项目是否在融资。完成合格投资者认证后，可以查看轮次、金额、出让比例和数据室。</span><button class="btn inv sm" data-goinv style="justify-self:start">去认证</button></div>`;
  else if (!p.deal) deal = `<p>该项目暂未开放投资人对接。</p>`;
  else {
    const d = p.deal, w = S.watch[p.id];
    deal = `<div class="deal">
      <div class="kvs"><div><b>${esc(d.round)} · ${esc(d.amt)}</b>本轮</div><div><b>${esc(d.share)}</b>出让比例</div>
        <div style="grid-column:1/-1"><b style="font-size:14px;font-weight:500">${esc(d.use)}</b>资金用途</div>
        <div><b class="num">${d.holders} / ${d.cap}</b>现有股东 / ${esc(d.form)}上限</div><div><b>${esc(p.ops)}</b>经营</div></div>
      <div class="room">${ROOM.map((r, i) => `<span class="tag ${d.room[i] ? 'ok' : 'warn'}"><i></i>${r}${d.room[i] ? '' : ' · 缺'}</span>`).join('')}</div>
      <div class="acts"><button class="btn inv sm" data-talk="${p.id}" ${w === 'talk' ? 'disabled' : ''}>${w === 'talk' ? '已发送约谈请求' : '表达意向并预约路演'}</button>
        <button class="star" data-watch="${p.id}" aria-pressed="${!!w}">${w ? '已关注' : '关注'}</button></div></div>`;
  }
  $('#sheet').innerHTML = `
    <div class="hd">${logo(p, 'lg')}<div><h2>${esc(p.name)} <span class="latin" style="font-size:15px;font-weight:500;color:var(--faint)">${esc(p.en)}</span></h2><p>${esc(p.tagline)}</p></div>
      <button class="x" id="closeSheet" aria-label="关闭">${I.x}</button></div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center"><span class="tag">${esc(p.ind)}</span><span class="tag">${esc(p.city)}</span><span class="tag">${md(p.launch.date)}首发</span>
      <span class="tag">加权票 ${n0(votesOf(p))} · 原始 ${n0(rawOf(p))}</span>
      <button class="star" data-vote="${p.id}" aria-pressed="${!!S.votes[p.id]}" style="margin-left:auto">${S.votes[p.id] ? '已投票' : '投一票'}</button></div>
    <div class="sec"><h3>产品</h3><p>${esc(p.about)}</p></div>
    <div class="sec"><h3>${esc(b.kind)} <span class="tag solid">全有或全无</span></h3>${money}${tiers}</div>
    <div class="sec"><h3>信号分 <span class="num" style="font-size:26px;font-weight:800">${p.score}</span></h3>
      ${partsHTML(p)}<p style="font-size:12.5px;color:var(--faint)">需求验证 30% + 执行交付 20% + 经营数据 20% + 社区热度 15% + 信息完整 15%</p></div>
    <div class="sec"><h3>本轮融资 <span class="tag inv"><i></i>${inv ? '你可见' : '仅投资人可见'}</span></h3>${deal}</div>
    <div class="sec"><h3>团队</h3><div class="team">${p.team.map(([n, r]) => `<div><b>${esc(n)}</b><span>${esc(r)}</span></div>`).join('')}</div></div>
    <div class="sec"><h3>动态</h3><div class="tl">${p.updates.map(([d, t]) => `<div><time>${esc(d)}</time><span>${esc(t)}</span></div>`).join('')}</div></div>`;
}

let lastFocus = null;
function openSheet(id) {
  S.open = id; S.pick = null; lastFocus = document.activeElement;
  renderSheet();
  $('#sheet').classList.add('on'); $('#sheet').setAttribute('aria-hidden', 'false'); $('#scrim').classList.add('on');
  $('#sheet').scrollTop = 0;
  setTimeout(() => $('#closeSheet')?.focus(), 50);
}
function closeSheet() {
  S.open = null;
  $('#sheet').classList.remove('on'); $('#sheet').setAttribute('aria-hidden', 'true'); $('#scrim').classList.remove('on');
  lastFocus?.focus?.();
}

// ---------- routing ----------
const VIEWS = { launch: renderLaunch, back: renderBack, invest: renderInvest, found: renderFound };
function render() {
  for (const v in VIEWS) {
    $('#v-' + v).hidden = v !== S.view;
    $('#t-' + v).setAttribute('aria-selected', v === S.view);
  }
  VIEWS[S.view]();
  $('#r-guest').setAttribute('aria-pressed', S.role === 'guest');
  $('#r-investor').setAttribute('aria-pressed', S.role === 'investor');
  $('#invDot').classList.toggle('on', S.role === 'investor');
  if (S.open) renderSheet();
}
function go(v) {
  S.view = v; render(); $('#main').scrollTop = 0;
  try { history.replaceState(null, '', '#' + v); } catch { }
}
function setRole(r) {
  if (r === 'investor' && !S.cert) { go('invest'); toast('先完成合格投资者认证'); return; }
  S.role = r; lsSet('role', r); render();
}

// ---------- events ----------
document.addEventListener('click', e => {
  const t = e.target.closest('button, [data-open]');
  if (!t) return;
  const d = t.dataset;
  if (d.v) return go(d.v);
  if (d.r) return setRole(d.r);
  if (d.vote) {
    S.votes[d.vote] = !S.votes[d.vote]; if (!S.votes[d.vote]) delete S.votes[d.vote];
    lsSet('votes', S.votes); render();
    if (S.votes[d.vote]) toast('已投票：你的账号实名且账龄满 30 天，计 1 票');
    return;
  }
  if (d.watch) {
    if (S.watch[d.watch]) delete S.watch[d.watch]; else S.watch[d.watch] = 'watch';
    lsSet('watch', S.watch); render(); return;
  }
  if (d.talk) {
    S.watch[d.talk] = 'talk'; lsSet('watch', S.watch); render();
    toast('已向创始人发送约谈请求（演示）'); return;
  }
  if (d.notify) {
    S.notify[d.notify] = !S.notify[d.notify]; lsSet('notify', S.notify); renderSheet();
    if (S.notify[d.notify]) toast('开售当天会提醒你'); return;
  }
  if (d.pick !== undefined) { S.pick = +d.pick < 0 ? null : +d.pick; renderSheet(); return; }
  if (d.pay !== undefined) { S.pick = null; renderSheet(); toast('演示环境：没有发生真实支付'); return; }
  if ('goinv' in d) { closeSheet(); go('invest'); return; }
  if (d.lt) { S.lt = d.lt; renderLaunch(); return; }
  if (d.kind) { S.kind = d.kind; renderBack(); return; }
  if (d.sort) { S.sort = d.sort; renderBack(); return; }
  if (t.id === 'certBtn') { S.cert = true; lsSet('cert', true); setRole('investor'); toast('认证完成（演示）：已进入投资人专区'); return; }
  if (t.id === 'leaveBtn') { setRole('guest'); return; }
  if (t.id === 'closeSheet') { closeSheet(); return; }
  if (d.open) openSheet(d.open);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && S.open) closeSheet();
  if (e.key === 'Enter' && e.target.matches('[data-open]:not(button)')) openSheet(e.target.dataset.open);
});
$('#scrim').addEventListener('click', closeSheet);
document.addEventListener('change', e => {
  const id = e.target.id, f = S.f;
  if (id === 'fInd') f.ind = e.target.value;
  else if (id === 'fRound') f.round = e.target.value;
  else if (id === 'fRise') f.rising = e.target.checked;
  else if (id === 'fMine') f.mine = e.target.checked;
  else if (id === 'fMin') f.min = +e.target.value;
  else return;
  renderInvest();
  $('#' + id)?.focus();
});
document.addEventListener('input', e => {
  if (e.target.id === 'fMin') $('#fMinV').textContent = e.target.value;
});

// ---------- boot ----------
const h = (location.hash || '').slice(1);
S.view = VIEWS[h] ? h : 'launch';
render();

})();</script>
