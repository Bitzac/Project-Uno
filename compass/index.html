<title>成长罗盘</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;700;900&display=swap">
<style>/* Layout: one liquid-glass window over a soft aurora; top bar (brand · students · view), tab row, one scrolling view, a form sheet from the right.
   Ink-blue accent (the blue-black ink of school exercise books), red reserved for problems. Hairline rules, heavy type. */
:root{--bg:#EDF1F7;--blob1:#A9C8FF;--blob2:#9FE3D2;--blob3:#FFD9AE;--blob4:#D9CCFF;--ink:#0B1220;--muted:#4B566B;--faint:#7A869A;--glass-a:rgba(255,255,255,.62);--glass-b:rgba(255,255,255,.3);--glass-edge:rgba(255,255,255,.92);--glass-inner:rgba(255,255,255,.97);--shadow:rgba(24,44,92,.18);--line:rgba(11,18,32,.15);--line-soft:rgba(11,18,32,.075);--field:rgba(255,255,255,.52);--accent:#2456C8;--accent-ink:#FFFFFF;--accent-soft:rgba(36,86,200,.11);--s2:#D9612A;--good:#0A8A5F;--good-soft:rgba(10,138,95,.11);--warn:#A86400;--warn-soft:rgba(230,150,20,.15);--bad:#C8352E;--bad-soft:rgba(200,53,46,.1);--inv:#5747C4;--inv-soft:rgba(87,71,196,.1);--scrim:rgba(16,26,48,.24);--sheet:rgba(246,248,252,.94);--tip:#0B1220;--tip-ink:#FFFFFF;--hair:1px;--f-display:"Outfit","Noto Sans SC",system-ui,sans-serif;--f-body:"Noto Sans SC","Outfit",system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#070B14;--blob1:#1A3C7E;--blob2:#0F5A4C;--blob3:#5A3B12;--blob4:#3A2D7A;--ink:#E8EEF8;--muted:#A3AFC2;--faint:#738099;--glass-a:rgba(26,34,52,.64);--glass-b:rgba(12,18,30,.42);--glass-edge:rgba(255,255,255,.15);--glass-inner:rgba(255,255,255,.18);--shadow:rgba(0,0,0,.5);--line:rgba(255,255,255,.15);--line-soft:rgba(255,255,255,.07);--field:rgba(255,255,255,.045);--accent:#6F9BFF;--accent-ink:#061230;--accent-soft:rgba(111,155,255,.15);--s2:#F08A4B;--good:#34D39E;--good-soft:rgba(52,211,158,.13);--warn:#F2B13D;--warn-soft:rgba(242,177,61,.15);--bad:#FF7468;--bad-soft:rgba(255,116,104,.15);--inv:#A79BFF;--inv-soft:rgba(167,155,255,.14);--scrim:rgba(0,0,0,.48);--sheet:rgba(14,20,34,.95);--tip:#E8EEF8;--tip-ink:#0B1220;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#070B14;--blob1:#1A3C7E;--blob2:#0F5A4C;--blob3:#5A3B12;--blob4:#3A2D7A;--ink:#E8EEF8;--muted:#A3AFC2;--faint:#738099;--glass-a:rgba(26,34,52,.64);--glass-b:rgba(12,18,30,.42);--glass-edge:rgba(255,255,255,.15);--glass-inner:rgba(255,255,255,.18);--shadow:rgba(0,0,0,.5);--line:rgba(255,255,255,.15);--line-soft:rgba(255,255,255,.07);--field:rgba(255,255,255,.045);--accent:#6F9BFF;--accent-ink:#061230;--accent-soft:rgba(111,155,255,.15);--s2:#F08A4B;--good:#34D39E;--good-soft:rgba(52,211,158,.13);--warn:#F2B13D;--warn-soft:rgba(242,177,61,.15);--bad:#FF7468;--bad-soft:rgba(255,116,104,.15);--inv:#A79BFF;--inv-soft:rgba(167,155,255,.14);--scrim:rgba(0,0,0,.48);--sheet:rgba(14,20,34,.95);--tip:#E8EEF8;--tip-ink:#0B1220;color-scheme:dark}
@media (min-resolution:2dppx){:root{--hair:.5px}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;padding-inline:16px;padding-block:16px;overflow:hidden;position:relative}
.num{font-family:var(--f-display);font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,h4{text-wrap:balance;margin:0}
.muted{color:var(--muted)}.sm{font-size:13px}
small{font-size:.82em}

/* aurora + glass */
.aurora{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.aurora i{position:absolute;border-radius:50%;filter:blur(80px);opacity:.72}
.aurora i:nth-child(1){width:44vw;height:44vw;left:-12vw;top:-14vw;background:var(--blob1)}
.aurora i:nth-child(2){width:34vw;height:34vw;right:-8vw;top:-8vw;background:var(--blob2)}
.aurora i:nth-child(3){width:38vw;height:38vw;left:28vw;bottom:-24vw;background:var(--blob3)}
.aurora i:nth-child(4){width:28vw;height:28vw;right:2vw;bottom:-12vw;background:var(--blob4)}
.glass{background:linear-gradient(145deg,var(--glass-a),var(--glass-b));-webkit-backdrop-filter:blur(28px) saturate(170%);backdrop-filter:blur(28px) saturate(170%);border:var(--hair) solid var(--glass-edge);box-shadow:inset 0 1px 0 var(--glass-inner),0 24px 60px -24px var(--shadow)}
.window{position:relative;z-index:1;height:100%;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto minmax(0,1fr);border-radius:28px;overflow:hidden}

/* top bar */
.top{display:flex;align-items:center;gap:16px;padding:12px 20px;border-bottom:var(--hair) solid var(--line);flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:9px}
.brand b{font:900 24px/1 var(--f-body);letter-spacing:.04em}
.brand span{font:600 10.5px var(--f-display);letter-spacing:.26em;color:var(--muted);text-transform:uppercase}
.kids{display:flex;gap:6px;align-items:center;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none;padding:2px}
.kids::-webkit-scrollbar{display:none}
.kid{display:flex;align-items:center;gap:8px;border:var(--hair) solid transparent;background:none;border-radius:16px;padding:4px 12px 4px 4px;cursor:pointer;white-space:nowrap;color:var(--muted)}
.kid[aria-selected="true"]{background:var(--glass-a);border-color:var(--line);color:var(--ink);box-shadow:inset 0 1px 0 var(--glass-inner),0 6px 16px -10px var(--shadow)}
.kid .kn{display:grid;line-height:1.2;text-align:left}
.kid .kn b{font-weight:800;font-size:14px}
.kid .kn small{font:500 11.5px var(--f-display);color:var(--faint)}
.kid.add{padding:0;width:34px;height:34px;justify-content:center;border:var(--hair) dashed var(--line)}
.kid.add svg{width:15px;height:15px}
.locked{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--faint);white-space:nowrap}
.locked svg{width:13px;height:13px}
.kid svg,.locked svg{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.ava{width:32px;height:32px;border-radius:11px;display:grid;place-items:center;font:900 15px var(--f-body);color:#fff;flex:none;background:linear-gradient(145deg,#4B7BE5,#1E3F99);box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}
.ava.f{background:linear-gradient(145deg,#E9799A,#A8366A)}
.ava.lg{width:64px;height:64px;border-radius:20px;font-size:28px}
.who{display:flex;align-items:center;gap:12px}
.seg{display:inline-flex;padding:3px;border-radius:14px;border:var(--hair) solid var(--line);background:var(--field);gap:2px}
.seg button{border:0;background:none;padding:6px 13px;border-radius:11px;font-size:14px;font-weight:500;color:var(--muted);cursor:pointer;white-space:nowrap}
.seg button[aria-selected="true"],.seg button[aria-pressed="true"],.seg button[aria-checked="true"]{background:var(--glass-a);color:var(--ink);font-weight:800;box-shadow:inset 0 1px 0 var(--glass-inner),0 4px 14px -6px var(--shadow)}
.seg.sm button{padding:5px 10px;font-size:13px}
body.student #role button[data-role="student"]{background:var(--accent);color:var(--accent-ink)}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--faint);white-space:nowrap}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--good)}
.sync.local i{background:var(--warn)}
.tabs{margin:10px 20px 0;justify-self:start;max-width:calc(100% - 40px);overflow-x:auto;scrollbar-width:none}
.tabs button{padding:7px 16px;font-size:14.5px}

/* views */
.main{overflow-y:auto;overflow-x:hidden;min-height:0}
.view{padding:18px 20px 30px;display:grid;grid-template-columns:minmax(0,1fr);gap:16px;min-width:0}
.vhead{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap}
.vhead h1{font:900 28px/1.15 var(--f-body);letter-spacing:.01em}
.vhead p{margin:4px 0 0;color:var(--muted);font-size:14px;max-width:64ch}
.vacts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.eyebrow{font:600 11px var(--f-display);letter-spacing:.18em;text-transform:uppercase;color:var(--faint);display:block;margin-bottom:2px}
.cols{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:16px;align-items:start}
.cols.even{grid-template-columns:repeat(2,minmax(0,1fr))}
.panel{border-radius:22px;border:var(--hair) solid var(--line);background:var(--field);padding:16px 18px;min-width:0;display:grid;gap:12px;align-content:start}
.panel h3{font:800 16px var(--f-body);display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap}
.panel h3 small{font:500 12.5px var(--f-body);color:var(--faint);margin-right:auto}
.panel h3 .btn{margin-left:auto}
.panel.empty{color:var(--muted);text-align:center;padding:30px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:16px;height:0;border-top:2px solid var(--accent);display:inline-block}
.legend i.k-prev,.legend i.k-ref{border-top:2px dashed var(--faint)}
.legend i.k-s2{border-color:var(--s2)}
.legend i.k-low{border-color:var(--warn)}
.legend i.k-band{height:10px;border:0;background:var(--accent-soft);border-radius:2px}

/* profile + verdict */
.profile{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:16px;align-items:center}
.profile h2{font:900 26px/1.2 var(--f-body)}
.pills{display:flex;gap:6px 14px;flex-wrap:wrap;margin-top:4px;font-size:13.5px;color:var(--muted)}
.pills span{display:inline-flex;align-items:center;gap:6px}
.pills b{color:var(--ink);font-weight:800}
.sysb{font:700 10.5px var(--f-display);letter-spacing:.08em;padding:1px 6px;border-radius:6px;border:var(--hair) solid var(--ink);color:var(--ink)}
.profile p{margin:4px 0 0}
.verdict{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 22px;align-items:center;padding:16px 20px;border-radius:22px;background:linear-gradient(120deg,var(--accent-soft),transparent 70%);border:var(--hair) solid var(--line)}
.vbig{display:flex;flex-direction:column;grid-row:span 2}
.vbig b{font:800 56px/1 var(--f-display);letter-spacing:-.02em}
.vbig .delta{margin-top:4px}
.verdict p{margin:0;font-size:15.5px;font-weight:500;max-width:60ch}
.alertbox{border-radius:20px;border:var(--hair) solid var(--bad);background:var(--bad-soft);padding:14px 18px;display:grid;gap:8px}
.alertbox>b{display:flex;align-items:center;gap:8px;color:var(--bad);font-weight:800}
.alertbox>b svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.6}
.alertbox p{margin:0;color:var(--muted)}
.sel{user-select:all;-webkit-user-select:all}

/* insights */
.ins{list-style:none;margin:0;padding:0;display:grid;gap:0}
.ins li{display:grid;grid-template-columns:22px minmax(0,1fr);gap:10px;padding:9px 0;border-bottom:var(--hair) solid var(--line-soft);font-size:14px;line-height:1.55}
.ins li:last-child{border-bottom:0}
.ins b{font-weight:800}
.ii{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;margin-top:-1px}
.ii svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ins .up .ii{color:var(--good);background:var(--good-soft)}
.ins .down .ii{color:var(--bad);background:var(--bad-soft)}
.ins .warn .ii{color:var(--warn);background:var(--warn-soft)}
.ins .info .ii{color:var(--accent);background:var(--accent-soft)}
.ins .alert .ii{color:var(--bad);background:var(--bad-soft)}
.ai{border-top:var(--hair) solid var(--line);padding-top:12px;display:grid;gap:8px}
.aihead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.aihead b{display:inline-flex;align-items:center;gap:7px;font-weight:800}
.aihead svg{width:15px;height:15px;fill:var(--accent);stroke:none}
.aitext{font-size:14px;line-height:1.75;margin:0}

/* kpis */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{border-radius:20px;border:var(--hair) solid var(--line);background:var(--field);padding:14px 16px;display:flex;flex-direction:column;gap:4px;align-items:flex-start;cursor:pointer;transition:transform .18s,box-shadow .18s;min-width:0}
.kpi:hover{transform:translateY(-2px);box-shadow:0 16px 36px -24px var(--shadow)}
.kpi b.num{font:800 30px/1.1 var(--f-display)}
.kpi b.num small{font-size:14px;font-weight:600;color:var(--muted);margin-left:2px}
.kpi b.na,.headline b.na,.stats3 b.na{color:var(--faint)}
.kpi>span{font-size:12.5px;color:var(--muted)}
.kpi .sub{color:var(--faint)}
.kface{display:flex;align-items:center;gap:8px}

/* tags, deltas, chips, buttons */
.tag{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--muted);border:var(--hair) solid var(--line);border-radius:999px;padding:1px 9px;white-space:nowrap;line-height:1.6;font-weight:500}
.tag i{width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.tag.ok{color:var(--good);border-color:currentColor}
.tag.warn{color:var(--warn);border-color:currentColor}
.tag.bad{color:var(--bad);border-color:currentColor}
.tag.inv{color:var(--inv);border-color:currentColor}
.tag.inv i{display:none}
.delta{display:inline-flex;align-items:center;gap:2px;font:700 12.5px var(--f-display);color:var(--faint);white-space:nowrap}
.delta svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.delta.up{color:var(--good)}.delta.dn{color:var(--bad)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:var(--hair) solid var(--line);background:none;border-radius:999px;padding:3px 11px;font:500 12.5px var(--f-display);color:var(--muted);cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{border-color:var(--ink);color:var(--ink);font-weight:800;background:var(--glass-a)}
.chip-ex{font-size:11px;font-weight:600;color:var(--inv);border:var(--hair) solid currentColor;border-radius:6px;padding:0 5px;vertical-align:middle;margin-left:4px}
.btn{border:0;border-radius:13px;padding:9px 16px;font-size:14px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.btn svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.btn.pri{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--glass-a);border:var(--hair) solid var(--line);color:var(--ink);font-weight:600}
.btn.danger{background:none;border:var(--hair) solid var(--bad);color:var(--bad);margin-left:auto}
.btn.sm{padding:6px 12px;font-size:13px;border-radius:11px}
.btn:disabled{opacity:.45;cursor:default}
.ib{width:28px;height:28px;border-radius:9px;border:var(--hair) solid transparent;background:none;display:inline-grid;place-items:center;cursor:pointer;color:var(--faint)}
.ib:hover{border-color:var(--line);color:var(--ink);background:var(--glass-a)}
.ib svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.linkbtn{border:0;background:none;padding:0;color:var(--accent);font-weight:600;cursor:pointer;font-size:inherit;text-decoration:underline;text-underline-offset:2px;text-decoration-thickness:var(--hair)}
.racts{display:inline-flex;gap:2px;justify-self:end}
.racts-line{display:flex;gap:16px;font-size:13px}

/* tables */
.headline{display:flex;align-items:flex-end;gap:12px 22px;flex-wrap:wrap}
.headline>div{display:flex;flex-direction:column}
.headline b{font:800 44px/1 var(--f-display);letter-spacing:-.02em}
.headline b small{font-size:16px;font-weight:600;color:var(--muted);margin-left:3px}
.headline p{margin:0;color:var(--muted);font-size:13.5px;max-width:70ch}
.tbl-wrap{overflow-x:auto;border-radius:20px;border:var(--hair) solid var(--line);background:var(--field)}
.tbl-wrap.flat{border:0;background:none;border-radius:0}
.tbl{border-collapse:collapse;width:100%;min-width:640px;font-size:14px}
.tbl.compact{min-width:0;font-size:13.5px}
.tbl th{font:600 11px var(--f-display);letter-spacing:.12em;text-transform:uppercase;color:var(--faint);text-align:left;padding:11px 12px 7px;border-bottom:var(--hair) solid var(--line);white-space:nowrap}
.tbl td{padding:9px 12px;border-bottom:var(--hair) solid var(--line-soft);vertical-align:middle}
.tbl.compact td,.tbl.compact th{padding-inline:8px}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr[data-act]{cursor:pointer}
.tbl tbody tr[data-act]:hover td{background:var(--field)}
.tbl tr.on td{background:var(--accent-soft)}
.tbl tr.on td:first-child{box-shadow:inset 2px 0 0 var(--accent)}
.tbl td small{font-size:12px}
.tbl b.good{color:var(--good)}.tbl b.bad{color:var(--bad)}
.sn{font-weight:800}
.sn small{font-weight:400;color:var(--faint);font-size:12px}
.rows{display:grid}
.rrow{display:grid;grid-template-columns:84px minmax(0,1fr) auto auto auto;gap:10px;align-items:center;padding:8px 0;border-bottom:var(--hair) solid var(--line-soft);font-size:13.5px}
.rrow:last-child{border-bottom:0}
.rrow time{font:500 12.5px var(--f-display);color:var(--faint)}
.rrow>span small{display:block;color:var(--faint);font-size:12px}
.rrow b{font-weight:800;white-space:nowrap}
.rrow.note{grid-template-columns:84px minmax(0,1fr) auto}
details.recs summary{cursor:pointer;font-size:13px;color:var(--muted);padding:4px 0}
details.recs[open] summary{margin-bottom:4px}

/* charts */
.chart-wrap{width:100%;overflow:hidden}
svg.chart,svg.radar{display:block;width:100%;height:auto;overflow:visible}
svg.radar{max-width:440px;margin:0 auto}
.ring{fill:none;stroke:var(--line-soft);stroke-width:1}
.ring.mid{stroke:var(--line)}
.spoke{stroke:var(--line-soft);stroke-width:1}
.rtick{font:500 10px var(--f-display);fill:var(--faint)}
.rp-cur{fill:var(--accent);fill-opacity:.13;stroke:var(--accent);stroke-width:2;stroke-linejoin:round}
.rp-prev{fill:none;stroke:var(--faint);stroke-width:1.5;stroke-dasharray:4 3;stroke-linejoin:round}
.rdot{fill:var(--accent);stroke:var(--bg);stroke-width:2;cursor:default}
.rlab{font:700 13px var(--f-body);fill:var(--ink)}
.rval{font:800 13px var(--f-display);fill:var(--muted)}
.rval.na{font-weight:500;fill:var(--faint)}
.chart .grid{stroke:var(--line-soft);stroke-width:1}
.chart .axis{stroke:var(--line);stroke-width:1}
.chart .tick{font:500 11px var(--f-display);fill:var(--faint)}
.chart .line{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .line.s1{stroke:var(--accent)}.chart .line.s2{stroke:var(--s2)}
.chart .line.ref{stroke:var(--faint);stroke-width:1.25}
.chart .line.ref.mid{stroke:var(--muted)}
.chart .line.dash{stroke-dasharray:4 3}
.chart .area.s1{fill:var(--accent);opacity:.1}
.chart .dot{stroke:var(--bg);stroke-width:2}
.chart .dot.s1{fill:var(--accent)}.chart .dot.s2{fill:var(--s2)}.chart .dot.ref{fill:var(--faint)}
.chart .hit{fill:transparent;cursor:default}
.chart .elab,.chart .blab{font:600 11px var(--f-body);fill:var(--muted)}
.chart .band{fill:var(--accent-soft)}
.chart .band.lowband{fill:var(--warn-soft)}
.bars .bar{fill:var(--accent)}
.bars .bar.low{fill:var(--warn)}
.spark{width:92px;height:28px;display:block;overflow:visible}
.spark .sl{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.spark .sl.up{stroke:var(--accent)}.spark .sl.dn{stroke:var(--bad)}
.spark circle{stroke:var(--bg);stroke-width:2}
.spark circle.up{fill:var(--accent)}.spark circle.dn{fill:var(--bad)}
.face{flex:none}
.face circle,.face path{fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:round}
.face .eye{fill:currentColor;stroke:none}
.face.f1,.face.f2{color:var(--warn)}.face.f3{color:var(--muted)}.face.f4,.face.f5{color:var(--accent)}

/* holistic */
.dims{gap:14px}
.dim{display:grid;gap:5px}
.dtop{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.dtop b{font-weight:800}
.dtop b small{font-weight:400;color:var(--faint)}
.dtop .num b{font:800 22px var(--f-display)}
.dtop .num{display:inline-flex;align-items:baseline;gap:8px}
.dim>small{color:var(--faint);font-size:12.5px}
.meter{height:6px;border-radius:3px;background:var(--accent-soft);overflow:hidden}
.meter i{display:block;height:100%;border-radius:3px;background:var(--accent)}
.mgrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px}
.mcol{display:grid;gap:8px;align-content:start;min-width:0}
.mcol h4{font:800 13.5px var(--f-body);display:flex;justify-content:space-between;padding-bottom:6px;border-bottom:var(--hair) solid var(--line)}
.merit{display:grid;gap:3px;padding:8px 0;border-bottom:var(--hair) solid var(--line-soft);font-size:13px;position:relative}
.merit time{font:500 11.5px var(--f-display);color:var(--faint)}
.merit b{font-weight:700;line-height:1.4}
.merit>span{display:flex;gap:4px;flex-wrap:wrap}
.merit small{color:var(--faint)}
.merit .racts{position:absolute;right:0;top:4px}

/* body */
.stats3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stats3.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.stats3>div{border-top:var(--hair) solid var(--line);padding-top:8px;display:flex;flex-direction:column;gap:3px;align-items:flex-start}
.stats3 span{font-size:12.5px;color:var(--muted)}
.stats3 b.num{font:800 26px/1.1 var(--f-display)}
.stats3 b small{font-size:13px;font-weight:600;color:var(--muted);margin-left:2px}
.stats3>div>small{color:var(--faint);font-size:12px}
.fsum{display:flex;gap:8px 18px;align-items:center;flex-wrap:wrap;padding-top:10px;border-top:var(--hair) solid var(--line);font-size:13px;color:var(--muted)}
.fsum b{color:var(--ink);font-weight:800}
.fsum b.big{font-size:24px}

/* mind */
.w5{display:flex;gap:14px;align-items:center}
.w5>b{font:800 48px/1 var(--f-display)}
.w5 div{display:flex;flex-direction:column;gap:4px;align-items:flex-start;font-size:13px;color:var(--muted)}
.hot{display:grid;gap:0}
.hot>div{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-bottom:var(--hair) solid var(--line-soft)}
.hot>div:last-child{border-bottom:0}
.hot b{font:800 20px var(--f-display);white-space:nowrap}
.hot span{font-size:13.5px;font-weight:600}
.hot small{display:block;font-weight:400;color:var(--faint);font-size:12px}
.help p{margin:0;color:var(--muted)}
.cal{display:grid;gap:4px;width:100%;max-width:440px;justify-self:center}
.cal-h,.cal-g{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center}
.cal-h span{font-size:11px;color:var(--faint)}
.cd{aspect-ratio:1;max-width:100%;border-radius:10px;display:grid;place-items:center;border:var(--hair) solid var(--line-soft);min-width:0}
.cd i{font:500 11px var(--f-display);color:var(--faint);font-style:normal}
.cd.fut{opacity:.35}
.cd.today{border-color:var(--accent)}
.cd svg{width:66%;height:auto}
.ck{display:grid;gap:12px}
.faces{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.facebtn{border:var(--hair) solid var(--line-soft);background:none;border-radius:16px;padding:8px 2px 6px;display:grid;justify-items:center;gap:2px;cursor:pointer;min-width:0}
.facebtn small{font-size:11.5px;color:var(--muted)}
.facebtn[aria-checked="true"]{background:var(--glass-a);border-color:var(--accent);box-shadow:0 6px 16px -10px var(--shadow)}
.facebtn[aria-checked="true"] small{color:var(--ink);font-weight:800}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* forms + sheet */
.field{display:grid;gap:4px;font-size:12.5px;color:var(--muted);min-width:0}
.field>span{font-weight:500}
.field input,.field select,.field textarea{width:100%;border:var(--hair) solid var(--line);background:var(--field);border-radius:11px;padding:8px 10px;font-size:14.5px;color:var(--ink);min-width:0}
.field textarea{resize:vertical}
.field.wide,.field-wrap.wide{grid-column:1/-1}
.ck .field .seg{flex-wrap:wrap}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.fgrid .fgrid{grid-column:1/-1}
.field-wrap{display:contents}
.field-wrap.wide{display:block}
.fnote{margin:0;font-size:12.5px;color:var(--faint);line-height:1.6}
.ferr{margin:0;color:var(--bad);font-size:13.5px;font-weight:600;min-height:1em}
.fitrow{display:grid;gap:6px;padding:8px 0;border-bottom:var(--hair) solid var(--line-soft)}
.fitrow b{font-size:13.5px}
.q{border:0;padding:0;margin:0 0 4px;display:grid;gap:8px}
.q legend{font-weight:700;font-size:14.5px;padding:0;margin-bottom:6px}
.opts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.opts label{position:relative;cursor:pointer}
.opts input{position:absolute;opacity:0}
.opts span{display:block;text-align:center;border:var(--hair) solid var(--line);border-radius:10px;padding:6px 4px;font-size:12.5px;color:var(--muted)}
.opts input:checked+span{border-color:var(--accent);background:var(--accent-soft);color:var(--ink);font-weight:800}
.opts input:focus-visible+span{outline:2px solid var(--accent);outline-offset:1px}
.scrim{position:fixed;inset:0;z-index:20;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;z-index:21;top:16px;right:16px;bottom:16px;width:min(520px,calc(100% - 32px));border-radius:26px;overflow-y:auto;transform:translateX(112%);transition:transform .32s cubic-bezier(.2,.8,.2,1);padding:20px 22px 26px}
.sheet.on{transform:none}
.sheet.glass{background:linear-gradient(145deg,var(--sheet),var(--sheet))}
.sheet form{display:grid;gap:14px}
.sheet .hd{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.sheet .hd h2{font:900 22px/1.25 var(--f-body)}
.sheet .hd p{margin:4px 0 0;color:var(--muted);font-size:13.5px}
.fbody{display:grid;gap:12px}
.facts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.x{width:34px;height:34px;border-radius:50%;border:var(--hair) solid var(--line);background:var(--glass-a);cursor:pointer;display:grid;place-items:center;flex:none}
.x svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round}

/* misc */
.tip{position:fixed;z-index:40;pointer-events:none;background:var(--tip);color:var(--tip-ink);font-size:12.5px;font-weight:500;padding:6px 10px;border-radius:9px;max-width:280px;opacity:0;transition:opacity .12s;left:0;top:0}
.tip.on{opacity:1}
.toast{position:fixed;z-index:30;left:50%;bottom:28px;transform:translate(-50%,20px);opacity:0;transition:all .25s;padding:10px 18px;border-radius:14px;font-size:14px;font-weight:600;max-width:calc(100% - 32px);pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
.foot{font-size:12px;color:var(--faint);padding:0 20px 18px;margin:0}
.empty{padding:40px;text-align:center;color:var(--muted);display:grid;gap:12px;justify-items:center}
.spin{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--accent);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.blank{max-width:640px;margin:6vh auto 0;display:grid;gap:14px}
.blank h1{font:900 34px/1.2 var(--f-body)}
.blank p{margin:0;color:var(--muted);font-size:15px}
.blank .acts{display:flex;gap:10px;flex-wrap:wrap}
.exs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:6px}
.exs div{border-top:var(--hair) solid var(--line);padding-top:8px;display:grid;font-size:13px;color:var(--muted)}
.exs b{color:var(--ink);font-weight:800;font-size:14px}
.panel svg:not(.radar):not(.chart):not(.spark):not(.face){width:16px;height:16px}

/* web: sign-in gate + account */
.gate{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:28px;align-items:center;max-width:1040px;margin:4vh auto 0;width:100%}
.gate-hero h1{font:900 40px/1.18 var(--f-body);margin:6px 0 12px}
.gate-hero>p{margin:0;color:var(--muted);font-size:15.5px;max-width:46ch}

.gate-acts{display:flex;gap:8px;flex-wrap:wrap}

.danger-zone{display:grid;gap:10px;padding:14px;border-radius:16px;border:var(--hair) solid var(--bad);background:var(--bad-soft)}
.danger-zone h3{font:800 15px var(--f-body);color:var(--bad)}
.danger-zone p{margin:0}
.danger-zone .btn.danger{margin-left:0;justify-self:start}
.icp{display:flex;gap:4px 14px;flex-wrap:wrap;justify-content:center;font-size:12px;color:var(--faint);margin:14px 0 0}
.icp a{color:var(--faint);text-decoration:none}

/* ---------- school year, grade and term ---------- */
const schoolYear = (sys, d) => { const y = d.getFullYear(), m = d.getMonth() + 1; return m >= SYS[sys].syMonth ? y : y - 1; };
// cohort = the school year the student was in grade index 0 (学前 / Kindergarten / Reception)
const gradeAt = (s, d) => schoolYear(s.system, d) - s.cohort;
function gradeLabel(s, g) {
  const sy = SYS[s.system];
  if (g < 0) return '未入学';
  if (g > sy.maxG) return '已毕业';
  return sy.grades[g];
}
function termOf(sys, dateStr) { const d = parseD(dateStr); return SYS[sys].term(d.getFullYear(), d.getMonth() + 1); }
const termKey = (sys, dateStr) => termOf(sys, dateStr).join('-');
const termName = (sys, key) => { const [y, n] = key.split('-').map(Number); return SYS[sys].termName(y, n); };
const termShort = (sys, key) => { const [y, n] = key.split('-').map(Number); return SYS[sys].termShort(y, n); };
const termCmp = (a, b) => { const [ya, na] = a.split('-').map(Number), [yb, nb] = b.split('-').map(Number); return ya - yb || na - nb; };

      const it = Array.isArray(r.items) ? r.items.map(num) : [];
      if (!isDate(r.date) || it.length !== 5 || it.some(x => x == null || x < 0 || x > 5)) continue;
      out.push({ id: r.id, date: r.date, items: it, score: it.reduce((s, x) => s + x, 0) * 4, example: ex });
    } else if (col === 'screens') {
      const sc = SCREENS[r.scale], v = num(r.score);
      if (!sc || !isDate(r.date) || v == null || v < 0 || v > sc.max) continue;
      out.push({ id: r.id, sid: r.sid, date: r.date, scale: r.scale, informant: INFORMANT[r.informant] ? r.informant : 'self', score: v, by: str(r.by, 30), label: str(r.label, 30), note, example: ex });
    } else if (col === 'notes') {
      if (!isDate(r.date) || !r.text) continue;
      out.push({ id: r.id, sid: r.sid, date: r.date, text: str(r.text, 500), example: ex });
    }
  }
  return out.sort(byDate(col === 'ratings' ? 'term' : 'date'));
}

function pickCur() {
  const want = ST.cur;
  CUR = D.students.some(p => p.id === want) || (want && want === PENDING) ? want : (D.students[0] ? D.students[0].id : null);
  D.st = D.students.find(p => p.id === CUR) || null;

/* local mode: everything in this browser; the first visit shows the fictional example students */

function loadLocalRecords() {

}
function saveLocal(c) {

function setSync(t, warn) { const el = $('sync'); el.classList.toggle('local', !!warn); el.querySelector('span').textContent = t; }

/* cloud data goes through STORE (src/store/*.js, one backend per build target); local mode stays in this file */
let UNSUB_TOP = [];
function connectStore() {
  mode = 'db'; CAN_EDIT = STORE.canEdit; setSync(STORE.syncLabel);
  for (const c of COLS) D[c] = [];
  D.students = []; D.st = null; CUR = null;
  UNSUB_TOP.forEach(u => u());
  let subscribed;
  UNSUB_TOP = [
    STORE.watchStudents(docs => {
      D.students = docs.map(cleanStudent).filter(Boolean).sort(byOrder);
      pickCur();
      if (CUR !== subscribed) { subscribed = CUR; subscribeRecords(); }
      renderAll();
    }, () => setSync('同步中断，显示最后一次数据', true)),
    STORE.watchPin(v => { D.pin = v; })
  ];
  renderAll();
}
function disconnectStore() {
  UNSUB_TOP.forEach(u => u()); UNSUB.forEach(u => u()); UNSUB_TOP = []; UNSUB = [];
  for (const c of COLS) D[c] = [];
  D.students = []; D.st = null; D.pin = null; CUR = null; mode = 'init';
}
function subscribeRecords() {
  UNSUB.forEach(u => u()); UNSUB = [];
  for (const c of COLS) D[c] = [];
  if (!CUR || mode !== 'db') return;
  const sid = CUR;
  for (const c of COLS) UNSUB.push(STORE.watchRecords(c, sid, docs => {
    if (sid !== CUR) return;
    D[c] = clean(c, docs); renderAll();
  }, () => setSync('同步中断，显示最后一次数据', true)));
}
function switchStudent(sid) {
  if (!sid || sid === CUR) return;
  ST.cur = sid; ST.term = null; ST.subj = null; saveUI();
  pickCur();
  if (mode === 'db') subscribeRecords(); else loadLocalRecords();
  renderAll();
}

function guardWrite(noStudent) {
  if (mode === 'init') { toast('正在连接数据，请稍候再试'); return false; }
  if (!CAN_EDIT) { toast('你只有查看权限'); return false; }
  if (!CUR && !noStudent) { toast('请先新建一个学生档案'); return false; }

}
const body = (c, obj) => PCOLS.includes(c) ? { ...obj, sid: CUR } : obj;
async function add(c, obj) {
  if (mode === 'db') return STORE.add(c, CUR, obj);
  const id = c[0] + rid('');
  D[c] = clean(c, [...D[c], { id, ...body(c, obj) }]); saveLocal(c); renderAll(); return id;
}
async function put(c, id, obj) {
  if (mode === 'db') return STORE.put(c, CUR, id, obj);
  D[c] = clean(c, [...D[c].filter(x => x.id !== id), { id, ...body(c, obj) }]); saveLocal(c); renderAll();
}
async function del(c, id) {
  if (mode === 'db') return STORE.del(c, CUR, id);
  D[c] = D[c].filter(x => x.id !== id); saveLocal(c); renderAll();
}
async function saveStudent(obj, isNew) {
  if (isNew) {
    const bodyS = { ...obj, order: Math.max(0, ...D.students.filter(p => !p.example).map(p => p.order)) + 1, example: false };
    let id;
    if (mode === 'db') { id = STORE.newId('students'); PENDING = id; await STORE.put('students', id, id, bodyS); }
    else { id = rid('s'); D.students = [...D.students, cleanStudent({ id, ...bodyS })].sort(byOrder); saveLocal('students'); }
    switchStudent(id);
    return id;
  }
  const bodyS = { ...obj, order: D.st.order, example: D.st.example };
  if (mode === 'db') return STORE.put('students', CUR, CUR, bodyS);
  D.students = D.students.map(p => p.id === CUR ? cleanStudent({ id: CUR, ...bodyS }) : p).sort(byOrder);
  saveLocal('students'); pickCur(); renderAll();
}
async function runJobs(jobs) { for (let i = 0; i < jobs.length; i += 8) await Promise.all(jobs.slice(i, i + 8).map(f => f())); }
function dropLocalStudent(sid) {
  for (const c of SCOLS) lsDel(lsRec(sid, c));
  for (const c of PCOLS) lsSet(lsPriv(c), (lsGet(lsPriv(c)) || []).filter(r => r && r.sid !== sid));
  D.students = D.students.filter(p => p.id !== sid); saveLocal('students');
}
async function deleteStudent() {
  const sid = CUR;
  if (mode === 'db') await STORE.deleteStudent(sid); else dropLocalStudent(sid);
  ST.cur = null; pickCur();
  if (mode === 'db') subscribeRecords(); else loadLocalRecords();
  renderAll();
}

/* examples: fictional, marked example:true, removable in one step */
const hasExamples = () => D.students.some(s => s.example);
async function loadExamples() {
  if (mode === 'db') await STORE.writeExamples(EX);
  else { lsDel(LSK.students); loadLocal(); }
  renderAll();
}
async function clearExamples() {
  const ids = D.students.filter(s => s.example).map(s => s.id);
  if (mode === 'db') { for (const sid of ids) await STORE.deleteStudent(sid); }
  else { ids.forEach(dropLocalStudent); ST.cur = null; pickCur(); loadLocalRecords(); }
  renderAll();

}

function fail(e) {
  const code = e && e.code;
  if (code === 'invalid_argument' || code === 'permission-denied' || code === 'DATABASE_PERMISSION_DENIED') {
    if (TARGET === 'artifact') { CAN_EDIT = false; setSync('只读 · 云端数据'); closeSheet(); renderAll(); toast('你只有查看权限，无法修改'); }
    else toast('没有权限保存，请重新登录后再试');
  }
  else if (code === 'quota_exceeded' || code === 'resource-exhausted') toast('存储已满，请先删除一些旧记录');
  else toast('保存失败，请检查网络后再试');
}

/* ---------- parent PIN (keeps a child in student view on a shared device; not a security boundary) ---------- */
async function hashPin(pin, salt) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(salt + ':' + pin));
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
}
const pinSupported = () => !!(window.crypto && crypto.subtle);
async function setPin(pin) {
  const salt = Math.random().toString(36).slice(2, 10);
  const v = pin ? { hash: await hashPin(pin, salt), salt } : null;
  if (mode === 'db') await STORE.setPin(v);
  else { if (v) lsSet(LSK.pin, v); else lsDel(LSK.pin); }
  D.pin = v;
}
async function checkPin(pin) { return !!D.pin && (await hashPin(pin, D.pin.salt)) === D.pin.hash; }

/* ---------- derived model for the current student ---------- */
let M = null;
function derive() {
  const s = D.st; if (!s) return null;
  const sys = SYS[s.system], today = todayISO(), now = new Date();
  const g = gradeAt(s, now), age = ageAt(s, today);
  const tk = d => termKey(s.system, d);
  const scores = D.scores.map(r => ({ ...r, term: tk(r.date), norm: normOf(r), avgNorm: r.avg != null ? clamp(SCALES[r.scale].norm(r.avg, r.full), 0, 100) : null }));
  const curTerm = tk(today);
  const scoreTerms = [...new Set(scores.map(r => r.term))].sort(termCmp);
  const allTerms = [...new Set([curTerm, ...scoreTerms, ...D.ratings.map(r => r.term), ...D.merits.map(r => tk(r.date)), ...D.moods.map(r => tk(r.date)), ...D.who5.map(r => tk(r.date)), ...D.fitness.map(r => tk(r.date))])].sort(termCmp);
  const termGrade = t => { const [y] = t.split('-').map(Number); return y - s.cohort; };

  /* subjects */
  function subjects(t) {
    const by = {};
    for (const r of scores) if (r.term === t) (by[r.subject] = by[r.subject] || []).push(r);
    return Object.entries(by).map(([subject, recs]) => {
      const last = recs[recs.length - 1];
      // trends only compare like with like: the history in the same scale as the latest result
      const all = scores.filter(r => r.subject === subject), hist = all.filter(r => r.scale === last.scale);
      const avgs = recs.filter(r => r.avgNorm != null);
      return {
        subject, recs, last, scale: last.scale, mean: mean(recs.map(r => r.norm)), valueMean: mean(recs.map(r => r.value)),
        avg: avgs.length ? mean(avgs.map(r => r.avgNorm)) : null, lvl: recs.some(r => r.lvl === 'AP') ? 'AP' : recs.some(r => r.lvl === 'H') ? 'H' : '',
        all, hist, trend: hist.length >= 3 ? slope(hist.slice(-5).map(r => r.norm)) : null
      };
    }).sort((a, b) => sys.subjects(termGrade(t)).indexOf(a.subject) - sys.subjects(termGrade(t)).indexOf(b.subject) || a.subject.localeCompare(b.subject));
  }
  function headline(list) {
    if (!list.length) return null;
    const cnt = {}; for (const x of list) cnt[x.scale] = (cnt[x.scale] || 0) + 1;
    const scale = Object.keys(cnt).sort((a, b) => cnt[b] - cnt[a])[0];
    const xs = list.filter(x => x.scale === scale);
    const n = xs.length;
    const h = headOf(scale, xs, n);
    return h && Object.assign(h, { scale });
  }
  function headOf(scale, xs, n) {
    if (scale === 'pts') return { label: '平均得分率', value: nf(mean(xs.map(x => x.mean)), 1), unit: '%', n, norm: mean(xs.map(x => x.mean)) };
    if (scale === 'pct' && s.system === 'us') {
      const gpa = mean(xs.map(x => usLetter(x.mean)[2]));
      const w = mean(xs.map(x => usLetter(x.mean)[2] + (x.lvl === 'AP' ? 1 : x.lvl === 'H' ? 0.5 : 0)));
      return { label: 'GPA（未加权）', value: gpa.toFixed(2), unit: '/4.0', sub: xs.some(x => x.lvl) ? `加权 ${w.toFixed(2)}` : '', n, norm: mean(xs.map(x => x.mean)) };
    }
    if (scale === 'pct') return { label: '平均分', value: nf(mean(xs.map(x => x.mean)), 1), unit: '%', n, norm: mean(xs.map(x => x.mean)) };
    if (scale === 'sb4') return { label: '平均标准等级', value: mean(xs.map(x => x.valueMean)).toFixed(1), unit: '/4', n, norm: mean(xs.map(x => x.mean)) };
    if (scale === 'ks2') return { label: 'KS2 平均标准分', value: nf(mean(xs.map(x => x.valueMean)), 0), unit: '', sub: '100 为达到预期', n, norm: mean(xs.map(x => x.mean)) };
    if (scale === 'gcse') return { label: 'GCSE 平均等级', value: mean(xs.map(x => x.valueMean)).toFixed(1), unit: '/9', n, norm: mean(xs.map(x => x.mean)) };
    if (scale === 'alevel') return { label: 'A-level 平均', value: ALEVEL[Math.round(mean(xs.map(x => x.valueMean)))], unit: '', n, norm: mean(xs.map(x => x.mean)) };
  }

  /* fitness */
  const fits = D.fitness.map(t => {
    const fg = gradeAt(s, parseD(t.date));
    let ev = null, comp = null;
    if (sys.fit === 'gb') {
      const items = { ...t.items };
      if (items.bmi == null) { const b = bmiNear(t.date); if (b) items.bmi = +b.toFixed(1); }
      ev = gbEvaluate({ items }, s.sex, fg); ev.items = items;
      comp = ev.std;
    } else if (sys.fit === 'fg') {
      const z = Object.values(t.marks).filter(m => FG_ZONE[m]);
      comp = z.length ? z.filter(m => m === 'HFZ').length / z.length * 100 : null;
    } else {
      const p = Object.values(t.marks).filter(m => typeof m === 'number');
      comp = p.length ? mean(p) : null;
    }
    return { ...t, g: fg, ev, comp, sy: schoolYear(s.system, parseD(t.date)) };
  });

  /* growth */
  function bmiNear(date) {
    const w = D.health.filter(h => h.type === 'weight' && Math.abs(dayDiff(h.date, date)) <= 60).sort((a, b) => Math.abs(dayDiff(a.date, date)) - Math.abs(dayDiff(b.date, date)))[0];
    const h = D.health.filter(x => x.type === 'height' && Math.abs(dayDiff(x.date, date)) <= 120).sort((a, b) => Math.abs(dayDiff(a.date, date)) - Math.abs(dayDiff(b.date, date)))[0];
    return w && h ? w.value / ((h.value / 100) ** 2) : null;
  }
  const heights = D.health.filter(h => h.type === 'height').map(h => ({ ...h, mo: monthsAt(s, h.date) }));
  const weights = D.health.filter(h => h.type === 'weight').map(h => ({ ...h, mo: monthsAt(s, h.date) }));
  const bmis = weights.map(w => { const b = bmiNear(w.date); return b ? { date: w.date, mo: w.mo, bmi: b, z: w.mo != null ? whoZ('bmi', s.sex, w.mo, b) : null } : null; }).filter(Boolean);
  heights.forEach(h => { h.z = h.mo != null ? whoZ('hfa', s.sex, h.mo, h.value) : null; });
  const vision = D.health.filter(h => h.type === 'vision');

  /* lifestyle: last 30 days of check-ins */
  const recent = D.moods.filter(m => dayDiff(today, m.date) < 30 && dayDiff(today, m.date) >= 0);
  const sr = sleepRange(age);
  const sl = recent.filter(m => m.sleep != null), ac = recent.filter(m => m.active != null);
  const life = {
    n: recent.length, range: sr,
    sleep: sl.length ? mean(sl.map(m => m.sleep)) : null, sleepOk: sl.length ? sl.filter(m => m.sleep >= sr[0]).length / sl.length * 100 : null,
    active: ac.length ? mean(ac.map(m => m.active)) : null, activeOk: ac.length ? ac.filter(m => m.active >= ACTIVE_MIN).length / ac.length * 100 : null,
    mood: recent.length ? mean(recent.map(m => m.mood)) : null, stress: recent.filter(m => m.stress).length ? mean(recent.filter(m => m.stress).map(m => m.stress)) : null,
    low: D.moods.filter(m => dayDiff(today, m.date) < 14 && m.mood <= 2).length
  };

  /* radar: five dimensions per term, each with the data it came from */
  function radar(t) {
    const v = {}, src = {};
    const subj = subjects(t);
    v.academic = subj.length ? mean(subj.map(x => x.mean)) : null;
    v.academicScale = subj.length ? headline(subj).scale : null;
    src.academic = !subj.length ? '本学期暂无成绩' : `${subj.length} 科本学期均值${['pts', 'pct'].includes(v.academicScale) ? '' : `（${SCALES[v.academicScale].name}线性换算为百分制）`}`;
    for (const d of RATED) {
      const r = D.ratings.find(x => x.term === t && x.dim === d);
      v[d] = r ? MARKS[r.mark] : null;
      src[d] = r ? `学期评级 ${r.mark}（${MARK_CN[r.mark]}）${r.by ? ' · ' + r.by : ''}` : '本学期暂无评级';
    }
    const [ty] = t.split('-').map(Number);
    const comps = [];
    const ft = fits.filter(f => f.sy === ty && f.comp != null).pop();
    if (ft) comps.push(['体测', ft.comp]);
    const w5 = D.who5.filter(w => tk(w.date) === t);
    if (w5.length) comps.push(['WHO-5', mean(w5.map(w => w.score))]);
    const mt = D.moods.filter(m => tk(m.date) === t);
    const tAge = mt.length ? ageAt(s, mt[mt.length - 1].date) : age;
    const ms = mt.filter(m => m.sleep != null);
    if (ms.length >= 5) comps.push(['睡眠达标', ms.filter(m => m.sleep >= sleepRange(tAge)[0]).length / ms.length * 100]);
    if (mt.length >= 5) comps.push(['心情', (mean(mt.map(m => m.mood)) - 1) / 4 * 100]);
    v.health = comps.length ? mean(comps.map(c => c[1])) : null;
    src.health = comps.length ? comps.map(c => `${c[0]} ${nf(c[1], 0)}`).join(' · ') : '本学期暂无体测、自评或打卡';
    return { v, src };
  }

  // default: the latest term (up to now) with at least three of the five dimensions, else the latest term with scores
  const full = allTerms.filter(t => termCmp(t, curTerm) <= 0).reverse().find(t => DIMS.filter(k => radar(t).v[k] != null).length >= 3);
  const defTerm = full || (scoreTerms.includes(curTerm) ? curTerm : (scoreTerms[scoreTerms.length - 1] || curTerm));
  const term = ST.term && allTerms.includes(ST.term) ? ST.term : defTerm;
  const prevTerm = allTerms[allTerms.indexOf(term) - 1] || null;
  const subj = subjects(term);
  const R = radar(term), Rp = prevTerm ? radar(prevTerm) : null;
  const lastFit = fits[fits.length - 1] || null;
  const who5 = D.who5;
  const screens = D.screens.slice().sort(byDate('date')).reverse();
  return {
    s, sys, g, age, today, term, prevTerm, terms: allTerms, curTerm, scoreTerms, scores, subj, head: headline(subj),
    headPrev: prevTerm ? headline(subjects(prevTerm)) : null, subjects, radar: R, radarPrev: Rp,
    fits, lastFit, heights, weights, bmis, vision, life, who5, screens, bmiNear
  };
}

/* ---------- rule-based assessment: every line cites the data behind it ---------- */
function insights(m) {
  const out = [], s = m.s, P = isParent(), sp = t => /[A-Za-z]/.test(t) ? ` ${t} ` : t, dimName = k => sp(m.sys.dim(k));
  const R = m.radar.v, Rp = m.radarPrev ? m.radarPrev.v : null;
  const have = DIMS.filter(k => R[k] != null);
  if (have.length >= 3) {
    const hi = have.reduce((a, b) => R[b] > R[a] ? b : a), lo = have.reduce((a, b) => R[b] < R[a] ? b : a);
    if (R[hi] - R[lo] >= 5) {
      out.push({ k: 'up', t: `五维中<b>${dimName(hi)}</b>最突出（${nf(R[hi], 0)}）` });
      out.push({ k: 'info', t: P ? `<b>${dimName(lo)}</b>相对最弱（${nf(R[lo], 0)}），可作为下学期重点` : `<b>${dimName(lo)}</b>还有提升空间（${nf(R[lo], 0)}）` });
    }
  }
  if (Rp) for (const k of DIMS) if (R[k] != null && Rp[k] != null && Math.abs(R[k] - Rp[k]) >= 5 && !(k === 'academic' && R.academicScale !== Rp.academicScale)) {
    const d = R[k] - Rp[k];
    out.push({ k: d > 0 ? 'up' : 'down', t: `${dimName(k)}比上学期${d > 0 ? '提高' : '下降'} <b>${nf(Math.abs(d), 0)}</b>` });
  }
  for (const x of m.subj) {
    if (x.trend != null && Math.abs(x.trend) >= 3) {
      const n = Math.min(5, x.hist.length);
      out.push({ k: x.trend > 0 ? 'up' : 'down', t: `<b>${sp(esc(x.subject))}</b>近 ${n} 次成绩平均每次${x.trend > 0 ? '提高' : '下降'} ${nf(Math.abs(x.trend), 1)} 分（百分制）` });
    }
    if (x.avg != null && x.mean - x.avg >= 10) out.push({ k: 'up', t: `<b>${sp(esc(x.subject))}</b>高出班级均分 ${nf(x.mean - x.avg, 1)} 分` });
    else if (x.avg != null && x.avg - x.mean >= 5) out.push({ k: 'down', t: `<b>${sp(esc(x.subject))}</b>低于班级均分 ${nf(x.avg - x.mean, 1)} 分` });
  }
  const f = m.lastFit;
  if (f && dayDiff(m.today, f.date) < 400) {
    if (m.sys.fit === 'gb' && f.ev) {
      const weak = f.ev.rows.filter(r => r.sc != null && r.sc < 60);
      if (weak.length) out.push({ k: 'warn', t: `体测 ${weak.map(r => `<b>${gbItemName(r.k, s.sex)}</b> ${r.sc} 分`).join('、')}，未及格` });
      if (f.ev.total != null) out.push({ k: f.ev.total >= 80 ? 'up' : 'info', t: `体测总分 <b>${nf(f.ev.total, 1)}</b>，${gbGrade(f.ev.total)[0]}` });
    } else if (m.sys.fit === 'fg') {
      const ni = Object.entries(f.marks).filter(([, z]) => z === 'NI' || z === 'NIHR');
      if (ni.length) out.push({ k: 'warn', t: `FitnessGram ${ni.map(([k]) => `<b>${FIT.fg.items[k].name}</b>`).join('、')} 未进入健康区` });
    } else {
      const low = Object.entries(f.marks).filter(([, p]) => typeof p === 'number' && p < 20);
      if (low.length) out.push({ k: 'warn', t: `${low.map(([k, p]) => `<b>${FIT.eurofit.items[k].name}</b> 第 ${nf(p, 0)} 百分位`).join('、')}，低于同龄欧洲常模 20%` });
    }
  }
  const L = m.life;
  if (L.sleep != null && L.sleep < L.range[0]) out.push({ k: 'warn', t: `近 30 天平均睡眠 <b>${nf(L.sleep, 1)} 小时</b>，低于 ${m.age} 岁建议的 ${L.range[0]}–${L.range[1]} 小时` });
  if (L.active != null && L.active < ACTIVE_MIN) out.push({ k: 'info', t: `近 30 天日均运动 <b>${nf(L.active, 0)} 分钟</b>，WHO 建议每天平均 60 分钟` });
  const v = m.vision[m.vision.length - 1];
  if (v) {
    const vs = VISION[m.sys.vision], prev = m.vision[m.vision.length - 2];
    const low = [['左眼', v.value], ['右眼', v.value2]].filter(([, d]) => d != null && visionLow(d, m.age));
    if (low.length) out.push({ k: 'warn', t: `视力 ${low.map(([e, d]) => `${e} <b>${vs.show(d)}</b>`).join('、')}，低于正常` });
    if (prev) {
      const drop = Math.max(Math.log10(prev.value) - Math.log10(v.value), prev.value2 && v.value2 ? Math.log10(prev.value2) - Math.log10(v.value2) : 0);
      if (drop >= 0.1) out.push({ k: 'down', t: `视力比 ${fmtD(prev.date)} 下降 ${nf(drop * 10, 0)} 行` });
    }
  }
  const b = m.bmis[m.bmis.length - 1];
  if (b && b.z != null) { const t = bmiZTag(b.z); if (t[1] !== 'ok') out.push({ k: 'warn', t: `BMI ${nf(b.bmi, 1)}，按 WHO 2007 标准为<b>${t[0]}</b>（z = ${nf(b.z, 1)}）` }); }
  // parent-only: well-being and screening
  if (P) {
    const w = m.who5[m.who5.length - 1];
    if (w && dayDiff(m.today, w.date) < 120) {
      const bd = who5Band(w.score);
      if (bd[1] !== 'ok') out.push({ k: 'alert', t: `WHO-5 幸福感指数 <b>${w.score}</b>（${fmtMD(w.date)}），${bd[0]}`, parent: true });
    }
    if (L.low >= 3) out.push({ k: 'alert', t: `近 14 天有 <b>${L.low} 天</b>心情打卡为低落`, parent: true });
    const seen = new Set();
    for (const x of m.screens) {
      const key = x.scale + x.informant; if (seen.has(key)) continue; seen.add(key);
      const sc = SCREENS[x.scale];
      if (dayDiff(m.today, x.date) < 365 && sc.alert(x.score, x.informant)) out.push({ k: 'alert', t: `${esc(x.scale === 'other' ? x.label || '其他量表' : x.scale)} ${x.score} 分（${fmtMD(x.date)}），${sc.band(x.score, x.informant)[0]}`, parent: true });
    }
  }
  return out;
}

/* ---------- store: claude.ai Artifact db capability ----------
 * students/{sid}/{col} for records, data/private/{col} (admin-only rule) for screening results and parent notes. */
let DB = null;
const apath = (c, sid) => c === 'students' ? 'students' : PCOLS.includes(c) ? `data/private/${c}` : `students/${sid}/${c}`;
const abody = (c, sid, obj) => PCOLS.includes(c) ? { ...obj, sid } : obj;
const asnap = s => s.docs.map(d => ({ id: d.id, ...d.data() }));
const STORE = {
  canEdit: true, syncLabel: '已同步到云端',
  newId: c => DB.collection(apath(c, 'x')).doc().id,
  watchStudents: (cb, err) => DB.collection('students').onSnapshot(s => cb(asnap(s)), err),
  watchPin: cb => DB.doc('data/private/config/pin').onSnapshot(d => cb(d.exists ? d.data() : null), () => { }),
  watchRecords(c, sid, cb, err) {
    if (PCOLS.includes(c)) return DB.collection(apath(c)).where('sid', '==', sid).onSnapshot(s => cb(asnap(s)), () => { }); // hidden from viewers
    return DB.collection(apath(c, sid)).onSnapshot(s => cb(asnap(s)), err);
  },
  async add(c, sid, obj) { const r = DB.collection(apath(c, sid)).doc(); await r.set(abody(c, sid, obj)); return r.id; },
  put: (c, sid, id, obj) => DB.doc(`${apath(c, sid)}/${id}`).set(abody(c, sid, obj)),
  del: (c, sid, id) => DB.doc(`${apath(c, sid)}/${id}`).delete(),
  setPin: v => v ? DB.doc('data/private/config/pin').set(v) : DB.doc('data/private/config/pin').delete(),
  async deleteStudent(sid) {
    const jobs = [];
    for (const c of SCOLS) for (const d of (await DB.collection(apath(c, sid)).get()).docs) jobs.push(() => DB.doc(`${apath(c, sid)}/${d.id}`).delete());
    for (const c of PCOLS) for (const d of (await DB.collection(apath(c)).where('sid', '==', sid).get()).docs) jobs.push(() => DB.doc(`${apath(c)}/${d.id}`).delete());
    await runJobs(jobs);
    await DB.doc('students/' + sid).delete();
  },
  async writeExamples(ex) {
    const jobs = [];
    for (const s of ex.students) {
      const { id, ...b } = s;
      jobs.push(() => DB.doc('students/' + id).set(b));
      for (const c of SCOLS) for (const r of ex.records[id][c] || []) { const { id: rid2, ...rb } = r; jobs.push(() => DB.doc(`students/${id}/${c}/${rid2}`).set(rb)); }
    }
    for (const c of PCOLS) for (const r of ex.private[c] || []) { const { id: rid2, ...rb } = r; jobs.push(() => DB.doc(`data/private/${c}/${rid2}`).set(rb)); }
    await runJobs(jobs);
  }
};

// claude.use resolves asynchronously, or null outside claude.ai: fall back to the browser's local storage
async function connect() {
  let db = null, user = null;
  try { db = window.claude && window.claude.use ? await window.claude.use('db') : null; } catch { db = null; }
  if (!db) { loadLocal(); mode = 'local'; setSync('本地模式 · 只存在此浏览器', true); renderAll(); return; }
  try { user = await window.claude.use('user'); } catch { user = null; }
  if (user) { try { STORE.canEdit = await user.canEdit(); } catch { STORE.canEdit = true; } }
  STORE.syncLabel = STORE.canEdit ? '已同步到云端' : '只读 · 云端数据';
  DB = db;
  connectStore();
}

/* ---------- SVG charts: hairline grid, 2px lines, ringed markers, data-tip hover ---------- */
const f1 = v => Math.round(v * 10) / 10;
const tipAttr = t => t ? ` data-tip="${esc(t)}"` : '';

// five-axis radar; null values leave a gap (no vertex) instead of pretending to be zero
function radarSVG(labels, cur, prev, o = {}) {
  const W = o.w || 360, H = o.h || 320, cx = W / 2, cy = H / 2 + 6, R = Math.min(W, H) / 2 - 58;
  const n = labels.length, ang = i => -Math.PI / 2 + i * 2 * Math.PI / n;
  const pt = (i, v) => [cx + Math.cos(ang(i)) * R * v / 100, cy + Math.sin(ang(i)) * R * v / 100];
  let s = `<svg class="radar" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.aria || '综合素质五维图')}">`;
  for (const r of [20, 40, 60, 80, 100]) s += `<polygon class="ring${r === 60 ? ' mid' : ''}" points="${labels.map((_, i) => pt(i, r).map(f1).join(',')).join(' ')}"/>`;
  labels.forEach((_, i) => { const [x, y] = pt(i, 100); s += `<line class="spoke" x1="${cx}" y1="${cy}" x2="${f1(x)}" y2="${f1(y)}"/>`; });
  const ta = ang(0) + Math.PI / n; // scale labels sit between the first two axes
  for (const r of [100]) s += `<text class="rtick" x="${f1(cx + Math.cos(ta) * R * r / 100 + 3)}" y="${f1(cy + Math.sin(ta) * R * r / 100 - 3)}">${r}</text>`;
  const poly = (vals, cls) => {
    const ps = vals.map((v, i) => v == null ? null : pt(i, clamp(v, 0, 100))).filter(Boolean);
    if (ps.length < 3) return '';
    return `<polygon class="${cls}" points="${ps.map(p => p.map(f1).join(',')).join(' ')}"/>`;
  };
  if (prev) s += poly(prev, 'rp-prev');
  s += poly(cur, 'rp-cur');
  cur.forEach((v, i) => {
    if (v == null) return;
    const [x, y] = pt(i, clamp(v, 0, 100));
    s += `<circle class="rdot" cx="${f1(x)}" cy="${f1(y)}" r="4.5"${tipAttr(`${labels[i]} ${nf(v, 0)}${prev && prev[i] != null ? `（上期 ${nf(prev[i], 0)}）` : ''}`)}/>`;
  });
  labels.forEach((l, i) => {
    const [x, y] = pt(i, 100), a = ang(i), dx = Math.cos(a), dy = Math.sin(a);
    const tx = x + dx * 16, ty = y + dy * 16 + (dy > 0.3 ? 12 : dy < -0.3 ? -8 : 4);
    const anchor = Math.abs(dx) < 0.2 ? 'middle' : dx > 0 ? 'start' : 'end';
    const v = cur[i];
    s += `<text class="rlab" x="${f1(tx)}" y="${f1(ty)}" text-anchor="${anchor}">${esc(l)}</text>`;
    s += `<text class="rval${v == null ? ' na' : ''}" x="${f1(tx)}" y="${f1(ty + 16)}" text-anchor="${anchor}">${v == null ? '暂无' : nf(v, 0)}</text>`;
  });
  return s + '</svg>';
}

// generic line chart: x and y are numeric; ticks carry their own labels
function lineSVG(c) {
  const W = c.w || 640, H = c.h || 240, m = Object.assign({ l: 40, r: 64, t: 14, b: 28 }, c.m || {});
  const X = v => m.l + (v - c.x.min) / ((c.x.max - c.x.min) || 1) * (W - m.l - m.r);
  const Y = v => H - m.b - (clamp(v, c.y.min, c.y.max) - c.y.min) / ((c.y.max - c.y.min) || 1) * (H - m.t - m.b);
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(c.aria || '')}">`;
  for (const b of c.bands || []) s += `<rect class="band ${b.cls || ''}" x="${m.l}" y="${f1(Y(b.y1))}" width="${W - m.l - m.r}" height="${f1(Math.max(0, Y(b.y0) - Y(b.y1)))}"/>` + (b.label ? `<text class="blab" x="${W - m.r + 6}" y="${f1((Y(b.y0) + Y(b.y1)) / 2 + 4)}">${esc(b.label)}</text>` : '');
  for (const t of c.y.ticks) s += `<line class="grid" x1="${m.l}" x2="${W - m.r}" y1="${f1(Y(t.v))}" y2="${f1(Y(t.v))}"/><text class="tick" x="${m.l - 8}" y="${f1(Y(t.v) + 4)}" text-anchor="end">${esc(t.label ?? t.v)}</text>`;
  for (const t of c.x.ticks) s += `<text class="tick" x="${f1(X(t.v))}" y="${H - 8}" text-anchor="middle">${esc(t.label)}</text>`;
  s += `<line class="axis" x1="${m.l}" x2="${W - m.r}" y1="${H - m.b}" y2="${H - m.b}"/>`;
  for (const ln of c.series) {
    const ps = ln.pts.filter(p => p.y != null);
    if (!ps.length) continue;
    const d = ps.map((p, i) => `${i ? 'L' : 'M'}${f1(X(p.x))} ${f1(Y(p.y))}`).join('');
    if (ln.area && ps.length > 1) s += `<path class="area ${ln.cls}" d="${d}L${f1(X(ps[ps.length - 1].x))} ${H - m.b}L${f1(X(ps[0].x))} ${H - m.b}Z"/>`;
    if (ps.length > 1) s += `<path class="line ${ln.cls}${ln.dash ? ' dash' : ''}" d="${d}"/>`;
    if (ln.dots !== false) for (const p of ps) s += `<circle class="dot ${ln.cls}" cx="${f1(X(p.x))}" cy="${f1(Y(p.y))}" r="${ln.r || 4}"/><circle class="hit" cx="${f1(X(p.x))}" cy="${f1(Y(p.y))}" r="12"${tipAttr(p.tip)}/>`;
    if (ln.label) { const p = ps[ps.length - 1]; s += `<text class="elab" x="${f1(X(p.x) + 9)}" y="${f1(Y(p.y) + 4)}">${esc(ln.label)}</text>`; }
  }
  return s + '</svg>';
}

// daily bars against a recommended band (sleep hours, active minutes)
function barsSVG(c) {
  const W = c.w || 640, H = c.h || 150, m = { l: 34, r: 12, t: 10, b: 24 };
  const n = c.days, bw = (W - m.l - m.r) / n;
  const Y = v => H - m.b - clamp(v, 0, c.max) / c.max * (H - m.t - m.b);
  let s = `<svg class="chart bars" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(c.aria || '')}">`;
  if (c.band) s += `<rect class="band" x="${m.l}" y="${f1(Y(c.band[1]))}" width="${W - m.l - m.r}" height="${f1(Y(c.band[0]) - Y(c.band[1]))}"/>`;
  for (const t of c.ticks) s += `<line class="grid" x1="${m.l}" x2="${W - m.r}" y1="${f1(Y(t))}" y2="${f1(Y(t))}"/><text class="tick" x="${m.l - 6}" y="${f1(Y(t) + 4)}" text-anchor="end">${t}</text>`;
  c.vals.forEach((v, i) => {
    const x = m.l + i * bw + Math.max(1, bw * 0.18), w = Math.max(2, Math.min(14, bw * 0.64));
    if (v.y == null) return;
    const y = Y(v.y), h = H - m.b - y;
    s += `<path class="bar${v.ok ? '' : ' low'}" d="M${f1(x)} ${H - m.b}V${f1(y + Math.min(3, h))}q0 -3 3 -3h${f1(w - 6)}q3 0 3 3V${H - m.b}Z"/>`;
    s += `<rect class="hit" x="${f1(m.l + i * bw)}" y="${m.t}" width="${f1(bw)}" height="${H - m.t - m.b}"${tipAttr(v.tip)}/>`;
  });
  for (const t of c.xt) s += `<text class="tick" x="${f1(m.l + t.i * bw + bw / 2)}" y="${H - 6}" text-anchor="middle">${esc(t.label)}</text>`;
  s += `<line class="axis" x1="${m.l}" x2="${W - m.r}" y1="${H - m.b}" y2="${H - m.b}"/>`;
  return s + '</svg>';
}

function spark(arr, o = {}) {
  if (!arr.length) return '';
  const w = o.w || 92, h = o.h || 28, pad = 4, lo = Math.min(...arr, o.lo ?? 100), hi = Math.max(...arr, o.hi ?? 0);
  const x = i => arr.length === 1 ? w / 2 : pad + i * (w - pad * 2) / (arr.length - 1);
  const y = v => hi === lo ? h / 2 : h - pad - (v - lo) / (hi - lo) * (h - pad * 2);
  const up = arr[arr.length - 1] >= arr[0] ? 'up' : 'dn';
  const d = arr.map((v, i) => `${i ? 'L' : 'M'}${f1(x(i))} ${f1(y(v))}`).join('');
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" aria-hidden="true"><path class="sl ${up}" d="${d}"/><circle class="${up}" cx="${f1(x(arr.length - 1))}" cy="${f1(y(arr[arr.length - 1]))}" r="3"/></svg>`;
}

// line-art face for the 1–5 mood scale
function moodFace(level, size = 28) {
  const c = size / 2, r = c - 1.5, my = c + r * 0.32, w = r * 0.5;
  const curve = [0, -0.34, -0.16, 0, 0.18, 0.36][level] * r;
  return `<svg class="face f${level}" viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" aria-hidden="true"><circle cx="${c}" cy="${c}" r="${r}"/><circle class="eye" cx="${f1(c - r * 0.36)}" cy="${f1(c - r * 0.16)}" r="${f1(r * 0.09)}"/><circle class="eye" cx="${f1(c + r * 0.36)}" cy="${f1(c - r * 0.16)}" r="${f1(r * 0.09)}"/><path d="M${f1(c - w)} ${f1(my - curve / 2)}Q${c} ${f1(my + curve)} ${f1(c + w)} ${f1(my - curve / 2)}"/></svg>`;
}

// nice round ticks between lo and hi
function niceTicks(lo, hi, n = 4) {
  const span = hi - lo || 1, step0 = span / n, mag = Math.pow(10, Math.floor(Math.log10(step0)));
  const step = [1, 2, 2.5, 5, 10].map(k => k * mag).find(s => span / s <= n) || 10 * mag;
  const a = Math.floor(lo / step) * step, b = Math.ceil(hi / step) * step, out = [];
  for (let v = a; v <= b + step / 2; v += step) out.push(+v.toFixed(6));
  return out;
}

function subjDetail(x) {
  const sys = M.s.system, recs = x.hist, others = x.all.filter(r => r.scale !== x.scale);
  const scales = new Set(recs.map(r => r.scale)), one = scales.size === 1 ? [...scales][0] : null;
  const native = one && ['gcse', 'alevel', 'ks2', 'sb4'].includes(one);
  const sc = native ? SCALES[one] : null;
  const yv = r => native ? r.value : r.norm, ya = r => native ? r.avg : r.avgNorm;
  const ys = recs.flatMap(r => [yv(r), ya(r)]).filter(v => v != null);
  let y;
  if (native) { const ticks = one === 'gcse' ? [1, 3, 5, 7, 9] : one === 'alevel' ? [1, 2, 3, 4, 5, 6] : one === 'ks2' ? [80, 90, 100, 110, 120] : [1, 2, 3, 4]; y = { min: sc.min, max: sc.max, ticks: ticks.map(v => ({ v, label: one === 'alevel' ? ALEVEL[v] : v })) }; }
  else { const lo = Math.max(0, Math.floor((Math.min(...ys) - 6) / 10) * 10); y = { min: lo, max: 100, ticks: niceTicks(lo, 100, 4).filter(v => v >= lo && v <= 100).map(v => ({ v })) }; }
  const n = recs.length, step = Math.max(1, Math.ceil(n / 7));
  const chart = lineSVG({
    aria: `${x.subject} 成绩走势`, w: chartW(false), h: 220, x: { min: 0, max: Math.max(1, n - 1), ticks: recs.map((r, i) => ({ v: i, label: fmtMD(r.date) })).filter((_, i) => i % step === 0 || i === n - 1) }, y,
    series: [
      { cls: 'ref', dash: true, r: 3, label: recs.some(r => r.avg != null) ? '班均' : '', pts: recs.map((r, i) => ({ x: i, y: ya(r), tip: r.avg != null ? `${fmtD(r.date)} 班级均分 ${SCALES[r.scale].show(r.avg, r.full).replace(/<[^>]+>/g, '')}` : '' })) },
      { cls: 's1', area: true, label: '本人', pts: recs.map((r, i) => ({ x: i, y: yv(r), tip: `${fmtD(r.date)} ${r.kind} ${SCALES[r.scale].show(r.value, r.full).replace(/<[^>]+>/g, '')}` })) }
    ]
  });
  return `<div class="panel">
    <h3><span>${subjName(sys, x.subject)} · 全部记录</span><small>${native ? esc(sc.name) : '百分制换算'}</small></h3>

  </div>`;
}

    const curve = z => { const out = []; for (let mo = Math.ceil(a0 * 12); mo <= Math.min(228, Math.floor(a1 * 12)); mo += 3) { const v = whoAt(kind, s.sex, mo, z); if (v) out.push({ x: mo / 12, y: v }); } return out; };

function formFit(id) {
  const r = id ? find('fitness', id) : null, s = D.st, sys = SYS[s.system].fit;

    async onSubmit() {
      const date = fv('fDate');
      if (!isDate(date) || date > today()) return ferr('请选择不晚于今天的日期');
      const def = FIT[sys].items, items = {}, marks = {};
      for (const k in def) {
        const el = $('fi_' + k); if (!el || !el.value.trim()) continue;
        const v = def[k].time ? parseMMSS(el.value) : num(el.value.trim());
        if (v == null || v < (k === 'sr' || k === 'sitreach' ? -50 : 0)) return ferr(`${def[k].name}：格式不对${def[k].time ? '，例如 3\'45"' : ''}`);
        items[k] = v;
      }
      for (const k in def) {
        const el = $('fm_' + k); if (!el || !el.value) continue;
        if (sys === 'fg') marks[k] = el.value;
        else { const p = num(el.value); if (p == null || p < 0 || p > 100) return ferr(`${def[k].name}：百分位应为 0–100`); marks[k] = p; }
      }
      const h = fn('fH'), w = fn('fW');
      if (h != null && (h < 60 || h > 230)) return ferr('身高应在 60–230 cm');
      if (w != null && (w < 10 || w > 200)) return ferr('体重应在 10–200 kg');
      if (h && w) items.bmi = Math.round(w / ((h / 100) ** 2) * 10) / 10;
      if (!Object.keys(items).length && !Object.keys(marks).length) return ferr('至少填写一项');
      return save(async () => {
        if (h) await add('health', { date, type: 'height', value: h, example: false });

        const obj = { date, items, marks, note: '', example: false };

      });
    }
  });
  $('fDate').addEventListener('change', () => { if (isDate(fv('fDate'))) $('fFitWrap').innerHTML = fitFields(sys, fv('fDate'), r); });
}
function fitFields(sys, date, r) {

      ...plan.filter(([k]) => k !== 'bmi').map(([k, w]) => F.num('fi_' + k, `${gbItemName(k, s.sex)}（${w}%）· ${def[k].unit}`, val(k), def[k].time ? { text: true, ph: '如 3\'45"' } : { step: 'any' }))

  return Object.keys(def).map(k => `<div class="fitrow"><b>${esc(def[k].name)}</b>${grid(F.num('fi_' + k, def[k].unit, val(k), def[k].time ? { text: true, ph: '如 9\'30"' } : {}), mk(k))}</div>`).join('');
}

  openSheet(D.pin ? '修改家长 PIN' : '设置家长 PIN', grid(F.num('fPin1', '4–6 位数字', '', { text: true, ph: '••••' }), F.num('fPin2', '再输一次', '', { text: true, ph: '••••' })) +
    F.note('设置后，从「学生」视角切回「家长」视角需要输入 PIN。它防止孩子在同一台设备上误入家长视角，不是加密。'), {
    extra: D.pin ? '<button type="button" class="btn danger" data-act="pin-clear">移除 PIN</button>' : '',
    async onSubmit() {
      const a = fv('fPin1'), b = fv('fPin2');
      if (!/^\d{4,6}$/.test(a)) return ferr('PIN 应为 4–6 位数字');
      if (a !== b) return ferr('两次输入不一致');
      try { await setPin(a); closeSheet(); renderFoot(); toast('已设置家长 PIN'); } catch (e) { fail(e); }
    }
  });
  ['fPin1', 'fPin2'].forEach(id => { const el = $(id); el.type = 'password'; el.inputMode = 'numeric'; el.autocomplete = 'off'; });
}
function formPinEnter() {
  openSheet('切回家长视角', F.num('fPin', '家长 PIN', '', { text: true, ph: '••••' }), {
    submit: '确认',
    async onSubmit() {
      const ok = await checkPin(fv('fPin'));
      if (!ok) { $('fPin').value = ''; return ferr('PIN 不对'); }
      closeSheet(); setRole('parent');
    }
  });
  const el = $('fPin'); el.type = 'password'; el.inputMode = 'numeric'; el.autocomplete = 'off';
}

/* ---------- roles ---------- */
function setRole(r) {
  ST.role = r; saveUI(); renderAll();
  toast(r === 'student' ? (D.pin ? '已切换到学生视角，切回需要家长 PIN' : '已切换到学生视角。可在页脚设置家长 PIN，防止孩子切回') : '已切换到家长视角');
}

/* ---------- AI 评语 through the sample capability ---------- */
function aiPrompt(m, ins) {
  const s = m.s, strip = h => String(h).replace(/<[^>]+>/g, '');
  const L = m.life, f = m.lastFit, w = m.who5[m.who5.length - 1];
  const lines = [
    `学制：${m.sys.name}；年级：${gradeLabel(s, m.g)}（${m.sys.stage(clamp(m.g, 0, m.sys.maxG))}）；性别：${sexCN(s.sex)}；年龄：${m.age ?? '未填'} 岁；学期：${termName(s.system, m.term)}`,
    '综合素质五维（0–100，括号内为数据来源）：' + DIMS.map(k => `${DIM_CN[k]} ${m.radar.v[k] == null ? '暂无' : nf(m.radar.v[k], 0)}（${strip(m.radar.src[k])}）`).join('；'),
    m.head ? `学业概况：${m.head.label} ${m.head.value}${m.head.unit}` : '本学期没有成绩记录',
    ...m.subj.map(x => `- ${x.subject}：本学期均值 ${nf(x.mean, 1)}（百分制）${x.avg != null ? `，班级均分 ${nf(x.avg, 1)}` : ''}${x.trend != null ? `，近几次每次变化 ${x.trend > 0 ? '+' : ''}${nf(x.trend, 1)}` : ''}`),
    f ? `最近体测 ${f.date}：` + (m.sys.fit === 'gb' && f.ev ? (f.ev.total != null ? `总分 ${f.ev.total}（${gbGrade(f.ev.total)[0]}）；` : '') + f.ev.rows.filter(r => r.sc != null).map(r => `${gbItemName(r.k, s.sex)} ${r.sc} 分`).join('，') : m.sys.fit === 'fg' ? Object.entries(f.marks).map(([k, z]) => `${FIT.fg.items[k].name} ${z}`).join('，') : Object.entries(f.marks).map(([k, p]) => `${FIT.eurofit.items[k].name} 第 ${p} 百分位`).join('，')) : '没有体测记录',
    L.n ? `近 30 天：平均睡眠 ${L.sleep != null ? nf(L.sleep, 1) : '—'} 小时（建议 ${L.range[0]}–${L.range[1]}），日均运动 ${L.active != null ? nf(L.active, 0) : '—'} 分钟，平均心情 ${nf(L.mood, 1)}/5` : '近 30 天没有打卡',
    w ? `WHO-5 幸福感指数：${w.score}/100（${w.date}）` : '',
    '规则引擎已得出的结论：' + ins.map(x => strip(x.t)).join('；')
  ].filter(Boolean);
  return `你是一位经验丰富、措辞克制的班主任。根据下面这位学生的数据，给家长写一段 180–220 字的学期评语：先一句总评，再分述学业、身心、其他方面，最后给出三条具体、可执行的建议（编号列出）。
要求：只依据给出的数据，不编造事实或数字；数据缺失就说明缺失；不做医学或心理诊断，涉及心理健康时语气温和，并建议需要时找专业人员评估；用简体中文。

${lines.join('\n')}`;
}
async function runAI() {
  if (AI.busy) return;
  let sample = null;
  try { sample = window.claude && window.claude.use ? await window.claude.use('sample') : null; } catch { sample = null; }
  if (!sample) { AI.err = '这个页面没有连到 Claude（需要在 claude.ai 中打开），评语功能不可用。'; renderAll(); return; }
  AI = { text: '', busy: true, err: '', sid: CUR };
  renderAll();
  const sid = CUR;
  try {
    const r = await sample(aiPrompt(M, INS), { modelTier: 'default', onText: ({ text }) => { if (sid !== CUR) return; AI.text = text; const el = $('aiText'); if (el) { el.classList.remove('muted'); el.innerHTML = esc(text).replace(/\n/g, '<br>'); } } });
    if (sid === CUR) AI.text = r.text;
  } catch (e) {
    AI.text = (e && e.text) || '';
    AI.err = e && e.code === 'not_granted' ? '没有授权调用 Claude，评语功能不可用。' : e && e.code === 'rate_limited' ? '调用太频繁，请稍后再试。' : '生成失败，请稍后再试。';
  }
  AI.busy = false;
  if (sid === CUR) renderAll();
}

/* ---------- check-in ---------- */
function ckCapture() {
  CK = { sid: CUR, date: todayISO(), v: Object.assign({}, CK.sid === CUR && CK.date === todayISO() ? CK.v : {}) };
  if ($('ckSleep')) { CK.v.sleep = $('ckSleep').value; CK.v.active = $('ckActive').value; CK.v.note = $('ckNote').value; }
}
async function ckSubmit() {
  ckCapture();
  const mine = D.moods.find(x => x.date === todayISO());
  const mood = CK.v.mood || (mine && mine.mood);
  if (!mood) { toast('先选一个心情'); return; }
  const sleep = num(CK.v.sleep), active = num(CK.v.active);
  if (sleep != null && (sleep < 0 || sleep > 16)) { toast('睡眠时长应在 0–16 小时'); return; }
  if (active != null && (active < 0 || active > 600)) { toast('运动时长应在 0–600 分钟'); return; }
  const obj = { date: todayISO(), mood, stress: CK.v.stress || (mine ? mine.stress : null), sleep, active, note: String(CK.v.note || '').slice(0, 140), example: false };
  try {
    if (mine) await put('moods', mine.id, obj); else await add('moods', obj);
    CK = { sid: null, date: null, v: {} };
    toast(isParent() ? '已保存今天的打卡' : '记好啦，明天见');
  } catch (e) { fail(e); }
}

/* ---------- delete with a second tap to confirm ---------- */
let ARM = { k: null, t: 0 };
function armed(k) {
  if (ARM.k === k && Date.now() - ARM.t < 4000) { ARM = { k: null, t: 0 }; return true; }
  ARM = { k, t: Date.now() }; toast('再点一次确认删除'); return false;
}

/* ---------- events ---------- */
const EDIT = { scores: formScore, fitness: formFit, health: formHealthEdit, merits: formMerit, screens: formScreen, notes: formNote };
document.addEventListener('click', async e => {
  const b = e.target.closest('[data-act]');
  if (!b) { if (!e.target.closest('[data-tip]')) hideTip(); return; }
  const a = b.dataset.act;
  if (a.startsWith('web-')) return; // account.js
  if (a === 'close') return closeSheet();
  if (a === 'go') { ST.view = b.dataset.v; saveUI(); renderAll(); $('main').scrollTop = 0; return; }
  if (a === 'kid') return switchStudent(b.dataset.id);
  if (a === 'term') { ST.term = b.dataset.t; return renderAll(); }
  if (a === 'subj') { ST.subj = b.dataset.s; return renderAll(); }
  if (a === 'growth') { ST.growth = b.dataset.g; return renderAll(); }
  if (a === 'copy') {
    const t = b.dataset.t;
    try { await navigator.clipboard.writeText(t); toast('已复制 ' + t); }
    catch { const el = b.parentElement.querySelector('.sel'); if (el) { const r = document.createRange(); r.selectNodeContents(el); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); } toast('号码已选中，可手动复制'); }
    return;
  }
  if (a === 'ck-mood' || a === 'ck-stress') {
    ckCapture();
    CK.v[a === 'ck-mood' ? 'mood' : 'stress'] = +b.dataset.v;
    b.parentElement.querySelectorAll('[role=radio]').forEach(x => x.setAttribute('aria-checked', String(x === b)));
    return;
  }
  if (a === 'who5') { if (canWrite()) formWho5(); return; }
  if (a === 'ai') return runAI();
  // everything below changes data
  if (a === 'load-ex') { if (!guardWrite(true)) return; b.disabled = true; try { await loadExamples(); toast('已载入 3 个示例学生'); } catch (err) { fail(err); } return; }
  if (a === 'new-student') { if (guardWrite(true)) formStudent(true); return; }
  if (!isParent() || !guardWrite()) return;
  if (a === 'clear-ex') { if (!armed('clear-ex')) return; try { const n = await clearExamples(); toast(`已清除 ${n} 个示例学生`); } catch (err) { fail(err); } return; }
  if (a === 'edit-student') return formStudent(false);
  if (a === 'del-student') {
    if (!armed('del-student')) { b.textContent = '确认删除档案'; return; }
    try { await deleteStudent(); closeSheet(); toast('档案已删除'); } catch (err) { fail(err); }
    return;
  }
  if (a === 'add-score') return formScore();
  if (a === 'add-fit') return formFit();
  if (a === 'add-growth') return formGrowth();
  if (a === 'add-vision') return formVision();
  if (a === 'add-rating') return formRating();
  if (a === 'add-merit') return formMerit();
  if (a === 'add-screen') return formScreen();
  if (a === 'add-note') return formNote();
  if (a === 'pin') return formPinSet();
  if (a === 'pin-clear') { try { await setPin(null); closeSheet(); renderFoot(); toast('已移除家长 PIN'); } catch (err) { fail(err); } return; }
  if (a.startsWith('edit-')) { const f = EDIT[a.slice(5)]; if (f) f(b.dataset.id); return; }
  if (a === 'del') {
    const c = b.dataset.c, id = b.dataset.id;
    if (!COLS.includes(c) || !armed(c + id)) return;
    try { await del(c, id); toast('已删除'); } catch (err) { fail(err); }
  }
});
$('role').addEventListener('click', e => {
  const b = e.target.closest('button[data-role]'); if (!b || b.dataset.role === ST.role) return;
  if (b.dataset.role === 'parent' && D.pin && pinSupported()) return formPinEnter();
  setRole(b.dataset.role);
});
$('nav').addEventListener('click', e => {
  const b = e.target.closest('button[data-v]'); if (!b) return;
  ST.view = b.dataset.v; saveUI(); renderAll(); $('main').scrollTop = 0;
});
document.addEventListener('submit', e => {
  e.preventDefault();
  if (e.target.id === 'sheetForm' && FORM && FORM.onSubmit) { $('ferr').textContent = ''; FORM.onSubmit(); }
  if (e.target.id === 'ckForm') { if (canWrite()) ckSubmit(); else toast('你只有查看权限'); }
});
$('scrim').addEventListener('click', closeSheet);
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && $('sheet').classList.contains('on')) closeSheet();
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[role=button][data-act]')) { e.preventDefault(); e.target.click(); }
});

/* ---------- tooltip for chart marks ---------- */
const tip = $('tip');
function showTip(el, x, y) {
  tip.textContent = el.dataset.tip; tip.classList.add('on');
  const r = tip.getBoundingClientRect();
  tip.style.left = clamp(x - r.width / 2, 8, innerWidth - r.width - 8) + 'px';
  tip.style.top = (y - r.height - 14 < 8 ? y + 18 : y - r.height - 14) + 'px';
}
function hideTip() { tip.classList.remove('on'); }
document.addEventListener('pointerover', e => { const el = e.target.closest('[data-tip]'); if (el && el.dataset.tip && e.pointerType === 'mouse') showTip(el, e.clientX, e.clientY); });
document.addEventListener('pointermove', e => { const el = e.target.closest('[data-tip]'); if (el && el.dataset.tip && e.pointerType === 'mouse') showTip(el, e.clientX, e.clientY); else if (e.pointerType === 'mouse') hideTip(); });
document.addEventListener('pointerdown', e => { const el = e.target.closest('[data-tip]'); if (el && el.dataset.tip && e.pointerType !== 'mouse') { showTip(el, e.clientX, e.clientY); clearTimeout(hideTip.t); hideTip.t = setTimeout(hideTip, 2600); } });
$('main').addEventListener('scroll', hideTip, { passive: true });

let lastW = innerWidth, resizeT = 0;
addEventListener('resize', () => { clearTimeout(resizeT); resizeT = setTimeout(() => { if (innerWidth !== lastW) { lastW = innerWidth; renderAll(); } }, 160); });

/* ---------- start ---------- */
if (ST.role === 'student' && !lsGet(LSK.ui)) ST.role = 'parent';
renderAll();
if (TARGET !== 'artifact') { $('acct').addEventListener('click', () => openAccount()); startWeb(); }
else if (window.claude && window.claude.use) connect(); // claude.use resolves asynchronously, or null outside claude.ai
else { loadLocal(); mode = 'local'; setSync('本地模式 · 只存在此浏览器', true); renderAll(); }

})();</script>
