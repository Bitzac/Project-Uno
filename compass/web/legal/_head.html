<!doctype html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{title}} · 成长罗盘</title>
<style>
:root{--bg:#F6F8FB;--ink:#0B1220;--muted:#4B566B;--line:rgba(11,18,32,.14);--accent:#2456C8;--warn:#A86400;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0B111C;--ink:#E8EEF8;--muted:#A3AFC2;--line:rgba(255,255,255,.14);--accent:#6F9BFF;--warn:#F2B13D;color-scheme:dark}}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.75 "Noto Sans SC",system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;padding:32px 16px 56px}
main{max-width:760px;margin:0 auto}
h1{font-size:28px;line-height:1.3;margin:0 0 6px}
h2{font-size:18px;margin:30px 0 8px;padding-top:14px;border-top:1px solid var(--line)}
h3{font-size:15.5px;margin:18px 0 6px}
p,li{color:var(--ink)}
.meta{color:var(--muted);font-size:13.5px}
.draft{border:1px solid var(--warn);color:var(--warn);border-radius:10px;padding:8px 12px;font-size:13.5px;margin:14px 0 6px}
table{border-collapse:collapse;width:100%;font-size:14px;margin:8px 0}
th,td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top}
th{font-weight:700;color:var(--muted);font-size:13px}
.tbl{overflow-x:auto}
a{color:var(--accent)}
</style>
</head>
