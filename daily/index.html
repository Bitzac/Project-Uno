<title>UNO 日刊</title>
<meta name="description" content="UNO 日刊：户外运动、AI、科技前沿、政治经济、国际市场，每日一期。">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..900&family=Noto+Sans+SC:wght@300;400;500;700;800;900&display=swap">
<style>/* Layout: a print-magazine column floating over a cool aurora. Expanded heavy masthead, vertical 日刊, hairline rules everywhere, liquid glass only on the lead story of each section, the cover ticker and the top bar. */
:root{--bg:#ECEFF3;--blob1:#BCD0FF;--blob2:#DCCBFF;--blob3:#BFEADB;--blob4:#FFDDBE;--ink:#0C0F14;--muted:#475060;--faint:#6B7484;--glass-a:rgba(255,255,255,.64);--glass-b:rgba(255,255,255,.3);--glass-edge:rgba(255,255,255,.95);--glass-inner:rgba(255,255,255,.98);--shadow:rgba(28,40,72,.16);--line:rgba(12,15,20,.18);--line-soft:rgba(12,15,20,.08);--field:rgba(255,255,255,.42);--accent:#3044CF;--accent-soft:rgba(48,68,207,.1);--red:#B82626;--green:#08703F;--track:rgba(12,15,20,.07);--hair:1px;--f-mast:"Archivo","Noto Sans SC",system-ui,sans-serif;--f-body:"Noto Sans SC","Archivo",system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;--f-num:"Archivo","Noto Sans SC",system-ui,sans-serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#07090D;--blob1:#1A2C66;--blob2:#36225F;--blob3:#0E4638;--blob4:#553613;--ink:#ECEFF4;--muted:#A6AEBB;--faint:#7D8695;--glass-a:rgba(30,34,45,.62);--glass-b:rgba(14,16,22,.4);--glass-edge:rgba(255,255,255,.14);--glass-inner:rgba(255,255,255,.18);--shadow:rgba(0,0,0,.55);--line:rgba(255,255,255,.17);--line-soft:rgba(255,255,255,.07);--field:rgba(255,255,255,.04);--accent:#A3ADFF;--accent-soft:rgba(163,173,255,.14);--red:#FF6B6B;--green:#3DD68C;--track:rgba(255,255,255,.08);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#07090D;--blob1:#1A2C66;--blob2:#36225F;--blob3:#0E4638;--blob4:#553613;--ink:#ECEFF4;--muted:#A6AEBB;--faint:#7D8695;--glass-a:rgba(30,34,45,.62);--glass-b:rgba(14,16,22,.4);--glass-edge:rgba(255,255,255,.14);--glass-inner:rgba(255,255,255,.18);--shadow:rgba(0,0,0,.55);--line:rgba(255,255,255,.17);--line-soft:rgba(255,255,255,.07);--field:rgba(255,255,255,.04);--accent:#A3ADFF;--accent-soft:rgba(163,173,255,.14);--red:#FF6B6B;--green:#3DD68C;--track:rgba(255,255,255,.08);color-scheme:dark}
@media (min-resolution:2dppx){:root{--hair:.5px}}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.65;padding-inline:16px;padding-block:0 48px;position:relative;overflow-x:hidden;--pos:var(--red);--neg:var(--green)}
body[data-updown="us"]{--pos:var(--green);--neg:var(--red)}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
h1,h2,h3,h4{margin:0;text-wrap:balance}
p{margin:0}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.up{color:var(--pos)}
.dn{color:var(--neg)}

/* aurora + glass */
.aurora{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.aurora i{position:absolute;border-radius:50%;filter:blur(90px);opacity:.75}
.aurora i:nth-child(1){width:46vw;height:46vw;left:-14vw;top:-16vw;background:var(--blob1)}
.aurora i:nth-child(2){width:38vw;height:38vw;right:-10vw;top:8vh;background:var(--blob2)}
.aurora i:nth-child(3){width:40vw;height:40vw;left:22vw;bottom:-26vw;background:var(--blob3)}
.aurora i:nth-child(4){width:30vw;height:30vw;right:-4vw;bottom:-14vw;background:var(--blob4)}
.glass{background:linear-gradient(145deg,var(--glass-a),var(--glass-b));-webkit-backdrop-filter:blur(26px) saturate(170%);backdrop-filter:blur(26px) saturate(170%);border:var(--hair) solid var(--glass-edge);box-shadow:inset 0 1px 0 var(--glass-inner),0 24px 60px -28px var(--shadow)}
.wrap{position:relative;z-index:1;max-width:1180px;margin-inline:auto}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;margin-block:12px 0;border-radius:18px;display:flex;align-items:center;gap:14px;padding:8px 10px 8px 16px;min-width:0}
.bar-brand{font:900 15px/1 var(--f-mast);font-stretch:120%;letter-spacing:.02em;white-space:nowrap;text-decoration:none}
.bar-brand span{font-family:var(--f-body);font-weight:900;margin-left:4px}
.nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0;mask-image:linear-gradient(90deg,#000 92%,transparent)}
.nav::-webkit-scrollbar{display:none}
.nav a{flex:none;text-decoration:none;font-size:13.5px;font-weight:500;color:var(--muted);padding:6px 11px;border-radius:10px;white-space:nowrap}
.nav a:hover{color:var(--ink)}
.nav a[aria-current="true"]{color:var(--ink);font-weight:800;background:var(--field);box-shadow:inset 0 0 0 var(--hair) var(--line)}
.bar-tools{display:flex;align-items:center;gap:8px;flex:none}
.sel{appearance:none;border:var(--hair) solid var(--line);background:var(--field);border-radius:10px;padding:6px 26px 6px 10px;font:600 13px var(--f-num);color:var(--ink);background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);background-position:calc(100% - 13px) 52%,calc(100% - 9px) 52%;background-size:4px 4px;background-repeat:no-repeat;cursor:pointer}
.seg{display:inline-flex;padding:2px;border-radius:10px;border:var(--hair) solid var(--line);background:var(--field)}
.seg button{border:0;background:none;font:600 12.5px var(--f-body);color:var(--muted);padding:5px 9px;border-radius:8px;cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--glass-a);color:var(--ink);font-weight:800;box-shadow:inset 0 1px 0 var(--glass-inner),0 3px 10px -5px var(--shadow)}
.sw{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:3px;vertical-align:1px}

/* masthead */
.mast{padding-block:44px 22px;display:grid;gap:18px}
.mast-meta{display:flex;flex-wrap:wrap;gap:6px 22px;justify-content:space-between;font:400 11.5px var(--f-num);letter-spacing:.24em;text-transform:uppercase;color:var(--muted);border-bottom:var(--hair) solid var(--line);padding-bottom:10px}
.mast-meta b{font-weight:800;color:var(--ink)}
.mast-title{display:flex;align-items:flex-end;gap:clamp(10px,2vw,22px);line-height:.8}
.mast-title .m-latin{font:900 clamp(84px,17vw,212px)/.78 var(--f-mast);font-stretch:125%;letter-spacing:-.045em;margin-left:-.04em}
.mast-title .m-cn{display:flex;flex-direction:column;font:900 clamp(26px,5vw,60px)/1.02 var(--f-body);padding-bottom:.02em}
.mast-title .m-side{margin-left:auto;align-self:stretch;display:flex;flex-direction:column;justify-content:flex-end;gap:6px;text-align:right;font-size:13px;color:var(--muted);max-width:30ch}
.mast-title .m-side strong{font:800 clamp(18px,2.4vw,26px)/1.1 var(--f-num);font-stretch:112%;color:var(--ink)}
.mast-secs{display:flex;flex-wrap:wrap;gap:4px 0;border-top:var(--hair) solid var(--line);border-bottom:var(--hair) solid var(--line);font-size:12.5px;color:var(--muted)}
.mast-secs a{text-decoration:none;padding:7px 14px 7px 0;margin-right:14px;border-right:var(--hair) solid var(--line-soft);white-space:nowrap}
.mast-secs a:last-child{border-right:0}
.mast-secs a:hover{color:var(--ink)}
.mast-secs i{font:normal 300 10.5px var(--f-num);letter-spacing:.18em;text-transform:uppercase;margin-left:6px;color:var(--faint)}

/* cover */
.cover{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:22px;align-items:start}
.story{display:grid;gap:18px;min-width:0}
.eyebrow{font:500 11px var(--f-num);letter-spacing:.28em;text-transform:uppercase;color:var(--faint)}
.eyebrow b{color:var(--accent);font-weight:800}
.story h2{font:900 clamp(28px,4.2vw,50px)/1.14 var(--f-body);letter-spacing:-.005em}
.story .dek{font-size:clamp(15px,1.5vw,17px);color:var(--muted);max-width:62ch;line-height:1.7}
.five{list-style:none;margin:6px 0 0;padding:0;border-top:var(--hair) solid var(--ink)}
.five li{display:grid;grid-template-columns:118px minmax(0,1fr);gap:14px;padding:13px 0;border-bottom:var(--hair) solid var(--line)}
.five a{text-decoration:none;font:800 14px var(--f-body);display:flex;flex-direction:column;gap:2px}
.five a i{font:normal 400 10px var(--f-num);letter-spacing:.2em;text-transform:uppercase;color:var(--faint)}
.five a:hover{color:var(--accent)}
.five p{font-size:14.5px;line-height:1.7}
.ticker{border-radius:24px;padding:16px 18px 12px;display:grid;gap:4px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px)}
.ticker h3{font:800 13px var(--f-body);display:flex;justify-content:space-between;align-items:baseline;padding-bottom:8px;border-bottom:var(--hair) solid var(--line)}
.ticker h3 small{font:400 11px var(--f-num);color:var(--faint);letter-spacing:.06em}
.tk{display:grid;grid-template-columns:minmax(0,1fr) auto 76px;gap:10px;align-items:baseline;padding:8px 0;border-bottom:var(--hair) solid var(--line-soft);font-size:13.5px}
.tk:last-of-type{border-bottom:0}
.tk .n{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}
.tk .v{font:700 14.5px var(--f-num);font-variant-numeric:tabular-nums}
.tk .c{font:700 13px var(--f-num);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.ticker .foot{font-size:11.5px;color:var(--faint);padding-top:8px;border-top:var(--hair) solid var(--line);line-height:1.5}

/* sections */
.sec{padding-top:64px;display:grid;gap:22px;scroll-margin-top:72px}
.sec-head{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:end;gap:16px;border-bottom:var(--hair) solid var(--ink);padding-bottom:12px}
.sec-head h2{font:900 clamp(32px,4.6vw,54px)/1 var(--f-body);letter-spacing:.01em}
.sec-head .en{font:300 12px var(--f-num);font-stretch:125%;letter-spacing:.34em;text-transform:uppercase;color:var(--muted);padding-bottom:6px}
.sec-head .cnt{font:400 12px var(--f-num);color:var(--faint);padding-bottom:6px;white-space:nowrap}
.sec-top{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:22px;align-items:start}
.sec-top.solo{grid-template-columns:minmax(0,1fr)}
.lead{border-radius:26px;padding:clamp(18px,2.6vw,30px);display:grid;gap:14px;min-width:0}
.tagline{display:flex;gap:10px;align-items:center;font:600 11.5px var(--f-num);letter-spacing:.14em;color:var(--faint)}
.tag{font:700 11.5px var(--f-body);letter-spacing:.06em;color:var(--accent);border:var(--hair) solid currentColor;border-radius:999px;padding:1px 9px}
.lead h3{font:900 clamp(22px,2.7vw,32px)/1.25 var(--f-body)}
.lead .dek{font-size:15.5px;color:var(--muted);font-weight:500}
.lead .body{display:grid;gap:10px;font-size:15px;max-width:68ch}
.figs{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));border-top:var(--hair) solid var(--line);border-bottom:var(--hair) solid var(--line)}
.fig{padding:12px 14px 10px 0;display:grid;gap:2px;min-width:0}
.fig+.fig{border-left:var(--hair) solid var(--line);padding-left:14px}
.fig b{font:800 clamp(22px,2.4vw,30px)/1.05 var(--f-num);font-stretch:112%;font-variant-numeric:tabular-nums;letter-spacing:-.01em;overflow-wrap:anywhere}
.fig b small{font:700 13px var(--f-body);margin-left:3px;color:var(--muted);letter-spacing:0}
.fig span{font-size:12px;color:var(--muted)}
.src{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--faint)}
.src a{text-decoration:none;border-bottom:var(--hair) solid var(--line)}
.src a:hover{color:var(--accent);border-color:currentColor}
.src::before{content:"来源";font-weight:700;letter-spacing:.1em}

/* side table */
.side{display:grid;gap:10px;min-width:0}
.side>h4{font:800 14px var(--f-body);padding-bottom:8px;border-bottom:var(--hair) solid var(--ink)}
.tbl{overflow-x:auto}
.tbl table{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{font:500 11px var(--f-num);letter-spacing:.14em;text-transform:uppercase;color:var(--faint);text-align:left;padding:6px 8px 6px 0;border-bottom:var(--hair) solid var(--line)}
.tbl td{padding:8px 8px 8px 0;border-bottom:var(--hair) solid var(--line-soft);white-space:nowrap}
.tbl .r{text-align:right;font-family:var(--f-num);font-variant-numeric:tabular-nums;font-weight:700}
.tbl tr:first-child td{font-weight:800}

/* briefs */
.briefs{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));column-gap:28px}
.brief{display:grid;gap:7px;align-content:start;padding:16px 0 18px;border-top:var(--hair) solid var(--line);min-width:0}
.brief h4{font:800 17px/1.4 var(--f-body)}
.brief p{font-size:14.5px;color:var(--muted);line-height:1.7}
.brief .figs{grid-template-columns:repeat(auto-fit,minmax(100px,1fr))}
.brief .fig{padding-block:8px 6px}
.brief .fig b{font-size:22px}

/* market board */
.board{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:4px 28px}
.grp{min-width:0}
.grp h4{font:800 14px var(--f-body);padding:14px 0 8px;border-bottom:var(--hair) solid var(--ink);display:flex;justify-content:space-between;align-items:baseline}
.grp h4 small{font:400 10.5px var(--f-num);letter-spacing:.12em;color:var(--faint)}
.q{display:grid;grid-template-columns:minmax(0,1fr) auto 64px 92px;gap:10px;align-items:center;padding:8px 0;border-bottom:var(--hair) solid var(--line-soft);font-size:13.5px}
.q .n{min-width:0}
.q .n span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.q .n em{display:block;font-style:normal;font-size:11px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.q .v{font:700 14px var(--f-num);font-variant-numeric:tabular-nums;text-align:right}
.q .c{font:700 13px var(--f-num);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.q .c.flat{color:var(--muted);font-weight:500}
.bar-c{position:relative;height:14px;border-radius:4px;background:var(--track)}
.bar-c::after{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;border-left:var(--hair) solid var(--faint)}
.bar-c i{position:absolute;top:3px;height:8px;border-radius:2px}
.bar-c i.pos{left:50%;background:var(--pos);border-radius:0 3px 3px 0}
.bar-c i.neg{right:50%;background:var(--neg);border-radius:3px 0 0 3px}
.bar-c i.clip{box-shadow:inset -3px 0 0 var(--bg)}
.q .d{grid-column:1/-1;display:none}
.scale{display:flex;justify-content:space-between;font:400 10px var(--f-num);color:var(--faint);width:92px;margin-left:auto}
.board-note{font-size:12px;color:var(--faint);line-height:1.6}

/* agenda */
.agenda{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));column-gap:28px}
.ag{display:grid;grid-template-columns:76px minmax(0,1fr);gap:12px;padding:12px 0;border-top:var(--hair) solid var(--line);align-items:baseline}
.ag .d{font:800 18px var(--f-num);font-stretch:112%;font-variant-numeric:tabular-nums}
.ag .t{font-size:14px;display:grid;gap:2px}
.ag .t i{font:normal 500 10.5px var(--f-num);letter-spacing:.18em;text-transform:uppercase;color:var(--faint)}

/* footer */
.colophon{margin-top:72px;padding-top:16px;border-top:var(--hair) solid var(--ink);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px;font-size:12.5px;color:var(--muted)}
.colophon b{color:var(--ink)}
.colophon p+p{margin-top:6px}

@media (max-width:980px){
  .cover{grid-template-columns:minmax(0,1fr)}
  .ticker{position:static}
  .sec-top{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:640px){
  body{font-size:14.5px}
  .bar{gap:8px;padding:6px 6px 6px 12px;flex-wrap:wrap}
  .bar-brand{order:1}
  .bar-tools{order:2;margin-left:auto}
  .nav{order:3;flex-basis:100%}
  .mast{padding-block:28px 16px}
  .mast-title .m-side,.mast-secs{display:none}
  .fig+.fig{padding-left:10px}
  .five li{grid-template-columns:minmax(0,1fr);gap:4px}
  .five a{flex-direction:row;align-items:baseline;gap:8px}
  .sec{padding-top:48px}
  .sec-head{grid-template-columns:minmax(0,1fr) auto}
  .sec-head .en{grid-row:2;grid-column:1/-1;padding:0}
  .briefs,.board,.agenda{grid-template-columns:minmax(0,1fr)}
  .q{grid-template-columns:minmax(0,1fr) auto 60px 64px}
  .scale{width:64px}
  .colophon{grid-template-columns:minmax(0,1fr)}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
html{scroll-behavior:smooth}
</style>
<div class="aurora" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
<div class="wrap">
  <header class="bar glass">
    <a class="bar-brand" href="#top">UNO<span>日刊</span></a>
    <nav class="nav" id="nav" aria-label="板块"></nav>
    <div class="bar-tools">
      <label for="issue-pick" hidden>往期</label>
      <select class="sel" id="issue-pick" aria-label="选择期号"></select>
      <div class="seg" role="group" aria-label="涨跌配色">
        <button type="button" id="ud-cn" aria-pressed="true" title="红涨绿跌"><i class="sw" style="background:var(--red)"></i>红涨</button>
        <button type="button" id="ud-us" aria-pressed="false" title="绿涨红跌"><i class="sw" style="background:var(--green)"></i>绿涨</button>
      </div>
    </div>
  </header>

<script>(()=>{'use strict';
// Renders one issue from the embedded JSON archive (newest first). No network calls.
const SECS = [
  { id: 'outdoor', n: '户外运动', s: '户外', en: 'Outdoor' },
  { id: 'ai', n: 'AI', s: 'AI', en: 'Artificial Intelligence' },
  { id: 'tech', n: '科技前沿', s: '科技', en: 'Frontier Tech' },
  { id: 'politics', n: '政治经济', s: '政经', en: 'Politics & Economy' },
  { id: 'markets', n: '国际市场', s: '市场', en: 'Global Markets' },
];
const SEC = Object.fromEntries(SECS.map(s => [s.id, s]));
const WEEK = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
const ISSUES = JSON.parse(document.getElementById('issues-data').textContent);

const $ = s => document.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const href = u => (/^https:\/\//.test(u) ? u : '#');
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch { /* storage blocked */ } },
};

const pct = c => (c > 0 ? '+' : c < 0 ? '−' : '') + Math.abs(c).toFixed(2) + '%';
function change(r) {
  if (typeof r.c !== 'number') return { cls: 'flat', text: r.ct || '—', arrow: '' };
  return { cls: r.c > 0 ? 'up' : r.c < 0 ? 'dn' : 'flat', text: pct(r.c), arrow: r.c > 0 ? '▲ ' : r.c < 0 ? '▼ ' : '' };
}

const sources = src => (src && src.length
  ? `<div class="src">${src.map(([n, u]) => `<a href="${esc(href(u))}" target="_blank" rel="noopener">${esc(n)}</a>`).join('')}</div>`
  : '');
const figs = list => (list && list.length
  ? `<div class="figs">${list.map(f => `<div class="fig"><b>${esc(f.v)}${f.u ? `<small>${esc(f.u)}</small>` : ''}</b><span>${esc(f.l)}</span></div>`).join('')}</div>`
  : '');
const tagline = x => `<div class="tagline"><span class="tag">${esc(x.tag)}</span><span class="num">${esc(x.date)}</span></div>`;

function lead(l) {
  return `<article class="lead glass">${tagline(l)}<h3>${esc(l.title)}</h3>
    ${l.dek ? `<p class="dek">${esc(l.dek)}</p>` : ''}
    <div class="body">${[].concat(l.body).map(p => `<p>${esc(p)}</p>`).join('')}</div>
    ${figs(l.figs)}${sources(l.src)}</article>`;
}

function brief(b) {
  return `<article class="brief">${tagline(b)}<h4>${esc(b.title)}</h4><p>${esc(b.body)}</p>${figs(b.figs)}${sources(b.src)}</article>`;
}

function table(t) {
  const al = i => (t.align && t.align[i] === 'num' ? ' class="r"' : '');
  return `<div class="side"><h4>${esc(t.title)}</h4><div class="tbl"><table>
    <thead><tr>${t.cols.map((c, i) => `<th scope="col"${al(i)}>${esc(c)}</th>`).join('')}</tr></thead>
    <tbody>${t.rows.map(r => `<tr>${r.map((c, i) => `<td${al(i)}>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody>
  </table></div>${sources(t.src)}</div>`;
}

function quote(r, s) {
  const c = change(r);
  let bar = '';
  if (typeof r.c === 'number' && r.c !== 0) {
    const w = Math.min(Math.abs(r.c) / s, 1) * 50;
    bar = `<i class="${r.c > 0 ? 'pos' : 'neg'}${Math.abs(r.c) > s ? ' clip' : ''}" style="width:${w.toFixed(2)}%"></i>`;
  }
  const meta = esc(r.d) + (r.note ? ' · ' + esc(r.note) : '');
  return `<div class="q" title="${esc(r.n)} ${esc(r.v)} ${esc(c.text)} · ${meta}">
    <div class="n"><span>${esc(r.n)}</span><em class="num">${meta}</em></div>
    <div class="v">${esc(r.v)}</div><div class="c ${c.cls}">${esc(c.text)}</div>
    <div class="bar-c" aria-hidden="true">${bar}</div></div>`;
}

function board(q) {
  const s = q.scale || 3;
  const scale = `<small class="scale" aria-hidden="true"><span>−${s}%</span><span>0</span><span>+${s}%</span></small>`;
  return `<div class="board">${q.groups.map(g => `<div class="grp"><h4>${esc(g.name)}${scale}</h4>${g.rows.map(r => quote(r, s)).join('')}</div>`).join('')}</div>
    <p class="board-note">条形为当日涨跌幅，所有行同一比例尺（±${s}%），超出部分截断。利率以基点计，不画条形。每行下方是该数据的收盘或报价日期。</p>${sources(q.src)}`;
}

function section(sec) {
  const meta = SEC[sec.id];
  let items = sec.items || [];
  let side = '';
  if (sec.table) side = table(sec.table);
  else if (!sec.quotes && items.length > 3) {
    side = `<div class="side">${items.slice(0, 2).map(brief).join('')}</div>`;
    items = items.slice(2);
  }
  const count = 1 + (sec.items || []).length;
  return `<section class="sec" id="${sec.id}" aria-labelledby="h-${sec.id}">
    <header class="sec-head"><h2 id="h-${sec.id}">${esc(meta.n)}</h2><span class="en">${esc(meta.en)}</span><span class="cnt num">${count} 条</span></header>
    <div class="sec-top${side ? '' : ' solo'}">${lead(sec.lead)}${side}</div>
    ${sec.quotes ? board(sec.quotes) : ''}
    ${items.length ? `<div class="briefs">${items.map(brief).join('')}</div>` : ''}
  </section>`;
}

function render(issue) {
  const [y, m, d] = issue.date.split('-').map(Number);
  const wd = WEEK[new Date(Date.UTC(y, m - 1, d)).getUTCDay()];
  const no = String(issue.no).padStart(3, '0');
  const total = issue.sections.reduce((n, s) => n + 1 + (s.items || []).length, 0);
  const quotes = (issue.sections.find(s => s.quotes) || {}).quotes;
  const keys = quotes ? quotes.groups.flatMap(g => g.rows).filter(r => r.key) : [];
  const ticker = keys.map(r => {
    const c = change(r);
    return `<div class="tk"><span class="n">${esc(r.n)}</span><span class="v">${esc(r.v)}</span><span class="c ${c.cls}">${c.arrow}${esc(c.text)}</span></div>`;
  }).join('');

  $('#issue').innerHTML = `
  <section class="mast" id="top">
    <div class="mast-meta"><span>Vol.<b>${y - 2025}</b> · No.<b>${no}</b></span><span><b>${y}.${String(m).padStart(2, '0')}.${String(d).padStart(2, '0')}</b> ${wd}</span><span>美西 05:00 版</span></div>
    <h1 class="mast-title"><span class="m-latin">UNO</span><span class="m-cn" aria-label="日刊"><span>日</span><span>刊</span></span>
      <span class="m-side"><strong class="num">${total} 条</strong>五个板块，每条附来源</span></h1>
    <nav class="mast-secs" aria-label="本期板块">${SECS.map(s => `<a href="#${s.id}">${esc(s.n)}<i>${esc(s.en)}</i></a>`).join('')}</nav>
  </section>
  <section class="cover" aria-labelledby="cover-h">
    <div class="story">
      <div class="eyebrow"><b>${esc(issue.cover.kicker)}</b> · Cover Story</div>
      <h2 id="cover-h">${esc(issue.cover.title)}</h2>
      <p class="dek">${esc(issue.cover.dek)}</p>
      <ol class="five">${issue.cover.points.map(p => `<li><a href="#${esc(p.sec)}">${esc(SEC[p.sec].n)}<i>${esc(SEC[p.sec].en)}</i></a><p>${esc(p.text)}</p></li>`).join('')}</ol>
    </div>
    ${keys.length ? `<aside class="ticker glass" aria-label="行情速览"><h3>行情速览<small>最新收盘 / 报价</small></h3>${ticker}
      <p class="foot">${esc(issue.note || '')}</p></aside>` : ''}
  </section>
  ${issue.sections.map(section).join('')}
  ${issue.agenda && issue.agenda.length ? `<section class="sec" id="agenda" aria-labelledby="h-agenda">
    <header class="sec-head"><h2 id="h-agenda">日程</h2><span class="en">Calendar</span><span class="cnt num">${issue.agenda.length} 项</span></header>
    <div class="agenda">${issue.agenda.map(a => `<div class="ag"><span class="d">${esc(a.d)}</span><div class="t"><i>${esc(SEC[a.sec].n)}</i>${esc(a.t)}</div></div>`).join('')}</div>
  </section>` : ''}
  <footer class="colophon">
    <div><p><b>UNO 日刊</b> · 第 ${no} 期 · 编辑于 <span class="num">${esc(issue.edited)}</span></p><p>${esc(issue.note || '')}</p></div>
    <div><p>每天美西 05:00 由 Claude 检索公开报道编辑出刊，每条注明来源和日期。数字取出刊时能查到的最新值；不同来源有出入时取一手来源或标注口径。本刊不构成投资建议。</p></div>
  </footer>`;
  watchSections();
}

// top-bar nav, highlighted for the section in view
function buildNav() {
  const links = [{ id: 'top', s: '要点' }, ...SECS, { id: 'agenda', s: '日程' }];
  $('#nav').innerHTML = links.map(l => `<a href="#${l.id}" data-id="${l.id}">${esc(l.s)}</a>`).join('');
}
let observer;
function watchSections() {
  if (observer) observer.disconnect();
  if (!('IntersectionObserver' in window)) return;
  const set = id => document.querySelectorAll('#nav a').forEach(a => a.setAttribute('aria-current', a.dataset.id === id ? 'true' : 'false'));
  observer = new IntersectionObserver(entries => {
    const hit = entries.filter(e => e.isIntersecting).sort((a, b) => a.boundingClientRect.top - b.boundingClientRect.top)[0];
    if (hit) set(hit.target.id);
  }, { rootMargin: '-80px 0px -65% 0px' });
  document.querySelectorAll('#top, .sec').forEach(el => observer.observe(el));
  set('top');
}

// archive picker
function buildPicker() {
  const sel = $('#issue-pick');
  sel.innerHTML = ISSUES.map((it, i) => `<option value="${i}">No.${String(it.no).padStart(3, '0')} · ${esc(it.date.slice(5).replace('-', '/'))}</option>`).join('');
  sel.addEventListener('change', () => {
    render(ISSUES[Number(sel.value)]);
    window.scrollTo({ top: 0 });
  });
}

// 红涨绿跌 (default) or 绿涨红跌
function setUpDown(mode) {
  document.body.dataset.updown = mode;
  $('#ud-cn').setAttribute('aria-pressed', String(mode === 'cn'));
  $('#ud-us').setAttribute('aria-pressed', String(mode === 'us'));
  store.set('uno-updown', mode);
}
$('#ud-cn').addEventListener('click', () => setUpDown('cn'));
$('#ud-us').addEventListener('click', () => setUpDown('us'));

buildNav();
buildPicker();
setUpDown(store.get('uno-updown') === 'us' ? 'us' : 'cn');
render(ISSUES[0]);
if (location.hash.length > 1) {
  const el = document.getElementById(location.hash.slice(1));
  if (el) el.scrollIntoView();
}

})();</script>
