<title>事业 OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;700;900&display=swap">
<style>/* Layout: one liquid-glass window over a cool aurora; top bar (brand · project · sync), a left rail of capability modules, one scrolling module view, a detail sheet from the right. Hairline rules, heavy type. Same visual language as health-os and groundbreak; cobalt accent, amber marks "you are here". */
:root{--bg:#EDF1F7;--blob1:#9CC3FF;--blob2:#A8E6D3;--blob3:#FFE1A6;--blob4:#C9C2FF;--ink:#0B1220;--muted:#4D5A6E;--faint:#7C8799;--glass-a:rgba(255,255,255,.62);--glass-b:rgba(255,255,255,.3);--glass-edge:rgba(255,255,255,.9);--glass-inner:rgba(255,255,255,.96);--shadow:rgba(24,44,90,.18);--line:rgba(11,18,32,.16);--line-soft:rgba(11,18,32,.08);--field:rgba(255,255,255,.5);--accent:#1F57D6;--accent-ink:#FFFFFF;--accent-soft:rgba(31,87,214,.1);--track:rgba(31,87,214,.14);--now:#A86B00;--now-soft:rgba(220,150,20,.16);--good:#0A7F4F;--good-soft:rgba(10,127,79,.12);--warn:#B86E00;--warn-soft:rgba(230,150,20,.16);--bad:#C93A30;--bad-soft:rgba(201,58,48,.1);--h1:#DCE7FB;--h2:#B7CEF6;--h3:#86AEEE;--h4:#4F86E2;--h5:#1F57D6;--h-ink:#0B1220;--h-ink4:#0B1220;--h-ink5:#FFFFFF;--scrim:rgba(18,28,50,.24);--sheet:rgba(246,248,252,.94);--hair:1px;--f-display:"Outfit","Noto Sans SC",system-ui,sans-serif;--f-body:"Noto Sans SC","Outfit",system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#070C16;--blob1:#173E86;--blob2:#0F5A4A;--blob3:#5A4313;--blob4:#33287A;--ink:#E9EEF7;--muted:#A3AEC2;--faint:#76829A;--glass-a:rgba(26,34,52,.62);--glass-b:rgba(12,18,30,.42);--glass-edge:rgba(255,255,255,.16);--glass-inner:rgba(255,255,255,.2);--shadow:rgba(0,0,0,.5);--line:rgba(255,255,255,.15);--line-soft:rgba(255,255,255,.07);--field:rgba(255,255,255,.05);--accent:#6E9DFF;--accent-ink:#06142F;--accent-soft:rgba(110,157,255,.14);--track:rgba(110,157,255,.18);--now:#F2B13D;--now-soft:rgba(242,177,61,.16);--good:#3FCB8E;--good-soft:rgba(63,203,142,.14);--warn:#F2B13D;--warn-soft:rgba(242,177,61,.16);--bad:#FF7468;--bad-soft:rgba(255,116,104,.14);--h1:#14233F;--h2:#1B3A73;--h3:#2853A6;--h4:#4A80E8;--h5:#7BA6FF;--h-ink:#E9EEF7;--h-ink4:#06142F;--h-ink5:#06142F;--scrim:rgba(0,0,0,.45);--sheet:rgba(12,18,30,.94);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#070C16;--blob1:#173E86;--blob2:#0F5A4A;--blob3:#5A4313;--blob4:#33287A;--ink:#E9EEF7;--muted:#A3AEC2;--faint:#76829A;--glass-a:rgba(26,34,52,.62);--glass-b:rgba(12,18,30,.42);--glass-edge:rgba(255,255,255,.16);--glass-inner:rgba(255,255,255,.2);--shadow:rgba(0,0,0,.5);--line:rgba(255,255,255,.15);--line-soft:rgba(255,255,255,.07);--field:rgba(255,255,255,.05);--accent:#6E9DFF;--accent-ink:#06142F;--accent-soft:rgba(110,157,255,.14);--track:rgba(110,157,255,.18);--now:#F2B13D;--now-soft:rgba(242,177,61,.16);--good:#3FCB8E;--good-soft:rgba(63,203,142,.14);--warn:#F2B13D;--warn-soft:rgba(242,177,61,.16);--bad:#FF7468;--bad-soft:rgba(255,116,104,.14);--h1:#14233F;--h2:#1B3A73;--h3:#2853A6;--h4:#4A80E8;--h5:#7BA6FF;--h-ink:#E9EEF7;--h-ink4:#06142F;--h-ink5:#06142F;--scrim:rgba(0,0,0,.45);--sheet:rgba(12,18,30,.94);color-scheme:dark}
@media (min-resolution:2dppx){:root{--hair:.5px}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;padding-inline:16px;padding-block:16px;overflow:hidden;position:relative}
.num{font-family:var(--f-display);font-variant-numeric:tabular-nums}
.latin{font-family:var(--f-display)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,h4{text-wrap:balance;margin:0}
a{color:inherit}
svg{display:block}

/* aurora + glass */
.aurora{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.aurora i{position:absolute;border-radius:50%;filter:blur(80px);opacity:.7}
.aurora i:nth-child(1){width:44vw;height:44vw;left:-12vw;top:-14vw;background:var(--blob1)}
.aurora i:nth-child(2){width:34vw;height:34vw;right:-8vw;top:-8vw;background:var(--blob2)}
.aurora i:nth-child(3){width:36vw;height:36vw;left:30vw;bottom:-24vw;background:var(--blob3)}
.aurora i:nth-child(4){width:28vw;height:28vw;right:4vw;bottom:-12vw;background:var(--blob4)}
.glass{background:linear-gradient(145deg,var(--glass-a),var(--glass-b));-webkit-backdrop-filter:blur(28px) saturate(170%);backdrop-filter:blur(28px) saturate(170%);border:var(--hair) solid var(--glass-edge);box-shadow:inset 0 1px 0 var(--glass-inner),0 24px 60px -24px var(--shadow)}
.window{position:relative;z-index:1;height:100%;display:grid;grid-template-rows:auto minmax(0,1fr);grid-template-columns:232px minmax(0,1fr);border-radius:28px;overflow:hidden}

/* top bar */
.top{grid-column:1/-1;display:flex;align-items:center;gap:16px;padding:12px 20px;border-bottom:var(--hair) solid var(--line);flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto}
.brand b{font:900 24px/1 var(--f-body);letter-spacing:.02em}
.brand span{font:600 11px var(--f-display);letter-spacing:.28em;color:var(--muted);text-transform:uppercase}
.seg{display:inline-flex;padding:3px;border-radius:14px;border:var(--hair) solid var(--line);background:var(--field);gap:2px;max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{border:0;background:none;padding:7px 13px;border-radius:11px;font-size:14px;font-weight:500;color:var(--muted);cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;flex:none}
.seg button[aria-selected="true"],.seg button[aria-pressed="true"]{background:var(--glass-a);color:var(--ink);font-weight:700;box-shadow:inset 0 1px 0 var(--glass-inner),0 4px 14px -6px var(--shadow)}
.seg .add{color:var(--accent);font-weight:700}
.proj{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);min-width:0;max-width:100%}
.sync{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--muted);white-space:nowrap}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--good)}
.sync.local i{background:var(--warn)}
.sync.ro i{background:var(--faint)}

/* rail */
.rail{border-right:var(--hair) solid var(--line);padding:16px 12px;display:flex;flex-direction:column;gap:4px;overflow-y:auto;min-height:0}
.rail h2{font:600 11px var(--f-display);letter-spacing:.2em;text-transform:uppercase;color:var(--faint);padding:0 10px 8px}
.mod{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 8px;align-items:center;text-align:left;border:var(--hair) solid transparent;background:none;border-radius:16px;padding:10px 12px;cursor:pointer;width:100%}
.mod b{font:800 15px/1.3 var(--f-body)}
.mod small{grid-column:1/-1;font-size:12px;color:var(--faint)}
.mod .pct{font:700 12.5px var(--f-display);color:var(--muted)}
.mod[aria-current="true"]{background:var(--glass-a);border-color:var(--glass-edge);box-shadow:inset 0 1px 0 var(--glass-inner),0 8px 22px -14px var(--shadow)}
.mod[aria-current="true"] .pct{color:var(--accent)}
.mod.planned{cursor:default;opacity:.55}
.mod.planned b{font-weight:600}
.mod .bar{grid-column:1/-1;height:3px;border-radius:2px;background:var(--track);overflow:hidden;margin-top:6px}
.mod .bar i{display:block;height:100%;background:var(--accent);border-radius:2px}
.rail .sep{border-top:var(--hair) solid var(--line);margin:10px 8px}
.rail .note{font-size:12px;color:var(--faint);padding:0 10px;line-height:1.6}

/* views */
.main{overflow-y:auto;overflow-x:hidden;min-height:0;min-width:0}
.view{padding:20px 22px 40px;display:grid;gap:18px;min-width:0}
.vhead{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap}
.vhead h1{font:900 30px/1.15 var(--f-body);letter-spacing:.01em}
.vhead p{margin:4px 0 0;color:var(--muted);font-size:14.5px;max-width:66ch}
.eyebrow{font:600 11.5px var(--f-display);letter-spacing:.2em;text-transform:uppercase;color:var(--faint)}
.subnav{position:sticky;top:0;z-index:5;padding:10px 22px;margin:0 0 -8px;background:linear-gradient(180deg,var(--glass-a),transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:var(--hair) solid var(--line-soft)}
.panel{border-radius:22px;border:var(--hair) solid var(--line);background:var(--field);padding:16px 18px;min-width:0;display:grid;gap:12px;align-content:start}
.panel>h3{font:800 16px var(--f-body);display:flex;align-items:baseline;gap:8px;justify-content:space-between;flex-wrap:wrap}
.panel>h3 small{font:500 12.5px var(--f-body);color:var(--faint)}
.panel>p{margin:0;color:var(--muted);font-size:14px}
.cols{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:18px;align-items:start}
.cols3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;align-items:start}
.lead{font:800 19px/1.5 var(--f-body);margin:0;max-width:60ch}
.lead em{font-style:normal;color:var(--accent)}
.muted{color:var(--muted)}
.small{font-size:13px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:var(--hair) solid var(--line);background:none;border-radius:999px;padding:4px 12px;font-size:13.5px;color:var(--muted);cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{border-color:var(--ink);color:var(--ink);font-weight:700}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;color:var(--muted);border:var(--hair) solid var(--line);border-radius:999px;padding:1px 9px;white-space:nowrap;line-height:1.6}
.tag i{width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.tag.ok{color:var(--good);border-color:currentColor}
.tag.warn{color:var(--warn);border-color:currentColor}
.tag.bad{color:var(--bad);border-color:currentColor}
.tag.acc{color:var(--accent);border-color:currentColor}
.tag.now{color:var(--now);border-color:currentColor}
.btn{border:0;border-radius:13px;padding:9px 16px;font-size:14px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:7px;white-space:nowrap;text-decoration:none}
.btn.pri{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:none;border:var(--hair) solid var(--line);color:var(--ink);font-weight:500}
.btn.sm{padding:5px 11px;font-size:13px;border-radius:10px}
.btn.on{border-color:var(--accent);color:var(--accent);font-weight:700}
.btn:disabled{opacity:.45;cursor:default}
body.ro [data-w]{pointer-events:none;opacity:.5}

/* overview */
.hero{display:grid;grid-template-columns:auto minmax(0,1fr);gap:22px;align-items:center}
.ring{width:132px;height:132px;position:relative;flex:none}
.ring svg{width:100%;height:100%}
.ring .tr{stroke:var(--track)}
.ring .fg{stroke:var(--accent)}
.ring div{position:absolute;inset:0;display:grid;place-items:center;align-content:center;text-align:center}
.ring b{font:800 34px/1 var(--f-display)}
.ring span{font-size:12px;color:var(--muted);margin-top:4px}
.where{display:grid;gap:10px;min-width:0}
.where h2{font:900 26px/1.25 var(--f-body)}
.where h2 em{font-style:normal;color:var(--now)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}
.kpi{border-top:var(--hair) solid var(--line);padding-top:10px;display:grid;gap:2px;min-width:0}
.kpi b{font:800 28px/1.1 var(--f-display)}
.kpi b small{font-size:15px;font-weight:600;margin-left:2px}
.kpi span{font-size:13px;color:var(--ink);font-weight:500}
.kpi em{font-style:normal;font-size:12px;color:var(--faint)}
.todo{display:grid;gap:0}
.todo li{list-style:none}
.todo .it{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:start;padding:10px 0;border-bottom:var(--hair) solid var(--line-soft)}
.todo .it:last-child{border-bottom:0}
.todo .ph{font:700 12px var(--f-display);color:var(--faint);white-space:nowrap;margin-top:2px}
.rank{display:grid;gap:10px}
.rk{display:grid;grid-template-columns:minmax(0,1fr) 120px 30px;gap:12px;align-items:center;font-size:14px;cursor:pointer;border-radius:12px;padding:4px 6px;margin:0 -6px;border:0;background:none;text-align:left;width:calc(100% + 12px)}
.rk:hover{background:var(--field)}
.rk b{font-weight:800}
.rk small{display:block;font-size:12px;color:var(--muted);font-weight:400}
.rk .num{font-weight:800;text-align:right}
.meter{height:6px;border-radius:3px;background:var(--track);overflow:hidden}
.meter i{display:block;height:100%;border-radius:3px;background:var(--accent)}
.flags{display:grid;gap:10px}
.flag{display:grid;grid-template-columns:18px minmax(0,1fr);gap:8px;font-size:13.5px;line-height:1.6}
.flag svg{width:16px;height:16px;margin-top:3px;stroke:var(--warn)}
.flag b{font-weight:700}
.flag span{color:var(--muted)}

/* step rows (checklist) */
.chk{appearance:none;-webkit-appearance:none;width:22px;height:22px;border-radius:7px;border:1.5px solid var(--line);background:var(--glass-a);cursor:pointer;display:grid;place-items:center;margin:1px 0 0;flex:none}
.chk:checked{background:var(--accent);border-color:var(--accent)}
.chk:checked::after{content:"";width:11px;height:6px;border-left:2px solid var(--accent-ink);border-bottom:2px solid var(--accent-ink);transform:translateY(-1px) rotate(-45deg)}
.steprow{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:start;padding:11px 0;border-bottom:var(--hair) solid var(--line-soft)}
.steprow:last-child{border-bottom:0}
.steprow .t{font-weight:700;font-size:14.5px;line-height:1.5}
.steprow .t .tag{margin-left:6px;vertical-align:1px}
.steprow.done .t{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1px;text-decoration-color:var(--faint)}
.steprow .d{font-size:13px;color:var(--muted);margin-top:2px;line-height:1.6}
.steprow .d b{color:var(--ink);font-weight:600}
.steprow .more{display:grid;gap:8px;margin-top:8px;padding:12px 14px;border-radius:14px;border:var(--hair) solid var(--line);background:var(--glass-b);font-size:13px}
.steprow .more p{margin:0;color:var(--muted)}
.steprow .more .pn{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px}
.steprow .more .pn b{font-weight:700;color:var(--ink);white-space:nowrap}
.steprow textarea{width:100%;min-height:58px;resize:vertical;border:var(--hair) solid var(--line);border-radius:10px;background:var(--field);padding:7px 9px;font-size:13px;line-height:1.5}
.steprow .meta{font-size:11.5px;color:var(--faint)}
.tgl{border:var(--hair) solid var(--line);background:none;border-radius:9px;width:30px;height:30px;display:grid;place-items:center;cursor:pointer;color:var(--muted)}
.tgl svg{width:14px;height:14px;transition:transform .2s}
.tgl[aria-expanded="true"] svg{transform:rotate(180deg)}
.notedot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-left:6px;vertical-align:2px}

/* charts */
.fig{margin:0;display:grid;gap:8px;min-width:0}
.fig figcaption{font-size:12.5px;color:var(--faint)}
.chart{overflow-x:auto;min-width:0}
.chart svg{width:100%;height:auto;min-width:560px;color:var(--ink);overflow:visible}
.chart .grid line{stroke:var(--line-soft);stroke-width:1}
.chart .axis line{stroke:var(--line);stroke-width:1}
.chart text{fill:var(--muted);font:500 11.5px var(--f-display)}
.chart text.lb{fill:var(--ink);font:700 12.5px var(--f-body)}
.chart text.sub{fill:var(--faint);font:500 11px var(--f-body)}
.chart .rng{stroke:var(--accent);stroke-width:2;stroke-linecap:round}
.chart .dot{fill:var(--accent);stroke:var(--bg);stroke-width:2}
.chart .now-band{fill:var(--now-soft)}
.chart .now-t{fill:var(--now);font:700 11.5px var(--f-body)}
.chart .bar{fill:var(--accent)}
.chart .bar.lo{fill:var(--h3)}
.chart .hit{fill:transparent;cursor:default}
.chart .hit:hover+.mk,.chart g.h:hover .mk,.chart g.h:focus .mk{opacity:.78}
.chart g.h{outline:none}
.chart g.h:focus-visible .hit{stroke:var(--accent);stroke-width:1.5;fill:var(--accent-soft)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);align-items:center}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;background:var(--accent);margin-right:6px;vertical-align:3px}
.legend i.now{height:10px;background:var(--now-soft);border:var(--hair) solid var(--now);vertical-align:-1px}
.legend i.sw{width:12px;height:12px;border-radius:3px;vertical-align:-1px}
.tip{position:fixed;z-index:40;pointer-events:none;padding:8px 11px;border-radius:12px;font-size:12.5px;max-width:280px;opacity:0;transition:opacity .12s;line-height:1.5}
.tip.on{opacity:1}
.tip b{display:block;font:800 15px var(--f-display);color:var(--ink)}
.tip span{color:var(--muted)}

/* round cards */
.rounds{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.rc{border-radius:18px;border:var(--hair) solid var(--line);background:var(--glass-b);padding:14px 14px 12px;display:grid;gap:8px;align-content:start;min-width:0}
.rc.now{border-color:var(--now);background:linear-gradient(180deg,var(--now-soft),transparent 70%)}
.rc h4{font:800 17px var(--f-body);display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.rc h4 small{font:600 11px var(--f-display);color:var(--faint);letter-spacing:.12em}
.rc dl{margin:0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;font-size:13px}
.rc dt{color:var(--faint)}
.rc dd{margin:0;color:var(--ink);font-weight:500}
.rc p{margin:0;font-size:12.5px;color:var(--muted);line-height:1.6}

/* heatmap */
.heat{overflow-x:auto;min-width:0}
.heat table{border-collapse:separate;border-spacing:2px;width:100%;min-width:420px;font-size:13px}
.heat th{font:600 11.5px var(--f-display);letter-spacing:.08em;color:var(--faint);text-align:left;padding:6px 8px;white-space:nowrap}
.heat th.c{text-align:center}
.heat td{padding:0}
.heat td.nm{padding:8px 10px 8px 0;font-weight:700;white-space:nowrap;width:100%}
.heat td.nm small{display:block;font-weight:400;font-size:11.5px;color:var(--faint)}
.heat .cell{display:grid;place-items:center;height:38px;border-radius:6px;font:800 14px var(--f-display);cursor:pointer;border:0;width:100%;min-width:84px}
.heat .cell:hover{filter:brightness(1.06)}
.heat .s0{background:var(--line-soft);color:var(--faint)}
.heat .s1{background:var(--h1);color:var(--h-ink)}
.heat .s2{background:var(--h2);color:var(--h-ink)}
.heat .s3{background:var(--h3);color:var(--h-ink)}
.heat .s4{background:var(--h4);color:var(--h-ink4)}
.heat .s5{background:var(--h5);color:var(--h-ink5)}
.heat tr.cur td.nm{color:var(--accent)}
.scale{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--faint)}
.scale i{width:22px;height:10px;border-radius:3px}

/* source cards & institutions */
.srcs{display:grid;gap:12px}
.sc{border-radius:20px;border:var(--hair) solid var(--line);background:var(--glass-b);padding:14px 16px;display:grid;gap:10px;min-width:0}
.sc .hd{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:start}

.why{font-size:13.5px;color:var(--muted);margin:0;line-height:1.65}
.why b{color:var(--ink)}
.insts{display:grid;gap:0;border-top:var(--hair) solid var(--line-soft)}
.inst{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:10px 0;border-bottom:var(--hair) solid var(--line-soft)}
.inst:last-child{border-bottom:0}
.inst b{font-weight:800;font-size:14.5px}
.inst .ev{grid-column:1;font-size:12.5px;color:var(--muted);line-height:1.6}
.inst .ev a{color:var(--faint);text-decoration-thickness:1px;text-underline-offset:2px}
.inst .act{grid-row:1/3;grid-column:2;display:flex;gap:6px;align-items:center}
.inst select{border:var(--hair) solid var(--line);background:var(--field);border-radius:9px;padding:4px 6px;font-size:12.5px}
details.more-insts summary{cursor:pointer;font-size:13px;color:var(--accent);font-weight:700;list-style:none;padding-top:6px}
details.more-insts summary::-webkit-details-marker{display:none}

/* pitch */
.slides{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;counter-reset:sl}
.sl{border-radius:16px;border:var(--hair) solid var(--line);background:var(--glass-b);padding:12px 13px;display:grid;gap:5px;align-content:start;position:relative;min-width:0}
.sl::before{counter-increment:sl;content:counter(sl,decimal-leading-zero);font:700 11px var(--f-display);color:var(--faint);letter-spacing:.1em}
.sl b{font:800 14.5px var(--f-body)}
.sl span{font-size:12.5px;color:var(--muted);line-height:1.55}
.sl em{font-style:normal;font-size:12.5px;color:var(--ink);line-height:1.55;border-top:var(--hair) solid var(--line-soft);padding-top:6px;margin-top:2px}
.flow{overflow-x:auto}
.flow svg{width:100%;min-width:640px;height:auto;color:var(--ink)}
.flow text{fill:var(--ink);font:700 12.5px var(--f-body)}
.flow text.s{fill:var(--muted);font:500 11px var(--f-body)}
.flow text.k{fill:var(--faint);font:600 10.5px var(--f-display);letter-spacing:.08em}
.flow rect{fill:var(--glass-a);stroke:var(--line);stroke-width:1}
.flow rect.hi{stroke:var(--accent);fill:var(--accent-soft)}
.flow path,.flow line{stroke:var(--faint);stroke-width:1.2;fill:none}
.flow polygon{fill:var(--faint)}
.qa{display:grid;gap:0}
.qa details{border-bottom:var(--hair) solid var(--line-soft);padding:10px 0}
.qa details:last-child{border-bottom:0}
.qa summary{cursor:pointer;font-weight:700;font-size:14.5px;list-style:none;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center}

.qa summary svg{width:14px;height:14px;color:var(--muted);transition:transform .2s}
.qa details[open] summary svg{transform:rotate(180deg)}
.qa p{margin:8px 0 0;font-size:13.5px;color:var(--muted);line-height:1.7}
.qa p b{color:var(--ink)}

/* process */
.gantt svg{min-width:640px}
.phase{display:grid;gap:4px}
.phase>header{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:baseline;padding-bottom:6px;border-bottom:var(--hair) solid var(--line)}
.phase>header h3{font:800 17px var(--f-body);display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}

.phase>header .cnt{font:700 13px var(--f-display);color:var(--muted)}
.phase.now>header h3::after{content:"当前阶段";font:700 11.5px var(--f-body);color:var(--now);border:var(--hair) solid var(--now);border-radius:999px;padding:0 8px}
.phase>p{margin:4px 0 0;font-size:13px;color:var(--muted)}
.branch{display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--muted)}

/* progress */
.phbars{display:grid;gap:10px}
.phb{display:grid;grid-template-columns:96px minmax(0,1fr) 54px;gap:12px;align-items:center;font-size:13.5px}
.phb span{color:var(--muted)}
.phb b{font:700 13px var(--f-display);text-align:right}
.phb.now span{color:var(--now);font-weight:700}
.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.col{border-radius:18px;border:var(--hair) solid var(--line);background:var(--glass-b);padding:10px;display:grid;gap:8px;align-content:start;min-height:120px;min-width:0}
.col h4{font:800 13.5px var(--f-body);display:flex;justify-content:space-between;color:var(--muted);padding:2px 4px}
.col h4 b{font-family:var(--f-display);color:var(--ink)}
.card{border-radius:12px;border:var(--hair) solid var(--line);background:var(--glass-a);padding:8px 10px;display:grid;gap:4px;font-size:13px;min-width:0}
.card b{font-weight:800}
.card small{color:var(--faint);font-size:11.5px}
.card select{border:var(--hair) solid var(--line);background:var(--field);border-radius:8px;padding:3px 5px;font-size:12px;width:100%}
.empty{padding:18px 8px;text-align:center;color:var(--faint);font-size:13px}
.funnel{display:grid;gap:8px}
.fbar{display:grid;grid-template-columns:80px minmax(0,1fr);gap:10px;align-items:center;font-size:13px}
.fbar span{color:var(--muted)}
.fbar .tr{position:relative;height:22px}
.fbar .tr i{position:absolute;left:0;top:0;bottom:0;border-radius:0 4px 4px 0;background:var(--accent);min-width:3px}
.fbar .tr em{position:absolute;top:50%;transform:translateY(-50%);font:700 13px var(--f-display);font-style:normal;white-space:nowrap;color:var(--ink)}

/* tables */
.tbl{overflow-x:auto;border-radius:18px;border:var(--hair) solid var(--line);background:var(--field);min-width:0}
.tbl table{border-collapse:collapse;width:100%;min-width:640px;font-size:13.5px}
.tbl th{font:600 11.5px var(--f-display);letter-spacing:.1em;color:var(--faint);text-align:left;padding:11px 12px 8px;border-bottom:var(--hair) solid var(--line);white-space:nowrap}
.tbl td{padding:10px 12px;border-bottom:var(--hair) solid var(--line-soft);vertical-align:top;line-height:1.6}
.tbl tr:last-child td{border-bottom:0}
.tbl td.n{font-family:var(--f-display);font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl td b{font-weight:800}

/* sources */
.refs{display:grid;gap:6px;font-size:12.5px;color:var(--muted);counter-reset:r;padding:0;margin:0}
.refs li{list-style:none;display:grid;grid-template-columns:30px minmax(0,1fr);gap:6px;line-height:1.6}
.refs li::before{counter-increment:r;content:"[" counter(r) "]";font:600 11.5px var(--f-display);color:var(--faint)}
.refs a{color:var(--ink);text-decoration-thickness:1px;text-underline-offset:2px;word-break:break-word}
sup.ref{font:600 10px var(--f-display);color:var(--accent);margin-left:1px;cursor:pointer}
sup.ref a{text-decoration:none;color:inherit}

.scrim{position:fixed;inset:0;z-index:20;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;z-index:21;top:16px;right:16px;bottom:16px;width:min(560px,calc(100% - 32px));border-radius:26px;overflow-y:auto;transform:translateX(110%);transition:transform .32s cubic-bezier(.2,.8,.2,1);padding:22px 22px 30px;display:grid;gap:16px;align-content:start}

.sec h3{font:800 15px var(--f-body)}
.sec p{margin:0;font-size:14px;color:var(--muted);line-height:1.7}
.form{display:grid;gap:12px}
.form label{display:grid;gap:5px;font-size:13px;color:var(--muted)}
.form input,.form select,.form textarea{border:var(--hair) solid var(--line);background:var(--field);border-radius:11px;padding:8px 10px;font-size:14px;color:var(--ink)}
.form .acts{display:flex;gap:8px;flex-wrap:wrap}
.confirm{display:grid;gap:8px;padding:12px 14px;border-radius:16px;border:var(--hair) solid var(--bad);background:var(--bad-soft);font-size:13.5px}
.toast{position:fixed;z-index:30;left:50%;bottom:28px;transform:translate(-50%,20px);opacity:0;transition:all .25s;padding:10px 18px;border-radius:14px;font-size:14px;font-weight:500;max-width:calc(100% - 32px);pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
.foot{font-size:12px;color:var(--faint);padding:0 22px 20px;line-height:1.7}
.planned-v{display:grid;place-items:center;align-content:center;gap:10px;min-height:50vh;text-align:center;color:var(--muted)}
.planned-v h1{font:900 28px var(--f-body);color:var(--ink)}

function cleanProj(p) {
  if (!p || typeof p !== 'object' || !p.id || !p.name) return null;
  return { id: String(p.id), name: String(p.name).slice(0, 16), sector: SECTORS[p.sector] ? p.sector : 'saas', stage: ROUND_IDS.includes(p.stage) ? p.stage : 'seed', note: String(p.note || '').slice(0, 200), order: Number.isFinite(p.order) ? p.order : 99, custom: true };
}
const TARGET_STATUS = ['target', 'contact', 'meet1', 'meet2', 'ts', 'dd', 'closed', 'pass'];
function cleanRec(c, d) {
  if (!d || typeof d !== 'object') return null;
  if (c === 'steps') return { done: !!d.done, note: String(d.note || '').slice(0, 1000), at: String(d.at || '') };
  return TARGET_STATUS.includes(d.status) ? { status: d.status, note: String(d.note || '').slice(0, 1000), at: String(d.at || '') } : null;
}

// ---------- progress helpers (used by every view) ----------
const stepRec = sid => PROG.steps[sid];
const stepDone = sid => { const r = stepRec(sid); return r ? r.done : !!(STEP_BY_ID[sid] && STEP_BY_ID[sid].pre); };
const stepNote = sid => (stepRec(sid) || {}).note || '';
const stepVisible = st => (!st.br || (st.br === 'gov' && S.gov) || (st.br === 'usd' && S.usd)) && (!st.only || st.only.includes(curProj().sector));
const visibleSteps = () => STEPS.filter(stepVisible);
function progressOf() {
  const vs = visibleSteps(), done = vs.filter(s => stepDone(s.id)).length;
  return { done, total: vs.length, pct: vs.length ? done / vs.length : 0 };
}
function currentPhase() {
  const first = visibleSteps().find(s => !stepDone(s.id));
  return first ? PHASES.find(p => p.id === first.ph) : PHASES[PHASES.length - 1];
}

// ---------- data layer: cloud db when available, this browser otherwise ----------
const lsProgKey = pid => 'prog.' + pid;
function loadLocal() {
  CUSTOM = (lsGet('custom', []) || []).map(cleanProj).filter(Boolean).sort(byOrder);
  if (!allProjects().some(p => p.id === S.pid)) S.pid = BUILTIN[0].id;
  loadLocalProg();
}
function loadLocalProg() {
  const raw = lsGet(lsProgKey(S.pid), {}) || {};
  PROG = { steps: {}, targets: {} };
  for (const c of ['steps', 'targets']) for (const [k, v] of Object.entries(raw[c] || {})) { const r = cleanRec(c, v); if (r) PROG[c][k] = r; }
}
const saveLocalProg = pid => lsSet(lsProgKey(pid), PROG);

function setSync(text, cls) { const el = $('sync'); el.className = 'sync ' + (cls || ''); el.querySelector('span').textContent = text; }
function setRO() {
  if (RO) return; RO = true; document.body.classList.add('ro');
  setSync('只读 · 你没有修改权限', 'ro');
}
function onDbError(e) {
  if (e && e.code === 'invalid_argument') { setRO(); toast('你只有查看权限，修改没有保存'); return; }
  if (e && e.code === 'quota_exceeded') { toast('云端存储已满，删除一些记录后再试'); return; }
  setSync('同步中断，显示最后一次数据', 'local');
}

async function connect() {
  let db = null;
  try { db = window.claude && window.claude.use ? await window.claude.use('db') : null; } catch { db = null; }
  if (!db) { mode = 'local'; loadLocal(); setSync('本地模式 · 只保存在此浏览器', 'local'); render(); return; }
  DB = db; mode = 'db'; setSync('已同步到云端');
  try {
    const u = await window.claude.use('user');
    if (u && u.can && (await u.can('data.write')) === false) setRO();
  } catch { }
  DB.collection('projects').onSnapshot(s => {
    CUSTOM = s.docs.map(d => cleanProj({ id: d.id, ...d.data() })).filter(Boolean).sort(byOrder);
    if (!allProjects().some(p => p.id === S.pid)) { S.pid = BUILTIN[0].id; saveUI(); subscribeProg(); }
    render();
  }, onDbError);
  subscribeProg();
  render();
}
function subscribeProg() {
  UNSUB.forEach(u => u()); UNSUB = [];
  PROG = { steps: {}, targets: {} };
  if (mode === 'local') { loadLocalProg(); return; }
  if (mode !== 'db') return;
  const pid = S.pid;
  for (const c of ['steps', 'targets']) UNSUB.push(DB.collection(`projects/${pid}/${c}`).onSnapshot(s => {
    if (pid !== S.pid) return;
    const o = {};
    for (const d of s.docs) { const r = cleanRec(c, d.data()); if (r) o[d.id] = r; }
    PROG[c] = o; render();
  }, onDbError));
}

// One write at a time per document; later writes wait for earlier ones.
const chains = {};
function queueWrite(path, fn) {
  const p = (chains[path] || Promise.resolve()).then(fn, fn).catch(onDbError);
  chains[path] = p; return p;
}
function canWrite() {
  if (RO) { toast('你只有查看权限'); return false; }
  if (mode === 'init') { toast('正在连接数据，请稍候再试'); return false; }
  return true;
}
function setStep(sid, patch) {
  if (!canWrite()) return false;
  const pid = S.pid, cur = stepRec(sid) || { done: stepDone(sid), note: '' };
  const next = { done: !!cur.done, note: cur.note || '', ...patch, at: today() };
  PROG.steps = { ...PROG.steps, [sid]: next };
  if (mode === 'db') queueWrite(`projects/${pid}/steps/${sid}`, () => DB.doc(`projects/${pid}/steps/${sid}`).set(next));
  else saveLocalProg(pid);
  return true;
}
function setTarget(iid, patch) {
  if (!canWrite()) return false;
  const pid = S.pid, path = `projects/${pid}/targets/${iid}`, t = { ...PROG.targets };
  if (patch === null) { delete t[iid]; PROG.targets = t; if (mode === 'db') queueWrite(path, () => DB.doc(path).delete()); else saveLocalProg(pid); return true; }
  const next = { status: 'target', note: '', ...(t[iid] || {}), ...patch, at: today() };
  t[iid] = next; PROG.targets = t;
  if (mode === 'db') queueWrite(path, () => DB.doc(path).set(next)); else saveLocalProg(pid);
  return true;
}
async function addProject(o) {
  if (!canWrite()) return;
  const body = { name: o.name, sector: o.sector, stage: o.stage, note: o.note, order: 10 + CUSTOM.length };
  if (mode === 'db') {
    const r = DB.collection('projects').doc();
    try { await r.set(body); } catch (e) { onDbError(e); return; }
    switchProject(r.id);
  } else {
    const p = cleanProj({ id: newId(), ...body });
    CUSTOM = [...CUSTOM, p].sort(byOrder); lsSet('custom', CUSTOM.map(({ custom, ...r }) => r));
    switchProject(p.id);
  }
  toast('已新增项目「' + o.name + '」');
}
async function deleteProject(pid) {
  if (!canWrite()) return;
  const p = CUSTOM.find(x => x.id === pid); if (!p) return;
  if (mode === 'db') {
    try {
      for (const c of ['steps', 'targets']) { const s = await DB.collection(`projects/${pid}/${c}`).get(); for (const d of s.docs) await DB.doc(`projects/${pid}/${c}/${d.id}`).delete(); }
      await DB.doc('projects/' + pid).delete();
    } catch (e) { onDbError(e); return; }
  } else {
    CUSTOM = CUSTOM.filter(x => x.id !== pid); lsSet('custom', CUSTOM.map(({ custom, ...r }) => r)); lsDel(lsProgKey(pid));
  }
  switchProject(BUILTIN[0].id);
  toast('已删除项目「' + p.name + '」');
}
function switchProject(pid) {
  if (pid === S.pid) { render(); return; }
  S.pid = pid; S.open = {}; saveUI(); subscribeProg(); render();
}

function closeSheet() { $('sheet').classList.remove('on'); $('sheet').setAttribute('aria-hidden', 'true'); $('scrim').classList.remove('on'); }
function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('on'), 2600);

function showTip(el, x, y) {
  const tip = $('tip'), [head, ...rest] = String(el.dataset.tip).split('\n');
  tip.textContent = '';
  const b = document.createElement('b'); b.textContent = head; tip.appendChild(b);
  if (rest.length) { const s = document.createElement('span'); s.textContent = rest.join(' · '); tip.appendChild(s); }
  tip.classList.add('on');
  const r = tip.getBoundingClientRect(), W = innerWidth, H = innerHeight;
  let left = x + 14, top = y + 14;
  if (left + r.width > W - 12) left = Math.max(12, x - r.width - 14);
  if (top + r.height > H - 12) top = Math.max(12, y - r.height - 14);
  tip.style.left = left + 'px'; tip.style.top = top + 'px';
}

// ---------- events ----------

function bind() {
  document.addEventListener('click', e => {
    const el = e.target.closest('[data-act]'); if (!el) return;
    const fn = ACT[el.dataset.act]; if (fn) { e.preventDefault(); fn(el, e); }
  });
  document.addEventListener('change', e => { const el = e.target.closest('[data-chg]'); if (el && ACT[el.dataset.chg]) ACT[el.dataset.chg](el, e); });
  document.addEventListener('input', e => { const el = e.target.closest('[data-inp]'); if (el && ACT[el.dataset.inp]) ACT[el.dataset.inp](el, e); });
  document.addEventListener('submit', e => { const el = e.target.closest('[data-sub]'); if (el && ACT[el.dataset.sub]) { e.preventDefault(); ACT[el.dataset.sub](el, e); } });
  document.addEventListener('focusout', () => setTimeout(() => { if (pendingRender) render(); }, 0));
  $('scrim').addEventListener('click', closeSheet);
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('sheet').classList.contains('on')) closeSheet(); });
  document.addEventListener('pointermove', e => { const el = e.target.closest && e.target.closest('[data-tip]'); if (el) showTip(el, e.clientX, e.clientY); else hideTip(); });
  document.addEventListener('focusin', e => { const el = e.target.closest && e.target.closest('[data-tip]'); if (el) { const r = el.getBoundingClientRect(); showTip(el, r.left + r.width / 2, r.bottom); } });
  document.addEventListener('focusout', e => { if (e.target.closest && e.target.closest('[data-tip]')) hideTip(); });
  $('main').addEventListener('scroll', hideTip, { passive: true });
}

  function gantt() {

    <section class="panel"><h3>上市：五个板块的门槛 <small>交易所规则原文</small></h3><div class="tbl"><table><thead><tr><th>板块</th><th>定位</th><th>典型上市标准（之一）</th><th>对你意味着</th></tr></thead><tbody>
      ${LISTING.map(l => `<tr><td><b>${esc(l.b)}</b></td><td>${esc(l.pos)}</td><td>${rich(l.std)}${ref(...l.src)}</td><td>${rich(l.mean)}</td></tr>`).join('')}
    </tbody></table></div></section>
    <section class="panel"><h3>市场数据 <small>募资与投资两端</small></h3><div class="tbl"><table><thead><tr><th>指标</th><th>数值</th><th>时间</th><th>说明什么</th></tr></thead><tbody>
      ${MARKET.map(m => `<tr><td>${esc(m.l)}</td><td class="n"><b>${esc(m.v)}</b>${ref(m.src)}</td><td class="n">${esc(m.d)}</td><td>${rich(m.mean)}</td></tr>`).join('')}
    </tbody></table></div></section>`;
  }

  function instRow(i) {
    const t = PROG.targets[i.id];
    return `<div class="inst"><b>${esc(i.n)}</b>
      <div class="ev">${esc(i.focus)}。${esc(i.ev)} <a href="${esc(i.src)}" target="_blank" rel="noopener">${esc(i.srcT)} ${I.ext}</a></div>
      <div class="act">${t ? `<select data-chg="tstatus" data-id="${i.id}" data-w aria-label="${esc(i.n)} 的进度">${TARGET_STATUS.map(s => `<option value="${s}" ${t.status === s ? 'selected' : ''}>${STATUS_N[s]}</option>`).join('')}</select>`
        : `<button class="btn ghost sm" data-act="target" data-id="${i.id}" data-w>＋ 目标清单</button>`}</div></div>`;
  }
  function typeCard(t, f) {
    const list = instsOf(t.id), shown = list.slice(0, 4), rest = list.slice(4);
    return `<article class="sc" id="type-${t.id}"><div class="hd"><h4>${esc(t.n)}${f >= 4 ? '<span class="tag ok"><i></i>优先</span>' : f <= 1 ? '<span class="tag">不建议</span>' : ''}</h4>
      <div class="fit"><span class="meter" style="width:72px" role="img" aria-label="适配度 ${f} 分"><i style="width:${f * 20}%"></i></span><b>${f}</b>/5</div></div>
      <p class="why">${rich(whyOf(t.id))}</p>
      <div class="facts"><div>常见额度<b>${esc(t.amt)}</b></div><div>周期<b>${esc(t.cyc)}</b></div><div>门槛<b>${rich(t.gate)}</b></div><div>要留意的条款<b>${rich(t.terms)}</b></div></div>
      <p class="why"><b>怎么接触：</b>${rich(t.how)}${t.src ? ref(...t.src) : ''}</p>
      ${list.length ? `<div class="insts">${shown.map(instRow).join('')}</div>${rest.length ? `<details class="more-insts"><summary>再看 ${rest.length} 家</summary><div class="insts">${rest.map(instRow).join('')}</div></details>` : ''}` : ''}
    </article>`;
  }
  function vSources() {
    const p = proj(), r = rankedTypes(), top = r.slice(0, 3).map(x => x.t.short || x.t.n).join('、');
    return `<div class="vhead"><div><div class="eyebrow">找对口资方</div><h1>${esc(p.short || p.name)} 先找：${esc(top)}</h1>
      <p>${rich(SOURCES_LEAD)}</p></div></div>
    <section class="panel"><h3>适配度矩阵 <small>点格子看这一类资方的门槛和机构</small></h3>${heatmap()}</section>
    <div class="srcs">${r.map(({ t, f }) => typeCard(t, f)).join('')}</div>`;
  }

  function vPitch() {
    const p = proj(), pitchSteps = STEPS.filter(s => s.ph === 'pitch' && stepVisible(s));
    const mine = Object.values(PROG.targets);
    const reached = FUNNEL.map(s => ({ s, n: mine.filter(t => FUNNEL.indexOf(t.status) >= FUNNEL.indexOf(s)).length }));
    const mx = Math.max(1, ...reached.map(x => x.n));
    return `<div class="vhead"><div><div class="eyebrow">路演</div><h1>一份 BP，过三道会</h1>
      <p>${rich(PITCH_LEAD)}</p></div></div>
    <section class="panel"><h3>投资机构内部怎么过会 <small>你见到的人和最终拍板的人不是同一批</small></h3>${meetFlow()}</section>
    <section class="panel"><h3>BP 结构 · ${BP.length} 页 <small>每页回答投资人的一个问题；横线下是${esc(p.short || p.name)}的要点</small></h3>
      <div class="slides">${BP.map(b => `<div class="sl"><b>${esc(b.t)}</b><span>${esc(b.q)}</span>${p.bp && p.bp[b.id] ? `<em>${rich(p.bp[b.id])}</em>` : ''}</div>`).join('')}</div></section>
    <div class="cols">
      <section class="panel"><h3>路演材料与动作 <small>勾选即记入进度</small></h3>${pitchSteps.map(s => stepRow(s)).join('')}</section>
      <section class="panel"><h3>你的漏斗 <small>按「目标清单」里每家机构走到的最远一步</small></h3>
        ${mine.length ? `<div class="funnel">${reached.map(x => `<div class="fbar"><span>${STATUS_N[x.s]}</span><div class="tr" data-tip="${esc(`${x.n} 家\n${STATUS_N[x.s]}`)}"><i style="width:${(x.n / mx * 100).toFixed(1)}%"></i><em style="left:calc(${(x.n / mx * 100).toFixed(1)}% + 8px)">${x.n}</em></div></div>`).join('')}</div>`
        : `<p class="empty">还没有目标机构。到「找资方」点「＋ 目标清单」，这里会按进度画出漏斗。</p>`}
        <p class="small muted">${rich(FUNNEL_NOTE)}${ref(...FUNNEL_SRC)}</p></section>
    </div>
    <section class="panel"><h3>投资人必问 <small>${esc(p.short || p.name)}的专属问题在前</small></h3><div class="qa">
      ${[...(p.qa || []), ...QA].map(q => `<details><summary>${esc(q.q)}${I.chev}</summary><p>${rich(q.a)}${q.src ? ref(...q.src) : ''}</p></details>`).join('')}
    </div></section>`;
  }
  function meetFlow() {
    const W = 760, H = 150, n = MEETINGS.length, gap = 14, bw = (W - gap * (n - 1)) / n;
    let g = `<defs><marker id="ar" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 8 4 0 8z" fill="currentColor" opacity=".55"/></marker></defs>`;
    MEETINGS.forEach((m, i) => {
      const x = i * (bw + gap);
      g += `<rect x="${x.toFixed(1)}" y="26" width="${bw.toFixed(1)}" height="96" rx="14" class="${m.hi ? 'hi' : ''}"/>
        <text class="k" x="${(x + 12).toFixed(1)}" y="18">${esc(m.k)}</text>
        <text x="${(x + 12).toFixed(1)}" y="52">${esc(m.n)}</text>
        <text class="s" x="${(x + 12).toFixed(1)}" y="74">${esc(m.who)}</text>
        <text class="s" x="${(x + 12).toFixed(1)}" y="92">${esc(m.dur)}</text>
        <text class="s" x="${(x + 12).toFixed(1)}" y="110">${esc(m.out)}</text>`;
      if (i < n - 1) g += `<line x1="${(x + bw + 2).toFixed(1)}" x2="${(x + bw + gap - 2).toFixed(1)}" y1="74" y2="74" marker-end="url(#ar)" style="color:var(--faint)"/>`;
    });
    return `<figure class="fig"><div class="flow"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(MEETINGS.map(m => m.n).join(' → '))}">${g}</svg></div><figcaption>${rich(MEET_NOTE)}${ref(...MEET_SRC)}</figcaption></figure>`;
  }

  function vProcess() {
    const cp = currentPhase();
    return `<div class="vhead"><div><div class="eyebrow">单轮交割</div><h1>一轮融资：从准备到打款</h1>
      <p>${rich(PROCESS_LEAD)}</p></div></div>
    <section class="panel"><h3>时间线 <small>悬停看每段时长</small></h3>${gantt()}
      <div class="branch"><span>你的投资方里有：</span><button class="chip" aria-pressed="${S.gov}" data-act="br" data-id="gov">国资 / 国有创投</button><button class="chip" aria-pressed="${S.usd}" data-act="br" data-id="usd">美元基金（境外架构）</button><span class="small">打开后对应支线步骤会加入清单</span></div></section>
    ${PHASES.map(ph => { const ss = STEPS.filter(s => s.ph === ph.id && stepVisible(s)); if (!ss.length) return ''; const d = ss.filter(s => stepDone(s.id)).length;
      return `<section class="panel phase${ph.id === cp.id ? ' now' : ''}" id="ph-${ph.id}"><header><h3>${esc(ph.n)} <small>${ph.w ? wk(ph.w) : ''}</small></h3><span class="cnt">${d} / ${ss.length}</span></header>
        <p>${rich(ph.d)}${ph.src ? ref(...ph.src) : ''}</p>${ss.map(s => stepRow(s)).join('')}</section>`; }).join('')}`;
  }

  function vProgress() {
    const p = proj(), pr = progressOf(), cp = currentPhase(), ts = PROG.targets;
    const card = id => { const i = INSTS.find(x => x.id === id); if (!i) return ''; const t = ts[id];
      return `<div class="card"><b>${esc(i.n)}</b><small>${esc(TYPE[i.type] ? TYPE[i.type].short || TYPE[i.type].n : '')}${t.at ? ' · ' + esc(t.at) : ''}</small>
        <select data-chg="tstatus" data-id="${id}" data-w aria-label="${esc(i.n)} 的进度">${TARGET_STATUS.map(s => `<option value="${s}" ${t.status === s ? 'selected' : ''}>${STATUS_N[s]}</option>`).join('')}</select>
        <button class="btn ghost sm" data-act="untarget" data-id="${id}" data-w>移出清单</button></div>`; };
    const notes = visibleSteps().filter(s => stepNote(s.id));
    return `<div class="vhead"><div><div class="eyebrow">我的进度 · ${esc(p.name)}</div><h1>完成 ${pr.done} / ${pr.total} 步，当前在「${esc(cp.n)}」</h1>
      <p>${mode === 'db' ? '进度保存在云端，换设备打开同一链接也能看到。' : mode === 'local' ? '当前是本地模式：进度只保存在这个浏览器里。' : '正在连接数据…'}${p.custom ? ' 这是你新增的项目，' : ''}${p.custom ? '<button class="btn ghost sm" data-act="editproj" data-w>编辑或删除项目</button>' : ''}</p></div></div>
    <div class="cols">
      <section class="panel"><h3>各阶段完成度</h3><div class="phbars">${PHASES.map(ph => { const ss = STEPS.filter(s => s.ph === ph.id && stepVisible(s)); if (!ss.length) return ''; const d = ss.filter(s => stepDone(s.id)).length;
        return `<div class="phb${ph.id === cp.id ? ' now' : ''}"><span>${esc(ph.n)}</span><span class="meter" role="img" aria-label="${esc(ph.n)} 完成 ${d} / ${ss.length}"><i style="width:${(d / ss.length * 100).toFixed(1)}%"></i></span><b>${d}/${ss.length}</b></div>`; }).join('')}</div>
        <button class="btn ghost sm" data-act="tab" data-id="process" style="justify-self:start">去勾选步骤 →</button></section>
      <section class="panel"><h3>写过备注的步骤 <small>${notes.length} 条</small></h3>${notes.length ? notes.map(s => `<div class="steprow"><span></span><div><b class="t">${esc(s.t)}</b><div class="d">${esc(stepNote(s.id))}</div></div><span></span></div>`).join('') : '<p class="empty">在任意步骤展开后写备注，会汇总到这里。</p>'}</section>
    </div>
    <section class="panel"><h3>目标机构看板 <small>${Object.keys(ts).length} 家 · 从「找资方」加入</small></h3>
      <div class="board">${COLS.map(c => { const ids = Object.keys(ts).filter(id => c.s.includes(ts[id].status) && INSTS.some(i => i.id === id));
        return `<div class="col"><h4>${c.n}<b>${ids.length}</b></h4>${ids.length ? ids.map(card).join('') : '<p class="empty">—</p>'}</div>`; }).join('')}</div></section>`;
  }

  // ----- sheets -----
  function typeSheet(tid, pid) {
    const t = TYPE[tid], p = allProjects().find(x => x.id === pid) || proj();
    openSheet(`<div class="hd"><div><div class="eyebrow">资方类型</div><h2>${esc(t.n)}</h2><p>${esc(p.name)} 适配度 <b class="num">${fitOf(tid, p)}</b> / 5</p></div><button class="x" data-act="close" aria-label="关闭">${I.x}</button></div>
      <div class="sec"><h3>为什么是这个分数</h3><p>${plainRich(whyOf(tid, p))}</p></div>
      <div class="sec"><h3>要点</h3><div class="facts" style="grid-template-columns:repeat(2,minmax(0,1fr))"><div>常见额度<b>${esc(t.amt)}</b></div><div>周期<b>${esc(t.cyc)}</b></div><div>门槛<b>${plainRich(t.gate)}</b></div><div>要留意的条款<b>${plainRich(t.terms)}</b></div></div><p><b>怎么接触：</b>${plainRich(t.how)}</p></div>
      <div class="sec"><h3>机构 <small class="muted">${instsOf(tid, p).length} 家</small></h3><div class="insts">${instsOf(tid, p).map(instRow).join('') || '<p class="muted small">这一类不点名具体机构。</p>'}</div></div>
      <div class="sec"><p class="small">来源：${(t.src || []).filter(k => SRC[k]).map(k => `<a href="${esc(SRC[k].u)}" target="_blank" rel="noopener">${esc(SRC[k].t)}</a>`).join('；') || '见「找资方」页底部'}</p></div>`);
  }
  function projectForm(edit) {
    const p = edit ? proj() : { name: '', sector: 'saas', stage: 'seed', note: '' };
    openSheet(`<div class="hd"><div><div class="eyebrow">${edit ? '编辑项目' : '新增项目'}</div><h2>${edit ? esc(p.name) : '把另一个项目放进来'}</h2><p>赛道决定资方适配度；下一轮决定轮次地图上的位置。</p></div><button class="x" data-act="close" aria-label="关闭">${I.x}</button></div>
      <form class="form" data-sub="${edit ? 'saveproj' : 'addproj'}">
        <label for="pf-name">项目名称<input id="pf-name" name="name" maxlength="16" required value="${esc(p.name)}" placeholder="例如：UNO 日刊"></label>
        <label for="pf-sector">赛道<select id="pf-sector" name="sector">${Object.entries(SECTORS).map(([k, s]) => `<option value="${k}" ${p.sector === k ? 'selected' : ''}>${esc(s.n)}</option>`).join('')}</select></label>
        <label for="pf-stage">下一轮要融<select id="pf-stage" name="stage">${ROUNDS.map(r => `<option value="${r.id}" ${p.stage === r.id ? 'selected' : ''}>${esc(r.n)}</option>`).join('')}</select></label>
        <label for="pf-note">备注<textarea id="pf-note" name="note" maxlength="200" rows="3" placeholder="一句话说明项目">${esc(p.note)}</textarea></label>
        <div class="acts"><button class="btn pri" type="submit">${edit ? '保存' : '新增项目'}</button><button class="btn ghost" type="button" data-act="close">取消</button></div>
      </form>
      ${edit ? `<div class="sec"><h3>删除项目</h3><p>会同时删除这个项目的全部进度和目标清单。</p><div id="delbox"><button class="btn ghost sm" data-act="askdel">删除「${esc(p.name)}」</button></div></div>` : ''}`);
  }

  // ----- actions -----
  Object.assign(ACT, {
    tab: el => { S.tab = el.dataset.id; saveUI(); render(); $('main').scrollTop = 0; },
    open: el => { S.open[el.dataset.id] = !S.open[el.dataset.id]; render(); const t = $('note-' + el.dataset.id); if (t && S.open[el.dataset.id]) t.focus({ preventScroll: true }); },
    step: el => { if (!setStep(el.dataset.id, { done: el.checked })) el.checked = !el.checked; render(); },
    note: el => { const id = el.dataset.id, v = el.value.slice(0, 1000); clearTimeout(ACT.note[id]); ACT.note[id] = setTimeout(() => { if (v !== stepNote(id)) setStep(id, { note: v }); }, 700); },
    br: el => { S[el.dataset.id] = !S[el.dataset.id]; saveUI(); render(); },
    type: el => typeSheet(el.dataset.id, el.dataset.pid || S.pid),
    target: el => { if (setTarget(el.dataset.id, { status: 'target' })) { toast('已加入目标清单'); render(); if ($('sheet').classList.contains('on')) { const b = $('sheet').querySelector(`[data-act="target"][data-id="${el.dataset.id}"]`); if (b) b.replaceWith(Object.assign(document.createElement('span'), { className: 'tag ok', textContent: '已加入' })); } } },
    untarget: el => { if (setTarget(el.dataset.id, null)) render(); },
    tstatus: el => { if (setTarget(el.dataset.id, { status: el.value })) render(); },
    editproj: () => projectForm(true),
    addproj: el => { const f = new FormData(el), name = String(f.get('name') || '').trim(); if (!name) return; closeSheet(); addProject({ name, sector: f.get('sector'), stage: f.get('stage'), note: String(f.get('note') || '').trim() }); },
    saveproj: async el => {
      const f = new FormData(el), p = proj(), name = String(f.get('name') || '').trim(); if (!name || !canWrite()) return;
      const body = { name, sector: f.get('sector'), stage: f.get('stage'), note: String(f.get('note') || '').trim(), order: p.order };
      closeSheet();
      if (mode === 'db') { try { await DB.doc('projects/' + p.id).set(body); } catch (e) { onDbError(e); } }
      else { CUSTOM = CUSTOM.map(x => x.id === p.id ? cleanProj({ id: p.id, ...body }) : x); lsSet('custom', CUSTOM.map(({ custom, ...r }) => r)); render(); }
      toast('已保存');
    },
    askdel: () => { $('delbox').innerHTML = `<div class="confirm">确定删除？这一步不能撤销。<div class="acts" style="display:flex;gap:8px"><button class="btn sm" style="background:var(--bad);color:#fff" data-act="dodel">删除</button><button class="btn ghost sm" data-act="close">取消</button></div></div>`; },
    dodel: () => { closeSheet(); deleteProject(S.pid); }
  });

  const VIEWS = { overview: vOverview, rounds: vRounds, sources: vSources, pitch: vPitch, process: vProcess, progress: vProgress };
  function renderModule(main) {
    if (!VIEWS[S.tab]) S.tab = 'overview';
    REFS = [];
    const body = VIEWS[S.tab]();
    main.innerHTML = `<div class="subnav"><div class="seg" role="tablist" aria-label="融资能力">${TABS.map(t => `<button role="tab" aria-selected="${S.tab === t.id}" data-act="tab" data-id="${t.id}">${t.n}</button>`).join('')}</div></div>
      <section class="view" role="tabpanel">${body}${refsHTML()}</section>${foot()}`;
  }
  return { render: renderModule, projectForm };
})();

// ---------- boot ----------
bind();
if (/^#(overview|rounds|sources|pitch|process|progress)$/.test(location.hash)) S.tab = location.hash.slice(1);
render();
connect();

})();</script>
