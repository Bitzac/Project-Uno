<title>身体健康 OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>:root{--bg:#EAF2FA;--blob1:#7CC6FF;--blob2:#FFB8C8;--blob3:#8DEBC6;--blob4:#C7B5FF;--ink:#0E1B2C;--muted:#56667C;--faint:#8494AA;--glass-a:rgba(255,255,255,.62);--glass-b:rgba(255,255,255,.3);--glass-edge:rgba(255,255,255,.85);--glass-inner:rgba(255,255,255,.95);--shadow:rgba(38,72,130,.2);--line:rgba(14,27,44,.1);--field:rgba(255,255,255,.7);--blue:#1C7CF2;--blue-soft:rgba(28,124,242,.12);--c-issue:#FF4F5E;--c-issue-soft:rgba(255,79,94,.15);--c-vital:#1C7CF2;--c-vital-soft:rgba(28,124,242,.13);--c-lab:#7657F5;--c-lab-soft:rgba(118,87,245,.15);--c-plan:#00A5C4;--c-plan-soft:rgba(0,165,196,.15);--s0:#9FD8FF;--s1:#FADB5F;--s2:#FF8C1A;--s3:#EF3E36;--s4:#C8157E;--s1-soft:rgba(250,219,95,.34);--s2-soft:rgba(255,140,26,.2);--s3-soft:rgba(239,62,54,.16);--s4-soft:rgba(200,21,126,.15);--ok:#12A150;--ok-soft:rgba(18,161,80,.13);--band:rgba(18,161,80,.1);--portal-hi:#1F5BB8;--portal-lo:#0A2560;--halo-mid:#4FB2FF;--bloom-op:.5;--hud-a:rgba(255,255,255,.92);--hud-b:rgba(255,255,255,.84);--hud-muted:#4A5A70;--hud-faint:#5F6E84;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0A1322;--blob1:#1B5FA8;--blob2:#7A2E4A;--blob3:#11705A;--blob4:#4B3A99;--ink:#EDF3FF;--muted:#A5B3C8;--faint:#72829A;--glass-a:rgba(28,40,64,.62);--glass-b:rgba(18,28,48,.38);--glass-edge:rgba(255,255,255,.18);--glass-inner:rgba(255,255,255,.22);--shadow:rgba(0,0,0,.45);--line:rgba(255,255,255,.1);--field:rgba(255,255,255,.08);--blue:#5AA8FF;--blue-soft:rgba(90,168,255,.16);--c-issue:#FF6673;--c-issue-soft:rgba(255,102,115,.2);--c-vital:#5AA8FF;--c-vital-soft:rgba(90,168,255,.18);--c-lab:#A08BFF;--c-lab-soft:rgba(160,139,255,.2);--c-plan:#2BD0EE;--c-plan-soft:rgba(43,208,238,.18);--s1-soft:rgba(250,219,95,.2);--s2-soft:rgba(255,140,26,.22);--s3-soft:rgba(239,62,54,.24);--s4-soft:rgba(200,21,126,.26);--ok:#3DDC84;--ok-soft:rgba(61,220,132,.16);--band:rgba(61,220,132,.1);--portal-hi:#184C9E;--portal-lo:#051636;--halo-mid:#2F8CFF;--bloom-op:.65;--hud-a:rgba(24,36,62,.84);--hud-b:rgba(14,24,44,.74);--hud-muted:#A5B3C8;--hud-faint:#8898B0;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0A1322;--blob1:#1B5FA8;--blob2:#7A2E4A;--blob3:#11705A;--blob4:#4B3A99;--ink:#EDF3FF;--muted:#A5B3C8;--faint:#72829A;--glass-a:rgba(28,40,64,.62);--glass-b:rgba(18,28,48,.38);--glass-edge:rgba(255,255,255,.18);--glass-inner:rgba(255,255,255,.22);--shadow:rgba(0,0,0,.45);--line:rgba(255,255,255,.1);--field:rgba(255,255,255,.08);--blue:#5AA8FF;--blue-soft:rgba(90,168,255,.16);--c-issue:#FF6673;--c-issue-soft:rgba(255,102,115,.2);--c-vital:#5AA8FF;--c-vital-soft:rgba(90,168,255,.18);--c-lab:#A08BFF;--c-lab-soft:rgba(160,139,255,.2);--c-plan:#2BD0EE;--c-plan-soft:rgba(43,208,238,.18);--s1-soft:rgba(250,219,95,.2);--s2-soft:rgba(255,140,26,.22);--s3-soft:rgba(239,62,54,.24);--s4-soft:rgba(200,21,126,.26);--ok:#3DDC84;--ok-soft:rgba(61,220,132,.16);--band:rgba(61,220,132,.1);--portal-hi:#184C9E;--portal-lo:#051636;--halo-mid:#2F8CFF;--bloom-op:.65;--hud-a:rgba(24,36,62,.84);--hud-b:rgba(14,24,44,.74);--hud-muted:#A5B3C8;--hud-faint:#8898B0;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Noto Sans SC","Outfit",system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;font-size:16px;line-height:1.5;padding-inline:16px;padding-block:16px;overflow:hidden;position:relative}
.num,.latin{font-family:"Outfit","Noto Sans SC",system-ui,sans-serif;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

/* aurora + glass */
.aurora{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.aurora i{position:absolute;border-radius:50%;filter:blur(70px);opacity:.75}
.aurora i:nth-child(1){width:46vw;height:46vw;left:-10vw;top:-12vw;background:var(--blob1)}
.aurora i:nth-child(2){width:36vw;height:36vw;right:-6vw;top:-8vw;background:var(--blob4)}
.aurora i:nth-child(3){width:40vw;height:40vw;left:22vw;bottom:-22vw;background:var(--blob3)}
.aurora i:nth-child(4){width:30vw;height:30vw;right:4vw;bottom:-10vw;background:var(--blob2)}
.glass{background:linear-gradient(145deg,var(--glass-a),var(--glass-b));-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);border:1px solid var(--glass-edge);box-shadow:inset 0 1px 0 var(--glass-inner),inset 0 -1px 1px rgba(255,255,255,.12),0 24px 60px -20px var(--shadow)}
.window{position:relative;z-index:1;height:100%;display:grid;grid-template-columns:minmax(330px,1fr) 2fr;border-radius:28px;overflow:hidden}
.window.enter{animation:winIn 1s cubic-bezier(.2,.7,.2,1)}
@keyframes winIn{0%{opacity:0;transform:scale(.96);filter:blur(6px)}}

/* sidebar */
.side{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--line);background:linear-gradient(180deg,rgba(255,255,255,.18),rgba(255,255,255,0))}
.titlebar{display:flex;align-items:center;gap:14px;padding:18px 22px 6px}
.lights{display:flex;gap:8px}
.lights span{width:13px;height:13px;border-radius:50%;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.15)}
.lights span:nth-child(1){background:#FF5F57}.lights span:nth-child(2){background:#FEBC2E}.lights span:nth-child(3){background:#28C840}
.brand{padding:10px 22px 0}
.brand h1{margin:0;font-size:30px;line-height:1.15;font-weight:700;letter-spacing:.01em;text-wrap:balance}
.brand p{margin:2px 0 0;color:var(--muted);font-size:14px;letter-spacing:.14em;text-transform:uppercase}
.people{display:flex;gap:6px;margin:14px 22px 0;overflow-x:auto;scrollbar-width:none;padding:2px}
.people button{flex:none;display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--field);border-radius:999px;padding:4px 12px 4px 4px;cursor:pointer;font-size:15px;font-weight:500;color:var(--ink)}
.people button small{font-size:12px;color:var(--muted);font-weight:400}
.people button[aria-selected="true"]{background:var(--glass-a);border-color:var(--blue);box-shadow:0 0 0 1px var(--blue) inset,0 6px 16px -8px var(--shadow)}
.people .av{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:13px;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--c-vital),var(--c-lab))}
.people .av.f,.pf-ava.f{background:linear-gradient(135deg,#E0569B,var(--c-lab))}
.people .add{padding:4px 12px;color:var(--blue);border-style:dashed}
.mods{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:16px 22px 0;padding:4px;border-radius:16px;background:var(--field);border:1px solid var(--line)}
.mods button{font-size:15px;font-weight:500;border:0;background:none;color:var(--muted);padding:9px 2px;border-radius:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap;min-width:0}
.mods button[aria-selected="true"]{background:var(--glass-a);color:var(--ink);box-shadow:inset 0 1px 0 var(--glass-inner),0 4px 12px -4px var(--shadow)}
.mods .n{font-size:13px;color:var(--faint);font-weight:400}
.kd{display:inline-block;width:10px;height:10px;border-radius:50%;flex:none}
.k-issue{background:var(--c-issue)}.k-vital{background:var(--c-vital)}.k-lab{background:var(--c-lab)}.k-plan{background:var(--c-plan)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;padding:18px 22px 6px}
.stat{padding:10px 10px 8px;border-radius:16px;background:var(--field);border:1px solid var(--line);min-width:0}
.stat b{display:block;font-size:clamp(20px,1.95vw,28px);line-height:1.08;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat b small{font-size:13px;font-weight:500;color:var(--muted);margin-left:2px}
.stat b.sm{font-size:clamp(14px,1.2vw,17px);line-height:1.95}
.stat span{font-size:12.5px;color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trail{margin:8px 22px 0;font-size:14px;color:var(--muted);line-height:1.6}
.trail b{color:var(--ink);font-weight:600}
.tools{display:flex;gap:8px;padding:14px 22px 6px;align-items:center}
.search{flex:1;position:relative;min-width:0}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;stroke:var(--faint)}
.search input{width:100%;font:inherit;font-size:16px;padding:9px 12px 9px 38px;border-radius:14px;border:1px solid var(--line);background:var(--field);color:var(--ink);outline:none}
.search input:focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-soft)}
.seg{display:inline-flex;padding:3px;border-radius:12px;background:var(--field);border:1px solid var(--line);flex:none}
.seg button{font-size:14px;border:0;background:none;color:var(--muted);padding:6px 11px;border-radius:9px;cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--glass-a);color:var(--ink);box-shadow:0 1px 4px var(--shadow);font-weight:500}
.zchip{margin:6px 22px 0;display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted)}
.zchip button{border:0;background:var(--blue-soft);color:var(--ink);border-radius:999px;padding:3px 6px 3px 12px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-size:14px}
.zchip button i{font-style:normal;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;background:var(--glass-a);font-size:12px}
.notice{margin:8px 22px 4px;padding:10px 12px;border-radius:14px;background:var(--blue-soft);font-size:14px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.notice button{font-size:13px;border:0;border-radius:10px;padding:5px 10px;background:var(--glass-a);cursor:pointer}
.list{flex:1;min-height:0;overflow-y:auto;padding:4px 12px 12px}
.group-h{display:flex;justify-content:space-between;align-items:baseline;padding:14px 12px 6px;font-size:13px;letter-spacing:.12em;color:var(--faint);text-transform:uppercase}
.group-h .num{letter-spacing:.02em;text-transform:none}
.item{width:100%;display:grid;grid-template-columns:14px minmax(0,1fr) auto;align-items:center;gap:12px;text-align:left;border:1px solid transparent;background:none;padding:10px 12px;border-radius:16px;cursor:pointer;transition:background .15s}
.item:hover{background:var(--field)}
.item[aria-current="true"]{background:var(--glass-a);border-color:var(--glass-edge);box-shadow:inset 0 1px 0 var(--glass-inner),0 8px 20px -12px var(--shadow)}
.item .nm{font-size:17px;font-weight:500;line-height:1.35}
.item .sub{font-size:13.5px;color:var(--muted);line-height:1.45}
.item.done .nm{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--faint)}
.dot{width:12px;height:12px;border-radius:50%;background:var(--s0)}
.dot.s1{background:var(--s1);box-shadow:0 0 0 4px var(--s1-soft)}.dot.s2{background:var(--s2);box-shadow:0 0 0 4px var(--s2-soft)}.dot.s3{background:var(--s3);box-shadow:0 0 0 4px var(--s3-soft)}.dot.s4{background:var(--s4);box-shadow:0 0 0 4px var(--s4-soft)}
.dot.res{background:transparent;box-shadow:inset 0 0 0 2px var(--faint)}
.pill{font-size:12.5px;padding:2px 9px;border-radius:999px;white-space:nowrap;background:var(--field);border:1px solid var(--line);color:var(--ink);display:inline-flex;align-items:center;gap:5px;line-height:1.5}
.pill i{width:7px;height:7px;border-radius:50%;flex:none}
.pill.s1{background:var(--s1-soft);border-color:transparent}.pill.s1 i{background:var(--s1)}
.pill.s2{background:var(--s2-soft);border-color:transparent}.pill.s2 i{background:var(--s2)}
.pill.s3{background:var(--s3-soft);border-color:transparent}.pill.s3 i{background:var(--s3)}
.pill.s4{background:var(--s4-soft);border-color:transparent}.pill.s4 i{background:var(--s4)}
.pill.ok{background:var(--ok-soft);border-color:transparent}.pill.ok i{background:var(--ok)}
.pill.mute{color:var(--muted)}
.pill.plan{background:var(--c-plan-soft);border-color:transparent}
.empty{padding:28px 14px;color:var(--muted);font-size:15px;text-align:center;line-height:1.7}
.foot{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 22px 18px;border-top:1px solid var(--line)}
.sync{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px;min-width:0}
.sync i{width:8px;height:8px;border-radius:50%;background:#2BC770;flex:none}
.sync.local i{background:#F2A93B}
.btn{font-size:16px;font-weight:500;border:0;border-radius:14px;padding:10px 18px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.btn.primary{background:var(--blue);color:#fff;box-shadow:0 8px 20px -8px var(--blue)}
.btn.ghost{background:var(--field);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--c-issue);color:#fff}
.btn.sm{font-size:14px;padding:7px 13px;border-radius:12px}
.btn:disabled{opacity:.45;cursor:default}
.linkbtn{font-size:14px;border:0;background:none;color:var(--blue);cursor:pointer;padding:4px 2px;white-space:nowrap}
.ro [data-w]{display:none!important}

/* vitals */
.vcard{width:100%;text-align:left;border:1px solid var(--line);background:var(--field);border-radius:18px;padding:12px 14px 10px;margin-top:10px;cursor:pointer;display:grid;grid-template-columns:minmax(0,1fr) 128px;gap:2px 12px;align-items:center}
.vcard:hover{border-color:var(--c-vital)}
.vcard .vh{display:flex;align-items:center;gap:8px;font-size:15px;color:var(--muted);grid-column:1/-1}
.vcard .vh b{color:var(--ink);font-weight:600;font-size:16px}
.vcard .vh .pill{margin-left:auto}
.vcard .vv{font-size:14px;color:var(--muted);line-height:1.3}
.vcard .vv b{font-family:Outfit,sans-serif;font-size:28px;font-weight:600;color:var(--ink);margin-right:3px}
.vcard .vd{font-size:13px;color:var(--faint);grid-column:1/-1}
.vcard svg{display:block;width:128px;height:40px}
.back{font-size:14px;border:0;background:none;color:var(--blue);cursor:pointer;padding:10px 4px 2px}
.dhead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:4px 4px 0}
.dhead h2{margin:0;font-size:24px;line-height:1.25}
.dhead .meta{font-size:14px;color:var(--muted);margin-top:2px}
.chart{position:relative;margin:12px 0 4px;padding:10px 6px 4px;border-radius:18px;background:var(--field);border:1px solid var(--line)}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .tip{position:absolute;pointer-events:none;padding:5px 9px;border-radius:10px;font-size:13px;white-space:nowrap;background:var(--glass-a);border:1px solid var(--glass-edge);box-shadow:0 8px 20px -10px var(--shadow);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.ax{font:11.5px Outfit,sans-serif;fill:var(--faint);font-variant-numeric:tabular-nums}
.axl{stroke:var(--line);stroke-width:1}
.bandlbl{font:11.5px "Noto Sans SC",sans-serif;fill:var(--muted)}
.lgd{display:flex;gap:14px;font-size:13px;color:var(--muted);padding:0 6px 4px}
.lgd span{display:inline-flex;align-items:center;gap:6px}
.lgd i{width:14px;height:3px;border-radius:2px}
.rec{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 6px;border-bottom:1px solid var(--line);font-size:15px}
.rec .num{font-weight:600}
.rec small{color:var(--muted);font-size:13px}
.ib{width:28px;height:28px;border-radius:9px;border:0;background:var(--field);color:var(--muted);cursor:pointer;font-size:14px;line-height:1}
.ib.arm{background:var(--c-issue);color:#fff;width:auto;padding:0 8px;font-size:12.5px}
.tacts{display:flex;flex-wrap:wrap;gap:8px;padding:14px 4px 6px;align-items:center}
.note{margin:12px 4px 4px;font-size:13px;color:var(--faint);line-height:1.6}

/* labs */
.lab .nm{display:flex;gap:6px;align-items:baseline;flex-wrap:wrap}
.lab .code{font:500 12.5px Outfit,sans-serif;color:var(--faint)}
.lab .lv{display:flex;align-items:center;gap:10px;font-size:13.5px;color:var(--muted)}
.lab .lv b{font:600 17px Outfit,sans-serif;color:var(--ink)}
.rbar{display:block;width:120px;height:14px;flex:none}
.rbar .trk{fill:var(--line)}
.rbar .nrm{fill:var(--ok-soft)}
.rbar .mk{stroke:var(--bg);stroke-width:2}

/* plans */
.prow{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:2px;border-radius:16px}
.prow .item{grid-template-columns:minmax(0,1fr) auto;padding-left:6px}
.chk{width:26px;height:26px;margin-left:8px;border-radius:8px;border:2px solid var(--faint);background:none;cursor:pointer;display:grid;place-items:center;padding:0}
.chk[aria-pressed="true"]{background:var(--c-plan);border-color:var(--c-plan)}
.chk[aria-pressed="true"]::after{content:"";width:10px;height:6px;border:solid #fff;border-width:0 0 2.5px 2.5px;transform:translateY(-1px) rotate(-45deg)}
.ro .chk{pointer-events:none}

/* stage */
.stage{position:relative;min-height:0;overflow:hidden}
.scanbg{position:absolute;inset:0;z-index:0;pointer-events:none;background:radial-gradient(ellipse 62% 78% at var(--cx,40%) var(--cy,50%),var(--portal-hi),var(--portal-lo))}
.scanbg::after{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(168,230,255,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(168,230,255,.07) 1px,transparent 1px);background-size:48px 48px;background-position:var(--cx,40%) var(--cy,50%);-webkit-mask-image:radial-gradient(ellipse 70% 80% at var(--cx,40%) var(--cy,50%),#000 25%,transparent 100%);mask-image:radial-gradient(ellipse 70% 80% at var(--cx,40%) var(--cy,50%),#000 25%,transparent 100%)}
.bloom{position:absolute;z-index:1;border-radius:50%;pointer-events:none;background:var(--halo-mid);filter:blur(70px);opacity:calc(var(--bloom-op) * .55)}
#gl,#ruler{position:absolute;left:0;top:0;width:100%;height:100%;display:block;pointer-events:none}
#ruler{z-index:2}
#ruler .tk{stroke:rgba(168,230,255,.45);stroke-width:1;fill:none}
#ruler .lb text{font:10px "JetBrains Mono",monospace;fill:rgba(207,232,255,.72)}
#ruler .hm{stroke:rgba(255,255,255,.55);stroke-width:1;stroke-dasharray:3 4;fill:none}
#ruler .hl{font:600 11.5px Outfit,"Noto Sans SC",sans-serif;fill:#fff}
#gl{z-index:3}
#hit{position:absolute;inset:0;z-index:5;cursor:grab;touch-action:none}
#hit.drag{cursor:grabbing}
#hit.pt{cursor:pointer}
#leaders{position:absolute;left:0;top:0;width:100%;height:100%;z-index:6;pointer-events:none;overflow:visible}
#leaders path{fill:none;stroke:rgba(168,230,255,.6);stroke-width:1}
#leaders circle{fill:#fff}
#callouts{position:absolute;inset:0;z-index:7;pointer-events:none}

const smin = (a, b, k) => { const h = Math.max(k - Math.abs(a - b), 0) / k; return Math.min(a, b) - h * h * k * 0.25; };

function rotT(r) { // transpose of Rz*Ry*Rx
  const cx = Math.cos(r[0]), sx = Math.sin(r[0]), cy = Math.cos(r[1]), sy = Math.sin(r[1]), cz = Math.cos(r[2]), sz = Math.sin(r[2]);

function compile(p, h) {
  const q = { t: p.t, op: p.op || 'u', k: p.k || 0, bb: null };
  if (p.t === 'sph') {
    q.cx = p.c[0]; q.cy = p.c[1]; q.cz = p.c[2]; q.r = p.r;
    q.bb = [q.cx - q.r, q.cy - q.r, q.cz - q.r, q.cx + q.r, q.cy + q.r, q.cz + q.r];

    q.cx = p.c[0]; q.cy = p.c[1]; q.cz = p.c[2]; [q.rx, q.ry, q.rz] = p.r;
    q.m = p.rot ? rotT(p.rot) : null;
    const e = Math.max(q.rx, q.ry, q.rz);
    q.bb = [q.cx - e, q.cy - e, q.cz - e, q.cx + e, q.cy + e, q.cz + e];

    [q.ax, q.ay, q.az] = p.a; const [bx, by, bz] = p.b;
    q.r1 = p.r1; q.r2 = p.r2;
    q.bax = bx - q.ax; q.bay = by - q.ay; q.baz = bz - q.az;
    q.l2 = q.bax * q.bax + q.bay * q.bay + q.baz * q.baz;
    q.rr = q.r1 - q.r2; q.a2 = q.l2 - q.rr * q.rr; q.il2 = 1 / q.l2;

function prim(q, x, y, z) {

    case 'sph': return Math.hypot(x - q.cx, y - q.cy, z - q.cz) - q.r;
    case 'ell': {

function evalShape(P, x, y, z) {

  $('list').innerHTML = `<button class="back" data-act="vback">‹ 全部体征</button><div class="dhead"><div><h2>${cur.name}</h2><div class="meta">${last ? `最新 ${vfmt(t, last)} ${cur.unit} · ${fmtMD(last.date)}` : '暂无记录'}</div></div>${tagPill(vitalTag(t, last))}</div>${bigChart(t)}<div class="tacts" data-w><button class="btn primary sm" data-act="vadd" data-type="${t}">＋ 记录${cur.name}</button></div>${recs || '<div class="empty">还没有记录</div>'}`;
  const ch = $('chart'); if (!ch) return;
  const svg = ch.querySelector('svg');
  const move = e => {
    const c = CH.cur; if (!c) return;
    const r = svg.getBoundingClientRect(), x = (e.clientX - r.left) / r.width * c.W;
    let bi = 0, bd = 1e9; c.s.forEach((v, i) => { const d = Math.abs(c.X(v.date) - x); if (d < bd) { bd = d; bi = i; } });
    const v = c.s[bi], px = c.X(v.date);
    const ln = $('chx'); ln.setAttribute('x1', px); ln.setAttribute('x2', px); ln.setAttribute('visibility', 'visible');
    const tip = $('ctip'); tip.hidden = false;
    tip.innerHTML = `${fmtD(v.date)} · <b class="num">${vfmt(c.t, v)}</b> ${VT[c.t].unit}`;
    const left = px / c.W * r.width + (r.left - ch.getBoundingClientRect().left);
    tip.style.left = clamp(left - tip.offsetWidth / 2, 4, ch.clientWidth - tip.offsetWidth - 4) + 'px'; tip.style.top = '6px';
  };
  svg.addEventListener('pointermove', move);
  svg.addEventListener('pointerleave', () => { $('ctip').hidden = true; $('chx').setAttribute('visibility', 'hidden'); });
}

function rangeSvg(l, W, H, big) {
  const v = l.value;
  const a0 = l.low ?? Math.min(v, l.high ?? v) * 0.5, b0 = l.high ?? Math.max(v, l.low ?? v) * 1.6;
  let lo = Math.min(a0, v), hi = Math.max(b0, v); const sp = hi - lo || 1; lo -= sp * 0.08; hi += sp * 0.08;
  const X = x => 6 + (x - lo) / (hi - lo) * (W - 12);
  const nl = X(l.low ?? lo), nh = X(l.high ?? hi), st = labStatus(l);
  const cy = big ? 16 : H / 2, th = big ? 10 : 6;
  let s = `<rect class="trk" x="6" y="${cy - th / 2}" width="${W - 12}" height="${th}" rx="${th / 2}"/><rect class="nrm" x="${nl.toFixed(1)}" y="${cy - th / 2}" width="${Math.max(2, nh - nl).toFixed(1)}" height="${th}" rx="${th / 2}"/>`;
  if (big) {
    if (l.low != null) s += `<text class="ax" x="${nl.toFixed(1)}" y="${cy + 24}" text-anchor="middle">${l.low}</text>`;
    if (l.high != null) s += `<text class="ax" x="${nh.toFixed(1)}" y="${cy + 24}" text-anchor="middle">${l.high}</text>`;
  }
  s += `<circle class="mk" cx="${X(v).toFixed(1)}" cy="${cy}" r="${big ? 6 : 4.5}" style="fill:${st.dir ? 'var(--s2)' : 'var(--ink)'}"/>`;
  return `<svg class="${big ? '' : 'rbar'}" viewBox="0 0 ${W} ${H}" aria-hidden="true">${s}</svg>`;
}
function sideLab() {
  const gs = labGroups(), abn = gs.filter(g => labStatus(g.latest).dir), lr = lastReport();
  const parts = new Set(abn.map(g => g.latest.part).filter(Boolean));
  $('stats').innerHTML = stat(gs.length, '指标') + stat(abn.length, '异常') + stat(parts.size, '涉及部位') + stat(lr ? fmtD(lr).slice(0, 7) : '—', '最近体检', 'sm');
  const worse = gs.filter(g => g.prev && labStatus(g.latest).dir && (g.latest.value - g.prev.value) * labStatus(g.latest).dir > 0);

  const list = gs.filter(g => inZone(g.latest.part) || (!g.latest.part && G.zone === 'all')).filter(g => match(g.latest.name, g.latest.key, g.latest.cat, partName(g.latest.part)));

  }).join('')).join('') : `<div class="empty">${ST.q ? '没有匹配的指标' : G.zone !== 'all' ? `${ZONES[G.zone].name}没有相关指标` : '还没有体检指标'}</div>`;

/* ---------- selection ---------- */
function selectPart(id, side, extra) {
  if (!PART[id]) return;
  const p = PART[id];
  if (G.zone !== p.zone) setZone(p.zone, { noFly: true });
  ST.sel = { kind: 'part', id, side: side || '', ...(extra || {}) };
  flyTo(partCam(id, side));
  renderAll(); renderCallouts();
}
function selectLab(key) {
  const g = labGroups().find(x => x.latest.key === key); if (!g) return;
  const part = g.latest.part;
  if (part && G.zone !== PART[part].zone) setZone(PART[part].zone, { noFly: true });
  if (part) flyTo(partCam(part));
  ST.sel = { kind: 'lab', key, id: part || null };
  renderAll(); renderCallouts();
}
function clearSel() { ST.sel = null; renderAll(); renderCallouts(); }
function setZone(z, opts) {
  G.zone = z;
  if (ST.sel && ST.sel.id && PART[ST.sel.id] && z !== 'all' && PART[ST.sel.id].zone !== z) ST.sel = null;
  if (z === 'all') ST.sel = null;
  if (!(opts && opts.noFly)) flyTo(z === 'all' ? { ...OVERVIEW_CAM, yaw: 0 } : ZONES[z].cam);
  renderAll(); renderCallouts();
}
function partCam(id, side) {
  const p = PART[id], zc = ZONES[p.zone].cam, c = p.cam || {};
  let s = side;
  if (!s && p.pair && SM[id]) s = SM[id].R > SM[id].L ? 'R' : 'L';
  const yaw = c.yawL !== undefined ? (s === 'R' ? c.yawR : c.yawL) : (c.yaw ?? 0);
  // organs and facial features get a close-up centred on the part; hair and brain keep the head view
  const close = p.zone === 'organs' ? 0.3 : p.zone === 'head' && !['hair', 'brain'].includes(id) ? 0.22 : 0;
  return { y: c.y ?? (close ? p.a[1] : zc.y), h: c.h ?? (close || zc.h), yaw };
}

const VS = `varying vec3 vN; varying vec3 vV; varying vec3 vP;
void main(){ vP = position; vec4 mv = modelViewMatrix * vec4(position, 1.0); vV = -mv.xyz; vN = normalize(normalMatrix * normal); gl_Position = projectionMatrix * mv; }`;
const FS_PART = `uniform vec3 uColor; uniform float uAlpha; uniform float uGlow; uniform float uPulse; uniform float uTime; uniform float uPattern;
varying vec3 vN; varying vec3 vV; varying vec3 vP;
void main(){
  vec3 n = normalize(vN); if(!gl_FrontFacing) n = -n;
  vec3 v = normalize(vV);
  float ndv = clamp(dot(n, v), 0.0, 1.0);
  float fres = pow(1.0 - ndv, 2.2);
  vec3 L = normalize(vec3(-0.35, 0.65, 0.7));
  float dif = 0.66 + 0.34 * max(dot(n, L), 0.0);
  float spec = pow(max(dot(n, normalize(L + v)), 0.0), 40.0);
  float pulse = uPulse * (0.5 + 0.5 * sin(uTime * 3.4));
  vec3 base = uColor;
  if (uPattern > 0.5 && uPattern < 1.5) {
    float s = sin(vP.x * 420.0 + 3.0 * sin(vP.y * 260.0)) * sin(vP.y * 400.0 + 3.0 * sin(vP.z * 300.0)) * sin(vP.z * 380.0 + 3.0 * sin(vP.x * 280.0));
    base *= 0.74 + 0.34 * smoothstep(-0.3, 0.5, s);
  } else if (uPattern > 1.5) {
    float s = sin(atan(vP.x, vP.z) * 90.0 + vP.y * 140.0);
    base *= 0.72 + 0.34 * s * s;
  }
  vec3 col = base * dif * (0.85 + 0.4 * uGlow) + mix(base, vec3(1.0), 0.45) * fres * (0.9 + uGlow) + vec3(spec * 0.55) + base * pulse * 0.45;
  float a = uAlpha * (0.6 + 0.4 * fres) + spec * 0.25 * uAlpha + pulse * 0.18 * uAlpha + uGlow * 0.12;
  gl_FragColor = vec4(col, clamp(a, 0.0, 1.0));
}`;
const FS_SHELL = `uniform float uOpacity; uniform float uScan; uniform float uHover;
varying vec3 vN; varying vec3 vV; varying vec3 vP;
float zoneOf(vec3 p){ if (p.y > 1.49) return 1.0; if (p.y > 0.86 && abs(p.x) < 0.165) return 2.0; return 3.0; }
void main(){
  vec3 n = normalize(vN); if(!gl_FrontFacing) n = -n;
  vec3 v = normalize(vV);
  float ndv = clamp(abs(dot(n, v)), 0.0, 1.0);
  float fres = pow(1.0 - ndv, 2.6);
  vec3 L = normalize(vec3(-0.35, 0.7, 0.6));
  float spec = pow(max(dot(n, normalize(L + v)), 0.0), 70.0);
  float t = vP.y * 30.0;
  float g = abs(fract(t - 0.5) - 0.5) / max(fwidth(t), 1e-4);
  float line = (1.0 - min(g, 1.0)) * (0.35 + 0.65 * fres);
  float scan = uScan > 0.0 ? smoothstep(0.035, 0.0, abs(vP.y - uScan)) : 0.0;
  float hov = (uHover > 0.5 && abs(zoneOf(vP) - uHover) < 0.1) ? 1.0 : 0.0;
  vec3 col = mix(vec3(0.75, 0.9, 1.0), vec3(0.62, 0.9, 1.0), fres) + vec3(spec) + vec3(0.55, 0.95, 1.0) * scan + vec3(0.3, 0.75, 1.0) * hov * 0.5;
  float a = uOpacity * (0.035 + fres * 0.62 + line * 0.07) + spec * 0.35 * uOpacity + scan * 0.35 * uOpacity + hov * (0.1 + fres * 0.25);
  gl_FragColor = vec4(col, clamp(a, 0.0, 1.0));
}`;
const FS_FLOOR = `uniform float uTime; varying vec2 vU;
void main(){
  vec2 p = (vU - 0.5) * 2.0; float r = length(p); float an = atan(p.y, p.x);
  float ring1 = smoothstep(0.012, 0.0, abs(r - 0.9)) * 0.8;
  float ring2 = smoothstep(0.008, 0.0, abs(r - 0.62)) * 0.55;
  float ticks = step(0.93, r) * step(r, 0.99) * step(0.55, fract(an * 48.0 / 6.2832 + uTime * 0.04)) * 0.35;
  float wave = smoothstep(0.02, 0.0, abs(r - fract(uTime * 0.22))) * (1.0 - r) * 0.9;
  float glow = pow(max(1.0 - r, 0.0), 2.0) * 0.5;
  float v = ring1 + ring2 + ticks + wave + glow;
  gl_FragColor = vec4(vec3(0.45, 0.85, 1.0), v);
}`;
const VS_UV = `varying vec2 vU; void main(){ vU = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`;

function mkPartMat(part, side) {

    vertexShader: VS, fragmentShader: FS_PART, transparent: true, depthWrite: false, side: THREE.DoubleSide

const V3 = a => new THREE.Vector3(a[0], a[1], a[2]);
const mir = (p, s) => [p[0] * s, p[1], p[2]];

/* stadiometer: a centimetre ruler standing beside the body in world space; it leaves the view in close-ups */
function drawRuler() {
  const hcm = D.profile && D.profile.height;
  const key = [G.ty, G.vh, G.zoom, G.pitch, LAY.W, LAY.H, G.scale].map(x => x.toFixed(4)).join('|') + hcm;
  if (key === G.rulerKey) return;
  G.rulerKey = key;
  const { W, H, cx } = LAY, v = PV.v || (PV.v = new THREE.Vector3());
  const sy = y => { v.set(0, y, 0).project(camera); return (1 - v.y) / 2 * H; };
  v.set(-0.4 * G.scale, G.ty * G.scale, 0).project(camera);
  const x0 = (v.x + 1) / 2 * W, ppm = Math.abs(sy(0) - sy(1));
  if (x0 < 24) { $('ruler').innerHTML = ''; return; }
  let y0 = 6; // the ruler stops below any floating panel above it
  for (const h of LAY.huds) if (x0 - 4 < h.r && x0 + 48 > h.l) y0 = Math.max(y0, h.b + 12);
  const minor = [0.01, 0.02, 0.05, 0.1].find(s => s * ppm >= 6) || 0.1;
  const major = [0.05, 0.1, 0.2, 0.5].find(s => s * ppm >= 34 && s >= minor * 2) || 0.5;
  let tk = '', lb = '';
  const N = Math.round(2.2 / minor), Yh = hcm ? sy(hcm / 100) : -1e9;
  for (let i = 0; i <= N; i++) {
    const y = i * minor, Y = sy(y);
    if (Y < y0 || Y > H - 6) continue;
    const isM = Math.abs(y / major - Math.round(y / major)) < 1e-6;
    tk += `M${x0.toFixed(1)},${Y.toFixed(1)}h${isM ? 12 : 6}`;
    if (isM && Math.abs(Y - Yh) > 14) lb += `<text x="${(x0 + 16).toFixed(1)}" y="${(Y + 3.5).toFixed(1)}">${Math.round(y * 100)}</text>`;
  }
  let mk = '';
  if (hcm) { const Y = sy(hcm / 100); mk = `<path class="hm" d="M${x0.toFixed(1)},${Y.toFixed(1)}H${cx.toFixed(1)}"/><text class="hl" x="${(x0 + 16).toFixed(1)}" y="${(Y - 6).toFixed(1)}">身高 ${hcm} cm</text>`; }
  $('ruler').innerHTML = `<path class="tk" d="M${x0.toFixed(1)},${sy(0).toFixed(1)}V${Math.max(sy(2.2), y0).toFixed(1)}${tk}"/><g class="lb">${lb}</g>${mk}`;
}

/* ---------- splash ---------- */
const SPL = { t0: performance.now(), mesh: 0, verts: 0, done: false, gone: false, lines: 0 };
const ECG = { buf: null, ts: null, head: 0, acc: 0, last: 0 };
function ecgVal(ph) {
  const g = (m, s) => Math.exp(-(((ph - m) / s) ** 2) / 2);
  return 0.12 * g(0.18, 0.025) - 0.14 * g(0.37, 0.009) + 1.0 * g(0.4, 0.011) - 0.28 * g(0.43, 0.01) + 0.3 * g(0.66, 0.042);

function drawECG(t) {
  const cv = $('spCanvas'); if (!cv) return;
  const dpr = Math.min(2, window.devicePixelRatio || 1), w = cv.clientWidth, h = cv.clientHeight;
  if (!w || !h) return;
  if (cv.width !== Math.round(w * dpr) || !ECG.buf) {
    cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
    ECG.buf = new Float32Array(Math.ceil(w)); ECG.ts = new Float32Array(Math.ceil(w)).fill(-1e9); ECG.head = 0; ECG.last = t;
  }
  const c = cv.getContext('2d'); c.setTransform(dpr, 0, 0, dpr, 0, 0); c.clearRect(0, 0, w, h);
  const R = w / 2, n = ECG.buf.length, bpm = curRhr() || 66, per = 60 / bpm, speed = w / 2.6;
  c.save(); c.beginPath(); c.arc(R, h / 2, R * 0.96, 0, Math.PI * 2); c.clip();
  c.fillStyle = 'rgba(8,24,56,.55)'; c.fillRect(0, 0, w, h);
  c.strokeStyle = 'rgba(143,219,255,.08)'; c.lineWidth = 1;
  for (let x = 0; x <= w; x += w / 20) { c.beginPath(); c.moveTo(x, 0); c.lineTo(x, h); c.stroke(); }
  for (let y = 0; y <= h; y += w / 20) { c.beginPath(); c.moveTo(0, y); c.lineTo(w, y); c.stroke(); }
  ECG.acc += (t - ECG.last) / 1000 * speed; ECG.last = t;
  let steps = Math.floor(ECG.acc); ECG.acc -= steps;
  while (steps-- > 0) { const i = ECG.head % n; ECG.buf[i] = ecgVal(((t / 1000 - steps / speed) / per) % 1); ECG.ts[i] = t; ECG.head++; }
  const base = h * 0.5, amp = h * 0.24, hi = ECG.head % n;
  c.lineWidth = 2.2; c.lineJoin = 'round'; c.lineCap = 'round'; c.shadowColor = '#4FB2FF'; c.shadowBlur = 10;
  for (let x0 = 1; x0 < n; x0 += 14) {
    const x1 = Math.min(n - 1, x0 + 14), mid = Math.min(n - 1, x0 + 7);
    if (ECG.ts[mid] < 0) continue;
    const a = Math.max(0, 1 - (t - ECG.ts[mid]) / 2400); if (a <= 0.02) continue;
    c.strokeStyle = `rgba(143,230,255,${a.toFixed(3)})`; c.beginPath();
    let started = false;
    for (let x = x0 - 1; x <= x1; x++) { if (x === hi || x === hi - 1 || ECG.ts[x] < 0) { started = false; continue; } const Y = base - ECG.buf[x] * amp; if (!started) { c.moveTo(x, Y); started = true; } else c.lineTo(x, Y); }
    c.stroke();
  }

  c.shadowBlur = 0; c.textAlign = 'center'; c.fillStyle = 'rgba(234,244,255,.92)';
  c.font = `600 ${Math.round(w * 0.11)}px Outfit, sans-serif`; c.fillText(String(bpm), R, h * 0.82);
  c.font = `500 ${Math.round(w * 0.032)}px "JetBrains Mono", monospace`; c.fillStyle = 'rgba(143,219,255,.8)'; c.fillText('BPM · 静息心率', R, h * 0.88);
  c.restore();
}
function addLog(i) {

  const gs = labGroups(), abn = gs.filter(g => labStatus(g.latest).dir).length;

/* ---------- actions ---------- */
async function togglePlan(id) {
  const p = D.plans.find(x => x.id === id); if (!p) return;
  const base = strip(p);
  if (p.done) { await put('plans', id, { ...base, done: false }); toast('已恢复为待办'); return; }
  if (p.repeat) {
    const t = todayISO(), from = p.due < t ? t : p.due, next = addPeriod(from, p.repeat);
    await put('plans', id, { ...base, due: next, last: t }); toast(`已打卡，下次 ${fmtMD(next)}`);
  } else { await put('plans', id, { ...base, done: true, doneAt: todayISO() }); toast(`已完成：${p.title}`); }
}
async function clearExamples() {
  if (!guardWrite()) return;
  let n = 0;
  try {
    if (mode === 'local') {
      for (const c of COLS) { n += D[c].filter(x => x.example).length; D[c] = D[c].filter(x => !x.example); saveLocal(c); }
    } else {
      const jobs = [];
      for (const c of COLS) for (const x of D[c].filter(x => x.example)) jobs.push([c, x.id]);
      for (let i = 0; i < jobs.length; i += 8) { await Promise.all(jobs.slice(i, i + 8).map(([c, id]) => del(c, id))); n += Math.min(8, jobs.length - i); }
    }
    ST.sel = null; ST.vt = null; renderAll(); toast(`已清除 ${n} 条示例数据`);
  } catch (e) { fail(e); }
}
async function onAct(e) {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act, id = b.dataset.id;
  try {
    switch (a) {
      case 'issue': { const i = D.issues.find(x => x.id === id); if (i) selectPart(i.part, i.side, { issue: id }); break; }
      case 'vt': ST.vt = b.dataset.type; renderAll(); $('list').scrollTop = 0; break;
      case 'vback': ST.vt = null; renderAll(); break;
      case 'vadd': openForm('vital', { type: b.dataset.type }); break;
      case 'vdel':
        if (!guardWrite()) break;
        if (!armed('v' + id)) { arm('v' + id); renderAll(); break; }
        ST.armed = null; await del('vitals', id); toast('已删除这条记录'); break;
      case 'lab': selectLab(b.dataset.key); break;
      case 'ladd': openForm('lab', { key: b.dataset.key }); break;
      case 'ldel':
        if (!guardWrite()) break;
        if (!armed('l' + id)) { arm('l' + id); renderAll(); break; }
        ST.armed = null; await del('labs', id); toast('已删除这次记录'); break;
      case 'plan': { const p = D.plans.find(x => x.id === id); if (!p) break; if (p.part) selectPart(p.part, '', { plan: id }); else openForm('plan', { id }); break; }
      case 'pedit2': openForm('plan', { id }); break;
      case 'chk': if (guardWrite()) await togglePlan(id); break;
      case 'close': clearSel(); break;
      case 'zall': setZone('all'); break;
      case 'part': selectPart(id); break;
      case 'iadd': openForm('issue', { part: b.dataset.part }); break;
      case 'padd': openForm('plan', { part: b.dataset.part }); break;
      case 'iedit': openForm('issue', { id }); break;
      case 'istat': {
        if (!guardWrite()) break;
        const i = D.issues.find(x => x.id === id); if (!i) break;
        await put('issues', id, { ...strip(i), status: b.dataset.s }); toast(`${i.title}：${STATUS[b.dataset.s]}`); break;
      }
      case 'idel':
        if (!guardWrite()) break;
        if (!armed('i' + id)) { arm('i' + id); renderAll(); break; }
        ST.armed = null; await del('issues', id); toast('已删除这个问题'); break;
      case 'pedit': openForm('profile'); break;
      case 'pnew': openForm('profile', { isNew: true }); break;
    }
  } catch (err) { fail(err); }
}

  $('splash').addEventListener('click', enterApp);
  new ResizeObserver(() => layout()).observe($('stage'));
  const hro = new ResizeObserver(() => measureHud());
  hro.observe($('zoneHud')); hro.observe(document.querySelector('.hud-tr'));
}

function boot() {
  loadLocal();
  wire();
  renderAll();
  splashMeta();
  requestAnimationFrame(splashFrame);
  connect().then(splashMeta);
  init3D((p, v) => { SPL.mesh = Math.max(SPL.mesh, p); if (v) SPL.verts = v; }).then(v => { if (!v) SPL.mesh = 1; });
}
boot();

})();</script>
